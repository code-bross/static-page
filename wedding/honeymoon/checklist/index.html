<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>유럽 신혼여행 체크리스트 | 🇭🇺 헝가리 · 🇦🇹 오스트리아 · 🇨🇿 체코 준비물</title>
    <meta name="description" content="유럽 3개국(부다페스트, 빈, 프라하) 신혼여행 완전 가이드 체크리스트. 나라별 대중교통(버스/트램), 상비약, 멀티탭, 돼지코, 예약 바우처, 온천 준비물 완벽 정리." />
    <!-- Open Graph Tags -->
    <meta property="og:title" content="유럽 신혼여행 완전 가이드 체크리스트" />
    <meta property="og:description" content="헝가리·오스트리아·체코 대중교통, 상비약, 멀티탭, 돼지코, 바우처 등 신혼여행 준비물 한눈에 보기" />
    <meta property="og:type" content="website" />
    <!-- Google Fonts & Pretendard -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="images_base64.js"></script>
    <style>
        :root {
            --bg-main: #0b111e;
            --panel-bg: rgba(21, 30, 47, 0.82);
            --panel-border: rgba(255, 255, 255, 0.12);
            --panel-hover: rgba(30, 43, 67, 0.9);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-sub: #cbd5e1;
            --accent-coral: #ff7a59;
            --accent-coral-glow: rgba(255, 122, 89, 0.35);
            --accent-cyan: #2f6f8f;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-purple: #a855f7;
            --accent-gold: #e2ba84;
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 10px 30px rgba(47, 111, 143, 0.25);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', 'Outfit', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.65;
            background-image:
                radial-gradient(circle at 10% 15%, rgba(255, 122, 89, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(47, 111, 143, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 60%);
            background-attachment: fixed;
            padding-bottom: 120px;
            word-break: keep-all;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Top Navigation Header */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(11, 17, 30, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--panel-border);
            padding: 14px 24px;
        }

        .top-nav-inner {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.08rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .nav-brand-badge {
            background: linear-gradient(135deg, var(--accent-coral), var(--accent-cyan));
            color: white;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.86rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--panel-border);
            color: var(--text-sub);
            transition: var(--transition);
        }

        .nav-link-btn:hover {
            background: rgba(255, 122, 89, 0.18);
            border-color: rgba(255, 122, 89, 0.4);
            color: var(--text-main);
            transform: translateY(-1px);
        }

        .nav-link-btn.active {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-coral));
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(255, 122, 89, 0.3);
        }

        /* Container */
        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Hero Header Section */
        .hero-card {
            background: linear-gradient(135deg, rgba(21, 30, 47, 0.95) 0%, rgba(35, 52, 80, 0.85) 100%);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            margin-bottom: 28px;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(255, 122, 89, 0.25) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-badge-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .hero-flag-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        .hero-title {
            font-size: clamp(1.8rem, 3.2vw, 2.6rem);
            font-weight: 800;
            line-height: 1.25;
            background: linear-gradient(135deg, #ffffff 30%, #ffd0c4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .hero-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 820px;
            margin-bottom: 26px;
            line-height: 1.6;
        }

        /* Progress Card Inside Hero */
        .progress-box {
            background: rgba(11, 17, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-md);
            padding: 22px 24px;
            backdrop-filter: blur(10px);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .progress-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-stat {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--accent-coral);
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-coral), var(--accent-green));
            border-radius: 999px;
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px rgba(255, 122, 89, 0.5);
        }

        .progress-quick-tools {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .tool-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.83rem;
            font-weight: 600;
            border: 1px solid var(--panel-border);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-sub);
            cursor: pointer;
            transition: var(--transition);
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            transform: translateY(-1px);
        }

        .tool-btn.primary {
            background: linear-gradient(135deg, var(--accent-coral), #e05638);
            border: none;
            color: white;
            box-shadow: 0 4px 12px rgba(255, 122, 89, 0.3);
        }

        .tool-btn.primary:hover {
            background: linear-gradient(135deg, #ff8c6e, var(--accent-coral));
        }

        /* Filter Controls & Search Bar */
        .controls-row {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 26px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px 14px 48px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--accent-coral);
            box-shadow: 0 0 0 3px rgba(255, 122, 89, 0.2);
            background: rgba(25, 36, 58, 0.95);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Category Filter Tabs */
        .category-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }

        .category-chips::-webkit-scrollbar {
            height: 4px;
        }

        .category-chips::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .chip-btn {
            white-space: nowrap;
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 600;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-sub);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chip-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }

        .chip-btn.active {
            background: linear-gradient(135deg, var(--accent-coral), var(--accent-cyan));
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(255, 122, 89, 0.3);
        }

        .chip-count {
            background: rgba(0, 0, 0, 0.25);
            padding: 2px 7px;
            border-radius: 999px;
            font-size: 0.74rem;
            font-weight: 700;
        }

        /* Category Section Group */
        .category-group {
            margin-bottom: 34px;
            animation: fadeIn 0.35s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: linear-gradient(90deg, rgba(47, 111, 143, 0.35) 0%, rgba(21, 30, 47, 0.4) 100%);
            border-left: 4px solid var(--accent-coral);
            border-radius: var(--radius-sm);
            margin-bottom: 14px;
        }

        .group-title {
            font-size: 1.12rem;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .group-badge {
            font-size: 0.78rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-sub);
        }

        /* Checklist Cards Grid */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 14px;
        }

        @media (max-width: 768px) {
            .items-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Checklist Item Card */
        .item-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            display: flex;
            gap: 14px;
            align-items: flex-start;
            transition: var(--transition);
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .item-card:hover {
            background: var(--panel-hover);
            border-color: rgba(255, 122, 89, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .item-card.completed {
            background: rgba(16, 185, 129, 0.06);
            border-color: rgba(16, 185, 129, 0.25);
        }

        .item-card.completed .item-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .item-card.completed .item-desc {
            opacity: 0.7;
        }

        /* Custom Checkbox Input */
        .checkbox-wrapper {
            position: relative;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .item-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 7px;
            background: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            outline: none;
            transition: var(--transition);
            display: grid;
            place-content: center;
        }

        .item-checkbox:hover {
            border-color: var(--accent-coral);
            box-shadow: 0 0 8px rgba(255, 122, 89, 0.4);
        }

        .item-checkbox:checked {
            background: linear-gradient(135deg, var(--accent-green), #059669);
            border-color: var(--accent-green);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        .item-checkbox:checked::after {
            content: '✓';
            color: white;
            font-size: 15px;
            font-weight: 900;
        }

        /* Item Content */
        .item-content {
            flex: 1;
            min-width: 0;
        }

        .item-header-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .item-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.4;
        }

        .item-tag {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .tag-required {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .tag-transport {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .tag-medicine {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .tag-power {
            background: rgba(168, 85, 247, 0.2);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .tag-voucher {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .tag-spa {
            background: rgba(236, 72, 153, 0.2);
            color: #f472b6;
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        .tag-drone {
            background: rgba(168, 85, 247, 0.25);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.4);
        }

        .tag-camera {
            background: rgba(234, 179, 8, 0.22);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.35);
        }

        .app-links-wrapper {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .app-store-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .app-store-btn:hover {
            background: rgba(59, 130, 246, 0.25);
            border-color: rgba(59, 130, 246, 0.5);
            color: #60a5fa;
            transform: translateY(-1px);
        }

        .app-store-btn.apple {
            background: rgba(255, 255, 255, 0.12);
        }

        .app-store-btn.google {
            background: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .app-store-btn.google:hover {
            background: rgba(16, 185, 129, 0.25);
            color: #34d399;
        }

        .item-desc {
            font-size: 0.86rem;
            color: var(--text-sub);
            line-height: 1.5;
            white-space: pre-line;
        }

        .item-tip-box {
            margin-top: 10px;
            background: rgba(47, 111, 143, 0.2);
            border-left: 3px solid var(--accent-cyan);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.81rem;
            color: #e2e8f0;
            line-height: 1.45;
        }

        .item-delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.6;
            transition: var(--transition);
            padding: 2px;
        }

        .item-delete-btn:hover {
            opacity: 1;
            color: #ef4444;
        }

        /* Modal for adding custom item */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #151e2f;
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 520px;
            padding: 28px;
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 14px;
            background: #0b111e;
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: var(--accent-coral);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        /* Insurance Button & Gallery Modal Styles */
        .view-insurance-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15) 0%, rgba(47, 111, 143, 0.3) 100%);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
        }

        .view-insurance-btn:hover {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-coral));
            border-color: transparent;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255, 122, 89, 0.35);
        }

        .img-count-badge {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 7px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 800;
        }

        .insurance-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 9, 16, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        const categoryNames = {

        const STORAGE_KEY_ITEMS = "honeymoon_checklist_items_v6";
        const STORAGE_KEY_CHECKED = "honeymoon_checklist_checked_v1";

        let currentCategory = "all";
        let checklistItems = [];
        let checkedState = {};

        let insuranceImages = [];
        let currentInsuranceIdx = 0;

        async function loadInsuranceImages() {
            if (window.INSURANCE_IMAGES_DATA && Array.isArray(window.INSURANCE_IMAGES_DATA) && window.INSURANCE_IMAGES_DATA.length > 0) {
                insuranceImages = window.INSURANCE_IMAGES_DATA;
                renderChecklist();
                return;
            }

            try {
                const response = await fetch('images_base64.json');
                if (response.ok) {
                    insuranceImages = await response.json();
                    renderChecklist();
                }
            } catch (e) {
                console.warn('Could not fetch images_base64.json via CORS:', e);
            }
        }

        // Initialize app
        function initApp() {
            loadFromStorage();
            renderCategoryChips();
            renderChecklist();
            updateProgress();
            loadInsuranceImages();
        }

        // Load items & state from localStorage
        function loadFromStorage() {
            const savedItems = localStorage.getItem(STORAGE_KEY_ITEMS);
            if (savedItems) {
                try {
                    const parsed = JSON.parse(savedItems);
                    const parsedIds = new Set(parsed.map(i => i.id));
                    const missingInitial = initialChecklistData.filter(i => !parsedIds.has(i.id));
                    checklistItems = [...parsed, ...missingInitial];
                } catch (e) {
                    checklistItems = [...initialChecklistData];
                }
            } else {
                checklistItems = [...initialChecklistData];
            }
            localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(checklistItems));

            const savedChecked = localStorage.getItem(STORAGE_KEY_CHECKED);
            if (savedChecked) {
                try {
                    checkedState = JSON.parse(savedChecked);
                } catch (e) {
                    checkedState = {};
                }
            } else {
                checkedState = {};
            }
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(checklistItems));
            localStorage.setItem(STORAGE_KEY_CHECKED, JSON.stringify(checkedState));
        }

        // Render Category Filter Chips
        function renderCategoryChips() {
            const container = document.getElementById("categoryChips");
            container.innerHTML = "";

            Object.keys(categoryNames).forEach(catKey => {
                const count = catKey === "all"
                    ? checklistItems.length
                    : checklistItems.filter(i => i.category === catKey).length;

                const btn = document.createElement("button");
                btn.className = `chip-btn ${catKey === currentCategory ? 'active' : ''}`;
                btn.onclick = () => selectCategory(catKey);
                btn.innerHTML = `
                    <span>${categoryNames[catKey]}</span>
                    <span class="chip-count">${count}</span>
                `;
                container.appendChild(btn);
            });
        }

        function selectCategory(catKey) {
            currentCategory = catKey;
            renderCategoryChips();
            renderChecklist();
        }

        // Filter items by category and search term
        function getFilteredItems() {
            const searchTerm = document.getElementById("searchInput").value.trim().toLowerCase();

            return checklistItems.filter(item => {
                const matchCat = currentCategory === "all" || item.category === currentCategory;
                const matchSearch = !searchTerm ||
                    item.title.toLowerCase().includes(searchTerm) ||
                    item.desc.toLowerCase().includes(searchTerm) ||
                    (item.tip && item.tip.toLowerCase().includes(searchTerm)) ||
                    (item.tag && item.tag.toLowerCase().includes(searchTerm));

                return matchCat && matchSearch;
            });
        }

        // Render Main Checklist Container
        function renderChecklist() {
            const container = document.getElementById("checklistContainer");
            container.innerHTML = "";

            const filtered = getFilteredItems();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <h3>검색 또는 카테고리에 해당하는 준비물이 없습니다.</h3>
                        <p style="margin-top:8px;">'사용자 항목 추가' 버튼을 눌러 나만의 체크리스트를 만들어보세요!</p>
                    </div>
                `;
                return;
            }

            // Group items by category
            const grouped = {};
            filtered.forEach(item => {
                if (!grouped[item.category]) {
                    grouped[item.category] = {
                        title: item.categoryTitle || categoryNames[item.category],
                        items: []
                    };
                }
                grouped[item.category].items.push(item);
            });

            // Order of categories display
            const orderKeys = ["hu", "at", "cz", "drone", "medicine", "electronics", "documents", "clothing"];

            orderKeys.forEach(catKey => {
                if (grouped[catKey] && grouped[catKey].items.length > 0) {
                    const groupObj = grouped[catKey];
                    const groupCheckedCount = groupObj.items.filter(i => checkedState[i.id]).length;

                    const groupSec = document.createElement("section");
                    groupSec.className = "category-group";

                    const headerEl = document.createElement("div");
                    headerEl.className = "group-header";
                    headerEl.innerHTML = `
                        <div class="group-title">
                            <span>${groupObj.title}</span>
                        </div>
                        <div class="group-badge">
                            ${groupCheckedCount} / ${groupObj.items.length} 완료
                        </div>
                    `;
                    groupSec.appendChild(headerEl);

                    const gridEl = document.createElement("div");
                    gridEl.className = "items-grid";

                    groupObj.items.forEach(item => {
                        const isChecked = !!checkedState[item.id];
                        const card = document.createElement("div");
                        card.className = `item-card ${isChecked ? 'completed' : ''}`;
                        card.id = `card_${item.id}`;

                        const getTagClass = (t) => {
                            if (t === '필수') return 'tag-required';
                            if (t === '교통') return 'tag-transport';
                            if (t === '상비약') return 'tag-medicine';
                            if (t === '전자기기') return 'tag-power';
                            if (t === '바우처') return 'tag-voucher';
                            if (t === '온천') return 'tag-spa';
                            if (t === '드론') return 'tag-drone';
                            if (t === '촬영장비') return 'tag-camera';
                            return 'tag-required';
                        };

                        card.innerHTML = `
                            <div class="checkbox-wrapper">
                                <input type="checkbox"
                                       class="item-checkbox"
                                       id="chk_${item.id}"
                                       ${isChecked ? 'checked' : ''}
                                       onchange="toggleCheck('${item.id}')">
                            </div>
                            <div class="item-content">
                                <div class="item-header-row">
                                    <span class="item-title">${escapeHtml(item.title)}</span>
                                    ${item.tag ? `<span class="item-tag ${getTagClass(item.tag)}">${escapeHtml(item.tag)}</span>` : ''}
                                </div>
                                <div class="item-desc">${escapeHtml(item.desc)}</div>
                                ${item.tip ? `<div class="item-tip-box">${escapeHtml(item.tip)}</div>` : ''}
                                ${item.appLinks && item.appLinks.length > 0 ? `
                                    <div class="app-links-wrapper">
                                        ${item.appLinks.map(link => `
                                            <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="app-store-btn ${link.type || ''}" onclick="event.stopPropagation();">
                                                <span>${link.icon || '📱'}</span>
                                                <span>${escapeHtml(link.name)}</span>
                                            </a>
                                        `).join('')}
                                    </div>
                                ` : ''}
                                ${(item.hasInsuranceViewer || item.id === 'doc_5') ? `
                                    <div style="margin-top: 10px;">
                                        <button type="button" class="view-insurance-btn" onclick="event.stopPropagation(); openInsuranceModal(0);">
                                            <span>🖼️ 보험증서 이미지 보기</span>
                                            <span class="img-count-badge">${insuranceImages.length > 0 ? insuranceImages.length + '장' : '7장'}</span>
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                            ${item.isCustom ? `<button class="item-delete-btn" onclick="deleteCustomItem('${item.id}')" title="삭제">✕</button>` : ''}
                        `;
                        gridEl.appendChild(card);
                    });

                    groupSec.appendChild(gridEl);
                    container.appendChild(groupSec);
                }
            });
        }

        // Toggle Check
        function toggleCheck(id) {
            checkedState[id] = !checkedState[id];
            saveToStorage();

            const card = document.getElementById(`card_${id}`);
            if (card) {
                if (checkedState[id]) {
                    card.classList.add('completed');
                } else {
                    card.classList.remove('completed');
                }
            }

            renderCategoryChips();
            renderChecklist();
            updateProgress();
        }

        // Update Progress Bar
        function updateProgress() {
            const total = checklistItems.length;
            const checkedCount = Object.keys(checkedState).filter(k => checkedState[k] && checklistItems.some(i => i.id === k)).length;
            const percent = total > 0 ? Math.round((checkedCount / total) * 100) : 0;

            document.getElementById("progressSummary").innerText = `(${checkedCount} / ${total} 항목 완료)`;
            document.getElementById("progressPercent").innerText = `${percent}%`;
            document.getElementById("progressBar").style.width = `${percent}%`;
        }

        // Reset All Checks
        function resetChecklist() {
            if (confirm("정말로 모든 체크 항목을 해제하시겠습니까?")) {
                checkedState = {};
                saveToStorage();
                renderCategoryChips();
                renderChecklist();
                updateProgress();
            }
        }

        // Filter Items by Input
        function filterItems() {
            renderChecklist();
        }

        // Custom Item Modal Handlers
        function openAddModal() {
            document.getElementById("addModal").classList.add("active");
        }

        function closeAddModal() {
            document.getElementById("addModal").classList.remove("active");
            document.getElementById("addForm").reset();
        }

        function handleAddCustomItem(e) {
            e.preventDefault();
            const category = document.getElementById("customCategory").value;
            const title = document.getElementById("customTitle").value.trim();
            const tag = document.getElementById("customTag").value;
            const desc = document.getElementById("customDesc").value.trim();

            if (!title) return;

            const categoryTitleMap = {
                "hu": "🇭🇺 헝가리 (부다페스트) 대중교통 & 준비물",
                "at": "🇦🇹 오스트리아 (빈) 대중교통 & 준비물",
                "cz": "🇨🇿 체코 (프라하) 대중교통 & 준비물",
                "drone": "🛸 EU 드론 (DJI Neo) 준비물 & 비행 허가 서류",
                "medicine": "💊 상비약 & 구급용품 (Emergency Medicines)",
                "electronics": "🔌 멀티탭 & 전자기기 (Power & Electronics)",
                "documents": "📄 필수 서류 & 예약 바우처 (Documents & Vouchers)",
                "clothing": "🧳 의류 & 세면/위생용품 (Clothing & Toiletries)"
            };

            const newItem = {
                id: "custom_" + Date.now(),
                category: category,
                categoryTitle: categoryTitleMap[category] || "나만의 준비물",
                title: title,
                tag: tag,
                desc: desc || "사용자가 직접 추가한 나만의 체크 항목입니다.",
                tip: "",
                isCustom: true
            };

            checklistItems.push(newItem);
            saveToStorage();
            closeAddModal();

            renderCategoryChips();
            renderChecklist();
            updateProgress();
        }

        function deleteCustomItem(id) {
            if (confirm("이 항목을 삭제하시겠습니까?")) {
                checklistItems = checklistItems.filter(i => i.id !== id);
                delete checkedState[id];
                saveToStorage();
                renderCategoryChips();
                renderChecklist();
                updateProgress();
            }
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text.replace(/&/g, "&amp;")
                       .replace(/</g, "&lt;")
                       .replace(/>/g, "&gt;")
                       .replace(/"/g, "&quot;")
                       .replace(/'/g, "&#039;");
        }

        // Insurance Modal Gallery Functions
        function openInsuranceModal(idx = 0) {
            if ((!insuranceImages || insuranceImages.length === 0) && window.INSURANCE_IMAGES_DATA) {
                insuranceImages = window.INSURANCE_IMAGES_DATA;
            }

            if (!insuranceImages || insuranceImages.length === 0) {
                alert("보험증서 이미지를 불러오는 중입니다. 잠시 후 다시 클릭해 주세요.");
                return;
            }
            currentInsuranceIdx = idx;
            const modal = document.getElementById("insuranceModal");
            if (modal) {
                modal.classList.add("active");
                updateInsuranceViewer();
            }
        }

        function closeInsuranceModal() {
            const modal = document.getElementById("insuranceModal");
            if (modal) {
                modal.classList.remove("active");
            }
        }

        function handleModalBackdropClick(e) {
            if (e.target.id === "insuranceModal") {
                closeInsuranceModal();
            }
        }

        function prevInsuranceImage() {
            if (!insuranceImages || insuranceImages.length === 0) return;
            currentInsuranceIdx = (currentInsuranceIdx - 1 + insuranceImages.length) % insuranceImages.length;
            updateInsuranceViewer();
        }

        function nextInsuranceImage() {
            if (!insuranceImages || insuranceImages.length === 0) return;
            currentInsuranceIdx = (currentInsuranceIdx + 1) % insuranceImages.length;
            updateInsuranceViewer();
        }

        function formatBase64Src(b64) {
            if (!b64) return '';
            if (b64.startsWith('data:')) return b64;
            return 'data:image/png;base64,' + b64;
        }

        function updateInsuranceViewer() {
            if (!insuranceImages || insuranceImages.length === 0) return;
            const item = insuranceImages[currentInsuranceIdx];
            const imgEl = document.getElementById("insuranceCurrentImg");
            const counterEl = document.getElementById("insuranceCounter");
            const thumbsContainer = document.getElementById("insuranceThumbnails");

            if (imgEl && item) {
                imgEl.src = formatBase64Src(item.base64);
                imgEl.alt = item.file || `보험증서 페이지 ${currentInsuranceIdx + 1}`;
            }

            if (counterEl) {
                counterEl.innerText = `${currentInsuranceIdx + 1} / ${insuranceImages.length}`;
            }

            if (thumbsContainer) {
                thumbsContainer.innerHTML = "";
                insuranceImages.forEach((imgObj, i) => {
                    const thumb = document.createElement("img");
                    thumb.className = `thumb-item ${i === currentInsuranceIdx ? 'active' : ''}`;
                    thumb.src = formatBase64Src(imgObj.base64);
                    thumb.alt = `페이지 ${i + 1}`;
                    thumb.title = `페이지 ${i + 1}`;
                    thumb.onclick = (e) => {
                        e.stopPropagation();
                        currentInsuranceIdx = i;
                        updateInsuranceViewer();
                    };
                    thumbsContainer.appendChild(thumb);
                });
            }
        }

        document.addEventListener("keydown", (e) => {
            const modal = document.getElementById("insuranceModal");
            if (modal && modal.classList.contains("active")) {
                if (e.key === "ArrowLeft") {
                    prevInsuranceImage();
                } else if (e.key === "ArrowRight") {
                    nextInsuranceImage();
                } else if (e.key === "Escape") {
                    closeInsuranceModal();
                }
            }
        });

        // Start on page load
        document.addEventListener("DOMContentLoaded", initApp);
    </script>
</body>

</html>
