<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">증권세제와 회사법의 판단 흐름</title>
  <desc id="desc">거래와 회사 의사결정의 상황을 구분하고 과세와 회사법상 요건을 확인하는 네 단계</desc>
  <rect width="960" height="430" rx="24" fill="#f4f7fc"/>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="48" y="52" font-size="19" fill="#2563eb" font-weight="700">SECURITIES TAX · CORPORATE LAW</text>
    <text x="48" y="91" font-size="29" font-weight="700">거래와 회사 의사결정은 질문을 나눠 확인합니다</text>
    <text x="48" y="119" font-size="16" fill="#64748b">무엇을 했는가 → 누가 결정하는가 → 어떤 요건인가 → 어떻게 기록하는가</text>
    <g transform="translate(48 151)">
      <rect width="196" height="142" rx="16" fill="#172b4d"/>
      <circle cx="29" cy="29" r="16" fill="#60a5fa"/><text x="24" y="35" fill="#172b4d" font-size="17" font-weight="700">1</text>
      <text x="22" y="76" fill="white" font-size="19" font-weight="700">상황 분류</text>
      <text x="22" y="105" fill="#bfdbfe" font-size="15">거래 · 소득 · 자본</text>
      <text x="22" y="127" fill="#bfdbfe" font-size="15">회사 의사결정</text>
    </g>
    <g transform="translate(268 151)">
      <rect width="196" height="142" rx="16" fill="#dbeafe"/>
      <circle cx="29" cy="29" r="16" fill="#2563eb"/><text x="24" y="35" fill="white" font-size="17" font-weight="700">2</text>
      <text x="22" y="76" font-size="19" font-weight="700">기준 확인</text>
      <text x="22" y="105" fill="#475569" font-size="15">과세대상 · 납세자</text>
      <text x="22" y="127" fill="#475569" font-size="15">자본금 · 주주권</text>
    </g>
    <g transform="translate(488 151)">
      <rect width="196" height="142" rx="16" fill="#e0e7ff"/>
      <circle cx="29" cy="29" r="16" fill="#4f46e5"/><text x="24" y="35" fill="white" font-size="17" font-weight="700">3</text>
      <text x="22" y="76" font-size="19" font-weight="700">요건·절차</text>
      <text x="22" y="105" fill="#475569" font-size="15">신고 · 납부 · 기간</text>
      <text x="22" y="127" fill="#475569" font-size="15">총회 · 이사회 · 등기</text>
    </g>
    <g transform="translate(708 151)">
      <rect width="204" height="142" rx="16" fill="#ccfbf1"/>
      <circle cx="29" cy="29" r="16" fill="#0f766e"/><text x="24" y="35" fill="white" font-size="17" font-weight="700">4</text>
      <text x="22" y="76" font-size="19" font-weight="700">검토·기록</text>
      <text x="22" y="105" fill="#475569" font-size="15">증빙과 의사록</text>
      <text x="22" y="127" fill="#475569" font-size="15">최신 법령 재확인</text>
    </g>
    <g stroke="#2563eb" stroke-width="4" fill="none">
      <path d="M252 222h10m-7-8 8 8-8 8"/>
      <path d="M472 222h10m-7-8 8 8-8 8"/>
      <path d="M692 222h10m-7-8 8 8-8 8"/>
    </g>
    <rect x="48" y="333" width="864" height="48" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="72" y="363" font-size="16" font-weight="700">기억할 구분</text>
    <text x="182" y="363" font-size="16" fill="#475569">세금의 성립·확정·소멸 ≠ 회사의 결의·집행·감독</text>
  </g>
</svg>
