<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">세제와 회사법의 질문</title><desc id="d">거래와 회사 의사결정에서 확인할 질문</desc><rect width="960" height="360" rx="24" fill="#f4f7fc"/><g font-family="sans-serif" fill="#172b4d"><text x="48" y="56" font-size="20" fill="#2563eb" font-weight="700">TAX &amp; COMPANY LAW</text><text x="48" y="96" font-size="30" font-weight="700">먼저 상황을 나누면 답이 보입니다</text><rect x="48" y="145" width="390" height="150" rx="18" fill="#172b4d"/><text x="82" y="190" fill="white" font-size="24" font-weight="700">증권세제</text><text x="82" y="230" fill="#bfdbfe" font-size="18">무엇을 거래했나?</text><text x="82" y="262" fill="#bfdbfe" font-size="18">누가·언제·얼마나?</text><rect x="522" y="145" width="390" height="150" rx="18" fill="#ccfbf1"/><text x="556" y="190" font-size="24" font-weight="700">회사법</text><text x="556" y="230" font-size="18">누가 결정할 권한인가?</text><text x="556" y="262" font-size="18">정족수·절차를 지켰나?</text></g></svg>
