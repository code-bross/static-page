<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">상장 과정</title><desc id="d">상장 신청부터 거래까지의 흐름</desc><rect width="960" height="360" rx="24" fill="#f4f7fc"/><g font-family="sans-serif" fill="#172b4d"><text x="48" y="56" font-size="20" fill="#2563eb" font-weight="700">LISTING</text><text x="48" y="96" font-size="30" font-weight="700">시장에 들어오는 길은 순서가 있습니다</text><g transform="translate(48 150)"><rect width="190" height="105" rx="16" fill="#172b4d"/><text x="25" y="48" fill="white" font-size="21" font-weight="700">상장 신청</text><text x="25" y="80" fill="#bfdbfe" font-size="16">발행인의 신청</text></g><g transform="translate(285 150)"><rect width="190" height="105" rx="16" fill="#dbeafe"/><text x="25" y="48" font-size="21" font-weight="700">심사·공시</text><text x="25" y="80" font-size="16">요건과 정보 확인</text></g><g transform="translate(522 150)"><rect width="190" height="105" rx="16" fill="#e0e7ff"/><text x="25" y="48" font-size="21" font-weight="700">공모·배정</text><text x="25" y="80" font-size="16">투자자에게 배분</text></g><g transform="translate(759 150)"><rect width="150" height="105" rx="16" fill="#ccfbf1"/><text x="25" y="48" font-size="21" font-weight="700">거래</text><text x="25" y="80" font-size="16">시장 진입</text></g><path d="M250 202h25m-8-8 8 8-8 8M487 202h25m-8-8 8 8-8 8M724 202h25m-8-8 8 8-8 8" stroke="#2563eb" stroke-width="4" fill="none"/></g></svg>
