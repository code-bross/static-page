<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">경기와 주가의 연결</title>
  <desc id="desc">경기 국면, 금리와 심리, 기업가치와 주가의 연결</desc>
  <rect width="960" height="360" rx="24" fill="#f4f7fc"/>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="48" y="56" font-size="20" fill="#2563eb" font-weight="700">MACRO FLOW</text>
    <text x="48" y="96" font-size="30" font-weight="700">경제가 움직이면, 숫자와 심리도 움직입니다</text>
    <g transform="translate(48 145)">
      <rect width="230" height="130" rx="18" fill="#172b4d"/>
      <text x="24" y="48" fill="white" font-size="23" font-weight="700">경기 국면</text>
      <text x="24" y="84" fill="#bfdbfe" font-size="18">회복 → 호황</text>
      <text x="24" y="110" fill="#bfdbfe" font-size="18">후퇴 → 불황</text>
    </g>
    <path d="M300 210h70m-15-12 15 12-15 12M590 210h70m-15-12 15 12-15 12" stroke="#2563eb" stroke-width="5" fill="none"/>
    <g transform="translate(380 145)">
      <rect width="180" height="130" rx="18" fill="#dbeafe"/>
      <text x="24" y="48" font-size="22" font-weight="700">금리·심리</text>
      <text x="24" y="84" font-size="17">유동성</text>
      <text x="24" y="108" font-size="17">기대와 수요</text>
    </g>
    <g transform="translate(670 145)">
      <rect width="230" height="130" rx="18" fill="#ccfbf1"/>
      <text x="24" y="48" font-size="22" font-weight="700">기업·주가</text>
      <text x="24" y="84" font-size="17">이익 전망</text>
      <text x="24" y="108" font-size="17">할인율·가격</text>
    </g>
  </g>
</svg>
