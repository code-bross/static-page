      <text x="22" y="76" font-size="19" font-weight="700">통제·관리</text>
      <text x="22" y="105" fill="#475569" font-size="15">선행매매 · 과당매매</text>
      <text x="22" y="127" fill="#475569" font-size="15">정보차단 · 보고</text>
    </g>
