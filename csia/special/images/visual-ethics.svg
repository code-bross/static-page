    <text x="48" y="91" font-size="29" font-weight="700">고객 보호는 권유 전부터 사후관리까지 이어집니다</text>
    <text x="48" y="119" font-size="16" fill="#64748b">고객우선 · 적합성 · 설명의무 · 이해상충 관리 · 기록 보존</text>
    <g transform="translate(48 151)">
