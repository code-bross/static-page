<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">고객 보호 업무 흐름</title><desc id="d">고객 파악, 적합성 확인, 설명과 사후관리</desc><rect width="960" height="360" rx="24" fill="#f4f7fc"/><g font-family="sans-serif" fill="#172b4d"><text x="48" y="56" font-size="20" fill="#2563eb" font-weight="700">ETHICS &amp; PROTECTION</text><text x="48" y="96" font-size="30" font-weight="700">좋은 권유는 고객을 먼저 확인합니다</text><g transform="translate(48 150)"><rect width="190" height="110" rx="16" fill="#172b4d"/><text x="27" y="198" fill="white" font-size="20" font-weight="700">고객 파악</text><text x="27" y="232" fill="#bfdbfe" font-size="16">목표·경험·위험</text></g><g transform="translate(285 150)"><rect width="190" height="110" rx="16" fill="#dbeafe"/><text x="27" y="198" font-size="20" font-weight="700">적합성 확인</text><text x="27" y="232" font-size="16">권유할 상품인가?</text></g><g transform="translate(522 150)"><rect width="190" height="110" rx="16" fill="#e0e7ff"/><text x="27" y="198" font-size="20" font-weight="700">설명·기록</text><text x="27" y="232" font-size="16">위험과 비용 전달</text></g><g transform="translate(759 150)"><rect width="150" height="110" rx="16" fill="#ccfbf1"/><text x="25" y="198" font-size="20" font-weight="700">사후관리</text><text x="25" y="232" font-size="16">신뢰 유지</text></g><path d="M250 205h25m-8-8 8 8-8 8M487 205h25m-8-8 8 8-8 8M724 205h25m-8-8 8 8-8 8" stroke="#2563eb" stroke-width="4" fill="none"/></g></svg>
