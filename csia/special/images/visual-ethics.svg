      <text x="22" y="76" font-size="19" font-weight="700">상품 판단</text>
      <text x="22" y="105" fill="#475569" font-size="15">적합성 · 적정성</text>
      <text x="22" y="127" fill="#475569" font-size="15">권유 여부 구분</text>
    </g>
    <g transform="translate(436 151)">
      <rect width="160" height="142" rx="16" fill="#e0e7ff"/>
