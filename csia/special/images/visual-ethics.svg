      <circle cx="28" cy="29" r="16" fill="#60a5fa"/><text x="23" y="35" fill="#172b4d" font-size="17" font-weight="700">1</text>
      <text x="22" y="76" fill="white" font-size="19" font-weight="700">고객 확인</text>
      <text x="22" y="105" fill="#bfdbfe" font-size="15">목표 · 경험 ·</text>
      <text x="22" y="127" fill="#bfdbfe" font-size="15">위험감수능력</text>
