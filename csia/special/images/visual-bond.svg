<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">채권 가격과 금리</title><desc id="d">시장금리와 채권가격의 반대 방향 관계</desc><rect width="960" height="360" rx="24" fill="#f4f7fc"/><g font-family="sans-serif" fill="#172b4d"><text x="48" y="56" font-size="20" fill="#2563eb" font-weight="700">BOND MARKET</text><text x="48" y="96" font-size="30" font-weight="700">금리가 오르면, 기존 채권 가격은?</text><rect x="55" y="145" width="365" height="140" rx="18" fill="#dbeafe"/><text x="85" y="190" font-size="23" font-weight="700">시장금리 상승</text><path d="M100 225h260M180 205l80 40m0 0 80-40" stroke="#dc2626" stroke-width="8" fill="none"/><text x="85" y="270" font-size="18">새 상품의 수익률이 높아짐</text><rect x="540" y="145" width="365" height="140" rx="18" fill="#ccfbf1"/><text x="570" y="190" font-size="23" font-weight="700">기존 채권 가격 하락</text><path d="M585 225h260M665 205l80 40m0 0 80-40" stroke="#2563eb" stroke-width="8" fill="none"/><text x="570" y="270" font-size="18">고정된 현금흐름의 상대 매력 감소</text><path d="M445 215h85" stroke="#7c3aed" stroke-width="5" stroke-dasharray="10 8"/></g></svg>
