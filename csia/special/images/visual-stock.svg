<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">주식 분석의 두 렌즈</title><desc id="d">기본적 분석과 기술적 분석 비교</desc><rect width="960" height="360" rx="24" fill="#f4f7fc"/><g font-family="sans-serif" fill="#172b4d"><text x="48" y="56" font-size="20" fill="#2563eb" font-weight="700">STOCK ANALYSIS</text><text x="48" y="96" font-size="30" font-weight="700">가치를 볼까, 흐름을 볼까?</text><rect x="48" y="135" width="390" height="165" rx="18" fill="#172b4d"/><text x="78" y="180" fill="white" font-size="25" font-weight="700">기본적 분석</text><text x="78" y="220" fill="#bfdbfe" font-size="18">경제 → 산업 → 기업</text><text x="78" y="254" fill="#bfdbfe" font-size="18">이익·위험 → 내재가치</text><rect x="522" y="135" width="390" height="165" rx="18" fill="#e0e7ff"/><text x="552" y="180" font-size="25" font-weight="700">기술적 분석</text><path d="M554 258l58-52 45 28 74-70 48 30" stroke="#7c3aed" stroke-width="7" fill="none"/><text x="552" y="286" font-size="18">가격·거래량 → 추세·심리</text></g></svg>
