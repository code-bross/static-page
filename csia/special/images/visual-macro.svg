<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">경기순환의 국면과 주기</title>
  <desc id="desc">불황, 회복기, 호황기, 후퇴기가 반복되며 순환주기와 수축기, 확장기, 변동폭을 나타낸 경기순환 곡선</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#1677c8"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="24" fill="#f4f7fc"/>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="48" y="46" font-size="19" fill="#2563eb" font-weight="700">BUSINESS CYCLE</text>
    <text x="48" y="78" font-size="27" font-weight="700">경기순환은 네 국면을 반복합니다</text>
    <rect x="34" y="98" width="892" height="282" rx="14" fill="#fff" stroke="#d7e0ea"/>
    <line x1="62" y1="160" x2="900" y2="160" stroke="#8b98a8" stroke-width="2"/>
    <line x1="62" y1="300" x2="900" y2="300" stroke="#8b98a8" stroke-width="2"/>
    <line x1="62" y1="230" x2="900" y2="230" stroke="#aeb9c5" stroke-width="2"/>
    <path d="M70 300 C130 300 145 160 235 160 C315 160 330 300 405 300 C475 300 490 160 580 160 C660 160 675 300 750 300 C820 300 850 294 890 294"
      fill="none" stroke="#1677c8" stroke-width="6" stroke-linecap="round"/>
    <g stroke="#1677c8" stroke-width="1.5" stroke-dasharray="5 5">
      <line x1="235" y1="124" x2="235" y2="330"/>
      <line x1="405" y1="124" x2="405" y2="330"/>
      <line x1="580" y1="124" x2="580" y2="330"/>
      <line x1="750" y1="124" x2="750" y2="330"/>
    </g>
    <g fill="#1677c8">
      <circle cx="70" cy="300" r="6"/><circle cx="235" cy="160" r="6"/>
      <circle cx="405" cy="300" r="6"/><circle cx="580" cy="160" r="6"/>
      <circle cx="750" cy="300" r="6"/>
    </g>
    <g fill="#172b4d" font-size="16" font-weight="700">
      <text x="80" y="322">① 불황기</text>
      <text x="145" y="187">② 회복기</text>
      <text x="207" y="143">③ 호황기</text>
      <text x="317" y="187">④ 후퇴기</text>
      <text x="415" y="322">① 불황기</text>
      <text x="490" y="187">② 회복기</text>
      <text x="552" y="143">③ 호황기</text>
      <text x="662" y="187">④ 후퇴기</text>
    </g>
    <g stroke="#1677c8" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <line x1="235" y1="116" x2="580" y2="116"/>
      <line x1="235" y1="348" x2="405" y2="348"/>
      <line x1="405" y1="348" x2="580" y2="348"/>
      <line x1="914" y1="160" x2="914" y2="300"/>
    </g>
    <g fill="#172b4d" font-size="15" font-weight="700">
      <text x="371" y="110">순환주기</text>
      <text x="281" y="371">수축기</text>
      <text x="467" y="371">확장기</text>
      <text x="920" y="234" writing-mode="tb">변동폭</text>
    </g>
    <text x="64" y="398" font-size="14" fill="#64748b">저점에서 다음 저점까지가 순환주기이며, 정점과 저점 사이의 차이가 변동폭입니다.</text>
  </g>
</svg>
