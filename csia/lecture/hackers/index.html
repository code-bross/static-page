abel=\"핵심 내용\">장부가액 기재, 영업용순자본 감산항목은 위험액 미산정</td></tr><tr><td data-label=\"구분\">총위험액</td><td data-label=\"핵심 내용\">시장위험＋신용위험＋운영위험</td></tr></tbody></table></div>", "quiz": [{"q": "금융투자업의 등록에 대한 설명으로 틀린 것은?", "a": "\"투자자문업의 경우 금융투자전문인력 3인 이상이어야 한다\"", "e": "자문업 1인, 일임업 2인, 둘 다 3인 이상이 맞음."}, {"q": "금융투자업자의 건전성 규제에 대한 설명으로 잘못된 것은?", "a": "\"순자본비율이 50% 이상 100% 미만인 경우 경영개선명령을 한다\"", "e": "이 구간은 <strong>경영개선권고</strong>이며, 명령은 0% 미만."}, {"q": "금융투자업자의 대주주 거래 제한에 대한 설명으로 잘못된 것은?", "a": "\"계열사가 발행한 주식·채권을 자기자본의 3%를 초과해 소유할 수 없다\"", "e": "한도는 <strong>8%</strong> (자기자본 기준 아님)."}, {"q": "고정으로 분류된 자산의 대손충당금 적립비율은?", "a": "<strong>20%</strong>", "e": "정상(충당금 적립) → 요주의 2% → 고정 20% → 회수의문 75% → 추정손실 100%."}, {"q": "대주주의 부당한 영향력 행사가 의심될 때 금융당국이 할 수 있는 조치는?", "a": "금융투자업자·대주주에게 <strong>필요한 자료 제출 요구</strong>", "e": "부당한 압력·횡포를 막기 위한 수단."}]}, {"id": "aW-frndpWak", "group": "자본시장법", "groupIndex": 1, "index": 5, "label": "5탄", "title": "[증권투자권유자문인력 강의 인강] 기출문제 풀이🙌 '자본시장법 5탄'ㅣ해커스 송영욱", "teacher": "송영욱", "nature": "기출풀이", "depth": "full", "video": "https://www.youtube.com/watch?v=aW-frndpWak", "badge": "", "content": "<h2 class=\"section-heading\">1. 금융투자업자의 공통 영업행위 규칙 — 업무위탁 규제</h2><ul><li>금융투자업자가 아닌 자는 <strong>금융투자·증권·파생·선물</strong> 등의 명칭을 상호에 사용할 수 없고, 투자정보 제공 등을 내세우며 영업할 수 없음.</li><li>금융투자업자는 <strong>자신의 명의를 대여</strong>하여 타인에게 금융투자업을 영위하게 해서는 안 됨.</li><li><strong>업무위탁 규제의 3단계 구분</strong> (핵심 암기):</li><li><strong>금융투자 겸영 업무 등 부수업무</strong>: 제3자에게 <strong>전부 또는 일부 위탁 가능</strong>.</li><li><strong>본질적 업무</strong>: 위탁 가능하나, 수탁회사가 해당 업무에 대한 <strong>인가·등록을 받은 자</strong>여야 함.</li><li><strong>핵심 업무</strong>: 위탁 <strong>불가</strong> — \"전산관리·조사분석 업무는 제외하고 전부 재위탁 가능\"이라는 지문은 틀림. 원칙적으로 재위탁 금지이나 전산·조사분석 등 일부는 <strong>위탁자 동의</strong>를 받으면 재위탁 예외 가능.</li></ul><h2 class=\"section-heading\">2. 투자매매업자·투자중개업자의 최선집행의무</h2><ul><li><strong>최선집행의무 적용 대상</strong>: 위험상품인 <strong>주권(주식)</strong> — 채무증권·파생결합증권·투자계약증권은 주식보다 덜 위험하므로 적용 없음.</li><li>증권사는 최선집행 기준을 <strong>3개월마다 점검</strong>해야 함.</li><li>고객이 최선집행 기준과 다른 <strong>별도 지시</strong>를 하면 고객의 의사에 따라 집행 (고객 지시 우선).</li></ul><h2 class=\"section-heading\">3. 자기계약 금지 원칙과 예외</h2><ul><li>투자매매업자·투자중개업자(증권사)가 <strong>자기계약을 하는 것은 원칙적으로 금지</strong> — 증권사 직원이 증권사와 고객을 쌍방 대리하는 경우.</li><li><strong>예외 (허용되는 경우)</strong>:</li></ul><ol><li>증권시장 또는 파생상품시장을 통한 매매 (공개시장이라 불공정 염려 없음)</li><li><strong>다자간매매체결회사</strong>를 통한 매매</li><li>자기가 판매한 <strong>집합투자증권의 환매</strong> (자기가 판 펀드를 되사는 것은 자기계약으로 보지 않음)</li><li>투자자 보호 우려가 없고 <strong>금융위원회</strong>가 정하여 고시하는 경우 (\"금융투자협회\"가 고시한다는 지문은 틀림).</li></ol><h2 class=\"section-heading\">4. 불건전 영업행위 (시행령 — 고빈출)</h2><ul><li><strong>고객 주문 전 선행매매 금지</strong> (프론트러닝).</li><li>조사분석자료 공표 <strong>24시간 경과 전 스캘핑 금지</strong>.</li><li>투자자에게 해당 투자매매업자·투자중개업자가 발행한 <strong>자기주식의 매매 권유 금지</strong>.</li></ul><h2 class=\"section-heading\">5. 투자매매업자·투자중개업자의 신용공여 규제 (증권사 대출 규제)</h2><ul><li>신용공여 = <strong>대출</strong>이라고 이해하면 됨.</li><li>구체적 기준·방법 등은 <strong>금융위원회 규정</strong>으로 정함.</li><li>신용공여는 증권사의 고유업무는 아니지만 <strong>증권과 관련된 경우 예외적으로 허용</strong>.</li><li><strong>증권 인수일로부터 3개월 이내에 투자자에게 그 증권을 매수하게 하기 위한 신용공여는 금지</strong> (묻지마 매수 유도 차단).</li><li><strong>증권회사의 총 신용공여 한도: 자기자본 범위 내</strong> (자기자본을 초과할 수 없음).</li><li><strong>신용공여 담보비율: 140% 이상</strong>.</li><li>행정조치(금융위) vs 형사처벌: 금융위는 회사·임직원에 대해 행정조치는 할 수 있으나 <strong>형사처벌은 할 수 없음</strong>.</li></ul><h2 class=\"section-heading\">6. 투자자예탁금의 별도예치</h2><ul><li>투자자예탁금은 고유재산과 <strong>구분하여 증권금융회사에 예치하거나 신탁회사에 신탁</strong> — \"타결제지원회사에 예탁\"이라는 지문은 틀림 (타결제지원회사는 증권 예탁용).</li><li>누구든지 투자자예탁금을 <strong>상계·압류할 수 없음</strong>.</li><li>금융투자업자의 <strong>인가 취소</strong> 시 투자자예탁금은 <strong>우선지급 사유</strong>에 해당.</li><li>안정적 운용: 정부가 지급보증한 채무증권뿐 아니라 <strong>금융기관이 지급보증한 채무증권도 매수 가능</strong> (\"매수할 수 없다\"는 지문은 틀림).</li></ul><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">업무위탁</td><td data-label=\"핵심 내용\">부수업무 전부·일부 가능 / 본질적 업무(수탁자 인가·등록자만) / <strong>핵심 업무 위탁 불가</strong></td></tr><tr><td data-label=\"구분\">최선집행의무 대상</td><td data-label=\"핵심 내용\"><strong>주권</strong>(위험상품). 3개월마다 점검, 고객 지시 우선</td></tr><tr><td data-label=\"구분\">자기계약 금지 예외</td><td data-label=\"핵심 내용\">시장 경유 매매, 다자간매매체결회사, 자기판매 펀드 환매, <strong>금융위</strong> 고시 경우</td></tr><tr><td data-label=\"구분\">불건전 영업행위</td><td data-label=\"핵심 내용\">선행매매 금지, 조사분석 공표 24시간 전 스캘핑 금지, 자기주식 매매 권유 금지</td></tr><tr><td data-label=\"구분\">신용공여 한도</td><td data-label=\"핵심 내용\"><strong>자기자본 범위 내</strong>, 담보비율 <strong>140%</strong> 이상</td></tr><tr><td data-label=\"구분\">신용공여 금지</td><td data-label=\"핵심 내용\">인수일로부터 <strong>3개월 이내</strong> 증권 매수 목적 신용공여</td></tr><tr><td data-label=\"구분\">투자자예탁금</td><td data-label=\"핵심 내용\">증권금융회사 예치 또는 신탁, <strong>상계·압류 불가</strong>, 인가취소 시 우선지급</td></tr><tr><td data-label=\"구분\">예탁금 운용</td><td data-label=\"핵심 내용\">정부보증뿐 아니라 <strong>금융기관 지급보증 채무증권도 매수 가능</strong></td></tr></tbody></table></div>", "quiz": [{"q": "업무위탁 규제에 대한 설명으로 틀린 것은?", "a": "\"전산관리·조사분석 업무를 제외하고는 모두 재위탁할 수 있다\"", "e": "<strong>핵심 업무는 위탁 불가</strong>가 원칙이며, 전산·조사분석은 위탁자 동의 시 예외적으로 재위탁 가능."}, {"q": "최선집행의무가 적용되는 금융투자상품은?", "a": "<strong>주권(주식)</strong>", "e": "위험상품인 주권에만 적용, 채무증권·파생결합증권 등은 제외."}, {"q": "자기계약 금지 원칙의 예외에 해당하지 않는 것은?", "a": "\"투자자 보호 우려가 없어 금융투자협회가 정하여 고시하는 경우\"", "e": "<strong>금융위원회</strong>가 고시하는 경우여야 함."}, {"q": "신용공여 규제에 대한 설명으로 틀린 것은?", "a": "\"증권 인수일로부터 3개월 이내 투자자에게 그 증권을 매수하게 하는 신용공여는 허용된다\"", "e": "<strong>금지</strong>됨."}, {"q": "투자자예탁금의 별도예치에 대한 설명으로 잘못된 것은?", "a": "\"타결제지원회사에 예탁해야 한다\"", "e": "<strong>증권금융회사에 예치 또는 신탁회사에 신탁</strong>해야 함."}]}, {"id": "9gqvV-rRGg0", "group": "자본시장법", "groupIndex": 1, "index": 6, "label": "자본시장 관련 법규 ①", "title": "증권투자권유자문인력 문제풀이 :자본시장 관련 법규 ①ㅣ해커스금융 송영욱", "teacher": "송영욱", "nature": "문제풀이", "depth": "full", "video": "https://www.youtube.com/watch?v=9gqvV-rRGg0", "badge": "", "content": "<h2 class=\"section-heading\">1. 자본시장법 제정 의의 (제정 배경 — 출제 빈도 낮음)</h2><ul><li><strong>열거주의 → 포괄주의</strong>: 과거에는 법에서 열거한 것만 허용 → 지금은 <strong>안 되는 것만 정하고 나머지는 모두 허용</strong>.</li><li><strong>기관별 규제 → 기능별 규제</strong>: 은행·증권·보험 등 기관이 아니라 매매·중개 등 <strong>기능</strong>을 기준으로 동일 규율.</li><li>업무범위 확대(겸영 허용, 투자권유대행인 제도 도입), 투자자 보호 강화.</li><li>\"열거주의 규제체제 도입\"이라는 지문은 틀림.</li></ul><h2 class=\"section-heading\">2. 금융투자상품의 정의 3요건</h2><ol><li><strong>이익을 얻거나 손실을 회피할 목적</strong> (영리 목적, 소비 목적 제외)</li><li><strong>현재 또는 장래 특정 시점에 금전 등을 지급하기로 약정</strong>함으로써 취득하는 <strong>권리</strong> (실물이 아닌 권리)</li><li><strong>원금손실 가능성</strong> = <strong>투자성</strong></li></ol><h2 class=\"section-heading\">3. 손해배상액 추정 — 투자금액·회수금액 산정 (고빈출 실수 포인트)</h2><ul><li>손해액 추정 = <strong>투자금액 − 회수금액</strong>.</li><li><strong>투자금액 산정 시 판매수수료는 제외</strong>: 1억원 투자, 선취수수료 1%(100만원) → 투자금액은 <strong>9,900만원</strong>.</li><li><strong>회수금액 산정 시 환매수수료는 포함</strong>: 7,000만원 환매, 환매수수료 1%(70만원) → 회수금액은 <strong>7,070만원</strong>.</li><li>\"판매수수료는 투자금액 산정 시 포함해야 한다\"는 지문은 틀림 (제외가 정답).</li></ul><h2 class=\"section-heading\">4. 금융투자상품의 분류 — 증권 vs 파생상품</h2><ul><li><strong>구분 기준: 원금초과손실 가능성 = 추가 지급의무</strong> 유무.</li><li><strong>증권</strong>: 원금까지만 손실 (추가로 낼 돈 없음 → <strong>추가 지급의무 없음</strong>).</li><li><strong>파생상품</strong>: 원금을 초과해 손실 가능 (추가로 더 내야 할 수 있음 → <strong>추가 지급의무 있음</strong>).</li><li><strong>증권 6종</strong> (암기): 채무증권 · 지분증권 · 수익증권 · 파생결합증권 · 증권예탁증권(DR) · 투자계약증권.</li><li><strong>파생상품</strong>: 장내파생상품(선물·옵션) / 장외파생상품(선도·스왑).</li><li><strong>파생결합증권(ELS·DLS·ELW)은 파생상품이 아니라 증권</strong> — '파생'이라는 말이 들어가도 증권 6종 중 하나 (빈출 함정).</li><li>주식매수선택권(스톡옵션)은 금융투자상품이 아님 (아래 제외 3종).</li></ul><h2 class=\"section-heading\">5. 금융투자상품에서 제외되는 3종 (무조건 암기)</h2><ol><li><strong>원화표시 CD</strong>(양도성예금증서)</li><li><strong>관리형(관리신탁)의 수익권</strong></li><li><strong>주식매수선택권</strong>(스톡옵션)</li></ol><ul><li>요건은 갖췄으나 법에서 명시적으로 제외.</li></ul><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">제정 의의</td><td data-label=\"핵심 내용\">열거주의→<strong>포괄주의</strong>, 기관별→<strong>기능별</strong> 규제</td></tr><tr><td data-label=\"구분\">금융투자상품 3요건</td><td data-label=\"핵심 내용\">영리 목적, 권리 취득, <strong>투자성</strong>(원금손실 가능성)</td></tr><tr><td data-label=\"구분\">투자금액 산정</td><td data-label=\"핵심 내용\"><strong>판매수수료 제외</strong> (1억−1% → 9,900만원)</td></tr><tr><td data-label=\"구분\">회수금액 산정</td><td data-label=\"핵심 내용\"><strong>환매수수료 포함</strong> (7,000만＋1% → 7,070만원)</td></tr><tr><td data-label=\"구분\">손해액 추정</td><td data-label=\"핵심 내용\">투자금액 − 회수금액</td></tr><tr><td data-label=\"구분\">증권 vs 파생상품</td><td data-label=\"핵심 내용\"><strong>원금초과손실 가능성</strong>(추가 지급의무) 유무</td></tr><tr><td data-label=\"구분\">증권 6종</td><td data-label=\"핵심 내용\">채무·지분·수익·<strong>파생결합</strong>·증권예탁·투자계약</td></tr><tr><td data-label=\"구분\">ELS·DLS·ELW</td><td data-label=\"핵심 내용\">파생결합<strong>증권</strong> (증권임)</td></tr><tr><td data-label=\"구분\">제외 3종</td><td data-label=\"핵심 내용\">CD, 관리신탁 수익권, 스톡옵션</td></tr></tbody></table></div>", "quiz": [{"q": "자본시장법 제정 의의와 거리가 먼 것은?", "a": "\"열거주의 규제체제 도입\"", "e": "<strong>포괄주의</strong> 도입이 맞음."}, {"q": "금융투자상품에 대한 설명으로 잘못된 것은?", "a": "\"판매수수료는 투자금액 산정 시 포함해야 한다\"", "e": "판매수수료는 <strong>제외</strong>, 환매수수료는 회수금액 산정 시 <strong>포함</strong>."}, {"q": "금융투자상품의 분류에 대한 설명으로 옳은 것은?", "a": "\"증권은 추가 지급의무가 없는 금융투자상품이다\"", "e": "증권은 원금까지만 손실, 파생상품은 원금초과손실(추가 지급의무) 가능."}, {"q": "파생결합증권에 대한 설명으로 틀린 것은?", "a": "\"파생결합증권은 파생상품에 속한다\"", "e": "'파생'이 들어가도 <strong>증권 6종</strong> 중 하나."}, {"q": "금융투자상품에 해당하지 않는 것은?", "a": "<strong>주식매수선택권</strong>", "e": "CD·관리신탁 수익권·스톡옵션은 명시적 제외 3종."}]}, {"id": "4lGENu4H-i8", "group": "자본시장법", "groupIndex": 1, "index": 7, "label": "자본시장 관련 법규 ②", "title": "증권투자권유자문인력 문제풀이 :자본시장 관련 법규 ②ㅣ해커스금융 송영욱", "teacher": "송영욱", "nature": "문제풀이", "depth": "full", "video": "https://www.youtube.com/watch?v=4lGENu4H-i8", "badge": "", "content": "<h2 class=\"section-heading\">1. 증권 6종의 개념 정리 (짝짓기형 출제)</h2><ul><li><strong>채무증권</strong>: 채권 — 국가 발행 시 국채, 회사 발행 시 회사채.</li><li><strong>지분증권</strong>: 주식(주권) — 그냥 주식이라고 생각.</li><li><strong>수익증권</strong>: 펀드(투자신탁의 수익권).</li><li><strong>파생결합증권</strong>: ELS·DLS·ELW·ETN 등 '이(伊)'자로 시작하는 상품들.</li><li><strong>ETF는 파생결합증권이 아님</strong> — 펀드 거래이므로 <strong>수익증권</strong>에 가까움 (빈출 함정).</li><li><strong>증권예탁증권</strong>: DR (EDR·GDR·KDR 등).</li><li><strong>투자계약증권</strong>: 타인과의 공동사업 투자, 타인이 운영하고 발생한 수익을 투자자가 받는 계약 증권 — <strong>무정형 증권</strong>.</li></ul><h2 class=\"section-heading\">2. 파생결합증권의 종류 5가지와 제외 대상</h2><ul><li><strong>① 주가연계 파생결합증권</strong>: ELS.</li><li><strong>② 이자율연계 파생결합증권</strong>: DLS — '파생결합증권'이라는 말과 달리 <strong>채무증권에 속함</strong> (정답 함정).</li><li><strong>③ 신용연계 파생결합증권</strong>: CLN(Credit Linked Note).</li><li><strong>④ 재해연계 파생결합증권</strong>: CAT본드(Catastrophe Bond).</li><li><strong>⑤ 기타 파생결합증권</strong>.</li><li>\"재해연계 파생상품\" 같은 표현으로 나오면 제외 대상 지문에 주의 — '재해연계 파생결합증권(증권)'은 포함.</li></ul><h2 class=\"section-heading\">3. 파생상품의 개념 (용어 짝짓기)</h2><ul><li><strong>선물</strong>: 특정 기초자산에 대해 장래 특정 시점에 특정 가격으로 <strong>인도할 것을 약정</strong> — 장내 시장에서 거래.</li><li><strong>선도</strong>: 선물과 내용이 동일하나 <strong>장외 시장</strong>에서 거래.</li><li><strong>옵션</strong>: 특정 기초자산에 대해 장래 특정 시점에 특정 가격으로 <strong>권리를 부여</strong>하는 계약 (사거나 팔 수 있는 권리).</li><li><strong>스왑</strong>: 일정 기간 동안 <strong>교환</strong>할 것을 약정하는 계약.</li><li>키워드 암기: <strong>인도 = 선물/선도, 권리 부여 = 옵션, 교환 = 스왑</strong>.</li></ul><h2 class=\"section-heading\">4. 금융투자업 6종 (개념 정의 문제 — 최빈출)</h2><ul><li><strong>투자매매업</strong>: 누구의 명의로 하든지 <strong>자기의 계산</strong>으로 금융투자상품의 매매 등을 영업으로 하는 것 — 자기 돈으로 거래, 손익이 자기에게 귀속.</li><li><strong>투자중개업</strong>: 누구의 명의로 하든지 <strong>타인의 계산</strong>으로 매매의 중개 등을 영업으로 하는 것 — 고객 돈으로 거래, 손익은 고객에게.</li><li><strong>집합투자업</strong>: 2인 이상 투자자로부터 자산을 <strong>집합</strong>하여 운용 (투자자를 구별하지 않음).</li><li><strong>투자자문업</strong>: 금융투자상품의 가치·투자판단에 대한 자문을 영업으로.</li><li><strong>투자일임업</strong>: 투자자로부터 투자판단의 전부·일부를 일임받아 <strong>투자자별로 구분하여</strong> 운용 (집합투자와 대비 — 구분 운용).</li><li><strong>신탁업</strong>: 신탁을 영업으로 하는 금융투자업.</li></ul><h2 class=\"section-heading\">5. 투자매매업의 적용 배제 사유</h2><ul><li><strong>자기가 증권을 발행하는 경우</strong>: 투자매매업으로 보지 않음 — 상장법인이 유상증자할 때마다 인가를 받아야 한다면 말이 안 되므로.</li><li><strong>투자매매업자를 상대방으로 하거나 투자중개업자를 통하여 금융투자상품을 매매하는 경우</strong>: 적용 배제 — \"투자매매업으로 본다\"는 지문은 틀림.</li><li>적용 배제에 해당하면 금융위 <strong>인가 없이</strong> 투자매매와 같은 행위 가능.</li></ul><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">ETF</td><td data-label=\"핵심 내용\">파생결합증권 아님 → <strong>수익증권</strong> 계열</td></tr><tr><td data-label=\"구분\">이자율연계 파생결합증권</td><td data-label=\"핵심 내용\"><strong>채무증권</strong>에 속함 (함정)</td></tr><tr><td data-label=\"구분\">신용연계 / 재해연계</td><td data-label=\"핵심 내용\"><strong>CLN</strong> / <strong>CAT본드</strong></td></tr><tr><td data-label=\"구분\">인도</td><td data-label=\"핵심 내용\"><strong>선물(장내)·선도(장외)</strong></td></tr><tr><td data-label=\"구분\">권리 부여</td><td data-label=\"핵심 내용\"><strong>옵션</strong></td></tr><tr><td data-label=\"구분\">교환</td><td data-label=\"핵심 내용\"><strong>스왑</strong></td></tr><tr><td data-label=\"구분\">투자매매업</td><td data-label=\"핵심 내용\"><strong>자기</strong>의 계산</td></tr><tr><td data-label=\"구분\">투자중개업</td><td data-label=\"핵심 내용\"><strong>타인</strong>의 계산</td></tr><tr><td data-label=\"구분\">집합투자 vs 일임</td><td data-label=\"핵심 내용\">구별 없이 집합 운용 vs <strong>투자자별 구분</strong> 운용</td></tr><tr><td data-label=\"구분\">투자매매업 적용배제</td><td data-label=\"핵심 내용\">자기증권 발행, 투자매매업자 상대방·투자중개업자 경유 매매</td></tr></tbody></table></div>", "quiz": [{"q": "파생결합증권에 해당하지 않는 것은?", "a": "<strong>ETF</strong>", "e": "ELS·ELW는 파생결합증권, ETF는 수익증권 계열."}, {"q": "파생결합증권에서 제외되는 것은?", "a": "<strong>이자율연계 파생결합증권</strong>", "e": "파생결합이라는 이름과 달리 <strong>채무증권</strong>에 속함."}, {"q": "파생상품에 대한 설명으로 잘못된 것은?", "a": "\"파생결합증권은 기초자산에 의해 산출된 금전 등을 거래할 수 있는 권리를 부여하는 것을 약정하는 계약이다\"", "e": "<strong>권리 부여 = 옵션</strong>이며, 파생결합증권은 증권이지 파생상품이 아님."}, {"q": "투자매매업·투자중개업의 개념으로 옳은 것은?", "a": "매매업은 <strong>자기의 계산</strong>, 중개업은 <strong>타인의 계산</strong>", "e": "'자기/타인의 계산' 키워드가 정오를 가름."}, {"q": "투자매매업에 대한 설명으로 잘못된 것은?", "a": "\"투자매매업자를 상대방으로 하거나 투자중개업자를 통하여 매매하는 경우 투자매매업으로 본다\"", "e": "<strong>적용 배제</strong> 사유이므로 투자매매업으로 보지 않음."}]}, {"id": "wKuy0LnwIpM", "group": "자본시장법", "groupIndex": 1, "index": 8, "label": "자본시장 관련 법규 ③", "title": "증권투자권유자문인력 문제풀이 :자본시장 관련 법규 ③ㅣ해커스금융 송영욱", "teacher": "송영욱", "nature": "문제풀이", "depth": "full", "video": "https://www.youtube.com/watch?v=wKuy0LnwIpM", "badge": "", "content": "<h2 class=\"section-heading\">1. 투자중개업의 적용 배제 사유 (4가지)</h2><ul><li><strong>투자권유대행인</strong>: 투자권유를 대행하는 경우 투자중개업으로 보지 않음 — 별도 인가 없이 가능.</li><li><strong>거래소</strong>: 증권시장·파생상품시장을 개설·운용하는 경우 투자중개업으로 보지 않음.</li><li>\"누구의 명의로 하든지 <strong>자기의 계산</strong>으로 할 것을 요한다\"는 지문은 틀림 — 투자중개업은 <strong>타인의 계산</strong>.</li></ul><h2 class=\"section-heading\">2. 투자자문업의 적용 배제 사유 4가지 (모두 해당 문제 — 빈출)</h2><ol><li><strong>불특정 다수인</strong>을 대상으로 발행·송신되고 불특정 다수인이 수시로 구입·수신할 수 있는 <strong>간행물·출판물·통신물·방송</strong> 등을 통해 조언하는 경우.</li><li><strong>역외투자자문업</strong> (국내 적용 제외에 해당하는 역외 영업).</li><li><strong>따로 대가 없이</strong> 다른 영업에 <strong>부수하여</strong> 금융상품의 가치·투자판단에 관한 자문에 응한 경우 — '따로 대가 없이' 키워드.</li><li><strong>외국투자자문업자</strong>가 국외에서 한국투자공사법에 따라 설립된 기금 및 그 기금을 운영하는 법인을 상대로 투자권유·투자광고 없이 투자자문업을 하는 경우.</li></ol><h2 class=\"section-heading\">3. 전문투자자 3분류 (투자자 구분 — 반복 출제)</h2><ul><li><strong>절대적 전문투자자</strong>: 어떤 경우에도 전문투자자 — 은행, 집합투자기구, 외국정부 등.</li><li><strong>상대적 전문투자자</strong> 4가지 (암기): <strong>주권상장법인 · 지방자치단체 · 기금관리운영법인 · 공익사업법인</strong> — 본인 신청 시 일반투자자로 전환 가능.</li><li><strong>주권상장법인이 장외파생상품 거래 시</strong>: 별도 의사표시 없으면 <strong>일반투자자로 대우</strong> (이중적 지위).</li><li><strong>자발적 전문투자자</strong>: 원래 일반투자자인 자가 스스로 전문투자자 지위 신청.</li><li>차등 보호: 일반투자자에게는 <strong>적합성·적정성 원칙 + 설명의무</strong> 필수, 전문투자자에게는 적용 안 됨.</li></ul><h2 class=\"section-heading\">4. 인가 대상 vs 등록 대상 금융투자업</h2><ul><li><strong>인가 대상 4종</strong>: 투자매매업·투자중개업·집합투자업·<strong>신탁업</strong> — 금융위 인가.</li><li><strong>등록 대상 4종</strong>: <strong>투자자문업·투자일임업</strong>·온라인소액투자중개업·전문사모집합투자업 — 금융위 등록.</li><li>인가 요건: 자기자본은 <strong>5억원과 대통령령 금액 중 큰 금액 이상</strong> / 전문인력 <strong>투자권유자문인력 5인 이상</strong>.</li><li>등록 전문인력: 투자자문업 <strong>1인</strong> 이상 · 투자일임업 <strong>2인</strong> 이상 · 둘 다 <strong>3인</strong> 이상.</li></ul><h2 class=\"section-heading\">5. 온라인소액투자중개업의 등록 요건과 영업행위 규제</h2><ul><li>등록 요건: 상법상 주식회사 또는 영업소 설치 외국 온라인투자중개업자, <strong>자기자본 5억원 이상</strong> (\"3억원 이상\" 지문은 틀림), 사업계획 타당성·건전성, 투자자 보호 가능 인력·전산·물적 장비.</li><li><strong>허용되는 청약권유 행위 4가지</strong> 외에는 불가 (자사 홈페이지 게시, 발행인 게재내용 홈페이지 게시, 홈페이지를 통한 회원 모집·관리, 특정 투자자에게 전송).</li><li><strong>투자광고는 개설된 인터넷 홈페이지에서만 가능</strong> — 홈페이지 이외 수단 통한 광고 금지.</li><li>발행인 요청 시 <strong>투자자 자격 등을 제한할 수 있음</strong>.</li></ul><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">투자중개업 적용배제</td><td data-label=\"핵심 내용\">투자권유대행인, 거래소의 시장 개설·운용</td></tr><tr><td data-label=\"구분\">투자자문업 적용배제 4</td><td data-label=\"핵심 내용\">불특정다수 간행물 조언, 역외투자자문업, <strong>무대가 부수자문</strong>, 외국투자자문업자</td></tr><tr><td data-label=\"구분\">투자중개업 정의</td><td data-label=\"핵심 내용\"><strong>타인</strong>의 계산 (자기의 계산 아님)</td></tr><tr><td data-label=\"구분\">상대적 전문투자자 4</td><td data-label=\"핵심 내용\">주권상장법인·지자체·기금운영법인·공익사업법인</td></tr><tr><td data-label=\"구분\">장외파생상품 거래 시</td><td data-label=\"핵심 내용\">상대적 전문투자자도 <strong>일반투자자</strong>로 대우</td></tr><tr><td data-label=\"구분\">인가 4종</td><td data-label=\"핵심 내용\">매매·중개·집합·신탁업</td></tr><tr><td data-label=\"구분\">등록 4종</td><td data-label=\"핵심 내용\">자문·일임·온라인소액·전문사모</td></tr><tr><td data-label=\"구분\">등록 전문인력</td><td data-label=\"핵심 내용\">1인(자문) / 2인(일임) / 3인(둘 다)</td></tr><tr><td data-label=\"구분\">온라인소액 등록</td><td data-label=\"핵심 내용\">자기자본 <strong>5억원</strong> 이상, 광고는 <strong>개설된 홈페이지</strong>에서만</td></tr></tbody></table></div>", "quiz": [{"q": "투자중개업에 대한 설명으로 잘못된 것은?", "a": "\"누구의 명의로 하든지 자기의 계산으로 할 것을 요한다\"", "e": "투자중개업은 <strong>타인의 계산</strong>."}, {"q": "투자자문업의 적용 배제 사유에 해당하는 것을 모두 고르면?", "a": "4가지 모두", "e": "불특정다수 간행물 조언·역외투자자문업·무대가 부수자문·외국투자자문업자 모두 등록 없이 가능."}, {"q": "절대적 전문투자자에 해당하지 않는 자는?", "a": "<strong>지방자치단체</strong>", "e": "은행·집합투자기구·외국정부는 절대적, 지자체는 <strong>상대적</strong> 전문투자자."}, {"q": "인가 대상 금융투자업이 아닌 것은?", "a": "<strong>투자일임업</strong>", "e": "자문업·일임업은 등록 대상."}, {"q": "온라인소액투자중개업의 등록 요건과 거리가 먼 것은?", "a": "\"3억원 이상의 자기자본이 있을 것\"", "e": "<strong>5억원 이상</strong>이 맞음."}, {"q": "온라인소액투자중개업자의 투자광고에 대한 설명으로 옳은 것은?", "a": "\"개설된 인터넷 홈페이지에서만 투자광고가 가능하다\"", "e": "홈페이지 이외 수단 통한 광고는 금지."}]}, {"id": "-ox83fdyMJ8", "group": "코넥스·K-OTC시장", "groupIndex": 2, "index": 1, "label": "이론정리 ①", "title": "증권투자권유자문인력 이론 정리! [코넥스시장, K-OTC시장①]ㅣ해커스금융 송영욱", "teacher": "송영욱", "nature": "이론정리", "depth": "full", "video": "https://www.youtube.com/watch?v=-ox83fdyMJ8", "badge": "", "content": "<h2 class=\"section-heading\">1. 우리나라 증권시장의 구조 (전제)</h2><ul><li><strong>장내시장 4가지</strong>: 유가증권시장(코스피) · 코스닥시장 · <strong>코넥스시장</strong> · 파생상품시장 — 한국거래소(KRX) 주관.</li><li><strong>장외시장의 대표</strong>: <strong>K-OTC시장</strong> — <strong>금융투자협회</strong> 주관 (한국거래소가 아님).</li><li>코넥스·K-OTC는 거래가 활성화되어 있지 않아 투명화·활성화를 위한 제도가 계속 만들어지는 중.</li></ul><h2 class=\"section-heading\">2. 코넥스시장의 특징 (유가증권·코스닥과 다른 점 중심)</h2><ul><li><strong>지정투자자 제도</strong>: 코넥스 특례상장(기술기업부·크라우드펀딩기업부 등) 시 <strong>지정투자자의 동의를 얻도록</strong> 함. 지정투자자는 거래소가 지정한 기관투자자(일반적으로 증권사·금융투자회사).</li><li><strong>지정자문인 제도</strong>: 유가증권·코스닥의 상장적격성은 <strong>한국거래소</strong>가 심사하지만, 코넥스의 상장적격성은 <strong>지정자문인(증권사)</strong> 이 판단 — 시험 최고 빈출 대비 포인트.</li><li><strong>기업설명회(IR) 개최 의무</strong>: 개최하지 않으면 상장폐지까지 가능 (유가증권·코스닥에는 없는 제도).</li><li><strong>가격제한폭</strong>: 유가증권·코스닥은 ±<strong>30%</strong>, 코넥스는 ±<strong>15%</strong>.</li><li><strong>동시호가 제도</strong>: 시간우선원칙의 예외 — 코넥스에는 원래 없었으나 <strong>최근 도입</strong>.</li><li><strong>LP(유동성공급자) 제도</strong>: 거래 부진 시 증권사가 호가를 받쳐주는 제도 도입.</li><li><strong>경매매 제도</strong>: 매도자는 1인, 매수자가 <strong>복수</strong>인 경우 경매매 방식으로 매매 가능.</li><li>코넥스시장은 <strong>초기 중소·벤처기업의 성장 지원</strong> 목적 — <strong>중소기업만 상장 가능</strong> (대기업·대형사는 코넥스 상장 요청 불가).</li></ul><h2 class=\"section-heading\">3. K-OTC시장의 특징 (장외시장)</h2><ul><li><strong>주관: 금융투자협회</strong> (장내시장의 한국거래소와 대비).</li><li><strong>상장이 아닌 등록·지정</strong>이라는 용어 사용:</li><li><strong>등록</strong>: 비상장주권이 K-OTC 등록을 요청해 거래 요건을 부여받는 것.</li><li><strong>지정</strong>: 협회가 신청 없이 K-OTC에서 거래될 수 있도록 지정한 것.</li><li><strong>신규등록 요건</strong> (상장 요건 대비 완화):</li><li><strong>전액 자본잠식 상태가 아닐 것</strong> — 50%·90% 자본잠식 회사도 등록 가능.</li><li><strong>매출액 5억원 이상</strong>.</li><li><strong>매매방식: 상대매매(1:1 거래)</strong> — 장내시장의 개별경쟁매매와 대비.</li><li><strong>불성실공시 유형</strong>: 유가증권·코스닥은 3가지(공시불이행·공시번복·<strong>공시변경</strong>)이나, K-OTC는 <strong>공시변경 제외</strong> → <strong>공시불이행·공시번복 2가지만</strong>.</li><li><strong>투자유의사항 공시</strong>: K-OTC시장에만 있는 공시 — 소규모·무명 회사가 많아 투자 위험 고지 목적.</li></ul><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">장내시장 4</td><td data-label=\"핵심 내용\">유가증권·코스닥·<strong>코넥스</strong>·파생상품 (KRX 주관)</td></tr><tr><td data-label=\"구분\">K-OTC 주관</td><td data-label=\"핵심 내용\"><strong>금융투자협회</strong> (장외시장)</td></tr><tr><td data-label=\"구분\">지정투자자 제도</td><td data-label=\"핵심 내용\">특례상장 시 <strong>지정투자자 동의</strong> 필요 (코넥스만)</td></tr><tr><td data-label=\"구분\">지정자문인 제도</td><td data-label=\"핵심 내용\">코넥스 <strong>상장적격성 판단 주체</strong> (유가·코스닥은 거래소)</td></tr><tr><td data-label=\"구분\">코넥스 기업설명회</td><td data-label=\"핵심 내용\"><strong>개최 의무</strong>, 미개최 시 상장폐지 가능</td></tr><tr><td data-label=\"구분\">가격제한폭</td><td data-label=\"핵심 내용\">유가·코스닥 ±30% vs 코넥스 ±<strong>15%</strong></td></tr><tr><td data-label=\"구분\">동시호가·LP·경매매</td><td data-label=\"핵심 내용\">코넥스에 <strong>신규 도입</strong>된 제도들</td></tr><tr><td data-label=\"구분\">코넥스 상장 대상</td><td data-label=\"핵심 내용\"><strong>중소기업만</strong> 가능</td></tr><tr><td data-label=\"구분\">K-OTC 용어</td><td data-label=\"핵심 내용\">상장이 아닌 <strong>등록·지정</strong></td></tr><tr><td data-label=\"구분\">K-OTC 등록 요건</td><td data-label=\"핵심 내용\">전액자본잠식만 아니면 됨, 매출 <strong>5억원</strong> 이상</td></tr><tr><td data-label=\"구분\">K-OTC 매매방식</td><td data-label=\"핵심 내용\"><strong>상대매매</strong>(1:1)</td></tr><tr><td data-label=\"구분\">K-OTC 불성실공시</td><td data-label=\"핵심 내용\">공시불이행·공시번복 <strong>2가지만</strong> (공시변경 제외)</td></tr><tr><td data-label=\"구분\">K-OTC 특유 공시</td><td data-label=\"핵심 내용\"><strong>투자유의사항 공시</strong></td></tr></tbody></table></div>", "quiz": [{"q": "코넥스시장의 상장적격성을 판단하는 주체는?", "a": "<strong>지정자문인(증권사)</strong>", "e": "유가증권·코스닥은 한국거래소가 판단."}, {"q": "코넥스시장의 가격제한폭은?", "a": "±<strong>15%</strong>", "e": "유가증권·코스닥의 ±30%와 대비."}, {"q": "코넥스시장의 특례상장 시 필요한 것은?", "a": "<strong>지정투자자의 동의</strong>", "e": "기술기업부·크라우드펀딩기업부 특례상장에 적용."}, {"q": "K-OTC시장을 주관하는 기관은?", "a": "<strong>금융투자협회</strong>", "e": "장내시장은 한국거래소, K-OTC는 금융투자협회."}, {"q": "K-OTC시장의 신규등록 요건으로 옳은 것은?", "a": "\"전액 자본잠식 상태가 아닐 것\"", "e": "50% 잠식도 등록 가능, 매출 5억원 이상."}, {"q": "K-OTC시장의 불성실공시 유형에 해당하지 않는 것은?", "a": "<strong>공시변경</strong>", "e": "K-OTC는 공시불이행·공시번복 2가지만 불성실공시."}]}, {"id": "lu1RYdDU-E0", "group": "코넥스·K-OTC시장", "groupIndex": 2, "index": 2, "label": "이론정리 ②", "title": "증권투자권유자문인력 이론 정리! [코넥스시장, K-OTC시장②]ㅣ해커스금융 송영욱", "teacher": "송영욱", "nature": "이론정리", "depth": "full", "video": "https://www.youtube.com/watch?v=lu1RYdDU-E0", "badge": "", "content": "<h2 class=\"section-heading\">1. 코넥스시장의 상장 제도 — 지정투자자·지정자문인</h2><ul><li><strong>지정기관투자자 제도</strong>: 특례상장으로 상장하는 경우 반드시 지정기관투자자를 지정하고 <strong>동의를 얻어야</strong> 상장 가능.</li><li>지정기관투자자의 요건: 해당 회사에 <strong>6개월 이상 투자</strong>, 금액은 <strong>30억원 이상 또는 지분 10% 이상</strong> 투자한 투자자.</li><li><strong>지정자문인 제도</strong>: 코넥스 상장적격성을 <strong>지정자문인(증권사)</strong> 이 심사·판단. 지정자문인은 상장 자문·지도, <strong>유동성 공급(LP)</strong> 역할도 수행.</li><li>그 외 완화 사항: 회계기준·지배구조 준수 의무 완화, <strong>보호예수 의무 면제·수수료 면제</strong>.</li></ul><h2 class=\"section-heading\">2. 코넥스시장의 상장 요건 (외형 요건 — 박스 암기)</h2><ol><li><strong>중소기업</strong>일 것.</li><li>주권(주식)의 <strong>양도 제한이 없을</strong> 것.</li><li><strong>감사의견 적정</strong>일 것.</li><li><strong>지정자문인과 선임 계약</strong>을 체결할 것.</li><li><strong>액면가액</strong>이 <strong>100원·200원·500원·1,000원·2,500원·5,000원</strong> 중 하나일 것 — <strong>무액면주 발행 불가</strong> (유가증권·코스닥은 무액면 가능).</li></ol><h2 class=\"section-heading\">3. 코넥스 특례상장 제도</h2><ul><li>일반 상장은 지정자문인이 필수이나, <strong>특례상장(기술기업부·크라우드펀딩기업부 등)은 지정자문인 없이도 상장 가능</strong>.</li><li>다만 상장한 날로부터 <strong>1년 이내</strong>에는 지정자문인 선임 계약을 체결해야 함.</li><li>특례상장 기업은 상장 후 <strong>6개월 경과</strong>하면 <strong>코스닥시장으로 이전상장</strong> 가능.</li></ul><h2 class=\"section-heading\">4. 코넥스시장의 상장폐지 요건</h2><ul><li><strong>지정자문인 미선임</strong>: 특례상장 기업이 상장일로부터 1년 이내 지정자문인을 선임하지 않으면 상장폐지.</li><li><strong>자본 전액잠식</strong>: 자본이 전액 잠식된 경우 상장폐지 — <strong>50% 잠식은 상장폐지 사유가 아님</strong>.</li><li><strong>기업설명회 미개최</strong>: <strong>2반기 연속</strong> 또는 <strong>3년 내 4회 이상</strong> 미개최 시 상장폐지 (유가증권·코스닥에는 없는 사유).</li><li>감사보고서 부적정·의견거절·범위제한으로 인한 한정, 분산요건 미달, 공시서류 미제출, 포괄적 주식교환 등.</li></ul><h2 class=\"section-heading\">5. 코넥스시장의 공시제도와 매매제도</h2><ul><li>공시: 의무공시·조회공시·자율공시 체계는 다른 시장과 유사, <strong>기업설명회 개최 의무</strong>가 특이점. 불성실공시 유형은 유가증권·코스닥(3가지)과 달리 <strong>2가지</strong>.</li><li><strong>매매수량 단위: 1주</strong> (유가증권시장과 동일).</li><li><strong>호가 종류</strong>: 유가증권시장은 지정가·시장가·조건부지정가·최유리지정가·최우선지정가 등 다양하나, 코넥스는 <strong>지정가·시장가 2가지만</strong> 가능.</li><li><strong>가격제한폭: ±15%</strong> (장외 대량매매는 30%).</li><li><strong>동시호가 제도 도입</strong> (시간우선원칙의 예외), <strong>LP(유동성공급) 제도</strong>는 지정자문인을 통해 운용.</li><li><strong>경매매 제도</strong>: 매도 1인 vs 매수 복수인 경우에 한해 허용.</li><li><strong>투자자유의사항 고지</strong>: 코넥스시장 투자 시 일반투자자에게 시장의 특성·투자위험을 <strong>개인별로 고지</strong> 의무 — 면제 대상: 전문투자자, 창업투자회사(창투사), 엔젤투자자 등.</li></ul><h2 class=\"section-heading\">6. K-OTC시장 — 등록·지정 제도</h2><ul><li><strong>등록</strong>: 비상장주권이 K-OTC 등록을 요청해 거래 요건을 부여받는 것.</li><li><strong>지정</strong>: 협회가 신청 없이 K-OTC 거래가 가능하도록 지정한 것.</li><li><strong>신규등록 요건</strong> (암기): ① <strong>전액 자본잠식 상태가 아닐 것</strong> (50% 잠식 가능) ② <strong>매출액 5억원 이상</strong> (크라우드펀딩 기업은 3억원, 크라우드펀딩 금액 2억원 이상 기준) ③ 감사의견 적정 ④ 통일규격 증권 발행 또는 전자등록 ⑤ 명의개서대행 계약 체결 ⑥ 주식 양도 제한 없을 것.</li><li><strong>신규지정 추가 요건</strong> (신규등록 요건 ＋ 2가지): ① 최근 사업연도 사업보고서를 금융위에 제출·공시하고 있을 것 ② 해당 주권에 <strong>공모 실적이 있거나 K-OTC 지정 동의서</strong>를 제출했을 것.</li></ul><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">지정기관투자자 요건</td><td data-label=\"핵심 내용\"><s h style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>분석 체계</strong></td><td data-label=\"핵심 내용\">일반적 방식 = <strong>탑다운(하향식)</strong>: 경제 → 산업 → 기업</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>계산문제 빈출</strong></td><td data-label=\"핵심 내용\"><strong>기본적분석 + 채권시장</strong>이 계산문제 최대 출제처</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>통화량 3효과</strong></td><td data-label=\"핵심 내용\"><strong>유동성 효과(단기, 금리↓)</strong> / <strong>소득 효과(장기, 금리↑)</strong> / <strong>피셔 효과(장기, 인플레이션 예상으로 금리↑)</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>통화량-주가</strong></td><td data-label=\"핵심 내용\"><strong>단기: 긍정적</strong> (금리 하락) / <strong>장기: 부정적 가능</strong> (금리 상승 요인)</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>한국은행 관리지표</strong></td><td data-label=\"핵심 내용\"><strong>M2</strong>. 만기 2년 이상 금융상품은 제외</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>M1 구성</strong></td><td data-label=\"핵심 내용\">현금통화 + 요구불예금 + 수시입출식 저축성예금(<strong>MMDA</strong>)</td></tr></tbody></table></div>", "quiz": [{"q": "기본적분석과 기술적분석의 차이로 옳은 것은?", "a": "<strong>기본적분석은 내재가치를 파악하는 것이 목표이고, 기술적분석은 과거 가격·거래량의 패턴을 찾아 미래 방향을 예측한다</strong>", "e": "\"과거 주가의 체계적 패턴을 찾는다\"는 기술적분석 설명이고, \"내재가치를 찾아낸다\"는 기본적분석 설명"}, {"q": "투자분석의 일반적인 접근 방식은?", "a": "<strong>탑다운(하향식) 방식 — 경제분석 → 산업분석 → 기업분석</strong>", "e": "큰 쪽에서 작은 쪽으로 분석하는 것이 일반적이며 교재도 이 방식을 따른다"}, {"q": "통화량 증가가 이자율에 미치는 효과로 옳은 것은?", "a": "<strong>단기적으로는 유동성 효과로 이자율이 하락하지만, 장기적으로는 소득 효과와 피셔 효과로 이자율이 상승할 수 있다</strong>", "e": "유동성 효과=단기·금리하락, 소득 효과·피셔 효과=장기·금리상승"}, {"q": "한국은행이 관리통화지표로 사용하는 것은?", "a": "<strong>M2(광의통화)</strong>", "e": "M1은 협의통화, M2가 관리지표. M2에서 만기 2년 이상 금융상품은 제외"}]}, {"id": "44fpeBTOVMw", "group": "기본적분석", "groupIndex": 3, "index": 2, "label": "기본서 핵심정리 (2)", "title": "[증권투자권유자문인력] 해커스 기본서 핵심정리 - 기본적분석(2)", "teacher": "민영기", "nature": "이론정리", "depth": "full", "video": "https://www.youtube.com/watch?v=44fpeBTOVMw", "badge": "", "content": "<h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>금리-주가</strong></td><td data-label=\"핵심 내용\"><strong>역의 관계</strong>: 금리 상승 → 자금조달·설비투자 축소 → <strong>주가 하락</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>물가-주가</strong></td><td data-label=\"핵심 내용\"><strong>완만한 상승 = 긍정적</strong>(기업 수익성 개선) / <strong>급격한 상승 = 부정적</strong> / <strong>스태그플레이션 = 부정적</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>인플레이션 헤지</strong></td><td data-label=\"핵심 내용\">주식 보유로 물가상승 피해 방지 가능 — 자산재평가·무상증자 논리</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>환율-주가</strong></td><td data-label=\"핵심 내용\"><strong>환율 상승(원화 절하) = 수출기업 채산성 개선 = 주가 상승</strong>. 환율 하락 = 주가 하락</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>원자재 가격-주가</strong></td><td data-label=\"핵심 내용\">원자재 가격 상승 → <strong>주가 하락</strong> (교과서 기준)</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>외국인투자자</strong></td><td data-label=\"핵심 내용\"><strong>주가 + 환율 함께 판단</strong>. 주가 상승보다 환율 상승이 크면 투자 안 함, 주가 하락보다 환율 하락이 크면 투자함</td></tr></tbody></table></div>", "quiz": [{"q": "금리와 주가의 관계로 옳은 것은?", "a": "<strong>금리와 주가는 역의 관계</strong>", "e": "금리 상승 시 자금조달·설비투자가 축소되어 주가가 하락하고, 금리 하락 시 주가가 상승한다"}, {"q": "물가와 주가의 관계로 틀린 것은?", "a": "<strong>\"물가가 완만한 상승세를 보이면 주가에 부정적인 영향을 준다\"</strong>", "e": "완만한 물가 상승은 기업 수익성 개선으로 주가에 긍정적이다. 급격한 물가 상승과 스태그플레이션이 부정적"}, {"q": "환율이 상승할 때 주가에 미치는 영향으로 옳은 것은?", "a": "<strong>수출기업의 채산성이 좋아져 주가가 상승한다</strong>", "e": "환율 상승 = 원화 절하 = 수출 증가·수입 감소 = 수출기업 수익성 향상"}, {"q": "외국인투자자의 투자 판단 기준으로 옳은 것은?", "a": "<strong>주가가 오르더라도 환율 상승폭이 더 크면 투자하지 않는다</strong>", "e": "외국인은 주가와 환율을 함께 보며, 환차손이 주가차익을 잠식하면 투자하지 않는다"}, {"q": "스태그플레이션이 주가에 미치는 영향은?", "a": "<strong>부정적</strong>", "e": "비용인상 인플레이션 + 경기침체의 동시 발생으로 기업 수지가 악화된다"}]}, {"id": "OOw5JzQs6mM", "group": "기본적분석", "groupIndex": 3, "index": 3, "label": "핵심 문제풀이 ①", "title": "증권투자권유자문인력 핵심 문제풀이 [기본적분석 ①]ㅣ해커스금융 민영기", "teacher": "민영기", "nature": "문제풀이", "depth": "full", "video": "https://www.youtube.com/watch?v=OOw5JzQs6mM", "badge": "", "content": "<h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>분석 공통 전제</strong></td><td data-label=\"핵심 내용\">시장은 <strong>비효율적</strong>이며 분석으로 <strong>초과이익</strong> 획득 가능</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>기본적분석</strong></td><td data-label=\"핵심 내용\">목표 = <strong>종목 선정</strong>, 핵심 = <strong>내재가치</strong>, 도구 = <strong>재무제표</strong>, 원인의 <strong>원인 규명</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>기술적분석</strong></td><td data-label=\"핵심 내용\">목표 = <strong>마켓 타이밍</strong>, 핵심 = <strong>과거 가격 추세</strong>, 도구 = <strong>차트</strong>, 원인 무관심</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>투자분석 체계</strong></td><td data-label=\"핵심 내용\"><strong>경제 → 산업 → 기업</strong> = <strong>탑다운(하향식)</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>유동성 효과</strong></td><td data-label=\"핵심 내용\">통화량 증가 → <strong>단기적</strong>으로 이자율 <strong>하락</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>소득 효과</strong></td><td data-label=\"핵심 내용\">이자율 하락 → 화폐수요 증가 → 이자율 <strong>상승</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>피셔 효과</strong></td><td data-label=\"핵심 내용\"><strong>인플레이션 예상</strong>으로 이자율 <strong>상승</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>재무상태표 작성기준</strong></td><td data-label=\"핵심 내용\">자산+<strong>부채+자본</strong>, 유동성 배열법(1년 기준), <strong>상계 금지(총액주의)</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>재무비율 한계</strong></td><td data-label=\"핵심 내용\"><strong>과거 정보</strong>, 결산기 상이 시 비교 곤란, 유량/저량 <strong>시간적 갭</strong>, 회계기준 상이 시 비교 곤란</td></tr></tbody></table></div>", "quiz": [{"q": "기본적분석과 기술적분석에 대한 설명으로 옳은 것은?", "a": "<strong>두 분석 모두 시장이 비효율적이라는 가정하에 분석을 통해 초과이익을 얻으려는 투자전략이다</strong>", "e": "\"과거 주가의 체계적 패턴\"은 기술적분석, \"내재가치 발견\"은 기본적분석의 설명이므로 해당 지문들은 오답"}, {"q": "피셔 효과에 대한 설명으로 옳은 것은?", "a": "<strong>인플레이션이 발생할 것으로 예상되어 금리가 다시 올라가는 현상</strong>", "e": "화폐수요 증가로 이자율이 오르는 것은 소득 효과이지 피셔 효과가 아니다"}, {"q": "경제지표와 주가의 관계로 잘못된 것은?", "a": "<strong>\"물가가 완만한 상승세를 보이면 주가에 부정적인 영향을 주어 하락한다\"</strong>", "e": "완만한 물가 상승은 기업 수익성 개선으로 주가에 긍정적"}, {"q": "재무상태표 작성기준으로 잘못된 것은?", "a": "<strong>\"재무상태표는 자산 및 부채로 구성된다\"</strong>", "e": "자산·부채와 함께 <strong>자본</strong>도 구성 요소이며, 차변=자산, 대변=부채+자본"}, {"q": "재무비율의 한계로 옳지 않은 것은?", "a": "<strong>\"결산기가 다른 기업과의 비교가 용이하다\"</strong>", "e": "결산기가 다른 기업은 직접 비교하기 어려우며, 유량/저량 간 시간적 갭과 회계기준 차이도 한계"}]}, {"id": "jXaOArSlgIQ", "group": "기본적분석", "groupIndex": 3, "index": 4, "label": "고득점 문제풀이 ②", "title": "증권투자권유자문인력 고득점 문제풀이 [기본적분석 ②]ㅣ해커스금융 민영기", "teacher": "민영기", "nature": "문제풀이", "depth": "full", "video": "https://www.youtube.com/watch?v=jXaOArSlgIQ", "badge": "", "content": "<h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>재무비율 4종</strong></td><td data-label=\"핵심 내용\"><strong>수익성=이익률 / 안정성=비율 / 활동성=회전율 / 성장성=증가율</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>활동성 회전율 산식</strong></td><td data-label=\"핵심 내용\"><strong>분자는 항상 매출액</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>ROI</strong></td><td data-label=\"핵심 내용\"><strong>당기순이익 / 총자본(총자산)</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>ROE</strong></td><td data-label=\"핵심 내용\"><strong>당기순이익 / 자기자본</strong> (가장 중요)</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>듀퐁 분해</strong></td><td data-label=\"핵심 내용\"><strong>ROE = 매출액순이익률 × 총자산회전율 × 재무레버리지</strong> (레버리지 제외하면 ROI)</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>유동비율</strong></td><td data-label=\"핵심 내용\"><strong>유동자산 / 유동부채</strong> — 단기채무 지급능력(유동성) 측정</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>배당성향·유보율</strong></td><td data-label=\"핵심 내용\"><strong>유보율 + 배당성향 = 1</strong> (유보율 = 1 − 배당성향)</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>EPS·BPS</strong></td><td data-label=\"핵심 내용\"><strong>EPS = 주당순이익</strong>, <strong>BPS = 주당장부가치</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>PER</strong></td><td data-label=\"핵심 내용\"><strong>주가 / EPS</strong> (자본회수기간 개념). <strong>적자 기업에는 사용 불가</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>PBR</strong></td><td data-label=\"핵심 내용\"><strong>주가 / BPS</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>가치주 판단</strong></td><td data-label=\"핵심 내용\"><strong>저PER·저PBR = 가치주(저평가)</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>배당수익률</strong></td><td data-label=\"핵심 내용\"><strong>주당 현금배당금 / 주가</strong></td></tr></tbody></table></div>", "quiz": [{"q": "기업의 수익 창출 능력을 측정하는 지표는?", "a": "<strong>수익성 비율(각종 이익률)</strong>", "e": "\"무슨무슨 이익률\" 형태가 수익성 비율이며, 자기자본이익률·총자본이익률·매출액영업이익률 등이 해당"}, {"q": "총자본이익률(ROI)이 전년에 비해 크게 향상된 이유로 거리가 먼 것은?", "a": "<strong>\"전년에 비하여 총자본이 크게 증가했다\"</strong>", "e": "분모(총자본)가 커지면 이익률은 떨어지므로, 향상되었다면 총자본은 감소했어야 한다"}, {"q": "ROE를 듀퐁 방식으로 분해하면?", "a": "<strong>매출액순이익률 × 총자산회전율 × 재무레버리지</strong>", "e": "재무레버리지를 제외하면 ROI(총자본이익률)가 됨"}, {"q": "기업의 단기채무 지급능력을 측정하는 대표적 비율은?", "a": "<strong>유동비율(유동자산 / 유동부채)</strong>", "e": ""}, {"q": "활동성 비율에 해당하지 않는 지표는?", "a": "<strong>이자보상비율</strong>", "e": "\"회전율\" 형태가 활동성 비율이고, 이자보상비율은 \"비율\" 형태의 안정성 비율"}, {"q": "PER에 대한 설명으로 잘못된 것은?", "a": "<strong>\"주당순이익이 증가하거나 주가가 높다면 PER이 올라간다\"</strong>", "e": "EPS(분모)가 증가하면 PER은 하락해야 하므로 \"감소하거나\"로 바꿔야 맞음. 적자인 경우 PER 사용 불가"}]}, {"id": "5fwraXat-nA", "group": "기본적분석", "groupIndex": 3, "index": 5, "label": "무료 문제풀이 ③", "title": "증권투자권유자문인력 무료 문제풀이 [기본적분석 ③]ㅣ해커스금융 민영기", "teacher": "민영기", "nature": "문제풀이", "depth": "full", "video": "https://www.youtube.com/watch?v=5fwraXat-nA", "badge": "", "content": "<h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>제로성장모형</strong></td><td data-label=\"핵심 내용\">주가 = <strong>배당금 / k</strong> (k = 무위험이자율 + 위험프리미엄)</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>정률성장모형</strong></td><td data-label=\"핵심 내용\">주가 = <strong>D₀(1+g) / (k − g)</strong>. 교재명 = <strong>항상성장모형 = 고든모형</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>성장률 g</strong></td><td data-label=\"핵심 내용\"><strong>g = 유보율 × ROE</strong>. 유보율 = <strong>1 − 배당성향</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>k 트릭</strong></td><td data-label=\"핵심 내용\">k를 <strong>무위험이자율 + 베타×(시장수익률 − 무위험이자율)</strong>로 찢어서 출제</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>모형 유추 관계</strong></td><td data-label=\"핵심 내용\"><strong>배당금↑→주가↑ / 요구수익률↑→주가↓ / 성장률↑→주가↑</strong>(분모 마이너스이므로)</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>기대수익률</strong></td><td data-label=\"핵심 내용\"><strong>기대수익률 = 배당수익률 + 성장률</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>기대 PER</strong></td><td data-label=\"핵심 내용\"><strong>기대배당성향 / (k − g)</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>PBR 관계식</strong></td><td data-label=\"핵심 내용\"><strong>PBR = ROE × PER</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>EV/EBITDA</strong></td><td data-label=\"핵심 내용\"><strong>기업가치(EV, 주주+채권자 가치) / EBITDA</strong>(이자·세금·감가상각비 차감 전 이익)</td></tr></tbody></table></div>", "quiz": [{"q": "주당배당금 300원, 배당이 증가하지 않을 것으로 예상, 무위험이자율 4%, 위험프리미엄 5%일 때 주식의 가치는?", "a": "<strong>300 / 0.09 = 3,333.33원</strong> (제로성장모형)", "e": "배당금 / 요구수익률, 요구수익률 = 4% + 5% = 9%"}, {"q": "현재 배당금 1,000원, 배당성장률 12%, 요구수익률 16%일 때 현재주가는?", "a": "<strong>28,000원</strong>", "e": "1,000×1.12 / (0.16−0.12) = 1,120 / 0.04"}, {"q": "배당성향 40%, ROE 10%, 주가 20,000원, 주당배당 1,000원일 때 기대수익률은?", "a": "<strong>11%</strong>", "e": "배당수익률 5% + 성장률(유보율 60% × ROE 10% = 6%) = 11%"}, {"q": "기대배당성향 45%, 요구수익률 11%, 기대성장률 6%일 때 기대 PER은?", "a": "<strong>9</strong>", "e": "0.45 / (0.11−0.06) = 9"}, {"q": "주가수익비율(PER)과 자기자본이익률(ROE)의 곱으로 표현되는 것은?", "a": "<strong>PBR(주가장부가치비율)</strong>", "e": "PBR = ROE × PER"}, {"q": "EV/EBITDA에서 EV와 EBITDA의 의미로 옳은 것은?", "a": "<strong>EV = 기업의 전체 가치(주주가치+채권자가치), EBITDA = 이자·세금·감가상각비 차감 전 이익</strong>", "e": "기업의 내재가치와 전체 기업가치를 비교하는 지표"}]}, {"id": "saB8j2gjpW4", "group": "경기분석", "groupIndex": 4, "index": 1, "label": "이론정리 1탄", "title": "[증권투자권유자문인력] \"경기분석\" 이론 정리 1탄 기본서 무료강의ㅣ해커스민영기", "teacher": "민영기", "nature": "이론정리", "depth": "full", "video": "https://www.youtube.com/watch?v=saB8j2gjpW4", "badge": "", "content": "<h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>경기의 정의</strong></td><td data-label=\"핵심 내용\"><strong>국민경제 활동의 총체적 수준</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>경기변동 4요소</strong></td><td data-label=\"핵심 내용\"><strong>추세변동(장기) · 순환변동(사이클) · 계절변동 · 불규칙변동(무작위)</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>분석 시 제거 요소</strong></td><td data-label=\"핵심 내용\"><strong>계절변동 + 불규칙변동</strong> 제거, <strong>추세 + 순환</strong> 결합 분석이 일반적</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>대표 경기지표</strong></td><td data-label=\"핵심 내용\"><strong>GDP</strong> = 일정 기간 생산된 재화·서비스의 <strong>부가가치 합계</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>정점·저점</strong></td><td data-label=\"핵심 내용\">정점 = <strong>peak</strong>(경기 최고), 저점 = <strong>trough</strong>(경기 최저)</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>순환진폭·순환심도</strong></td><td data-label=\"핵심 내용\"><strong>정점과 저점의 차이</strong> (두 용어는 같은 의미)</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>순환주기</strong></td><td data-label=\"핵심 내용\"><strong>정점→다음 정점</strong> (또는 저점→다음 저점)까지의 기간</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>기준순환일</strong></td><td data-label=\"핵심 내용\">정점·저점이 발생한 <strong>구체적 시점</strong>(터닝 포인트)</td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>2분법</strong></td><td data-label=\"핵심 내용\"><strong>수축국면</strong>(정점→저점) / <strong>확장국면</strong>(저점→정점) — <strong>최근 주로 사용</strong></td></tr></tbody></table></div><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th style=\"width:28%\">구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\"><strong>4분법</strong></td><td data-label=\"핵심 내용\"><strong>회복 → 호황 → 후퇴 → 불황</strong> — 전통적 방식</td></tr></tbody></table></div>", "quiz": [{"q": "경기의 정의로 옳은 것은?", "a": "<strong>국민경제 활동의 총체적 수준</strong>", "e": "경제 전체가 얼마나 활발한지를 나타내는 총체적 개념"}, {"q": "경기변동의 구성 요소가 아닌 것은?", "a": "<strong>구조변동</strong> 등 4요소 외 항목", "e": "4요소는 추세변동·순환변동·계절변동·불규칙변동"}, {"q": "경기분석 시 일반적으로 제거하는 변동 요소는?", "a": "<strong>계절변동과 불규칙변동</strong>", "e": "규칙·패턴 발견을 위해 우연적·계절적 요소를 제거하고 추세변동+순환변동 위주로 분석"}, {"q": "순환진폭(순환심도)의 의미는?", "a": "<strong>정점과 저점 간의 차이</strong>", "e": "순환의 강도를 나타내며, 진폭과 심도는 같은 의미"}, {"q": "최근 경기순환 분석에서 주로 이용되는 방법은?", "a": "<strong>2분법(수축국면·확장국면)</strong>", "e": "회복·호황·후퇴·불황의 4분법보다 구분이 명확한 2분법을 최근에 더 많이 사용"}, {"q": "기준순환일의 의미는?", "a": "<strong>정점 또는 저점이 발생한 구체적 시점</strong>", "e": "확장국면↔수축국면이 바뀌는 터닝 포인트"}]}, {"id": "-5rpyKrc484", "group": "경기분석", "groupIndex": 4, "index": 2, "label": "물가지수 2탄", "title": "[증권투자권유자문인력] 경기분석 이론 정리 2탄_대표적 물가지수ㅣ해커스민영기", "teacher": "민영기", "nature": "이론정리", "depth": "full", "video": "https://www.youtube.com/watch?v=-5rpyKrc484", "badge": "", "content": "<h2 class=\"section-heading\">1. 대표적 물가지수 3종</h2><ul><li><strong>CPI (소비자물가지수)</strong>: 최종 소비재와 서비스의 물가 추이를 측정하는 지수</li><li>조사 대상: 대표 품목 <strong>481개</strong>를 뽑아 지속적으로 관찰 (숫자 암기 필요 없음 — \"대표적인 것만 뽑는다\"는 개념만)</li><li>특징: <strong>임금 비중이 상대적으로 높다</strong> (임금은 노동력의 가격이라 다른 재화 가격보다 변동이 적음) → <strong>경기 변동에 크게 민감하지 않다</strong></li><li>공식 없음, 특징만 숙지</li><li><strong>PPI (생산자물가지수)</strong>: 국내시장 1차 거래 단계에서 기업 간 거래되는 최종재·원자재·중간재 및 일부 서비스 가격을 조사</li><li>특징: 전반적인 상품의 <strong>수급 동향</strong>을 반영하는 물가지수</li><li>공식 없음, 특징만 숙지</li><li><strong>GDP 디플레이터 (GDP Deflator)</strong>: 유일하게 <strong>공식 암기 필수</strong></li><li>공식: <strong>GDP 디플레이터 = 명목GDP ÷ 실질GDP</strong></li><li>의미: <strong>국민경제 전체의 물가 수준(물가 압력)을 측정</strong>하는 종합 물가지수 — 모든 상품과 서비스의 가격을 종합 고려</li><li>해석: 디플레이터에서 1을 빼면 물가상승률 (예: 명목 1,200원 ÷ 실질 1,000원 = 1.2 → 물가상승률 <strong>20%</strong>)</li></ul><h2 class=\"section-heading\">2. 명목GDP vs 실질GDP (디플레이터의 기반 개념)</h2><ul><li><strong>명목GDP</strong>: 해당 연도의 가격 × 해당 연도 생산량 (가격 상승분이 그대로 반영됨)</li><li><strong>실질GDP</strong>: <strong>기준년도</strong>의 가격 × 해당 연도 생산량 (물가 변동을 제거)</li><li>예: 빵 10개, 2000년 가격 100원 → GDP 1,000원. 2001년 가격 120원으로 오르고 생산량 10개 동일 → 명목GDP 1,200원, 실질GDP 1,000원 → 성장이 아니라 <strong>물가 상승(인플레이션)</strong></li><li>디플레이터 = 1,200 ÷ 1,000 = 1.2 → 0.2(20%)가 물가 압력</li></ul><h2 class=\"section-heading\">3. 통화량 (통화지표 4분류)</h2><ul><li>유동성 기준: <strong>즉각적으로 현금화·지급결제 가능 여부</strong>에 따라 화폐 범위를 나눔</li><li><strong>M1 (협의통화)</strong>: 현금통화 + <strong>요구불예금</strong> + <strong>수시입출식 저축성예금</strong></li><li>요구불예금: 언제든 찾을 수 있어 유동성이 강함</li><li>수시입출식 저축성예금의 대표상품 = <strong>MMDA</strong> (M1 포함 명시)</li><li><strong>M2 (광의통화)</strong>: M1 + 나머지 금융상품 (CD, MMF 등 시장성 상품 전부)</li><li><strong>단, 만기가 2년 이상인 금융상품은 제외</strong></li><li>한국은행의 <strong>통화지표 관리 대상 기준 = M2</strong></li><li><strong>Lf (금융기관 유동성)</strong> / <strong>L (광의유동성)</strong>: 너무 광범위해 시험 중요도 낮음, 참고용</li><li>주의: MMF는 대부분 M1에 포함되지 않음 (2005.11 이후 일정 환매제도가 적용된 법인 MMF 제외, 2007.3.22 이후 미래가격제 도입된 개인 MMF 제외) — MMDA가 M1 포함되는 대표 상품</li></ul><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">물가지수 3종</td><td data-label=\"핵심 내용\"><strong>CPI</strong> (소비자물가지수), <strong>PPI</strong> (생산자물가지수), <strong>GDP 디플레이터</strong></td></tr><tr><td data-label=\"구분\">CPI 특징</td><td data-label=\"핵심 내용\">대표 품목 선별 조사, <strong>임금 비중 높음</strong>, <strong>경기 변동 민감도 낮음</strong>, 공식 없음</td></tr><tr><td data-label=\"구분\">PPI 특징</td><td data-label=\"핵심 내용\">기업 간 1차 거래 단계 조사, <strong>수급 동향 반영</strong>, 공식 없음</td></tr><tr><td data-label=\"구분\">GDP 디플레이터 공식</td><td data-label=\"핵심 내용\"><strong>명목GDP ÷ 실질GDP</strong> — 국민경제 전체 물가 압력 측정</td></tr><tr><td data-label=\"구분\">실질GDP</td><td data-label=\"핵심 내용\"><strong>기준년도 가격</strong> × 해당 연도 생산량</td></tr><tr><td data-label=\"구분\">M1 (협의통화)</td><td data-label=\"핵심 내용\">현금통화 + <strong>요구불예금</strong> + <strong>수시입출식 저축성예금</strong>(대표: <strong>MMDA</strong>)</td></tr><tr><td data-label=\"구분\">M2 (광의통화)</td><td data-label=\"핵심 내용\">M1 + 기타 금융상품. 단 <strong>만기 2년 이상 상품 제외</strong></td></tr><tr><td data-label=\"구분\">한국은행 관리 기준 지표</td><td data-label=\"핵심 내용\"><strong>M2</strong></td></tr></tbody></table></div>", "quiz": [{"q": "GDP 디플레이터의 공식과 의미는?", "a": "<strong>명목GDP ÷ 실질GDP</strong>", "e": "국민경제 전체의 물가 수준(물가 압력)을 종합적으로 측정하는 지수"}, {"q": "소비자물가지수(CPI)의 특징으로 옳은 것은?", "a": "<strong>임금이 차지하는 비중이 상대적으로 높고 경기 변동에 크게 민감하지 않다</strong>", "e": "임금은 노동력의 가격이라 가격 변동이 작기 때문"}, {"q": "생산자물가지수(PPI)가 반영하는 동향은?", "a": "<strong>전반적인 상품의 수급 동향</strong>", "e": "기업 간 1차 거래 단계 가격을 조사"}, {"q": "M1(협의통화)에 포함되는 것은?", "a": "현금통화, <strong>요구불예금</strong>, <strong>수시입출식 저축성예금(MMDA)</strong>", "e": "즉시 인출 가능해 유동성이 강한 것만"}, {"q": "M2에서 제외되는 금융상품의 기준은?", "a": "<strong>만기가 2년 이상인 금융상품</strong>", "e": "유동성이 낮은 장기 상품은 M2에서 제외"}, {"q": "한국은행이 통화지표 관리 기준으로 사용하는 지표는?", "a": "<strong>M2</strong>", "e": ""}]}, {"id": "r-UaF2w8K4w", "group": "경기분석", "groupIndex": 4, "index": 3, "label": "통화유통속도 3탄", "title": "[증권투자권유자문인력 강의] 통화유통속도 이론 정리 3탄ㅣ해커스민영기", "teacher": "민영기", "nature": "이론정리", "depth": "full", "video": "https://www.youtube.com/watch?v=r-UaF2w8K4w", "badge": "", "content": "<h2 class=\"section-heading\">1. 통화유통속도 (화폐유통속도)</h2><ul><li>정의: 한 단위의 화폐가 일정 기간 동안 <strong>몇 번 거래를 수행했는가</strong> 하는 회전율 (velocity)</li><li>공식: <strong>V = PY ÷ M = 명목GDP ÷ 통화량</strong></li><li>P = 물가 수준, Y = 거래량 → P × Y = <strong>명목GDP</strong></li><li>예: 명목GDP 1만원, 풀린 돈이 천원뿐이라면 → 돈이 <strong>10번</strong> 돌아야 하므로 유통속도 = 10</li><li>시험 포인트: 공식은 이해 위주 (박스 암기 수준), 뒤의 적정 통화량 공식이 진짜 암기 대상</li></ul><h2 class=\"section-heading\">2. 적정 통화량 증가율 공식 (암기 필수)</h2><ul><li>공식: <strong>Mg = Pg + Yg − Vg</strong></li><li>Mg = 통화량 증가율</li><li>Pg = GDP 디플레이터 상승률 (물가상승률)</li><li>Yg = 실질GDP 증가율 (경제성장률)</li><li>Vg = 통화유통속도 변화율</li><li>배경 개념: 통화량을 <strong>너무 많이</strong> 늘리면 물가 상승(국민 도탄), <strong>너무 적게</strong> 늘리면 거래 방해로 디플레이션·불황</li><li>전제: 경제 규모가 커지면 유통속도는 관습적으로 잘 안 바뀌므로(고정 가정), 경제성장만큼 통화량을 늘려야 적정</li><li>암기 팁: 물가상승 + 성장률 더하고, 유통속도 변화는 빼기</li></ul><h2 class=\"section-heading\">3. 경기변동의 원인 — 학파 매칭 (함정 빈출)</h2><div class=\"table-wrap\"><table><thead><tr><th>원인</th><th>학자</th><th>핵심 키워드</th></tr></thead><tbody><tr><td data-label=\"원인\"><strong>수요 측면 충격</strong></td><td data-label=\"학자\"><strong>케인스</strong></td><td data-label=\"핵심 키워드\">민간 기업의 <strong>투자지출 변화</strong>, 기업가의 <strong>동물적 감각(animal spirits)</strong> · 불안정한 투자심리</td></tr><tr><td data-label=\"원인\"><strong>화폐 충격</strong></td><td data-label=\"학자\"><strong>밀턴 프리드만</strong> (통화주의자)</td><td data-label=\"핵심 키워드\">통화당국(중앙은행)의 <strong>자의적인 통화량 조절</strong> 때문에 경기순환 발생</td></tr><tr><td data-label=\"원인\"><strong>기대 착오</strong> (불완전 정보)</td><td data-label=\"학자\"><strong>루카스</strong> (합리적 기대학파)</td><td data-label=\"핵심 키워드\">불완전한 정보 상황에서 <strong>경제주체들의 기대 오류</strong>(판단 착오)가 경기변동 촉발</td></tr><tr><td data-label=\"원인\"><strong>공급 측면 충격</strong></td><td data-label=\"학자\"><strong>슘페터</strong></td><td data-label=\"핵심 키워드\">기술·혁신·생산성 변화가 생활을 바꾸고 경기 사이클을 변동 (스마트폰 사례)</td></tr></tbody></table></div><ul><li>출제 패턴: 지문으로 학자-원인을 뒤섞어 맞느냐 틀리냐를 묻는 형태. 경제학사 깊게가 아니라 <strong>\"누가—무슨 원인\"</strong> 찰 붙이기 수준</li></ul><h2 class=\"section-heading\">4. 경기변동의 3대 특징</h2><ul><li><strong>지속성</strong>: 경기 상승·하강이 상당 기간 이어지고, 반전시키는 요인이 무엇인가의 문제</li><li><strong>변동성</strong>: 언제 오르다 꺾여서 반대로 전환되는가 (전환 시점의 문제)</li><li><strong>공행성</strong>: 생산·고용·투자·소비 등 경제지표들이 <strong>같은 방향으로 함께 움직이는</strong> 성격</li></ul><h3 class=\"subheading\">지속성을 설명하는 3가지 견해</h3><ol><li><strong>유발투자</strong>의 역할 강조 — 케인스 학파</li><li><strong>가격·임금 경직성</strong> — 가격이 쉽게 안 바뀌니까 변동이 지속</li><li><strong>자본재 투자의 건설기간</strong> — 자본재 건설에 기간이 길어 효과가 지연</li></ol><h2 class=\"section-heading\">5. 우리나라 경기순환의 특성</h2><ul><li><strong>전 기간을 통해 가장 큰 영향을 미치는 요인 = 건설투자</strong> (체크)</li><li><strong>해외 부문이 영향을 많이 미쳤다</strong></li><li>통화(정책)는 대체로 <strong>경기를 안정시키는 방향</strong>으로 운영되었다고 평가</li><li>우리나라의 농업생산은 총생산에서 차지하는 비중이 꾸준히 감소 → 경기순환에 미치는 영향은 <strong>미미</strong></li><li>측정 방법 3종:</li><li><strong>순환심도 = 순환진폭</strong>: 경기변동을 잘 반영하는 변수를 골라 확장기·수축기의 변동폭 계산</li><li><strong>변동성 = 표준편차</strong>: 경기변수의 증가율 표준편차로 측정</li><li><strong>공행성</strong>: <strong>경기 전환점과 시차 분석</strong>을 통해 측정 (변수들이 안정적 관계로 같은 방향 움직임)</li></ul><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">통화유통속도 공식</td><td data-label=\"핵심 내용\"><strong>V = 명목GDP ÷ 통화량</strong></td></tr><tr><td data-label=\"구분\">적정 통화량 증가율</td><td data-label=\"핵심 내용\"><strong>Mg = Pg + Yg − Vg</strong> (물가상승률 + 실질GDP증가율 − 유통속도변화율)</td></tr><tr><td data-label=\"구분\">수요 충격</td><td data-label=\"핵심 내용\"><strong>케인스</strong> — 동물적 감각(불안정한 투자심리)</td></tr><tr><td data-label=\"구분\">화폐 충격</td><td data-label=\"핵심 내용\"><strong>밀턴 프리드만</strong> (통화주의자) — 통화당국의 자의적 통화조절</td></tr><tr><td data-label=\"구분\">기대 착오</td><td data-label=\"핵심 내용\"><strong>루카스</strong> (합리적 기대학파) — 불완전 정보 속 판단 오류</td></tr><tr><td data-label=\"구분\">공급 충격</td><td data-label=\"핵심 내용\"><strong>슘페터</strong> — 기술·혁신·생산성 변화</td></tr><tr><td data-label=\"구분\">경기변동 3대 특징</td><td data-label=\"핵심 내용\"><strong>지속성 · 변동성 · 공행성</strong></td></tr><tr><td data-label=\"구분\">지속성 설명 3견해</td><td data-label=\"핵심 내용\"><strong>유발투자</strong> / <strong>가격·임금 경직성</strong> / <strong>자본재 건설기간</strong></td></tr><tr><td data-label=\"구분\">우리나라 최대 영향 요인</td><td data-label=\"핵심 내용\"><strong>건설투자</strong></td></tr><tr><td data-label=\"구분\">공행성 측정 방법</td><td data-label=\"핵심 내용\"><strong>경기 전환점과 시차 분석</strong></td></tr></tbody></table></div>", "quiz": [{"q": "통화유통속도(V)의 공식은?", "a": "<strong>V = 명목GDP ÷ 통화량</strong>", "e": "화폐 1단위가 몇 번 거래를 수행했는가의 회전율"}, {"q": "적정 통화량 증가율을 구하는 공식은?", "a": "<strong>Mg = Pg + Yg − Vg</strong>", "e": "물가상승률(GDP디플레이터 상승률) + 실질GDP 증가율 − 유통속도 변화율"}, {"q": "\"통화당국의 자의적인 통화량 조절이 경기순환의 원인이다\"라고 주장한 학자는?", "a": "<strong>밀턴 프리드만(통화주의자)</strong>", "e": "화폐 충격 이론"}, {"q": "\"동물적 감각(animal spirits)\"이라는 말이 나오면 어떤 학자의 어떤 원인이론인가?", "a": "<strong>케인스, 수요 측면의 충격</strong>", "e": "기업가의 불안정한 투자심리에 따른 투자지출 변화"}, {"q": "경기변동에서 생산·고용·투자 등 경제지표가 같은 방향으로 함께 움직이는 성격을 무엇이라 하는가?", "a": "<strong>공행성</strong>", "e": "경기 전환점과 시차 분석으로 측정"}, {"q": "우리나라 경기순환에 전 기간을 통해 가장 큰 영향을 미치는 요인은?", "a": "<strong>건설투자</strong>", "e": ""}]}, {"id": "fmq8ANCLMuw", "group": "경기분석", "groupIndex": 4, "index": 4, "label": "경기분석 ③", "title": "증권투자권유자문인력 '경기분석③' 자격증 취득 전 기본기를 탄탄하게 하고싶다면 꼭 보세요!ㅣ해커스금융 민영기", "teacher": "민영기", "nature": "이론정리", "depth": "full", "video": "https://www.youtube.com/watch?v=fmq8ANCLMuw", "badge": "", "content": "<h2 class=\"section-heading\">1. 경기예측 3방법 (분류 자체가 출제)</h2><ol><li><strong>경기지표</strong>를 이용하는 방법 — 경기확산지수(DI), 경기종합지수(CI)</li><li><strong>설문조사(서베이법)</strong> — 기업경기실사지수(BSI), 소비자태도지수(CSI)</li><li><strong>경제모형</strong> — 시계열 모형, 거시경제계량모형 (교재에 설명 없이 \"이런 게 있다\" 소개 수준이므로 내용 공부 불필요)</li></ol><h2 class=\"section-heading\">2. 경기확산지수 (DI) vs 경기종합지수 (CI)</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>DI (경기확산지수)</th><th>CI (경기종합지수)</th></tr></thead><tbody><tr><td data-label=\"구분\">측정 대상</td><td data-label=\"DI (경기확산지수)\">경제지표들의 <strong>변화 방향만</strong> 종합</td><td data-label=\"CI (경기종합지수)\">경기에 민감하게 반응하는 대표 시계열들을 종합</td></tr><tr><td data-label=\"구분\">해석 기준</td><td data-label=\"DI (경기확산지수)\"><strong>50을 기준</strong> (50 이상 상승 / 50 이하 하강 / 50은 전환점)</td><td data-label=\"CI (경기종합지수)\"><strong>+/− 표기</strong> (플러스면 확장·상승, 마이너스면 수축·하강)</td></tr><tr><td data-label=\"구분\">알 수 있는 것</td><td data-label=\"DI (경기확산지수)\">경기 국면 판단, <strong>전환점</strong> 식별</td><td data-label=\"CI (경기종합지수)\">방향·국면·전환점 + <strong>속도·진폭</strong>까지</td></tr><tr><td data-label=\"구분\">한계</td><td data-label=\"DI (경기확산지수)\"><strong>진폭·속도 측정 불가</strong> (방향 위주)</td><td data-label=\"CI (경기종합지수)\">—</td></tr><tr><td data-label=\"구분\">활용도</td><td data-label=\"DI (경기확산지수)\">범용성 낮음, 공신력 있는 기관 발표 중단</td><td data-label=\"CI (경기종합지수)\">DI보다 훨씬 활용도 높음</td></tr></tbody></table></div><h2 class=\"section-heading\">3. 경기종합지수의 구성 — 선행·동행·후행 지수 (선다형 빈출)</h2><ul><li><strong>선행지수</strong> (경기보다 먼저 움직이는 지표): <strong>소비자 기대지수</strong>, <strong>건설 수주액</strong>(주문 먼저 받아야 하므로), <strong>코스피지수</strong>, <strong>장단기 금리 스프레드</strong></li><li><strong>동행지수</strong> (현재 경기와 같이 움직이는 지표): <strong>광공업 생산지수</strong>, <strong>건설기성액</strong>, <strong>실질 수입액</strong></li><li>현재 경기 동향 파악에는 <strong>동행종합지수</strong>를 분석</li><li>지수 레벨 자체로는 순환 과정 파악이 어려우므로 <strong>추세변동을 제거한 순환변동치</strong>를 작성해 경기 국면·전환점 판단에 활용</li><li><strong>후행지수</strong> (경기보다 늦게 움직이는 지표): <strong>소비재 수입액</strong>(돈 벌어야 소비하므로), <strong>회사채 유통수익률</strong>(경기가 꺾인 뒤 기업이 돈을 빌리려 금리를 높이기 때문)</li><li>참고: 경기변동의 4원계열(추세변동·순환변동·불규칙변동·계절변동) 중 <strong>추세변동 제거 후 순환변동치</strong>로 분석</li></ul><h2 class=\"section-heading\">4. 설문조사(서베이법) 3지수</h2><ul><li><strong>BSI (기업경기실사지수)</strong>: 기업체에 설문 → 긍정/부정 응답 수 집계</li><li><strong>CSI (소비자태도지수)</strong>: 소비자에게 설문 → 낙관/비관 응답 수 집계</li><li>공통 해석: <strong>0~200의 값</strong>, <strong>100을 기준</strong>으로 판단</li><li>100 이상 = 긍정 응답이 많음 → <strong>상승·확장 국면</strong></li><li>100 이하 = 부정 응답이 많음 → <strong>하강·수축 국면</strong></li><li>100 = <strong>경기 전환점</strong></li><li><strong>ESI (경제심리지수)</strong>: 별도 설문이 아니라 <strong>BSI와 CSI를 합성·조정</strong>해 만든 비교적 최근 지표</li><li>100 상회 = 기업+소비자를 포함한 민간 경제심리가 <strong>과거 평균보다 좋음</strong></li></ul><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">경기예측 3방법</td><td data-label=\"핵심 내용\"><strong>경기지표 / 설문조사(서베이법) / 경제모형</strong></td></tr><tr><td data-label=\"구분\">DI 해석</td><td data-label=\"핵심 내용\"><strong>50 기준</strong> — 50 이상 상승, 50 이하 하강, 50은 전환점. <strong>진폭·속도 측정 불가</strong></td></tr><tr><td data-label=\"구분\">CI 해석</td><td data-label=\"핵심 내용\"><strong>+/− 표기</strong> — 방향·국면·전환점·속도·진폭 모두 파악 가능</td></tr><tr><td data-label=\"구분\">선행지수</td><td data-label=\"핵심 내용\"><strong>소비자 기대지수, 건설 수주액, 코스피지수, 장단기 금리 스프레드</strong></td></tr><tr><td data-label=\"구분\">동행지수</td><td data-label=\"핵심 내용\"><strong>광공업 생산지수, 건설기성액, 실질 수입액</strong> (현재 경기 판단용)</td></tr><tr><td data-label=\"구분\">후행지수</td><td data-label=\"핵심 내용\"><strong>소비재 수입액, 회사채 유통수익률</strong></td></tr><tr><td data-label=\"구분\">BSI·CSI 해석</td><td data-label=\"핵심 내용\"><strong>0~200, 100 기준</strong> — 100 이상 긍정/확장, 100 이하 부정/수축</td></tr><tr><td data-label=\"구분\">ESI</td><td data-label=\"핵심 내용\">BSI + CSI <strong>합성</strong> 지표 (별도 설문 아님)</td></tr></tbody></table></div>", "quiz": [{"q": "경기예측의 3가지 방법은?", "a": "<strong>경기지표 이용, 설문조사(서베이법), 경제모형</strong>", "e": "경제모형은 시계열 모형과 거시경제계량모형이 있으나 교재 소개 수준"}, {"q": "경기확산지수(DI)의 해석 기준으로 옳은 것은?", "a": "<strong>50을 기준으로 50 이상이면 상승, 50 이하이면 하강</strong>", "e": "DI는 변화 방향만 종합하므로 진폭·속도는 측정 불가"}, {"q": "경기종합지수(CI)와 DI의 차이로 옳은 것은?", "a": "<strong>CI는 경기변동의 속도·진폭까지 파악 가능해 DI보다 활용도가 높다</strong>", "e": "CI는 +/− 표기로 속도(기울기)·진폭까지 분석"}, {"q": "선행지수에 속하는 것은?", "a": "<strong>소비자 기대지수, 건설 수주액, 코스피지수, 장단기 금리 스프레드</strong>", "e": "경기보다 먼저 움직이는 지표들"}, {"q": "회사채 유통수익률이 후행지수인 이유는?", "a": "<strong>경기가 꺾인 뒤 기업이 자금 조달을 위해 금리를 높이기 때문</strong>", "e": "경기를 따라 늦게 움직임"}, {"q": "BSI가 120이면 경기를 어떻게 판단하는가?", "a": "<strong>긍정적 응답이 많아 확장(상승) 국면</strong>", "e": "100을 기준으로 이상이면 긍정, 이하이면 부정"}]}, {"id": "uvlFYTlb5Mk", "group": "경기분석", "groupIndex": 4, "index": 5, "label": "최종핵심 문제풀이 ①", "title": "증권투자권유자문인력 최종핵심 문제풀이 '경기분석①' 금융권 취업을 원한다면 보세요!┃ 해커스금융 민영기 교수님", "teacher": "민영기", "nature": "문제풀이 (기본문제 전체 풀이, 출제예상문제 중 중요도 ★3개 전수 + 선별 풀이)", "depth": "full", "video": "https://www.youtube.com/watch?v=uvlFYTlb5Mk", "badge": "", "content": "<h2 class=\"section-heading\">1. 경기순환 기본 용어</h2><ul><li>경기순환 구분: <strong>이분법</strong>(수축국면/확장국면), <strong>4분법</strong>(후퇴·불황·회복·호황)</li><li><strong>기준순환일</strong>: 정점 또는 저점의 시점 — 확장→수축, 수축→확장으로 바뀌는 <strong>터닝포인트의 날짜</strong></li><li><strong>순환진폭</strong>(순환심도): 정점과 저점 간의 차이</li><li><strong>주기</strong>: 원래 상태로 돌아올 때까지 — <strong>저점에서 다음 저점까지</strong> (저점→다음 정점 아님!)</li><li><strong>성장순환</strong>: 장기 성장 추세선(추세선)을 중심으로 나타나는 경기의 기복</li><li>시계열의 4요인: <strong>추세변동</strong>(인구증가·기술진보 등 장기적, 직선/곡선)·<strong>순환변동</strong>(비즈니스 사이클, 정점·저점·진폭·주기)·<strong>계절변동</strong>(1년 주기)·<strong>불규칙변동</strong>(천재지변·노사분쟁 등)</li><li>후행지수 예시: <strong>도시가계 소비지출</strong>, <strong>회사채 유통수익률</strong> (선행이 아님 — 선다 함정)</li></ul><h2 class=\"section-heading\">2. 국민소득계정과 국내총생산(GDP)</h2><ul><li><strong>지출국민소득 구성</strong>: <strong>민간소비 + 투자 + 정부지출(정부소비) + 순수출(수출−수입)</strong> — 정부소비는 포함(제외가 아님!)</li><li>국민소득계정은 <strong>한국은행</strong>이 분기별·연도별로 추계, 총체적 실물경제 흐름을 나타내는 대표적 거시경제지표</li><li>GDP 정의: 일정 기간 동안 생산된 재화·서비스의 <strong>부가가치 합계</strong> = <strong>최종 생산물의 시장가치</strong></li></ul><h2 class=\"section-heading\">3. 산업활동 관련 경제지표</h2><ul><li>자료의 대부분은 <strong>통계청</strong>이 추계 (한국은행 아님) — 월별·분기별·연도별 작성</li><li>종류: 산업생산, 생산자재고, 제조업 평균가동률, 기계수주, 국내건설수주, 건축허가면적, 실업률 등</li><li>성격: <strong>국민계정의 보조지표</strong>, 단기 경제 흐름 파악에 유용, 선행성을 갖는 지표(예: <strong>건축허가면적</strong>)는 경제전망의 중요 정보</li></ul><h2 class=\"section-heading\">4. 대표적 물가지수 (압도적 빈출)</h2><ul><li><strong>CPI (소비자물가지수)</strong>: 도시가계의 평균 생계비·구매력 변동 측정, <strong>임금 비중이 상대적으로 높음</strong>, 체감·장바구니 물가와는 괴리</li><li><strong>PPI (생산자물가지수)</strong>: 상품 및 상품 성격의 일부 서비스 가격을 조사 → 전반적인 상품의 <strong>수급동향 반영</strong></li><li><strong>GDP 디플레이터</strong>: <strong>명목GDP ÷ 실질GDP × 100</strong> — 한 국가 전체의 <strong>물가압력(전체 물가 수준)</strong> 측정, 계산형 문제 가능 (분자 명목·분모 실질, 거꾸로 주의)</li></ul><h2 class=\"section-heading\">5. 통화지표와 통화유통속도</h2><ul><li>통화량 변화의 효과: <strong>단기적으로는 실물 부분</strong>에, <strong>장기적으로는 시차를 두고 물가</strong>(전반적 물가 수준)에 영향 (순서 뒤바뀐 지문 함정)</li><li>상대적 파급효과의 크기는 경제구조·경기상황에 따라 <strong>다르게</strong> 나타남 (일률적 아님)</li><li><strong>M1 = 현금통화 + 요구불예금 + 수시입출식 저축성예금</strong>(MMDA) — \"요구불예금까지만\"은 틀린 지문</li><li><strong>M2</strong> = M1 + 시장성 금융상품 전반, 단 <strong>만기 2년 이상 제외</strong></li><li><strong>통화유통속도(V) = 명목GDP ÷ 통화량</strong> — <strong>사후적으로만 추계 가능</strong> (사전적 추계 불가), <strong>우리나라 장기 하락 추세</strong></li><li>적정 통화량 증가율: <strong>Mg = Pg(GDP 디플레이터 상승률) + Yg(실질GDP 증가율) − Vg(유통속도 변화율)</strong></li></ul><h2 class=\"section-heading\">6. 금리</h2><ul><li>금리 = <strong>자본의 한계수익률</strong>(자본의 한계효율) = 현재소득과 미래소득의 교환비율, 장기 명목성장률과 자금시장 수급 상황을 반영해 결정</li><li><strong>대표적 시장금리</strong>: <strong>콜금리</strong>(초단기·단기금리 대표), <strong>CD(양도성예금증서) 유통수익률</strong>, <strong>국고채 수익률</strong></li><li>경제 선진화·자본축적 진행 → 자본의 한계수익률 <strong>하락</strong> → 실질금리 하향 추세 (상승이 아님)</li><li><strong>캐리 트레이드</strong>: 저금리 국가 → 고금리 국가로 자금 이동, 되돌아오면 캐리 트레이드 청산</li></ul><h2 class=\"section-heading\">7. 경기변동 원인과 특징 — 학파 짝맞추기 (압도적 빈출)</h2><div class=\"table-wrap\"><table><thead><tr><th>원인</th><th>학자</th><th>키워드</th></tr></thead><tbody><tr><td data-label=\"원인\"><strong>수요 측면 충격</strong></td><td data-label=\"학자\"><strong>케인스</strong></td><td data-label=\"키워드\">민간기업 투자지출 변화, <strong>동물적 감각</strong>(animal spirits), <strong>임금·가격 경직성</strong></td></tr><tr><td data-label=\"원인\"><strong>화폐적 충격</strong></td><td data-label=\"학자\"><strong>프리드만</strong></td><td data-label=\"키워드\">통화당국의 <strong>자의적인 통화량 조절</strong> (money shock)</td></tr><tr><td data-label=\"원인\"><strong>합리적 기대의 판단 오류</strong></td><td data-label=\"학자\"><strong>루카스</strong></td><td data-label=\"키워드\"><strong>불완전한 정보</strong> 상황에서의 경제주체 기대 착오</td></tr><tr><td data-label=\"원인\"><strong>공급 측면 충격</strong></td><td data-label=\"학자\"><strong>슘페터</strong></td><td data-label=\"키워드\">생산요소의 <strong>새로운 결합</strong>, 기술혁신, 생산성 향상</td></tr></tbody></table></div><ul><li>경기변동의 3대 특징: <strong>지속성 · 변동성 · 공행성</strong></li><li>공행성: 경제변수들이 안정적 관계를 가지고 일정한 방향으로 함께 움직이는 특성</li><li>지속성 설명 3견해: <strong>유발투자</strong>(케인즈), <strong>임금·가격 경직성</strong>, <strong>자본재 투자 건설기간</strong></li><li><strong>실물적 균형경기변동이론</strong>: 기술진보·생산성 향상을 강조, 경기변동의 <strong>지속성</strong>을 잘 설명</li></ul><h2 class=\"section-heading\">8. 우리나라 경기순환의 특징</h2><ul><li><strong>전 기간 가장 큰 영향 요인 = 건설투자</strong> (해외 부분은 두 번째 의미)</li><li><strong>해외 부분</strong>의 영향이 크다</li><li>통화(정책)는 대체로 경기를 <strong>안정시키는</strong> 방향으로 운용되어 왔다 (변동시키는 방향이 아님)</li><li><strong>농업생산</strong>은 총생산에서 차지하는 비중이 꾸준히 <strong>감소</strong> (영향 미미)</li></ul><h2 class=\"section-heading\">9. 케인즈 학파의 경기변동이론</h2><ul><li>경기변동 = 기업가의 <strong>투자심리(동물적 감각, animal spirits)</strong> 와 소비자의 내구소비재 지출의 <strong>불안정성</strong>(안정적이 아님!)</li><li><strong>승수효과</strong>(독립투자·내구재소비 증가 → 추가 생산·소득 증가) + <strong>가속도 원리</strong>(생산 변동 → 투자 변동 유발)를 결합해 경기순환 설명</li><li>\"승수효과\", \"가속도 원리\", \"animal spirits\"라는 말이 나오면 무조건 케인즈</li></ul><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">기준순환일</td><td data-label=\"핵심 내용\"><strong>정점·저점의 시점</strong>(터닝포인트의 날짜)</td></tr><tr><td data-label=\"구분\">순환진폭</td><td data-label=\"핵심 내용\"><strong>정점과 저점 간의 차이</strong></td></tr><tr><td data-label=\"구분\">주기</td><td data-label=\"핵심 내용\"><strong>저점 → 다음 저점</strong>까지</td></tr><tr><td data-label=\"구분\">GDP 구성</td><td data-label=\"핵심 내용\"><strong>민간소비 + 투자 + 정부지출 + 순수출</strong>(수출−수입)</td></tr><tr><td data-label=\"구분\">GDP 추계 기관</td><td data-label=\"핵심 내용\"><strong>한국은행</strong>(분기별·연도별)</td></tr><tr><td data-label=\"구분\">산업활동지표 추계 기관</td><td data-label=\"핵심 내용\"><strong>통계청</strong>(월별·분기별·연도별)</td></tr><tr><td data-label=\"구분\">GDP 디플레이터</td><td data-label=\"핵심 내용\"><strong>명목GDP ÷ 실질GDP × 100</strong>, 전체 물가압력 측정</td></tr><tr><td data-label=\"구분\">M1</td><td data-label=\"핵심 내용\">현금통화 + <strong>요구불예금 + 수시입출식저축성예금</strong>(MMDA)</td></tr><tr><td data-label=\"구분\">통화효과 순서</td><td data-label=\"핵심 내용\"><strong>단기→실물, 장기→물가</strong> (시차 있음)</td></tr><tr><td data-label=\"구분\">통화유통속도</td><td data-label=\"핵심 내용\"><strong>명목GDP ÷ 통화량</strong>, <strong>사후적 추계만 가능</strong>, 장기 하락 추세</td></tr><tr><td data-label=\"구분\">대표 시장금리</td><td data-label=\"핵심 내용\"><strong>콜금리, CD 유통수익률, 국고채 수익률</strong></td></tr><tr><td data-label=\"구분\">케인스</td><td data-label=\"핵심 내용\"><strong>수요충격 · 동물적 감각 · 임금가격경직성 · 승수효과+가속도 원리</strong></td></tr><tr><td data-label=\"구분\">프리드만</td><td data-label=\"핵심 내용\"><strong>화폐적 충격</strong>(자의적 통화량 조절)</td></tr><tr><td data-label=\"구분\">루카스</td><td data-label=\"핵심 내용\"><strong>불완전 정보·합리적 기대의 판단 오류</strong></td></tr><tr><td data-label=\"구분\">슘페터</td><td data-label=\"핵심 내용\"><strong>공급충격</strong>(새로운 결합·기술혁신·생산성 향상)</td></tr><tr><td data-label=\"구분\">우리나라 최대 영향</td><td data-label=\"핵심 내용\"><strong>건설투자</strong></td></tr></tbody></table></div>", "quiz": [{"q": "도시가계 소비지출과 회사채 유통수익률은 어느 지수에 속하는가?", "a": "<strong>후행종합지수</strong>", "e": "경기보다 늦게 움직이므로 선행지수가 아님"}, {"q": "기준순환일이란 무엇인가?", "a": "<strong>정점 또는 저점의 시점</strong>", "e": "확장↔수축이 바뀌는 터닝포인트의 날짜"}, {"q": "GDP(지출국민소득)의 구성 요소는?", "a": "<strong>민간소비 + 투자 + 정부지출(정부소비) + 순수출</strong>", "e": "정부소비는 제외가 아니라 포함"}, {"q": "GDP 디플레이터의 공식과 측정 대상은?", "a": "<strong>명목GDP ÷ 실질GDP × 100</strong>, 국가 전체의 <strong>물가압력</strong> 측정", "e": "분자는 명목, 분모는 실질"}, {"q": "통화유통속도의 추계와 추세에 대한 설명으로 옳은 것은?", "a": "<strong>사후적으로만 추계 가능하고, 우리나라의 경우 장기 하락 추세</strong>", "e": "사전적 추계는 불가"}, {"q": "\"불완전한 정보 상황에서 경제주체들의 합리적 기대가 판단 오류를 일으켜 경기가 변동한다\"는 학자는?", "a": "<strong>루카스</strong>", "e": "기술·생산성 혁신을 강조한 것은 슘페터, 수요충격은 케인스, 화폐충격은 프리드만"}]}, {"id": "bbIh6UfsA3c", "group": "직무윤리", "groupIndex": 5, "index": 1, "label": "기본서 이론정리", "title": "증권투자권유자문인력 기본서 이론정리ㅣ'직무윤리''📝ㅣ해커스 송영욱 증권투자권유자문인력 독학 시험일정 금융권취업", "teacher": "송영욱", "nature": "이론정리", "depth": "full", "video": "https://www.youtube.com/watch?v=bbIh6UfsA3c", "badge": "", "content": "<h2 class=\"section-heading\">1. 직무윤리 기본 이해</h2><ul><li><strong>도덕적 딜레마</strong>: 맡긴 칼을 (약속은 지키되 살인 도구로 쓸 사람에게) 돌려줘야 할지 말지처럼 어느 쪽을 선택해도 문제가 있는 상황 — 판단 기준이 되는 <strong>윤리 기준</strong>이 필요한 이유</li><li><strong>법과 윤리</strong>: 법은 <strong>윤리의 최소한</strong>. 윤리 위반 = 도덕적 비난에 그침 / 법 위반 = 법적 처벌. 자율적 준수 vs 강제·처벌로 구분</li><li><strong>기업윤리</strong>(거시적 — 경영 전반에 걸친 윤리강령) vs <strong>직무윤리</strong>(미시적 — 임직원이 지켜야 할 행동강령)</li><li><strong>윤리경영 시대 6가지 근거</strong>: ① 환경 변화(고도화 사회), ② 거래비용(위험비용까지 포함 관리), ③ 가치 있는 생존, ④ <strong>신종자본</strong>(무형자본 — 직무윤리를 잘 지키는 회사가 단단하고 신뢰받음), ⑤ 인프라 구축(자유로운 공정경쟁의 조건), ⑥ <strong>사회적 비용 감소</strong>(윤리적 행동이 비용 절감)</li></ul><h2 class=\"section-heading\">2. 직무윤리 기초 사상과 동향 (학자·기구 짝맞추기)</h2><ul><li><strong>칼뱅</strong>과 <strong>베버</strong>: 직무윤리를 강조한 사상적 배경의 인물</li><li><strong>국제 동향</strong>:</li><li><strong>OECD</strong>: 국제 공통의 <strong>기업윤리강령</strong> 제정·시행</li><li><strong>TI(국제투명성기구)</strong>: 매년 <strong>부패인식지수</strong> 발표 → 국가별 부패 정도 측정</li><li>영국 BITC의 <strong>CR 인덱스</strong> (사회적 책임 평가)</li><li><strong>국내 동향</strong>:</li><li><strong>부패방지법</strong>, <strong>공직자윤리강령</strong></li><li><strong>청탁금지법(김영란법)</strong>: <strong>대가성 입증 없어도 금품 수수만으로 처벌</strong> — 기존 뇌물죄보다 강화</li><li>윤리경영 측정 지표: 산업정책연구원 <strong>KOBEX</strong>, 전경련 <strong>FKI-X</strong>, 서강대 <strong>SOFAX</strong>, <strong>CSR 인덱스</strong></li></ul><h2 class=\"section-heading\">3. 직무윤리의 적용대상과 성격</h2><ul><li>적용대상: <strong>금융투자업에 종사하는 모든 사람</strong> — 직접·간접 여부, 계약관계·고용관계 유무, <strong>보수 유무와 관계없이</strong> 실제로 금융투자업 업무를 수행하는 자</li><li><strong>잠재적 고객</strong>에 대해서도 직무윤리 준수</li><li>성격: 기본적으로 <strong>자율규제</strong>가 원칙이지만, <strong>법에 의한 타율규제도 병행</strong></li><li>직무윤리의 핵심 명제: <strong>\"자신과 상대방의 이해가 상충하는 상황에서는 상대방의 입장에서 자신에 대한 상대방의 신뢰를 저버리지 않는 행동을 선택하라\"</strong> = 고객우선 원칙의 풀어쓰기</li></ul><h2 class=\"section-heading\">4. 금융투자업에서 직무윤리가 중요한 이유 4가지 (압도적 빈출)</h2><ol><li><strong>이해상충 가능성</strong>: 증권사 수익(수수료) vs 고객 비용(수수료 부담)이 충돌 — 과도한 수수료 추구는 고객 보호 약화</li><li><strong>투자성 상품 특성</strong>: <strong>원금손실 가능성</strong> 있는 상품을 다루므로 선량한 관리 의무가 더 중요</li><li><strong>금융소비자의 질적 변화</strong>: 과거 정확한 정보제공 요구 → 현재는 소비자 권리 강화(보호 강도 상승)</li><li><strong>안전장치</strong>: 직무윤리를 잘 지키면 부당한 처벌을 받지 않고 자기 방어 수단이 됨</li></ol><h2 class=\"section-heading\">5. 직무윤리 기본원칙 2개</h2><ol><li><strong>신의성실의 원칙</strong>: 과거에는 윤리적 의무였으나 <strong>법의 강제 규정이 되면서 윤리적 의무인 동시에 법적 의무</strong>가 됨 — 이 \"이중성\"이 중요 포인트</li><li><strong>고객우선의 원칙</strong>: 우선순위 = <strong>고객 &gt; 회사 &gt; 임직원</strong>, 고객 간에는 <strong>상호 순위 없음</strong></li></ol><ul><li>기본원칙을 근거로 법제화된 것: <strong>이해상충 방지의무</strong>, 금융소비자 보호, 본인·회사·사회에 대한 의무 (뒷부분은 다음 강의)</li></ul><h2 class=\"section-heading\">6. 이해상충 방지 의무 (자본시장법 — 압도적 출제)</h2><ul><li>상징 규정: <strong>정당한 사유 없이 투자자의 이익을 해하면서 자신의 이익(또는 제3자의 이익)을 얻어서는 안 된다</strong></li><li>대표 사례: <strong>과당매매</strong>(매매를 과하게 많이 해서 고객에게 세금·수수료 부담을 늘리고 증권사는 수수료 수익 증대)</li><li>이해상충 방지책 7항목:</li></ul><ol><li><strong>인가·등록 시부터 이해상충 방지체계 의무화</strong> (인가·등록 요건 자체에 포함 — 나중에 갖추는 게 아님)</li><li><strong>이해상충 발생 가능성 파악·관리 의무</strong> (자본시장법 44조 1항)</li><li><strong>고지 및 저감 후 거래 의무</strong>: 발생 가능성을 고객에게 알리고, 문제없는 수준으로 낮춘 뒤 거래</li><li><strong>회피의무</strong>: 낮추기 곤란하면 <strong>그 거래 자체를 하지 마라</strong></li><li><strong>정보교류 차단 의무(차이니스 월)</strong>: 고객정보의 정보제공 제한, <strong>종사자 겸직 금지</strong>, 공간·설비 공동이용 차단</li><li><strong>조사분석자료 작성대상 및 제공 제한</strong>: 자기(금융투자업자)가 발행한 증권에 대한 리포트 <strong>공표 금지</strong> (유리한 것만 쓸 가능성)</li><li><strong>자기거래 금지 원칙</strong>: 업자가 본인 명의로 고객과 거래하면서 동시에 고객을 대리(중개)하는 것 — 혼자 다 하는 것과 같아 금지</li></ol><ul><li><strong>자기거래 예외 3가지</strong> (원칙 금지지만 허용):</li></ul><ol><li>투자중개업자가 <strong>증권시장·파생상품시장·다자간매매체결회사</strong> 등 <strong>공개시장</strong>을 통해 위탁 매매를 체결하는 경우</li><li>투자매매·투자중개업자가 <strong>자기가 판매하는 집합투자증권(펀드)을 매수</strong>하는 경우</li><li><strong>금융위원회가 정해 고시</strong>하는 경우</li></ol><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">법과 윤리</td><td data-label=\"핵심 내용\">법은 <strong>윤리의 최소한</strong>. 윤리 위반 = 도덕적 비난, 법 위반 = 처벌</td></tr><tr><td data-label=\"구분\">기초 사상</td><td data-label=\"핵심 내용\"><strong>칼뱅, 베버</strong></td></tr><tr><td data-label=\"구분\">TI(국제투명성기구)</td><td data-label=\"핵심 내용\"><strong>부패인식지수</strong> 발표</td></tr><tr><td data-label=\"구분\">청탁금지법(김영란법)</td><td data-label=\"핵심 내용\"><strong>대가성 입증 없어도 금품 수수만으로 처벌</strong></td></tr><tr><td data-label=\"구분\">윤리경영 지표</td><td data-label=\"핵심 내용\"><strong>KOBEX</strong>(산업정책연구원), <strong>FKI-X</strong>(전경련), <strong>SOFAX</strong>(서강대), <strong>CSR 인덱스</strong></td></tr><tr><td data-label=\"구분\">적용대상</td><td data-label=\"핵심 내용\">금융투자업 종사자 <strong>전부</strong>(보수 유무 무관), <strong>잠재적 고객</strong> 포함</td></tr><tr><td data-label=\"구분\">중요 이유 4</td><td data-label=\"핵심 내용\"><strong>이해상충 가능성 / 투자성(원금손실) / 금융소비자 질적 변화 / 안전장치</strong></td></tr><tr><td data-label=\"구분\">기본원칙 2</td><td data-label=\"핵심 내용\"><strong>신의성실의 원칙</strong>(윤리+법적 의무), <strong>고객우선 원칙</strong>(고객&gt;회사&gt;임직원)</td></tr><tr><td data-label=\"구분\">이해상충 상징 규정</td><td data-label=\"핵심 내용\">정당한 사유 없이 투자자 이익 해하며 자신·제3자 이익 취득 금지</td></tr><tr><td data-label=\"구분\">대표 사례</td><td data-label=\"핵심 내용\"><strong>과당매매</strong></td></tr><tr><td data-label=\"구분\">방지체계</td><td data-label=\"핵심 내용\"><strong>인가·등록 시부터</strong> 의무화</td></tr><tr><td data-label=\"구분\">7개 방지책</td><td data-label=\"핵심 내용\">파악·관리 / <strong>고지 및 저감 후 거래</strong> / <strong>회피</strong> / <strong>정보교류 차단(차이니스 월)</strong> / 조사분석자료 제한 / <strong>자기거래 금지</strong></td></tr><tr><td data-label=\"구분\">자기거래 예외 3</td><td data-label=\"핵심 내용\"><strong>공개시장</strong>(증권·파생·다자간) 위탁체결 / 자기 판매 <strong>펀드 매수</strong> / <strong>금융위 고시</strong></td></tr></tbody></table></div>", "quiz": [{"q": "금융투자업에서 직무윤리가 특히 강조되는 이유 4가지는?", "a": "<strong>이해상충 가능성, 투자성(원금손실 가능성) 상품 특성, 금융소비자의 질적 변화, 안전장치(직원 보호)</strong>", "e": "수수료 구조상 이해상충이 빈번하고 투자성 상품은 고객 손실 위험이 크기 때문"}, {"q": "신의성실의 원칙에서 중요한 변화는?", "a": "<strong>윤리적 의무였던 것이 법의 강제 규정이 되면서 법적 의무도 되었다는 점</strong>", "e": "윤리이자 법의 이중적 성격"}, {"q": "직무윤리의 적용대상에 포함되지 않는 자는?", "a": "해당 없음 — <strong>보수 유무·계약 유무와 무관하게 실제로 업무 수행하는 종사자 전부</strong>, 잠재적 고객에 대해서도 준수", "e": "적용 범위가 넓은 것이 포인트"}, {"q": "이해상충 방지책 중 '회피의무'란 무엇인가?", "a": "<strong>이해상충 가능성을 낮추기 곤란하다고 판단될 때 그 거래 자체를 하지 않아야 할 의무</strong>", "e": "고지·저감이 먼저, 그것도 안 되면 회피"}, {"q": "자기거래가 원칙적으로 금지되나 예외적으로 허용되는 3가지는?", "a": "<strong>공개시장(증권시장·파생상품시장·다자간매매체결회사)을 통한 위탁 매매 체결, 자기 판매 펀드 매수, 금융위 고시</strong>", "e": "혼자 다 하는 거래는 금지이나 공개시장 경유는 공정성 확보로 허용"}, {"q": "TI(국제투명성기구)가 매년 발표하는 것은?", "a": "<strong>부패인식지수</strong>", "e": "국가별 부패 정도를 측정·평가하는 지표"}]}, {"id": "tERxaKD9q28", "group": "직무윤리", "groupIndex": 5, "index": 2, "label": "최종핵심 분쟁예방 (1)", "title": "증권투자권유자문인력 최종핵심 문제풀이 '직무윤리 · 투자자분쟁예방 (1)' ┃ 해커스금융 송영욱 교수님", "teacher": "송영욱", "nature": "문제풀이 (직무윤리 편, 3과목 30문제 중 **직무윤리가 12문제**로 최대 비중)", "depth": "full", "video": "https://www.youtube.com/watch?v=tERxaKD9q28", "badge": "", "content": "<h2 class=\"section-heading\">1. 직무윤리의 중요성과 적용대상 (1·3번 문제)</h2><ul><li><strong>직무윤리 중요성 강조 이유 4가지</strong>: ① 투자성(원금손실 가능성), ② 금융소비자의 질적 변화(적극적 소비자 보호), ③ <strong>이해상충 가능성</strong>, ④ 정보비대칭성 문제</li><li>틀린 지문 패턴: \"이해상충 가능성 및 정보비대칭성 문제가 점점 <strong>축소</strong>되고 있다\" → 축소되는 게 아님</li><li><strong>적용대상</strong>: <strong>투자권유대행인도 적용 대상</strong>. 투자 관련 업무 종사자라면 <strong>위임·고용관계 유무, 보수 유무와 관계없이</strong> 준수. <strong>계약관계 없는 잠재적 고객</strong>에 대해서도 준수 (이것까지 요구하는 게 아니다 — 틀린 지문)</li><li>기본원칙 2가지: <strong>고객우선의 원칙</strong>, <strong>신의성실의 원칙</strong> — 이 두 원칙을 법제화한 것이 <strong>금융소비자 보호 의무</strong>(금융소비자보호법)와 <strong>이해상충 방지의무</strong>(자본시장법)</li></ul><h2 class=\"section-heading\">2. 금융소비자보호법 — 적용범위 (5번 문제)</h2><ul><li><strong>금융소비자보호법의 보호대상 상품 = \"금융상품\"</strong> (금융투자상품이 아님!)</li><li>2021년 3월 제정·시행되면서 보호 범위가 <strong>금융투자상품 → 금융상품으로 확대</strong></li><li>금융상품 = <strong>금융투자상품</strong>(증권 + 파생상품) + <strong>비금융투자상품</strong>(보험·대출·예금 등)</li><li>금융투자업 종사자는 <strong>금융회사나 주주의 이익보다 금융소비자의 이익을 우선</strong> 보호 (고객우선 원칙)</li><li>신의성실의 원칙 = <strong>윤리적 의무이자 법적 의무</strong></li></ul><h2 class=\"section-heading\">3. 금융소비자 보호의 4단계 (6번 문제)</h2><ul><li>과거 2단계 → 현재 <strong>4단계</strong>로 세분화:</li></ul><ol><li><strong>상품 개발 단계</strong>: 개발 시부터 소비자 보호되도록 관련 부서 협의·모니터링</li><li><strong>상품 판매 이전 단계</strong>: 직원 교육 정기 실시, 필요시 자격증 취득</li><li><strong>상품 판매 단계</strong>: <strong>6대 판매원칙 규제</strong>, <strong>불공정영업행위 금지</strong>, <strong>계약서류 제공 의무</strong></li><li><strong>상품 판매 이후 단계</strong>: 처리결과 보고 의무, <strong>해피콜</strong>, 미스터리쇼핑, 소송중지제도, 자료열람요구권</li></ol><ul><li>출제 패턴: 특정 단계의 내용에 다른 단계의 것을 섞어 \"거리가 먼 것\"을 고르게 함 (예: <strong>해피콜</strong>은 판매 이후 단계이지 판매 단계가 아님)</li></ul><h2 class=\"section-heading\">4. 본인·회사·사회에 대한 윤리 (7·8·9번 문제)</h2><ul><li><strong>본인에 대한 윤리</strong>: 법규준수의무, 자기혁신, <strong>품위유지 의무</strong>, 공공성·독립성 유지, 사적이익 추구 금지</li><li>\"공정한 자유로운 시장경제 질서 존중·유지\"는 <strong>사회에 대한 윤리</strong>이지 본인이 아님</li><li><strong>회사에 대한 윤리</strong>: 상호존중, 공용재산의 사적 이용·수익 금지, <strong>경영진의 책임</strong>(윤리적 책임뿐 아니라 <strong>법적 책임·사용자 책임</strong>도 있음!), 대외활동 준수사항, 정보보호의무, 고용계약 종료 후 의무</li><li>대외활동: 사견 표명 가능하나, <strong>회사의 공식 의견과 다르면 사견임을 명백히 표현</strong></li><li>사전 승인 받았더라도 이해상충 확대 시 <strong>중단 요구 가능</strong></li><li>특정 정보가 비밀정보인지 불명확 → <strong>준법감시인의 사전 확인</strong> (사후 아님)</li><li><strong>사회에 대한 윤리</strong>: 시장질서 존중</li><li><strong>자본시장법 174조~178조 = 불공정거래(내부자거래) 규제</strong></li><li><strong>순수 내부자</strong>(임원·대주주 등) + <strong>준내부자(둔내부자)
