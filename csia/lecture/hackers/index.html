<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>해커스금융 강의 핵심자료</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --paper: #ffffff;
      --paper-2: #f1f5f9;
      --paper-hover: #f8fafc;
      --ink: #0f172a;
      --ink-secondary: #334155;
      --muted: #64748b;
      --line: #e2e8f0;
      --line-strong: #cbd5e1;
      --nav: #0f172a;
      --nav-text: #f8fafc;
      --nav-border: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --accent-border: #bfdbfe;
      --highlight: #fef08a;
      --highlight-ink: #713f12;
      --badge-bg: #e2e8f0;
      --badge-ink: #334155;
      --th-bg: #1e293b;
      --th-ink: #f8fafc;
      --table-border: #e2e8f0;
      --table-zebra: #f8fafc;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 12px 28px -4px rgba(15, 23, 42, 0.12), 0 4px 10px -2px rgba(15, 23, 42, 0.05);
      --focus: #3b82f6;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f17;
        --paper: #131b28;
        --paper-2: #1b2536;
        --paper-hover: #1e2a3c;
        --ink: #f1f5f9;
        --ink-secondary: #cbd5e1;
        --muted: #94a3b8;
        --line: #263346;
        --line-strong: #33445c;
        --nav: #080d14;
        --nav-text: #f8fafc;
        --nav-border: #1b2536;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-soft: #172554;
        --accent-border: #1e3a8a;
        --highlight: rgba(250, 204, 21, 0.22);
        --highlight-ink: #fde047;
        --badge-bg: #1e293b;
        --badge-ink: #cbd5e1;
        --th-bg: #1e293b;
        --th-ink: #f8fafc;
        --table-border: #263346;
        --table-zebra: #162030;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.35);
        --shadow-lg: 0 14px 34px rgba(0, 0, 0, 0.45);
        --focus: #60a5fa;
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      line-height: 1.75;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    button, input, a { font: inherit; }
    a { color: inherit; text-decoration: none; }

    /* Topbar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--nav-text);
      border-bottom: 1px solid var(--nav-border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .topbar-inner {
      max-width: 1200px;
      margin: auto;
      min-height: 60px;
      padding: 8px 24px;
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .home-btn {
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      display: none;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      transition: all 0.15s ease;
      align-items: center;
      gap: 6px;
    }
    .home-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.35);
    }
    .home-btn.visible { display: inline-flex; }
    .search {
      margin-left: auto;
      position: relative;
      width: min(380px, 60vw);
    }
    .search input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-radius: var(--radius-md);
      padding: 9px 14px 9px 38px;
      outline: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .search input::placeholder { color: #94a3b8; }
    .search input:focus {
      border-color: #60a5fa;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.25);
    }
    .search svg {
      position: absolute;
      left: 12px;
      top: 10px;
      opacity: 0.65;
    }
    .status {
      font-size: 0.84rem;
      color: #94a3b8;
      white-space: nowrap;
      font-weight: 500;
    }

    /* Main layout */
    .wrap {
      max-width: 1200px;
      margin: auto;
      padding: 36px 24px 80px;
    }

    /* Hero */
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 36px;
      align-items: center;
      padding: 20px 0 36px;
      border-bottom: 1px solid var(--line);
    }
    .hero h1 {
      font-size: clamp(2rem, 4.5vw, 3.2rem);
      font-weight: 850;
      line-height: 1.18;
      letter-spacing: -0.04em;
      margin: 0 0 16px;
      color: var(--ink);
    }
    .hero p {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 640px;
      margin: 0;
      line-height: 1.7;
    }
    .stat-board {
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 22px 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .stat strong {
      font-size: 2.1rem;
      font-weight: 850;
      display: block;
      line-height: 1.1;
      color: var(--accent);
      letter-spacing: -0.03em;
    }
    .stat span {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
    }

    /* Group Nav */
    .group-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 28px 0 36px;
    }
    .group-nav button {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink-secondary);
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }
    .group-nav button:hover, .group-nav button:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
      outline: none;
    }

    /* Group Section & Cards */
    .group-section {
      margin: 0 0 54px;
    }
    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--line);
    }
    .group-head h2 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin: 0;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .group-head .count-badge {
      font-size: 0.82rem;
      color: var(--muted);
      background: var(--paper-2);
      border: 1px solid var(--line);
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 600;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 16px;
    }
    .lecture-card {
      position: relative;
      text-align: left;
      border: 1px solid var(--line);
      border-left: 4px solid var(--group-color);
      background: var(--paper);
      color: var(--ink);
      padding: 18px 20px;
      cursor: pointer;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 154px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .lecture-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--line-strong);
    }
    .lecture-card:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .card-index {
      font-weight: 750;
      font-size: 0.82rem;
      color: var(--muted);
      background: var(--paper-2);
      padding: 2px 7px;
      border-radius: 4px;
    }
    .card-nature {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .lecture-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.45;
      margin: 0 0 14px;
      color: var(--ink);
      letter-spacing: -0.015em;
    }
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .card-bottom .teacher {
      font-weight: 600;
      color: var(--ink-secondary);
    }
    .card-bottom .arrow {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.95rem;
      transition: transform 0.15s ease;
    }
    .lecture-card:hover .arrow {
      transform: translateX(3px);
    }
    .empty {
      grid-column: 1 / -1;
      padding: 48px 24px;
      background: var(--paper);
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-md);
      text-align: center;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .footer-note {
      margin-top: 54px;
      color: var(--muted);
      font-size: 0.84rem;
      text-align: center;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    /* Lecture View Layout */
    .lecture-layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 820px);
      gap: 40px;
      justify-content: center;
      align-items: start;
    }
    .side {
      position: sticky;
      top: 80px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      padding-right: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }
    .side::-webkit-scrollbar {
      width: 4px;
    }
    .side::-webkit-scrollbar-thumb {
      background: var(--line-strong);
      border-radius: 4px;
    }
    .side .group-label {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--accent);
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }
    .side ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .side li {
      margin-bottom: 4px;
    }
    .side button {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 9px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: var(--radius-sm);
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .side button:hover {
      background: var(--paper-2);
      color: var(--ink);
    }
    .side button.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 750;
      border-color: var(--accent-border);
    }

    /* Article Reader */
    .article {
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-md);
      padding: clamp(28px, 5vw, 64px);
      border-radius: var(--radius-lg);
    }
    .crumb {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .crumb span { color: var(--ink); }
    .kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--paper-2);
      border: 1px solid var(--line);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--ink-secondary);
    }
    .pill.accent {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent);
    }
    .pill.warn {
      background: #fef2f2;
      border-color: #fecaca;
      color: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      .pill.warn {
        background: #450a0a;
        border-color: #7f1d1d;
        color: #fca5a5;
      }
    }
    .article-title {
      font-size: clamp(1.85rem, 4vw, 2.45rem);
      font-weight: 850;
      line-height: 1.26;
      letter-spacing: -0.035em;
      margin: 0 0 16px;
      color: var(--ink);
    }
    .article-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 18px;
      color: var(--muted);
      font-size: 0.88rem;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }
    .video-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #ffffff !important;
      font-weight: 700;
      font-size: 0.82rem;
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      margin-left: auto;
      transition: background 0.15s ease;
    }
    .video-link:hover {
      background: var(--accent-hover);
    }

    /* Article Content Typography */
    .article-body {
      font-size: 1.02rem;
      color: var(--ink-secondary);
      line-height: 1.76;
    }
    .section-heading {
      font-size: 1.36rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin: 46px 0 18px;
      padding: 10px 16px;
      background: var(--paper-2);
      border-left: 4px solid var(--accent);
      border-radius: 0 8px 8px 0;
      color: var(--ink);
    }
    .subheading {
      font-size: 1.1rem;
      font-weight: 750;
      letter-spacing: -0.015em;
      margin: 28px 0 12px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subheading::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .article-body p {
      margin: 12px 0;
    }
    .article-body ul, .article-body ol {
      margin: 12px 0 20px;
      padding-left: 1.5rem;
    }
    .article-body li {
      margin: 8px 0;
      line-height: 1.74;
    }
    .article-body li::marker {
      color: var(--accent);
      font-weight: 700;
    }
    .article-body strong {
      background: var(--highlight);
      color: var(--highlight-ink);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .article-body hr {
      border: 0;
      border-top: 1px dashed var(--line-strong);
      margin: 36px 0;
    }
    .article-body blockquote {
      margin: 22px 0;
      padding: 16px 20px;
      background: var(--paper-2);
      border-left: 4px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--ink);
      font-size: 0.96rem;
    }

    /* Table (암기표) */
    .table-wrap {
      margin: 22px 0 32px;
      border: 1px solid var(--table-border);
      border-radius: var(--radius-md);
      overflow-x: auto;
      box-shadow: var(--shadow-sm);
      background: var(--paper);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.94rem;
      text-align: left;
    }
    th {
      background: var(--th-bg);
      color: var(--th-ink);
      font-weight: 750;
      padding: 13px 18px;
      letter-spacing: -0.01em;
      border-bottom: 1px solid var(--line);
    }
    td {
      padding: 13px 18px;
      border-bottom: 1px solid var(--table-border);
      line-height: 1.68;
      vertical-align: middle;
      color: var(--ink-secondary);
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    tbody tr:nth-child(even) {
      background: var(--table-zebra);
    }
    tbody tr:hover {
      background: var(--accent-soft);
    }
    td[data-label="구분"] {
      font-weight: 750;
      color: var(--ink);
      word-break: keep-all;
    }

    /* Quiz Section */
    .quiz {
      margin-top: 54px;
      padding: 28px;
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
    }
    .quiz-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 8px;
    }
    .quiz-head h2 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .quiz-actions {
      display: flex;
      gap: 8px;
    }
    .quiz-toggle-btn {
      border: 1px solid var(--line-strong);
      background: var(--paper);
      color: var(--ink-secondary);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 650;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .quiz-toggle-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }
    .quiz-intro {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 20px;
    }
    .quiz-item {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .quiz-item:hover {
      border-color: var(--line-strong);
    }
    .quiz-item[open] {
      border-color: var(--accent-border);
      box-shadow: var(--shadow-sm);
    }
    .quiz summary {
      cursor: pointer;
      font-weight: 650;
      font-size: 0.98rem;
      padding: 15px 18px;
      list-style: none;
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      line-height: 1.55;
      color: var(--ink);
    }
    .quiz summary::-webkit-details-marker {
      display: none;
    }
    .quiz summary .q-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      min-width: 32px;
      height: 24px;
      padding: 0 6px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 4px;
      font-weight: 800;
      font-size: 0.78rem;
    }
    .quiz summary .q-text {
      flex: 1;
    }
    .quiz summary .toggle-icon {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 1.15rem;
      font-weight: 300;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .quiz-item[open] summary .toggle-icon {
      transform: rotate(45deg);
      color: var(--accent);
    }
    .answer {
      background: var(--paper-2);
      padding: 16px 20px;
      border-top: 1px solid var(--line);
      font-size: 0.94rem;
    }
    .answer-row {
      margin: 6px 0;
      display: flex;
      align-items: baseline;
      gap: 10px;
      line-height: 1.68;
    }
    .badge-ans, .badge-exp {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .badge-ans {
      background: #059669;
      color: #ffffff;
    }
    .badge-exp {
      background: var(--line-strong);
      color: var(--ink);
    }

    /* Pager Navigation */

  <script>
    const lectures = [{"id": "VCdajY6ZGaA", "group": "유가증권시장·코스닥시장", "groupIndex": 0, "index": 1, "label": "이론정리 ①", "title": "증권투자권유자문인력 이론정리 : 유가증권시장·코스닥시장①ㅣ해커스금융 송영욱", "teacher": "송영욱", "nature": "이론정리", "depth": "full", "video": "https://www.youtube.com/watch?v=VCdajY6ZGaA", "badge": "", "content": "<h2 class=\"section-heading\">1. 청산·결제제도</h2><h3 class=\"subheading\">청산과 결제의 개념</h3><ul><li><strong>청산</strong>: 결제를 <strong>보증</strong>하는 절차</li><li><strong>결제</strong>: 대금을 이행하고 매매를 <strong>종결</strong>시키는 것</li></ul><h3 class=\"subheading\">우리나라 결제 방법 3원칙</h3><ol><li><strong>실물결제 원칙</strong> — 증권과 대금을 실질적으로 수수(실제로 주고받음)</li><li><strong>차감결제</strong> — 회원별·종목별로 매수·매도를 차감하여 <strong>잔량(순차이)만 수수</strong></li><li><strong>집중결제</strong> — 매매 당사자 간 직접 결제가 아니라 <strong>KRX(한국거래소)</strong> 라는 결제 기구에서 집중적으로 결제</li></ol><h3 class=\"subheading\">장내시장의 결제보증과 신용위험 제거</h3><ul><li>유가증권시장·코스닥시장·코넥스시장 = <strong>장내시장</strong> (KRX 내에서 이루어지는 거래)</li><li>장내시장에서는 <strong>거래소가 결제 이행을 보증</strong> → <strong>신용위험(거래상대방 위험)이 없음</strong></li><li>어느 한쪽이 결제를 안 해도 거래소가 상대방에게 무조건 갚아줌</li><li>결제 재원: <strong>손해배상공동기금</strong>(몇 천억 규모 적립), <strong>결제적립금</strong></li></ul><h3 class=\"subheading\">거래증거금제도 (증권시장에도 도입)</h3><ul><li>원래 파생상품시장의 특징적 제도 → 증권시장에도 도입됨</li><li>증권사(회원)가 거래소에 납부하는 <strong>거래증거금</strong>: <strong>순위험증거금</strong> + <strong>변동증거금</strong></li><li>목적: <strong>결제불이행 위험 최소화</strong>, 결제 재원 충당 확대</li><li>참고 구분: <strong>위탁증거금</strong>은 고객(위탁자)이 증권사(회원)에게 납부하는 것</li></ul><hr><h2 class=\"section-heading\">2. 시장감시제도</h2><ul><li>거래소(KRX) 내에 <strong>시장감시위원회</strong> 설치</li><li>주요 업무: <strong>불공정행위 조사·심리</strong>, <strong>회원 감리</strong></li><li>목적: 시장에서 불공정행위가 일어나지 않도록 감시</li></ul><hr><h2 class=\"section-heading\">3. 분쟁조정 (거래소 vs 금감원 비교 — 핵심)</h2><h3 class=\"subheading\">거래소 분쟁조정</h3><ol><li>분쟁조정 신청서 접수</li><li>분쟁조정위원회에서 <strong>합의 권고</strong></li><li>접수로부터 <strong>30일 이내</strong> 합의가 안 되면 → <strong>분쟁조정위원회 회부</strong></li><li>위원회는 회부 후 <strong>30일 이내</strong>에 <strong>조정안 작성·확정</strong></li><li>양 당사자가 수락하면 <strong>민법상 화해</strong>와 같은 효과 (강제력 없음)</li></ol><h3 class=\"subheading\">금감원 분쟁조정위원회 (차이점 2가지)</h3><ol><li>기간이 <strong>30일이 아니라 60일</strong> (조정치로부터 60일 이내 조정안 작성)</li><li>수락 시 <strong>민법상 화해가 아니라 재판상 화해</strong>와 같은 효력 → <strong>강제집행 가능</strong></li></ol><ul><li>→ 민원인들은 <strong>거래소보다 금감원을 더 선호</strong> (강제력 때문)</li></ul><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">우리나라 결제 3원칙</td><td data-label=\"핵심 내용\">실물결제(실질 수수) · 차감결제(순차이만 수수) · 집중결제(KRX 집중)</td></tr><tr><td data-label=\"구분\">청산 vs 결제</td><td data-label=\"핵심 내용\">청산=결제 <strong>보증</strong> 절차 / 결제=대금 이행 + 매매 <strong>종결</strong></td></tr><tr><td data-label=\"구분\">장내시장 신용위험</td><td data-label=\"핵심 내용\">거래소가 결제보증 → <strong>신용위험 없음</strong>. 재원: 손해배상공동기금·결제적립금</td></tr><tr><td data-label=\"구분\">거래증거금</td><td data-label=\"핵심 내용\">회원(증권사)→거래소 납부. <strong>순위험증거금 + 변동증거금</strong> (증권시장 도입)</td></tr><tr><td data-label=\"구분\">위탁증거금</td><td data-label=\"핵심 내용\">고객→증권사(회원) 납부 (파생상품시장 제도와 동일한 용어)</td></tr><tr><td data-label=\"구분\">시장감시위원회</td><td data-label=\"핵심 내용\">KRX 내 설치. 불공정행위 조사·심리, 회원 감리</td></tr><tr><td data-label=\"구분\">거래소 분쟁조정</td><td data-label=\"핵심 내용\">합의권고 → 접수 30일 미합의 → 위원회 회부 → 30일 내 조정안. 수락 시 <strong>민법상 화해</strong></td></tr><tr><td data-label=\"구분\">금감원 분쟁조정</td><td data-label=\"핵심 내용\"><strong>60일</strong>, 수락 시 <strong>재판상 화해</strong> (강제집행 가능) → 민원인 선호</td></tr></tbody></table></div><hr>", "quiz": [{"q": "우리나라 주식 결제의 3원칙은?", "a": "<strong>실물결제·차감결제·집중결제</strong>", "e": "실물결제는 증권·대금의 실질 수수, 차감결제는 매수·매도 차감 후 잔량만 수수, 집중결제는 KRX에서 집중 결제."}, {"q": "장내시장에서 신용위험(거래상대방 위험)이 없는 이유는?", "a": "<strong>거래소가 결제 이행을 보증</strong>하기 때문", "e": "한쪽이 불이행해도 거래소가 무조건 갚아줌. 재원은 손해배상공동기금·결제적립금."}, {"q": "거래증거금은 누가 누구에게 납부하는가?", "a": "<strong>회원(증권사)이 거래소(KRX)에 납부</strong>", "e": "순위험증거금·변동증거금으로 구성, 결제불이행 위험 최소화 목적. 위탁증거금은 고객이 증권사에 납부하는 것."}, {"q": "거래소 분쟁조정에서 조정안을 양 당사자가 수락하면 어떤 효력이 있는가?", "a": "<strong>민법상 화해</strong>", "e": "강제력 없음. 금감원 조정안은 재판상 화해 효력(강제집행 가능)."}, {"q": "금감원 분쟁조정위원회와 거래소 분쟁조정의 차이 2가지는?", "a": "<strong>기간(60일 vs 30일)</strong> 과 <strong>수락 시 효력(재판상 화해 vs 민법상 화해)</strong>", "e": "재판상 화해는 강제집행이 가능하므로 민원인들이 금감원을 더 선호."}]}, {"id": "RgU3mjlE2G8", "group": "유가증권시장·코스닥시장", "groupIndex": 0, "index": 2, "label": "이론정리 ②", "title": "증권투자권유자문인력 이론정리 : 유가증권시장·코스닥시장②ㅣ해커스금융 송영욱", "teacher": "송영욱", "nature": "이론정리", "depth": "full", "video": "https://www.youtube.com/watch?v=RgU3mjlE2G8", "badge": "", "content": "<h2 class=\"section-heading\">1. 이연결제제도 (의미 정도만)</h2><ul><li><strong>이연 = 결제를 늦춤(연기)</strong></li><li>결제 시안까지 미납된 증권이 있으면, 다음 날 이후로 이어(이연)한 뒤 연기한 날 결제할 증권과 <strong>차감</strong>하여 결제를 종결하는 제도</li><li>강사: \"의미만 아시면 됩니다. 중요하지 않습니다\"</li></ul><hr><h2 class=\"section-heading\">2. 결제리스크 관리제도</h2><h3 class=\"subheading\">결제이행 재원 3가지 (암기)</h3><ol><li><strong>손해배상공동기금</strong></li><li><strong>결제적립금</strong></li><li><strong>회원보증금</strong></li></ol><ul><li>KRX가 거래상대방이 이행하든 안 하든 무조건 결제를 이행하는데, 그 재원을 위 3가지로 충당</li></ul><h3 class=\"subheading\">결제불이행시 예방 제도</h3><ul><li>결제이행 파악·관리, 결제이행 보증을 위한 <strong>유동성 공급</strong> 확보</li><li>결제가 곤란하다고 인정되는 경우 <strong>현금 또는 유동성 있는 종목의 증권으로 결제</strong>할 수 있도록 특례 마련</li></ul><h3 class=\"subheading\">결제불이행시 처리 방법 (상식적, 순서 이해)</h3><ol><li><strong>지급정지</strong> (지급 정지하거나 채무인수 안 해줌)</li><li><strong>일괄청산</strong> — 이미 납부할 것이 있으면 <strong>상계조치</strong>하여 결제</li><li><strong>구상권 행사</strong> — 결제불이행 회원에게 청구</li></ol><ul><li>구상권 예: B가 1억원 결제를 안 해서 KRX가 대신 결제했으면, KRX가 B의 회원인 X증권사에게 \"네가 1억 내라\"고 청구, X증권사는 다시 B에게 청구. 이렇게 대신 낸 돈을 되돌려 받는 권리가 <strong>구상권</strong></li></ul><hr><h2 class=\"section-heading\">3. 증권시장의 거래증거금제도 (강사 \"체크\")</h2><h3 class=\"subheading\">도입 배경</h3><ul><li>원래 파생상품시장의 제도였는데 <strong>가격제한폭이 15% → 30%로 확대</strong>되면서 결제위험이 불안해져 증권시장에도 도입</li><li>증권사가 거래소에 일정 부분 증거금을 더 내게 하는 제도</li></ul><h3 class=\"subheading\">부과 대상 종목</h3><ul><li><strong>상장주식</strong> + <strong>증권상품(ELW·ETN·ETF)</strong> 로 한정</li><li>(보통결제: T+2일, 이일결제: 다음날, 당일결제: 당일 — 상장주식·증권상품은 대부분 <strong>보통결제</strong> 방식)</li></ul><h3 class=\"subheading\">산출 방법</h3><ul><li>증권회사의 <strong>자기계좌·위탁계좌 그룹별로 순위험증거금과 변동증거금을 산출하여 합산</strong></li><li><strong>순위험증거금</strong>: 향후 발생할 수 있는 <strong>잠재적 손실</strong>에 대비한 증거금</li><li><strong>변동증거금</strong>: <strong>당일 손익</strong>을 반영한 증거금</li></ul><hr><h2 class=\"section-heading\">4. 시장감시위원회 (거래소 내)</h2><ul><li>거래소 내에 <strong>시장감시위원회</strong> 설치</li><li>업무: <strong>불공정거래 예방 활동, 시장감시, 이상거래 심리, 회원 감리, 분쟁조정</strong></li></ul><hr><h2 class=\"section-heading\">5. 거래소의 분쟁조정 (제일 중요 파트)</h2><h3 class=\"subheading\">절차 (숫자 암기!)</h3><ol><li>분쟁조정 접수</li><li>접수일로부터 <strong>30일 이내</strong>에 <strong>시장감시위원회</strong>에 회부 (합의 권고 후에도 합의 안 되면)</li><li>회부 후 <strong>30일 이내</strong>에 <strong>조정심의·조정결정</strong></li><li>조정결정 <strong>통지받은 때부터 15일 이내</strong>에 양 당사자가 <strong>수락 여부 표시</strong></li><li>수락하면 <strong>민법상 화해</strong>와 같은 효력</li></ol><h3 class=\"subheading\">거래소 분쟁조정의 특징</h3><ul><li><strong>간편하고 신속한</strong> 분쟁 해결 가능 (법원 대비 2~3개월 내 종결)</li></ul><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">결제이행 재원 3가지</td><td data-label=\"핵심 내용\">손해배상공동기금 · 결제적립금 · 회원보증금</td></tr><tr><td data-label=\"구분\">결제불이행 처리</td><td data-label=\"핵심 내용\">지급정지 → 일괄청산(상계) → 구상권 행사 (대신 낸 돈 되돌려받기)</td></tr><tr><td data-label=\"구분\">거래증거금 대상</td><td data-label=\"핵심 내용\">상장주식 + 증권상품(<strong>ELW·ETN·ETF</strong>)</td></tr><tr><td data-label=\"구분\">거래증거금 산출</td><td data-label=\"핵심 내용\">자기·위탁계좌 그룹별 <strong>순위험증거금 + 변동증거금</strong> 합산</td></tr><tr><td data-label=\"구분\">순위험 vs 변동</td><td data-label=\"핵심 내용\">순위험=<strong>잠재적 손실 대비</strong> / 변동=<strong>당일 손익 반영</strong></td></tr><tr><td data-label=\"구분\">시장감시위원회</td><td data-label=\"핵심 내용\">KRX 내 설치. 불공정거래 예방·이상거래 심리·회원감리·분쟁조정</td></tr><tr><td data-label=\"구분\">거래소 분쟁조정 기간</td><td data-label=\"핵심 내용\">접수 후 <strong>30일</strong> 이내 회부 → <strong>30일</strong> 내 조정결정 → 통지 후 <strong>15일</strong> 내 수락 여부</td></tr><tr><td data-label=\"구분\">수락 효력</td><td data-label=\"핵심 내용\"><strong>민법상 화해</strong> (강제력 없음)</td></tr></tbody></table></div><hr>", "quiz": [{"q": "결제이행 재원 3가지는?", "a": "<strong>손해배상공동기금·결제적립금·회원보증금</strong>", "e": "KRX가 상대방 이행 여부와 무관하게 결제를 이행하는데 그 재원을 이 3가지로 충당."}, {"q": "구상권이란?", "a": "<strong>대신 결제해준 돈을 결제불이행 회원(고객)에게 되돌려 청구하는 권리</strong>", "e": "KRX가 X증권사의 고객 B를 대신해 결제했으면 KRX→X증권사→B 순서로 구상권 행사."}, {"q": "증권시장 거래증거금의 부과 대상 종목은?", "a": "<strong>상장주식 + 증권상품(ELW·ETN·ETF)</strong>", "e": "파생상품시장 제도였으나 가격제한폭 확대(15%→30%)로 증권시장에 도입."}, {"q": "순위험증거금과 변동증거금의 차이는?", "a": "순위험=<strong>잠재적 손실 대비</strong>, 변동=<strong>당일 손익 반영</strong>", "e": "두 가지를 합산해 거래증거금 산출(자기·위탁계좌 그룹별)."}, {"q": "거래소 분쟁조정에서 조정결정을 통지받은 당사자는 언제까지 수락 여부를 표시해야 하는가?", "a": "<strong>통지받은 때부터 15일 이내</strong>", "e": "수락하면 민법상 화해 효력. 절차는 접수→30일 내 회부→30일 내 조정결정."}]}, {"id": "BH--kowOXAA", "group": "유가증권시장·코스닥시장", "groupIndex": 0, "index": 3, "label": "이론정리 ③", "title": "증권투자권유자문인력 이론정리 : 유가증권시장·코스닥시장③ㅣ해커스금융 송영욱", "teacher": "송영욱", "nature": "이론정리 (실전 예상문제 풀이 6문항 중심)", "depth": "full", "video": "https://www.youtube.com/watch?v=BH--kowOXAA", "badge": "", "content": "<h2 class=\"section-heading\">1. 한국거래소 (예상문제 1번)</h2><ul><li><strong>허가주의</strong> 채택 (O)</li><li>조직 형태: <strong>상법상 주식회사</strong> (× 함정: \"민법상 비영리 사단법인\"은 틀림)</li><li>원칙적으로 <strong>거래소 회원이 아닌 자는 거래소 시장에서 매매거래 불가</strong> — 회원의 대부분은 증권사</li><li>거래소가 개설하는 주식 관련 시장 <strong>4개</strong> (= 장내시장): <strong>유가증권시장·코스닥시장·코넥스시장·파생상품시장</strong></li></ul><hr><h2 class=\"section-heading\">2. 상장제도 (예상문제 2·3번)</h2><h3 class=\"subheading\">추가상장 vs 재상장 vs 신규상장</h3><ul><li><strong>추가상장</strong>: 기상장 법인이 <strong>유상·무상증자</strong> 등으로 새로 발행한 주권을 상장하는 것</li><li><strong>재상장</strong>: 상장폐지된 기업이 재상장하는 경우 — <strong>상장예비심사를 생략할 수 없음</strong> (신규상장에 준하는 절차 필수)</li><li><strong>공모상장</strong>: 상장예비심사를 거친 후 공모 절차 진행</li><li>상장폐지된 법인의 <strong>재상장 신청 기간: 폐지일로부터 5년 이내</strong></li></ul><h3 class=\"subheading\">공모상장 절차 순서</h3><ol><li><strong>주권 상장예비심사 신청서 제출</strong></li><li><strong>심사 결과 통지</strong></li><li>금융위에 <strong>증권신고서 제출</strong> (→ 투자설명서 제출)</li><li><strong>주권 신규상장 신청서 제출</strong></li><li>상장 승인 → 수요예측 → 청약·배정·납입 → 상장</li></ol><hr><h2 class=\"section-heading\">3. 상장폐지제도 (예상문제 4번)</h2><ul><li><strong>직권</strong>에 의한 상장폐지뿐 아니라 <strong>신청</strong>에 의한 상장폐지(자진 상장폐지)도 가능 (× 함정: \"직권에 의해서만 한다\"는 틀림)</li><li>간섭받기 싫은 대주주가 비상장으로 가려는 경우 등, 좋은 회사가 신청하기도 함</li><li><strong>관리종목 지정</strong>: 상장폐지 우려를 <strong>사전에 예고하는 단계</strong> (지정되면 주가 폭락 유의)</li><li>상장폐지 결정 후 <strong>7일간의 정리매매</strong> (투자자에게 최종 매매 기회 제공 — 이 시점 주가는 이미 폭락 상태)</li><li>상장폐지 해당 전, 해당 법인에 <strong>사전에 상장폐지 우려 예고 가능</strong></li></ul><hr><h2 class=\"section-heading\">4. 코스닥 변경상장 vs 추가상장 vs 재상장 (예상문제 5번)</h2><ul><li><strong>상호·액면금액 변경</strong> → <strong>변경상장</strong> (코스닥 시장에서 매매할 수 있도록 변경상장 필요)</li><li><strong>유상증자로 신주 발행</strong> → <strong>추가상장</strong></li><li><strong>분할·분할합병으로 새로운 법인 설립</strong> → <strong>재상장</strong> (× 함정: 변경·추가상장이 아님)</li></ul><hr><h2 class=\"section-heading\">5. 기업공시제도의 의의 (예상문제 6번)</h2><ul><li>투자자에게 <strong>투자 판단에 필요한 정보 제공</strong></li><li><strong>내부자거래 등 불공정거래 방지</strong></li><li>증권시장에 <strong>공정한 거래 실현</strong></li><li>× 함정: \"기업 정보를 공개하는 것은 기업의 <strong>자율적 의사</strong>에 따르므로 의무가 아니다\"는 <strong>틀림</strong> — 공시는 <strong>의무</strong>임 (상장법인의 경우)</li></ul><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">한국거래소</td><td data-label=\"핵심 내용\">허가주의 / <strong>상법상 주식회사</strong>(비영리 사단법인 X) / 회원이 아니면 매매 불가</td></tr><tr><td data-label=\"구분\">거래소 개설 시장 4개</td><td data-label=\"핵심 내용\">유가증권시장 · 코스닥시장 · 코넥스시장 · 파생상품시장</td></tr><tr><td data-label=\"구분\">추가상장</td><td data-label=\"핵심 내용\">유상·무상증자로 새로 발행한 주권 상장</td></tr><tr><td data-label=\"구분\">재상장</td><td data-label=\"핵심 내용\">상장예비심사 <strong>생략 불가</strong>, 폐지일로부터 <strong>5년 이내</strong> 신청</td></tr><tr><td data-label=\"구분\">공모상장 순서</td><td data-label=\"핵심 내용\">예비심사 신청 → 결과 통지 → 증권신고서 → 신규상장 신청 → 승인</td></tr><tr><td data-label=\"구분\">상장폐지</td><td data-label=\"핵심 내용\">직권 <strong>+ 신청(자진)</strong> 가능 / 관리종목 지정=폐지 우려 예고 / <strong>정리매매 7일</strong></td></tr><tr><td data-label=\"구분\">코스닥 변경상장</td><td data-label=\"핵심 내용\">상호·액면금액 변경 → 변경상장 / 유상증자 신주 → 추가상장 / 분할신설법인 → <strong>재상장</strong></td></tr><tr><td data-label=\"구분\">공시제도 의의</td><td data-label=\"핵심 내용\">투자정보 제공 · 불공정거래 방지 · 공정거래 실현 / <strong>공시는 의무</strong></td></tr></tbody></table></div><hr>", "quiz": [{"q": "한국거래소의 조직 형태는?", "a": "<strong>상법상 주식회사</strong>", "e": "\"민법상 비영리 사단법인\" 지문은 틀림. 허가주의 채택, 비회원은 시장 매매 불가."}, {"q": "상장폐지된 기업이 재상장할 때 상장예비심사를 생략할 수 있는가?", "a": "<strong>불가</strong>", "e": "신규상장에 준하는 절차를 거쳐야 함. 재상장 신청 기간은 폐지일로부터 5년 이내."}, {"q": "공모상장에서 증권신고서를 제출하는 시점은?", "a": "<strong>상장예비심사 결과 통지 후</strong>", "e": "예비심사 신청→결과 통지→증권신고서(금융위)→투자설명서→신규상장 신청서→상장 승인."}, {"q": "코스닥 상장법인의 분할로 새로운 법인이 설립된 경우 필요한 상장은?", "a": "<strong>재상장</strong>", "e": "상호 변경은 변경상장, 유상증자 신주는 추가상장. 분할 신설은 재상장."}, {"q": "상장폐지 시 투자자에게 부여되는 최종 매매 기회는?", "a": "<strong>7일간의 정리매매</strong>", "e": "관리종목 지정은 상장폐지 우려의 사전 예고 단계. 상장폐지는 직권뿐 아니라 신청(자진)도 가능."}, {"q": "기업공시제도의 목적이 아닌 것은?", "a": "<strong>기업의 자율적 의사에 따른 공개</strong>", "e": "공시는 의무임. 투자 판단 정보 제공, 내부자거래 등 불공정거래 방지, 공정한 거래 실현이 목적."}]}, {"id": "qUJBuvvFjE0", "group": "유가증권시장·코스닥시장", "groupIndex": 0, "index": 4, "label": "기본서 핵심정리", "title": "[해커스금융] 증권투자권유자문인력 기본서 핵심정리 - 유가증권시장/코스닥시장", "teacher": "자막에서 강사명 확인 불가 (해커스금융 강사)", "nature": "이론정리 (기본서 핵심정리 — 공시제도 + 매매거래제도)", "depth": "full", "video": "https://www.youtube.com/watch?v=qUJBuvvFjE0", "badge": "", "content": "<h2 class=\"section-heading\">1. 공시제도의 분류</h2><h3 class=\"subheading\">발행시장 공시 3가지 (암기 — 이것만 알면 나머지는 유통시장 공시)</h3><ol><li><strong>증권신고서 등 신고서</strong></li><li><strong>투자설명서</strong></li><li><strong>발행실적보고서</strong></li></ol><ul><li>→ \"다음 중 유통시장 공시가 아닌 것은\" / \"발행시장 공시가 아닌 것은\" 형태의 짝짓기 문제로 빈출</li></ul><h3 class=\"subheading\">유통시장 공시</h3><ul><li><strong>정기공시</strong>: 사업보고서·반기보고서·분기보고서 (정기적으로 공시하는 의무공시)</li><li><strong>수시공시</strong>: 필요할 때 수시로 — <strong>주요사항보고서</strong>(회사에 나쁜 일·주주가 알아야 할 중대사항 발생 시 의무, 예: 부도·증자·감자·영업양수도·합병·분할·주식의 포괄적 교환), <strong>기타공시</strong>(합병보고서·자사주 취득보고서·주식매수선택권 부여 신고 등), <strong>지분공시</strong>(5% 이상 대량보유 시 5% 룰 보고)</li></ul><h3 class=\"subheading\">조회공시·자율공시·공정공시 (강사 \"특별히 기억\" 파트)</h3><ul><li><strong>조회공시</strong>: 풍문·보도(부도설, 실적 설 등)의 사실 여부를 해당 법인에 직접 물어보는 공시</li><li><strong>오전</strong> 조회공시 요청 → <strong>오후까지</strong> 답변 의무</li><li><strong>오후</strong> 조회공시 요청 → <strong>다음날 오전까지</strong> 답변 의무</li><li><strong>자율공시</strong>: 회사가 투자자에게 알릴 필요가 있는 주요경영사항을 <strong>자율적으로</strong> 공시 (보통 회사 입장에서 좋은 소식·자랑 성격, 실적 개선·좋은 계약 등)</li><li><strong>공정공시</strong>: IR·설명회 전에 참석하지 못한 일반 투자자도 공평하게 정보를 알 수 있도록 하는 공시 — <strong>정보 비대칭 방지</strong> 목적</li><li>예: 증권사 애널리스트 50명을 모아 IR을 하면, 그 설명회 <strong>개시 시작 전</strong>까지 공시해야 함 (보도자료 배포 시에는 배포 전까지)</li></ul><h3 class=\"subheading\">공정공시 의무 적용의 예외 3가지 (밑줄)</h3><ol><li><strong>보도 목적의 언론 취재에 응해</strong> 언론사에 정보를 제공한 경우 (공시할 시간적 여유 없음)</li><li><strong>변호사 등 명시적인 비밀유지의무</strong>가 있는 자에게 정보를 제공한 경우</li><li><strong>금융위 허가를 받은 신용평가기관</strong>이나 <strong>외국 신용평가기관</strong>에게 정보를 제공한 경우</li></ol><hr><h2 class=\"section-heading\">2. 불성실공시</h2><h3 class=\"subheading\">불성실공시의 유형 3가지</h3><ol><li><strong>공시 불이행</strong> — 공시 의무가 있는데 하지 않은 경우</li><li><strong>공시 번복</strong> — 한 번 했다가 다시 고치는 경우</li><li><strong>공시 변경</strong> — A라고 했다가 B라고 하는 등 왔다갔다 하는 경우</li></ol><h3 class=\"subheading\">불성실공시 시 제재</h3><ul><li><strong>불성실공시법인으로 지정·공표</strong></li><li><strong>매매거래정지</strong>, <strong>벌점 부과</strong>, <strong>제재금 부과</strong></li><li>개선계획서 제출 요구, 공시담당책임자 교육, <strong>관리종목 지정</strong>, <strong>상장폐지</strong>, 임원 교체 등</li><li>(계속되면 벌점 누적으로 관리종목·상장폐지까지 가능)</li></ul><hr><h2 class=\"section-heading\">3. 매매거래제도</h2><h3 class=\"subheading\">위탁증거금</h3><ul><li>결제 이행을 담보하기 위한 증거금. 일반적으로 매수대금의 <strong>25~40%</strong> 수준 징수 (종목별 차이 있음)</li><li>증권사가 자율적으로 정하되, 거래소가 <strong>최저한도</strong>를 정할 수 있음</li><li>예: 100만원어치 주식을 40만원만 있으면 살 수 있고, 나머지 60만원은 결제일(T+2)에 납부. 못 갚으면 다음날 <strong>반대매매</strong>로 청산</li></ul><h3 class=\"subheading\">위탁증거금 100% 징수하는 경우 3가지 (강사 강조)</h3><ol><li><strong>상장주식수 5만주 미만</strong>인 종목의 <strong>매도 주문</strong></li><li><strong>투자경고종목·투자위험종목</strong>의 <strong>매수 주문</strong> (단기과열종목 분류 중 투자경고·투자위험 종목)</li><li><strong>미수동결계좌</strong></li></ol><ul><li><strong>매수대금 미납</strong> → 다음 매매거래일부터 <strong>30일간</strong> 미수 불가</li><li><strong>매도증권 미납</strong> → 다음 매매거래일부터 <strong>90일간</strong> 미수 불가</li></ul><h3 class=\"subheading\">대용증권 (현금 대신 증거금으로 사용 가능한 증권)</h3><ul><li><strong>상장증권, DR(증권예탁증권), ETF, ETN, 상장채무증권, 수익증권, 비상장 벤처기업펀드</strong></li></ul><h3 class=\"subheading\">매매거래일·거래시간·수량단위</h3><ul><li>매매거래일: <strong>월요일~금요일</strong> (국경일 제외)</li><li><strong>휴장일</strong>: 국경일, 토요일, <strong>근로자의 날(5/1)</strong>, <strong>12월 31일</strong>(연말 시장 결산)</li><li>매매거래시간: <strong>9:00 ~ 15:30</strong> / 호가 주문은 <strong>7:30부터</strong> 가능 / 15:30 이후 <strong>시간외 종가거래</strong> 가능</li><li>매매수량단위: <strong>1주 단위</strong> (예외: <strong>ELW는 10주 단위</strong>)</li></ul><h3 class=\"subheading\">호가가격단위 (가격틱)</h3><ul><li><strong>유가증권시장: 7단계</strong> — 1원·5원·10원·50원·100원·500원·1,000원</li><li>주가 구간별: 1,000원 미만→1원 / 5,000원 미만→5원 / 1만원 미만→10원 / 5만원 미만→50원 / 10만원 미만→100원 / 50만원 미만→500원 / 50만원 초과→1,000원</li><li><strong>코스닥시장·코넥스시장: 5단계</strong> — 1원·5원·10원·50원·100원 (유가증권의 상위 2단계 없음)</li></ul><h3 class=\"subheading\">주문의 종류 (핵심 5가지)</h3><ol><li><strong>지정가</strong>: 종목·수량·가격을 모두 지정 (예: A주식 10주 1만원에 매수)</li><li><strong>시장가</strong>: 종목·수량은 지정, <strong>가격은 지정하지 않음</strong> — 나오는 주문대로 가격에 상관없이 계속 체결</li><li><strong>조건부지정가</strong>: 장중에는 지정가로 있다가 <strong>장 마감 10분 전(종가단일가 시간)</strong>부터 <strong>시장가로 변경</strong> — 무조건 종가에 체결</li><li><strong>최유리지정가</strong>: 가격을 지정하지 않고 시스템이 <strong>가장 유리한 가격</strong>으로 체결 (매수자는 가장 낮은 매도호가)</li><li><strong>최우선지정가</strong>: <strong>체결 가능성 최고</strong> — 매수자는 같은 방향에서 가장 높은 가격, 매도자는 가장 낮은 가격으로 주문</li></ol><ul><li>참고: 목표가 주문, 경쟁대량매매는 출제 비중 낮음</li></ul><h3 class=\"subheading\">주문 조건 (IOC / FOK)</h3><ul><li><strong>IOC (일부 충족 조건)</strong>: 즉시 체결 가능한 수량만 체결하고 <strong>미체결 나머지는 취소</strong> (예: 100주 중 70주만 체결 가능 → 70주 체결, 30주 취소)</li><li><strong>FOK (전부 충족 조건)</strong>: <strong>전량 체결 가능해야만 체결</strong>, 한 주도 미체결이면 <strong>전부 취소</strong> (100주 중 99주만 체결 가능 → 전량 취소)</li></ul><h3 class=\"subheading\">가격제한폭</h3><ul><li>원칙: 전일종가 기준 <strong>±30%</strong> (예: 전일 1만원 → 13,000원까지 주문 가능, 7,000원 미만 불가)</li><li><strong>적용 제외 4가지</strong> (중요): <strong>정리매매 종목, 주식워런트증권(ELW), 신주인수권증서, 신주인수권증권</strong> — 가격제한 없이 하루에 60~70%도 움직일 수 있음</li><li><strong>확대 적용</strong>: <strong>레버리지 ETF</strong> — 배율(1.5배·2배)만큼 가격제한폭도 확대 적용</li></ul><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">발행시장 공시 3종</td><td data-label=\"핵심 내용\">증권신고서 · 투자설명서 · 발행실적보고서 (나머지는 전부 유통시장)</td></tr><tr><td data-label=\"구분\">조회공시 답변 기한</td><td data-label=\"핵심 내용\">오전 조회→<strong>오후까지</strong> / 오후 조회→<strong>다음날 오전까지</strong></td></tr><tr><td data-label=\"구분\">자율공시</td><td data-label=\"핵심 내용\">회사 자율 (좋은 소식·자랑 성격)</td></tr><tr><td data-label=\"구분\">공정공시</td><td data-label=\"핵심 내용\">IR 등 <strong>설명회 개시 전</strong>까지 공시, 정보 비대칭 방지 / 예외 3종(언론취재·비밀유지의무자·신용평가기관)</td></tr><tr><td data-label=\"구분\">불성실공시 3유형</td><td data-label=\"핵심 내용\">공시 불이행 · 공시 번복 · 공시 변경</td></tr><tr><td data-label=\"구분\">불성실공시 제재</td><td data-label=\"핵심 내용\">법인 지정·공표 · 매매거래정지 · 벌점 · 제재금 · 관리종목 지정 · 상장폐지</td></tr><tr><td data-label=\"구분\">위탁증거금 100% 3종</td><td data-label=\"핵심 내용\">5만주 미만 매도주문 · 투자경고/투자위험 종목 매수주문 · 미수동결계좌(매수대금 미납→30일, 매도증권 미납→90일)</td></tr><tr><td data-label=\"구분\">대용증권</td><td data-label=\"핵심 내용\">상장증권 · DR · ETF · ETN · 상장채무증권 · 수익증권 · 비상장 벤처기업펀드</td></tr><tr><td data-label=\"구분\">휴장일</td><td data-label=\"핵심 내용\">국경일 · 토요일 · 근로자의날(5/1) · <strong>12/31</strong></td></tr><tr><td data-label=\"구분\">거래시간</td><td data-label=\"핵심 내용\">9:00~15:30 (호가주문 7:30~, 15:30 이후 시간외종가거래)</td></tr><tr><td data-label=\"구분\">수량단위</td><td data-label=\"핵심 내용\">1주 (예외: ELW 10주)</td></tr><tr><td data-label=\"구분\">호가단위</td><td data-label=\"핵심 내용\">유가증권 7단계 / 코스닥·코넥스 5단계</td></tr><tr><td data-label=\"구분\">주문 5종</td><td data-label=\"핵심 내용\">지정가 · 시장가 · 조건부지정가(장마감 10분전 시장가 전환) · 최유리지정가 · 최우선지정가</td></tr><tr><td data-label=\"구분\">IOC / FOK</td><td data-label=\"핵심 내용\">IOC=일부 체결+나머지 취소 / FOK=전량 체결 아니면 전부 취소</td></tr><tr><td data-label=\"구분\">가격제한폭</td><td data-label=\"핵심 내용\">±30% / 제외 4종(정리매매·ELW·신주인수권증서·신주인수권증권) / 레버리지ETF 확대 적용</td></tr></tbody></table></div><hr>", "quiz": [{"q": "발행시장 공시 3가지는?", "a": "<strong>증권신고서 · 투자설명서 · 발행실적보고서</strong>", "e": "이 3가지만 알면 나머지는 전부 유통시장 공시로 판단. \"유통시장 공시가 아닌 것은\" 지문형 빈출."}, {"q": "오후에 조회공시를 요청하면 언제까지 답변해야 하는가?", "a": "<strong>다음날 오전까지</strong>", "e": "오전 조회→오후까지 답변. 조회공시는 풍문·보도의 사실 여부를 회사에 직접 확인하는 공시."}, {"q": "위탁증거금을 100% 징수해야 하는 경우 3가지는?", "a": "<strong>상장주식수 5만주 미만의 매도주문, 투자경고·투자위험종목의 매수주문, 미수동결계좌</strong>", "e": "미수동결은 매수대금 미납→30일, 매도증권 미납→90일 미수 불가."}, {"q": "유가증권시장과 코스닥시장의 호가가격단위 차이는?", "a": "<strong>유가증권 7단계, 코스닥·코넥스 5단계</strong>", "e": "코스닥·코넥스는 1원·5원·10원·50원·100원 5개만 있음."}, {"q": "조건부지정가 주문의 특징은?", "a": "<strong>장중에는 지정가, 장 마감 10분 전부터 시장가로 변경</strong>되어 종가에 무조건 체결", "e": "지정한 가격에 체결 안 돼도 종가단일가 시간에 시장가로 전환되어 종가 체결."}, {"q": "가격제한폭이 적용되지 않는 경우는?", "a": "<strong>정리매매 종목, 주식워런트증권(ELW), 신주인수권증서, 신주인수권증권</strong>", "e": "원칙은 ±30%, 레버리지 ETF는 배율만큼 확대 적용."}]}, {"id": "HtC2Pw3qpb0", "group": "유가증권시장·코스닥시장", "groupIndex": 0, "index": 5, "label": "최종핵심 문제풀이 ①", "title": "증권투자권유자문인력 최종핵심 문제풀이🔑'유가증권시장①'ㅣ해커스 송영욱ㅣ증권투자자문인력 은행취업 금융자격증", "teacher": "송영욱", "nature": "문제풀이 (2과목 총 20문항 중 유가증권시장에서 8문항 — 비중 가장 큼)", "depth": "full", "video": "https://www.youtube.com/watch?v=HtC2Pw3qpb0", "badge": "", "content": "<h2 class=\"section-heading\">1. 증권시장 기초 (문제 1·2)</h2><h3 class=\"subheading\">발행시장 vs 유통시장</h3><ul><li>증권시장은 <strong>발행시장</strong>과 <strong>유통시장</strong>으로 구분</li><li>발행시장: 기업 입장에서 <strong>자금조달</strong>의 시장 / 투자자 입장에서 <strong>신규 발행 증권에 대한 최초 투자</strong> 시장</li><li>유통시장: 발행된 증권의 <strong>매매·유통</strong> 시장</li><li>둘은 <strong>상호의존적·보완적 관계</strong></li></ul><h3 class=\"subheading\">증권 vs 파생상품 / 직접금융 vs 간접금융</h3><ul><li>증권 = <strong>추가 지급의무를 부담하지 않는</strong> 금융투자상품 / 파생상품 = 추가 지급의무 부담 가능</li><li>증권시장 = 증권사를 거쳐 연결되지만 <strong>직접금융</strong> 방식 (× 함정: \"간접금융\"은 틀림)</li><li>직접금융: 투자자 <strong>명의</strong>로 회사에 자금 공급 (주식·채권 매수)</li><li>간접금융: 저축자가 은행에 예금하고 은행 <strong>명의</strong>로 대출 → 은행을 끼고 간접 연결</li></ul><h3 class=\"subheading\">공모 vs 사모 — 모집 vs 매출</h3><ul><li><strong>모집</strong>: <strong>50인 이상</strong>의 투자자에게 <strong>새로 발행되는</strong> 증권의 취득청약 <strong>권유</strong></li><li><strong>매출</strong>: <strong>50인 이상</strong>의 투자자에게 <strong>이미 발행된</strong> 증권의 매도청약 <strong>권유</strong></li><li><strong>모집의 주체 = 증권의 발행인</strong> / <strong>매출의 주체 = 증권의 보유자</strong> (뒤바뀐 지문이 함정)</li><li>50인 산정 시 제외자: <strong>전문가</strong>(전문투자자)와 <strong>발행인의 연고자</strong>(최대주주·특수관계인·임원·우리사주조합)</li></ul><hr><h2 class=\"section-heading\">2. 발행 형태 — 직접발행 vs 간접발행 (문제 3)</h2><ul><li><strong>직접발행</strong>: 발행사가 발행사무·발행위험 모두 부담</li><li><strong>간접발행</strong> (시험 빈출) 3가지:</li></ul><ol><li><strong>모집주선</strong>: 발행사무만 부담</li><li><strong>잔액인수</strong>: 발행사무 + 발행위험 부담, <strong>미판매분만 인수</strong></li><li><strong>총액인수</strong>: 발행사무 + 발행위험 부담, <strong>처음부터 전량 인수</strong> (우리나라 대부분이 총액인수)</li></ol><ul><li>인수수수료율: <strong>모집주선 &lt; 잔액인수 &lt; 총액인수</strong> (× 함정: \"인수수수료율이 낮다는 것이 장점\"은 총액인수에는 틀림)</li><li>용어: 발행주체 = 발행인 = 발행회사, 발행사무·위험을 맡는 증권사 = <strong>발행기관 = 인수기관</strong></li></ul><hr><h2 class=\"section-heading\">3. 상장 준비단계 vs 추진단계 (문제 4)</h2><ul><li><strong>상장 준비단계</strong> (거래소 관여 전): <strong>외부감사인 지정</strong>, <strong>명의개서대행 계약 체결</strong>, <strong>이사회·주주총회 결의</strong></li><li><strong>상장 추진단계</strong> (거래소 관여 후): <strong>상장예비심사 청구서 제출</strong>, 증권신고서 제출, 희망가격 설정, IR, 청약·납입 등</li></ul><hr><h2 class=\"section-heading\">4. 유상증자 (문제 5)</h2><ul><li><strong>유상증자 = 주식 발행으로 자기 자본 증가</strong></li><li>배정 방식 4가지: <strong>주주배정</strong>(가장 일반적) · <strong>주주우선공모</strong> · <strong>제3자배정</strong>(구조조정·특별한 기술 등) · <strong>일반공모</strong> (+ 직접공모는 출제 비중 낮음)</li><li>주주우선공모에서 청약 미달분 발생 → <strong>일반공모</strong>로 처리 (× 함정: \"이사회 결의로 전문투자자 대상 제3자배정으로 해결\"은 틀림)</li><li><strong>2권 상장법인의 일반공모는 이사회 결의로 가능</strong> (주주총회 특별결의 아님)</li></ul><hr><h2 class=\"section-heading\">5. 주권상장법인의 혜택 (문제 6)</h2><ul><li><strong>우리사주조합 우선배정</strong>: 공모주식 총수의 <strong>20%</strong>까지</li><li><strong>유가증권시장 = 의무</strong>, <strong>코스닥시장 = 자유</strong>(할 수도 안 할 수도 있음)</li><li><strong>발행주식 총수의 2분의 1까지 의결권 없거나 제한되는 주식 발행 가능</strong></li><li>상장법인은 <strong>이사회 결의</strong>로 <strong>금전 분기배당</strong> 가능</li><li><strong>액면미달 발행</strong>: 일반 회사 = 주총 특별결의 + <strong>법원 인가</strong> / 주권상장법인 = 법원 인가 없이 <strong>주총 특별결의만</strong>으로 가능 (× 함정: \"이사회 결의만으로 가능\"은 틀림)</li></ul><hr><h2 class=\"section-heading\">6. 상장 방식과 요건 (문제 7·8·9)</h2><h3 class=\"subheading\">상장 원칙·방식</h3><ul><li><strong>전부상장 원칙</strong> (주권의 전부 상장), <strong>신청주의</strong> 상장 원칙, 주권상장 <strong>유예</strong> 가능</li><li>상장 방식 5가지: <strong>신규상장 · 변경상장 · 추가상장 · 재상장 · 우회상장</strong></li><li>변경상장 = 주권의 종목·상호 등 변경 시 / 추가상장 = 주식 발행으로 주식수 변경 시</li><li><strong>우회상장</strong> = 주권상장법인과 비상장법인의 합병 등으로 주권비상장법인의 지분증권이 상장되는 것 (× 함정: 변경상장으로 오인)</li><li>재상장 3가지: 일반재상장·분할재상장·합병재상장 → <strong>유가증권시장은 3가지 모두, 코스닥시장은 합병·분할재상장만</strong> 가능</li></ul><h3 class=\"subheading\">규모·분산 요건 (숫자 암기)</h3><ul><li><strong>자기자본 300억원 이상</strong>, <strong>상장주식수 100만주 이상</strong></li><li><strong>일반주주수 700명 이상</strong> (× 함정: 500명), <strong>일반주주 지분 25% 이상</strong> 또는 <strong>500만주 이상</strong></li></ul><h3 class=\"subheading\">경영성과·안정성 요건</h3><ul><li>최근 <strong>매출액 1,000억원 이상</strong>이거나 <strong>시가총액 2,000억원 이상</strong></li><li>최근 2개년 이익 50억원 이상 + 시가총액 1,000억원 이상 시 충족</li><li><strong>설립 후 3년 이상 경과</strong> + 계속 영업활동 (코스닥시장은 3년 요건 없음)</li><li>감사 의견: <strong>최근 사업연도는 적정</strong>, 최근 3개년도는 <strong>적정 또는 한정</strong> (× 함정: \"최근 3년 연속 적정\"은 틀림)</li></ul><hr><h2 class=\"section-heading\">7. 매매거래정지·상장폐지·관리종목 (문제 10·11)</h2><h3 class=\"subheading\">매매거래정지 사유 (거리가 먼 것 = 변경상장 사유)</h3><ul><li>조회공시 답변 기한 미준수, 시장 감시 필요 시, 풍문·보도 관련 거래량 급변</li><li><strong>변경상장 사유는 정지 사유 아님</strong> (주로 안 좋은 내용·긴급한 내용이 정지 사유)</li></ul><h3 class=\"subheading\">관리종목 지정 vs 상장폐지 (핵심: \"2년 연속\" = 상장폐지)</h3><ul><li><strong>2년 연속 매출액 50억원 미만</strong> → <strong>상장폐지</strong> (1회는 관리종목 지정)</li><li><strong>2년 연속 자본잠식 50% 이상</strong> → 상장폐지 (× 함정: \"자본잠식 30% 미만\"은 틀림)</li><li><strong>2년 연속 감사보고서 의견 한정</strong> → 상장폐지 사유</li><li><strong>2년 연속 일반주주 200인 미만</strong> → 상장폐지 사유</li><li>거래량: 반기 월평균 거래량이 유동주식수 <strong>1% 미달</strong> → 관리종목 지정 / <strong>반기 연속</strong> 미달 → 상장폐지 (\"2년 연속\"이 아님)</li><li>공시서류: <strong>분기·반기 사업보고서 2회 연속 미제출</strong> → 상장폐지 (1회는 관리종목)</li></ul><hr><h2 class=\"section-heading\">8. 공시제도 — 발행시장 vs 유통시장 (문제 12·13·14)</h2><ul><li><strong>발행시장 공시 3종</strong>: <strong>증권신고서 · 투자설명서 · 발행실적보고서</strong> (나머지는 전부 유통시장)</li><li><strong>주요경영사항 공시</strong>: 수시로 발생하는 경영정보 중 투자판단에 중요한 사실을 <strong>적시</strong> 공시하는 의무공시 (대부분 안 좋은 내용: 영업정지·증자·감자·횡령·배임·합병·부도 등)</li><li><strong>당일공시 사항 = 사유 발생 당일 18:00부터 다음날 7:30까지</strong> 공시 (× 함정: \"사유 발생 당일 18:00 이내\"는 틀림)</li><li><strong>공정공시</strong>: 미공개 중요정보를 특정인에게 선별 제공 시 <strong>실시 전에</strong> 모든 투자자에게 공시</li><li><strong>보도 목적의 언론 취재 응대</strong>는 <strong>공정공시 의무 적용 제외</strong> (미리 공시할 시간적 여유가 없고, 보도 시점에 모든 사람에게 공개되므로)</li></ul><hr><h2 class=\"section-heading\">9. 불성실공시법인과 위탁증거금 (문제 15·16)</h2><ul><li>불성실공시 = 공시 불이행·번복·변경. <strong>개선계획서 요구는 한국금융투자협회가 아니라 한국거래소</strong> (× 함정)</li><li>거래소는 <strong>공시위반 제재금 부과</strong>, 매매거래정지, 지정 사실·벌점 공표 가능</li><li><strong>위탁증거금 100% 징수</strong> 3가지: <strong>상장주식수 5만주 미만 종목의 매도주문</strong> (× 함정: \"50%\"는 틀림), <strong>투자경고·투자위험종목의 매수주문</strong> (투자주의종목은 제외), <strong>미수동결계좌</strong></li><li><strong>대용증권</strong> = 현금에 갈음해 위탁증거금으로 사용 가능한 <strong>거래소가 지정</strong>한 증권. 회원은 거래소가 공표한 사정비율 내에서 징수 비율 자율 결정</li></ul><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">증권시장</td><td data-label=\"핵심 내용\"><strong>직접금융</strong> 방식 / 발행시장(자금조달·최초투자)+유통시장(매매유통), 상호의존·보완</td></tr><tr><td data-label=\"구분\">모집 vs 매출</td><td data-label=\"핵심 내용\">모집=<strong>신규</strong> 증권 취득청약 권유(주체=<strong>발행인</strong>) / 매출=<strong>기발행</strong> 증권 매도청약 권유(주체=<strong>보유자</strong>)</td></tr><tr><td data-label=\"구분\">간접발행 3종</td><td data-label=\"핵심 내용\">모집주선(사무만) · 잔액인수(미판매분 인수) · 총액인수(전량 인수, 국내 주류)</td></tr><tr><td data-label=\"구분\">상장 단계</td><td data-label=\"핵심 내용\">준비단계(외부감사인·명의개서대행·이사회/주총 결의) → 추진단계(예비심사 청구서 제출~)</td></tr><tr><td data-label=\"구분\">유상증자 배정</td><td data-label=\"핵심 내용\">주주배정(가장 일반적) · 주주우선공모(미달분→일반공모) · 제3자배정 · 일반공모(2권상장은 이사회 결의)</td></tr><tr><td data-label=\"구분\">상장법인 혜택</td><td data-label=\"핵심 내용\">우리사주 20% 우선배정(유가=<strong>의무</strong>/코스닥=<strong>자유</strong>) · 의결권제한주식 1/2까지 · 분기배당 이사회 결의 · 액면미달=<strong>주총 특별결의만</strong>(법원 인가 불필요)</td></tr><tr><td data-label=\"구분\">상장 방식 5종</td><td data-label=\"핵심 내용\">신규 · 변경 · 추가 · 재상장 · 우회상장(합병 등으로 비상장법인 지분증권 상장)</td></tr><tr><td data-label=\"구분\">상장 요건</td><td data-label=\"핵심 내용\">자기자본 <strong>300억</strong>↑ · 상장주식수 <strong>100만주</strong>↑ · 일반주주 <strong>700명</strong>↑ · 지분 <strong>25%</strong>↑ 또는 500만주↑</td></tr><tr><td data-label=\"구분\">경영성과 요건</td><td data-label=\"핵심 내용\">매출 <strong>1,000억</strong>↑ 또는 시가총액 <strong>2,000억</strong>↑ · 설립 3년↑(코스닥 무) · 최근 감사 <strong>적정</strong>, 3개년 적정 또는 한정</td></tr><tr><td data-label=\"구분\">관리종목→상장폐지</td><td data-label=\"핵심 내용\">2년 연속 매출 50억↓ · 자본잠식 50%↑ · 감사 한정 · 일반주주 200인↓ · (반기 연속 거래량 1%↓도 폐지)</td></tr><tr><td data-label=\"구분\">당일공시</td><td data-label=\"핵심 내용\">사유 발생 <strong>당일 18:00 ~ 다음날 7:30</strong></td></tr><tr><td data-label=\"구분\">공정공시 예외</td><td data-label=\"핵심 내용\">언론 취재 응대 (제공 전 공시 불가능, 보도 시점에 전면 공개)</td></tr><tr><td data-label=\"구분\">위탁증거금 100%</td><td data-label=\"핵심 내용\">5만주 미만 매도주문 · 투자경고/투자위험 매수주문 · 미수동결계좌</td></tr></tbody></table></div><hr>", "quiz": [{"q": "모집과 매출의 차이는?", "a": "모집=<strong>새로 발행되는</strong> 증권의 취득청약 권유(<strong>발행인</strong>이 주체), 매출=<strong>이미 발행된</strong> 증권의 매도청약 권유(<strong>보유자</strong>가 주체)", "e": "주체 뒤바뀐 지문이 함정. 50인 산정 시 전문투자자·연고자는 제외."}, {"q": "총액인수와 잔액인수의 차이는?", "a": "잔액인수=미판매분만 인수, 총액인수=<strong>전량 인수</strong>", "e": "인수수수료율은 모집주선&lt;잔액인수&lt;총액인수. 우리나라 대부분은 총액인수 방식."}, {"q": "상장 준비단계에 해당하는 것은?", "a": "<strong>외부감사인 지정·명의개서대행 계약 체결·이사회(주주총회) 결의</strong>", "e": "상장예비심사 청구서 제출부터는 거래소가 관여하는 추진단계."}, {"q": "주주우선공모에서 청약 미달분이 발생하면?", "a": "<strong>일반공모</strong>", "e": "\"이사회 결의로 전문투자자 대상 제3자배정\"은 틀린 지문."}, {"q": "일반주주수와 자기자본의 상장 요건 숫자는?", "a": "<strong>일반주주 700명 이상, 자기자본 300억원 이상</strong>", "e": "500명 함정 주의. 일반주주 지분 25% 이상 또는 500만주 이상."}, {"q": "상장폐지 사유로 가장 거리가 먼 것은?", "a": "<strong>변경상장 사유</strong>", "e": "이는 매매거래정지 사유 문제. \"2년 연속\"이 붙는 것(매출 50억↓·자본잠식 50%↑·감사 한정·일반주주 200인↓)이 상장폐지 사유."}]}, {"id": "F6JuDDxLikY", "group": "유가증권시장·코스닥시장", "groupIndex": 0, "index": 6, "label": "최종핵심 문제풀이 ②", "title": "증권투자권유자문인력 최종핵심 문제풀이 '유가증권시장②'✨ 합격을 원하신 다면 꼭 보세요! ┃ 해커스금융 송영욱 교수님", "teacher": "송영욱", "nature": "문제풀이 ('유가증권시장①'편의 1~16번에 이어 17~31번 풀이)", "depth": "full", "video": "https://www.youtube.com/watch?v=F6JuDDxLikY", "badge": "", "content": "<h2 class=\"section-heading\">1. 시간외시장과 매매수량·호가단위 (문제 17·18)</h2><h3 class=\"subheading\">장전·장후 시간외시장의 시간 차이 (× 함정)</h3><ul><li><strong>장개시전 시간외시장</strong>: 호가접수시간 = 매매거래시간 (<strong>8:00~9:00</strong>, 같음)</li><li><strong>장종료후 시간외시장</strong>: 호가접수시간은 <strong>15:30~18:00</strong>이나 매매거래시간은 <strong>15:40~18:00</strong> → <strong>10분 차이</strong></li><li>15:30~15:40은 호가만 접수되고 매매(체결)는 안 됨</li><li>정규시장: 호가 주문은 <strong>8:30부터</strong> 가능하나 <strong>체결은 9:00부터</strong></li></ul><h3 class=\"subheading\">매매수량단위·호가가격단위</h3><ul><li>매매수량단위 <strong>1주</strong> (예외: <strong>ELW는 10주</strong> — 주가가 5원·10원짜리도 있어 금액이 너무 작기 때문. 과거 유가증권시장도 10주→1주로 변경됨)</li><li>호가가격단위: <strong>유가증권시장 7단계</strong>(1·5·10·50·100·500·1,000원), <strong>코스닥시장 5단계</strong>(100원까지)</li><li>암기 팁: \"<strong>공 세 개</strong>만 뛰면 호가가격단위\" — 1,000원 미만→1원, 5,000원 미만→5원, 1만원 미만→10원, 5만원 미만→50원, 10만원 미만→100원, 50만원 미만→500원, 50만원 이상→1,000원</li><li>주가 35,000원 → 5만원 미만이므로 <strong>50원</strong> (× 함정: 100원)</li></ul><hr><h2 class=\"section-heading\">2. 가격제한폭과 호가 종류 (문제 19·20)</h2><h3 class=\"subheading\">가격제한폭 ±30%</h3><ul><li>적용 대상: 주식·DR·ETF뿐 아니라 <strong>ETN·수익증권에도 적용</strong> (× 함정: \"ETN·수익증권에는 적용되지 않는다\"는 틀림)</li><li><strong>적용 제외 4종</strong>: <strong>정리매매 종목 · 주식워런트증권(ELW) · 신주인수권증서 · 신주인수권증권</strong></li><li><strong>레버리지 ETF</strong>: 배율만큼 가격제한폭 <strong>확대</strong> 적용</li></ul><h3 class=\"subheading\">호가(주문) 종류 — 시험 빈출 5종</h3><ul><li><strong>지정가</strong>: 가장 일반적. 종목·수량·가격 지정 (투자자가 원하는 <strong>최소한의 가격 수준</strong> 지정)</li><li><strong>시장가</strong>: 종목·수량은 지정, <strong>가격은 지정하지 않음</strong> — 시장에 나와 있는 대로 무조건 매수·매도</li><li><strong>조건부지정가</strong>: 장중에는 지정가, <strong>장 마감 10분 전(15:20)부터 시장가로 전환</strong></li><li>× 함정: \"주문 접수 시 <strong>상대방의 최우선호가</strong> 가격으로 지정되는 주문\"은 <strong>최유리지정가</strong>이지 최우선지정가가 아님</li><li><strong>선물옵션 최종거래일</strong>에는 프로그램매매를 위한 조건부지정가 호가 제출 <strong>금지</strong> (3:20에 선물이 종료되므로 3:20~3:30 조건부지정가 제출 불가)</li></ul><hr><h2 class=\"section-heading\">3. 단일가매매와 시간우선 원칙 예외 (문제 21·22)</h2><h3 class=\"subheading\">단일가매매 vs 접속매매(복수가매매)</h3><ul><li>일반 거래 = <strong>복수가매매 = 접속매매</strong>(여러 가격, 경쟁매매)</li><li>단일가매매 = 일정 시간 접수한 호가를 <strong>하나의 가격으로 집중 체결</strong> (예외적 거래)</li><li>단일가매매 대상·시간:</li><li><strong>장개시 최초가격(시가)</strong>: 30분 호가 접수 (8:30~9:00)</li><li><strong>시장 임시정지 후 재개시 최초가격</strong>: <strong>10분</strong> 호가 접수 (× 함정: 30분이 아님. 장 시작과 정리매매만 30분)</li><li><strong>CB 등 매매거래정지 후 재개시</strong>: 10분</li><li><strong>장종료시 가격(종가)</strong>: 10분 (15:20~15:30)</li><li><strong>정리매매·단기과열종목</strong>: <strong>30분 단위</strong> 단일가매매</li><li>단일가매매 체결: <strong>합치가격</strong>으로 체결우선순위에 따라 체결</li></ul><h3 class=\"subheading\">시간우선 원칙의 예외 — 동시호가 간주</h3><ul><li><strong>시가결정 시 상·하한가</strong>로 결정 → 동시호가로 간주, <strong>시간우선 원칙 배제</strong></li><li><strong>VI(변동성완화장치) 발동 시</strong>, <strong>전산장애·풍문 등으로 거래 중단 후 재개 시</strong>도 동시호가</li><li><strong>종가결정 시에는 해당되지 않음</strong> — 종가는 상한가여도 시간우선 원칙 적용 (× 함정)</li><li>함께 암기: 체결우선 원칙, <strong>위탁자우선원칙·수량우선원칙·접수우선원칙</strong></li></ul><hr><h2 class=\"section-heading\">4. 매매체결 특례 — 신규상장·정리매매·시간외 (문제 23·24·25)</h2><h3 class=\"subheading\">평가가격과 신규상장 종목의 호가 범위</h3><ul><li><strong>평가가격</strong>: 최초가격 결정을 위해 제출할 수 있는 호가 범위의 <strong>기준</strong>이 되는 가격</li><li><strong>신규상장 종목</strong>: 최초가격 결정을 위한 호가 범위 = 평가가격의 <strong>90~200%</strong> (일반 종목은 전일종가 ±30% = 70~130%)</li><li><strong>따상</strong> = 공모가 2배 + 상한가 = 최대 <strong>160% 수익</strong></li></ul><h3 class=\"subheading\">정리매매</h3><ul><li>상장폐지 확정 종목을 상장폐지 전 <strong>7일간</strong> 매매하게 해 환금 기회 부여</li><li><strong>30분 단위 단일가매매</strong>, <strong>가격제한폭 적용 배제</strong> (× 함정: \"정규시장 매매거래시간에 접속매매\"는 틀림)</li></ul><h3 class=\"subheading\">시간외시장 구분</h3><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>시간외 종가매매</th><th>시간외 단일가매매</th></tr></thead><tbody><tr><td data-label=\"구분\">체결 가격</td><td data-label=\"시간외 종가매매\"><strong>종가</strong>로만 거래</td><td data-label=\"시간외 단일가매매\">종가 기준 ±10% 범위에서 거래</td></tr><tr><td data-label=\"구분\">장전</td><td data-label=\"시간외 종가매매\">8:30~8:40 (전일종가)</td><td data-label=\"시간외 단일가매매\">—</td></tr><tr><td data-label=\"구분\">장후</td><td data-label=\"시간외 종가매매\">15:30~15:40 (당일종가)</td><td data-label=\"시간외 단일가매매\">—</td></tr><tr><td data-label=\"구분\">우선원칙</td><td data-label=\"시간외 종가매매\">가격 고정 → <strong>시간우선만</strong> 적용</td><td data-label=\"시간외 단일가매매\">—</td></tr></tbody></table></div><ul><li>시간외 종가매매의 <strong>총 30분</strong>: 장전 8:30~8:40 + 장후 15:40~16:00 (자막 기준)</li><li>\"가격 변동 범위 당일종가 ±10%\"는 시간외 <strong>단일가</strong>매매의 얘기 (× 함정)</li></ul><h3 class=\"subheading\">장중 대량·바스켓매매</h3><ul><li>회원이 신청하여 매매를 성립시키는 제도</li><li>체결가격 = <strong>당일 최고·최저가 범위 내</strong>에서 결정 (× 함정: \"호가접수 직전 형성된 가격\"은 틀림)</li><li>규모 요건: 매매수량단위의 <strong>5,000배 이상</strong> 또는 수량×가격 <strong>1억원 이상</strong></li><li>매매 체결 전까지 <strong>정정·취소 가능</strong></li></ul><hr><h2 class=\"section-heading\">5. 서킷브레이커스 vs 사이드카 (문제 26·27)</h2><h3 class=\"subheading\">서킷브레이커스 (CB) — 시험 단골</h3><ul><li>발동 효과: <strong>모든 종목</strong> 및 주식관련 선물옵션 거래 <strong>20분간 중단</strong> (× 함정: 30분이 아님)</li><li>발동 요건: 지수(코스피·코스닥 지수, 현물 기준)가 <strong>전일종가 대비 8%·15%·20% 이상 하락하여 1분간 지속</strong></li><li><strong>1일 1회만</strong> 발동 가능</li><li><strong>장종료 40분 전(14:50) 이후</strong>에는 발동 안 함</li><li><strong>20% 이상 하락</strong> 시에는 아예 <strong>장 종료</strong></li><li>발동 해제: 매매거래 정지 후 <strong>20분 경과</strong> → 매매 재개</li></ul><h3 class=\"subheading\">사이드카 (CB와 구분)</h3><ul><li>발동 기준: <strong>선물 가격</strong>(코스피200 선물 가격) 기준</li><li><strong>상·하 모두</strong> 적용 (CB는 하락 시에만)</li><li>해제: <strong>프로그램매매 호가 제출 5분 정지</strong> 후 재개 (CB는 시장 전체 20분)</li><li><strong>단기과열종목 지정</strong> → <strong>3일간 30분 단위 단일가매매</strong>로 체결</li></ul><h3 class=\"subheading\">신용·경고 관련 조치</h3><ul><li><strong>투자경고·투자위험종목</strong> 지정 → <strong>신용거래 제한 + 위탁증거금 100% 징수</strong> (+ 매매거래정지)</li></ul><hr><h2 class=\"section-heading\">6. 공정한 주가형성과 공매도·자기주식 (문제 28)</h2><ul><li>공정한 주가형성을 위한 제도: <strong>공매도 제한 · 자기주식 매매 제한 · 호가정보 공개</strong></li><li><strong>위탁증거금 제한</strong>은 결제이행 담보이지 공정한 주가형성과는 거리가 멈 (× 함정)</li><li><strong>무차익공매도 불허, 차익공매도만 허용</strong></li><li>자기주식 취득: 취득수량 한도 제한 없음(<strong>이익금 범위 내</strong>면 가능), 이사회 결의상 공시 후 <strong>익일부터 3개월 이내</strong>에 취득</li></ul><hr><h2 class=\"section-heading\">7. 배당락·권리락 (문제 29)</h2><ul><li><strong>배당락</strong> = 배당받을 권리 소멸 / <strong>권리락</strong> = 신주 받을 권리 소멸 (지문 뒤바뀜 주의)</li><li>12월 결산법인: <strong>12/31 휴장</strong> → 주주확정 실제 기준일은 <strong>12월 30일</strong></li><li>T+2 결제로 <strong>12월 28일까지 매수</strong>해야 12월 30일 주주 확정 (× 함정: \"12월 29일까지\")</li><li>배당락 <strong>기준가격 조정</strong> = <strong>주식배당의 경우에만</strong> 적용 (현금배당은 적용 안 됨)</li></ul><hr><h2 class=\"section-heading\">8. 청산·결제와 거래증거금 (문제 30·31)</h2><ul><li><strong>청산</strong>: 거래소가 <strong>중앙거래당사자(CCP)</strong> 로서 매도·매수자 간 채권채무를 <strong>차감</strong> 확정하고 결제 이행까지 <strong>보증</strong>하는 일련의 절차</li><li><strong>결제</strong>: 청산으로 확정된 CCP와 회원 간 채무를 증권 인도·대금지급으로 이행해 매매를 <strong>종결</strong></li><li>우리나라 결제 원칙: <strong>실물결제·차감결제·집중결제</strong> (× 함정: 현금결제·전량결제)</li><li>결제이행 재원: <strong>손해배상공동기금·결제적립금·거래소 자산·회원보증금</strong></li><li><strong>거래증거금 부과 대상</strong>: 상장주식·ELW·ETF (가격제한폭 15%→30% 확대가 도입 배경, <strong>순위험증거금 + 변동증거금</strong>)</li><li><strong>RP(환매조건부채권)</strong> 등 위험 적은 채권·국채는 부과 안 함 (× 함정)</li><li>위탁증거금 = 고객이 증권사에 납부 / 거래증거금 = 회원(증권사)이 거래소에 납부</li></ul><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">장후 시간외</td><td data-label=\"핵심 내용\">접수 15:30~18:00 / 체결 15:40~18:00 (10분 차이)</td></tr><tr><td data-label=\"구분\">호가단위</td><td data-label=\"핵심 내용\">유가 7단계 / 코스닥 5단계 (35,000원→<strong>50원</strong>)</td></tr><tr><td data-label=\"구분\">가격제한폭</td><td data-label=\"핵심 내용\">±30% (ETN·수익증권도 적용) / 제외 4종(정리매매·ELW·신주인수권증서·신주인수권증권) / 레버리지ETF 확대</td></tr><tr><td data-label=\"구분\">단일가 시간</td><td data-label=\"핵심 내용\">장개시 30분 / 임시정지 재개·CB재개·종가 10분 / 정리매매·단기과열 30분</td></tr><tr><td data-label=\"구분\">시간우선 예외</td><td data-label=\"핵심 내용\">시가 상·하한가→동시호가 / VI·거래중단재개도 / <strong>종가 제외</strong></td></tr><tr><td data-label=\"구분\">신규상장 호가범위</td><td data-label=\"핵심 내용\">평가가격 <strong>90~200%</strong> (일반 70~130%) / 따상=160%</td></tr><tr><td data-label=\"구분\">시간외 종가</td><td data-label=\"핵심 내용\">장전 8:30~8:40(전일종가) · 장후 15:30~15:40(당일종가), 시간우선만</td></tr><tr><td data-label=\"구분\">CB</td><td data-label=\"핵심 내용\">8%·15%·20% 하락 1분 지속 → <strong>20분 중단</strong> / 1일 1회 / 14:50 이후 불가 / 20%↓는 장 종료</td></tr><tr><td data-label=\"구분\">사이드카</td><td data-label=\"핵심 내용\">선물 기준 · 상하 모두 · 프로그램매매 호가제출 5분 정지</td></tr><tr><td data-label=\"구분\">경고·위험종목</td><td data-label=\"핵심 내용\">신용거래 제한 + 위탁증거금 100% 징수</td></tr><tr><td data-label=\"구분\">공매도</td><td data-label=\"핵심 내용\">무차익 불허, 차익만 허용 / 자기주식 3개월 이내 취득</td></tr><tr><td data-label=\"구분\">배당락</td><td data-label=\"핵심 내용\">12월 기준일=<strong>12/30</strong>, 매수는 <strong>12/28까지</strong> / 기준가격 조정은 주식배당만</td></tr><tr><td data-label=\"구분\">청산·결제</td><td data-label=\"핵심 내용\">실물·차감·집중 / 재원 4종 / CCP 보증</td></tr><tr><td data-label=\"구분\">거래증거금</td><td data-label=\"핵심 내용\">상장주식·ELW·ETF (RP 등 저위험 채권 제외)</td></tr></tbody></table></div><hr>", "quiz": [{"q": "장종료후 시간외시장에서 호가 접수와 매매 체결 시간의 차이는?", "a": "<strong>접수는 15:30부터, 체결은 15:40부터</strong> (10분간은 접수만)", "e": "장개시전 시간외(8:00~9:00)는 접수=체결 시간이 같다."}, {"q": "가격제한폭이 적용되지 않는 4종은?", "a": "<strong>정리매매 종목·ELW·신주인수권증서·신주인수권증권</strong>", "e": "주식·DR·ETF·ETN·수익증권에는 모두 적용. 레버리지 ETF는 배율만큼 확대."}, {"q": "단일가매매 호가 접수 시간이 10분인 경우는?", "a": "<strong>시장 임시정지 후 재개·CB 후 재개·종가 결정</strong>", "e": "장개시(시가)·정리매매·단기과열종목만 30분."}, {"q": "시간우선 원칙이 배제되는 경우(동시호가)는?", "a": "<strong>시가결정 시 상·하한가, VI 발동, 전산장애·풍문 등 거래중단 후 재개</strong>", "e": "종가결정 시에는 상한가여도 시간우선 원칙 적용됨."}, {"q": "서킷브레이커스 발동 요건과 효과는?", "a": "지수 <strong>8%·15%·20% 이상 하락 1분 지속</strong> → <strong>20분간 거래 중단</strong>", "e": "1일 1회, 14:50 이후 불가, 20% 하락 시 장 종료. 사이드카는 선물 기준·상하 모두·5분간 프로그램매매 호가정지."}, {"q": "배당락과 권리락의 차이는?", "a": "배당락=<strong>배당</strong> 권리 소멸, 권리락=<strong>신주</strong> 권리 소멸", "e": "12월 결산법인은 12/31 휴장이므로 12/28까지 매수 → 12/30 주주 확정. 기준가격 조정은 주식배당에만."}]}, {"id": "Jq3Y9wzmUis", "group": "자본시장법", "groupIndex": 1, "index": 1, "label": "기출문제 풀이 ①", "title": "[증권투자권유자문인력 기출] 기출문제 풀이 '자본시장법 ①'ㅣ해커스 투자권유자문인력", "teacher": "자막에서 강사명 확인 불가 (해커스 투자권유자문인력)", "nature": "기출풀이 (문제 1~3번 풀이)", "depth": "full", "video": "https://www.youtube.com/watch?v=Jq3Y9wzmUis", "badge": "", "content": "<h2 class=\"section-heading\">1. 자본시장법 제정의 특징 (문제 1)</h2><h3 class=\"subheading\">열거주의 → 포괄주의 (× 함정: \"열거주의 채택\"은 틀림)</h3><ul><li>예전: <strong>열거주의</strong> — 법에서 열거한 상품만 판매 가능 (10가지 정도 정해놓고 그 상품만)</li><li>지금: <strong>포괄주의</strong> — 법에서 <strong>금지하지 않으면 다 판매 가능</strong> (신상품 대응)</li></ul><h3 class=\"subheading\">기관별 규제 → 기능별 규제</h3><ul><li>예전: 은행법·증권거래법·보험법 따로 (기관별 규제)</li><li>지금: <strong>기능이 같으면 같은 법으로 규제</strong> (예: 은행도 펀드 판매 → 자본시장법)</li></ul><h3 class=\"subheading\">업무 범위 확대 + 투자자 보호 강화</h3><ul><li>업무 범위: <strong>확대</strong> (은행도 펀드·방카슈랑스 판매)</li><li>투자자 보호: <strong>강화</strong> (금융상품이 많아지고 복잡해져서 설명의무·적합성 등 강화)</li><li>→ 정답: 1번 (열거주의 채택이 틀린 지문)</li></ul><hr><h2 class=\"section-heading\">2. 금융투자상품의 요건과 손해배상 산정 (문제 2)</h2><h3 class=\"subheading\">금융투자상품 요건 3가지 (가장 중요한 것은 3번째)</h3><ol><li>이익을 얻거나 <strong>손실을 회피할 목적</strong> (투자 목적이 반드시 있어야)</li><li>권리 취득 (실물이 아닌 권리)</li><li><strong>투자성 = 원금손실 가능성</strong> (법적 표현: \"<strong>투자금액이 회수금액을 초과하게 될 위험</strong>\")</li></ol><ul><li>투자금액 &gt; 회수금액 = 원금을 까먹을 수 있다는 뜻</li></ul><h3 class=\"subheading\">손해배상금 산정 방식 (계산 문제)</h3><ul><li>손해배상금 = <strong>투자금액 − 회수금액</strong></li><li><strong>투자금액 산정 시 판매수수료는 제외(뺌)</strong> (× 함정: \"포함해야 된다\"는 틀림)</li><li><strong>회수금액 산정 시 환매수수료와 세금은 포함(더함)</strong> (회수금액에 환매수수료·세금 합산)</li><li>예: 1억원 투자(판매수수료 100만원) → 투자금액 9,900만원 / 회수 7,000만원(환매수수료 200만 + 세금 100만) → 회수금액 7,300만원 → <strong>손해배상금 = 2,600만원</strong></li><li>→ 정답: 3번</li></ul><hr><h2 class=\"section-heading\">3. 금융투자상품의 분류 (문제 3)</h2><h3 class=\"subheading\">증권 vs 파생상품의 구분 기준</h3><ul><li>원금손실 가능 여부에 따라: 금융투자상품(원금손실 가능) vs 비금융투자상품</li><li>금융투자상품 내부 구분:</li><li><strong>증권</strong> = <strong>추가 지급의무가 없음</strong> (원금까지만 깨짐 — 1억 투자해도 1억까지만 손실)</li><li><strong>파생상품</strong> = <strong>추가 지급의무가 있음</strong> (원금초과손실 가능 — 1억 투자해서 3억 깨질 수 있음)</li></ul><h3 class=\"subheading\">증권 6가지 (암기)</h3><ol><li><strong>채무증권</strong> (보통 채권)</li><li><strong>지분증권</strong></li><li><strong>수익증권</strong></li><li><strong>파생결합증권</strong> (ELS·DLS — 파생상품이 아니라 <strong>증권</strong>에 속함!)</li><li><strong>투자계약증권</strong></li><li><strong>증권예탁증권</strong> (DR)</li></ol><h3 class=\"subheading\">파생상품</h3><ul><li><strong>장내파생상품</strong>: 선물·옵션 (대표적)</li><li><strong>장외파생상품</strong>: 선도·스왑 (대표적)</li></ul><h3 class=\"subheading\">금융투자상품에서 제외되는 3가지 (암기)</h3><ol><li><strong>CD</strong> (양도성예금증서)</li><li><strong>관리신탁의 수익권</strong> (현상유지 성격)</li><li><strong>주식매수선택권(스톡옵션)</strong></li></ol><ul><li>→ 요건상으로는 해당하지만 법에서 제외. 원금손실 가능성이 극히 낮아 설명의무·적합성을 적용하지 않아도 됨</li><li>→ 정답: 1번</li></ul><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">자본시장법 특징</td><td data-label=\"핵심 내용\"><strong>포괄주의</strong>(금지하지 않으면 다 가능) · <strong>기능별 규제</strong> · 업무범위 확대 · 투자자 보호 강화</td></tr><tr><td data-label=\"구분\">금융투자상품 요건</td><td data-label=\"핵심 내용\">목적(이익/손실회피) · 권리 취득 · <strong>투자성=원금손실 가능성</strong>(투자금액이 회수금액을 초과할 위험)</td></tr><tr><td data-label=\"구분\">손해배상 산정</td><td data-label=\"핵심 내용\">투자금액−회수금액 / 투자금액 산정 시 <strong>판매수수료 제외</strong> / 회수금액 산정 시 <strong>환매수수료·세금 포함</strong></td></tr><tr><td data-label=\"구분\">증권 vs 파생</td><td data-label=\"핵심 내용\">증권=<strong>추가 지급의무 없음</strong>(원금까지 손실) / 파생=추가 지급의무 있음(초과손실 가능)</td></tr><tr><td data-label=\"구분\">증권 6종</td><td data-label=\"핵심 내용\">채무 · 지분 · 수익 · <strong>파생결합</strong> · 투자계약 · 증권예탁(DR)</td></tr><tr><td data-label=\"구분\">파생상품</td><td data-label=\"핵심 내용\">장내: 선물·옵션 / 장외: 선도·스왑</td></tr><tr><td data-label=\"구분\">제외 3종</td><td data-label=\"핵심 내용\"><strong>CD · 관리신탁 수익권 · 스톡옵션</strong></td></tr></tbody></table></div><hr>", "quiz": [{"q": "자본시장법 제정 이전과 비교해 바뀐 나열 방식은?", "a": "<strong>열거주의 → 포괄주의</strong>", "e": "법에서 금지하지 않는 상품은 모두 판매 가능. 기관별 규제 → 기능별 규제로도 바뀜."}, {"q": "손해배상금을 산정할 때 투자금액은 어떻게 정하는가?", "a": "투자금액에서 <strong>판매수수료는 제외</strong>", "e": "회수금액 산정 시에는 환매수수료와 세금을 포함. 예: 1억 투자−판매수수료 100만=9,900만원."}, {"q": "증권과 파생상품의 구분 기준은?", "a": "<strong>추가 지급의무</strong>(=원금초과손실 가능성) 유무", "e": "증권은 원금까지만 손실, 파생상품은 원금을 초과해 손실 가능."}, {"q": "파생결합증권은 증권인가 파생상품인가?", "a": "<strong>증권</strong>", "e": "ELS·DLS가 대표적. 이름에 '파생'이 들어가지만 원금은 초과손실되지 않으므로 증권 분류."}, {"q": "금융투자상품에서 제외되는 3가지는?", "a": "<strong>CD · 관리신탁 수익권 · 스톡옵션</strong>", "e": "원금손실 가능성이 극히 낮아 설명의무·적합성 적용 제외."}]}, {"id": "ACJ0yD8f-zw", "group": "자본시장법", "groupIndex": 1, "index": 2, "label": "2탄", "title": "[증권투자권유자문인력 자격증 요약] 기출문제 풀이 '자본시장법 2탄'ㅣ해커스 송영욱", "teacher": "송영욱", "nature": "기출풀이 (자본시장법 1탄의 문제 1~3번에 이어 문제 4~6번 풀이)", "depth": "full", "video": "https://www.youtube.com/watch?v=ACJ0yD8f-zw", "badge": "", "content": "<h2 class=\"section-heading\">1. 증권 6종의 의의 (문제 4)</h2><h3 class=\"subheading\">증권 6가지와 쉬운 이해</h3><ol><li><strong>채무증권</strong> = 채권 (국가 발행→국채, 회사 발행→회사채, 법적 명칭)</li><li><strong>지분증권</strong> = 주식 (회사의 지분)</li><li><strong>수익증권</strong> = 펀드 (펀드의 법적 명칭)</li><li><strong>파생결합증권</strong> = ELS·DLS·ELW 등 외생적 지수 연계 증권</li><li><strong>투자계약증권</strong> = 조합 형태의 소규모 펀드 (타인과의 공동사업, 이익 배분)</li><li><strong>증권예탁증권</strong> = <strong>DR</strong> (외국회사 주식의 예탁 증서, 주식과 동일한 가치)</li></ol><h3 class=\"subheading\">DR의 이해</h3><ul><li>외국회사(예: 미국 K회사)가 한국에서 상장하는 경우: 실제 주식은 미국에 두고, 주식 증서만 <strong>한국예탁결제원</strong>에 맡김</li><li>이 증서가 주식과 <strong>동일한 가치</strong>를 가짐 → 매매할 때마다 주식을 주고받을 필요가 없음</li></ul><h3 class=\"subheading\">파생결합증권 해당 여부 (× 함정)</h3><ul><li><strong>ETF는 파생결합증권이 아님</strong> — 끝자리 F는 Fund(펀드) = <strong>수익증권</strong>에 해당 → 정답 4번</li><li>(참고: ELS·DLS·ELW는 파생결합증권, ETF는 수익증권)</li></ul><hr><h2 class=\"section-heading\">2. 파생상품의 개념 — 선물·선도·옵션·스왑 (문제 5)</h2><h3 class=\"subheading\">키워드 암기법 (강사 팁)</h3><ul><li>\"<strong>인도</strong>\"라는 말이 들어가면 → <strong>선물 / 선도</strong></li><li>선물 = <strong>장내</strong>에서 기초자산의 매매대금·이자 등을 <strong>장래 특정 시점에 인도할 것을 약정</strong>하는 계약</li><li>선도 = 개념은 선물과 <strong>똑같음</strong>, 차이는 <strong>장외</strong>에서 거래된다는 것뿐</li><li>\"<strong>권리</strong>\"라는 말이 들어가면 → <strong>옵션</strong></li><li>옵션 = 기초자산에 의해 산출된 금전 등을 거래시킬 수 있는 <strong>권리를 부여</strong>하는 것을 약정하는 계약</li><li>(× 함정: \"기초자산에 의해 산출된 금전 등을 거래시킬 수 있는 권리를 부여...\"는 파생결합증권이 아니라 <strong>옵션</strong>의 설명 → 정답 3번)</li><li>\"<strong>교환</strong>\"이라는 말이 들어가면 → <strong>스왑</strong></li><li>스왑 = 기초자산에 의해 산출된 금전을 <strong>일정 기간 교환할 것을 약정</strong>하는 계약</li></ul><hr><h2 class=\"section-heading\">3. 금융투자업 6종 (문제 6)</h2><h3 class=\"subheading\">금융투자업 6종</h3><ol><li><strong>투자매매업</strong></li><li><strong>투자중개업</strong></li><li><strong>집합투자업</strong></li><li><strong>신탁업</strong></li><li><strong>투자자문업</strong></li><li><strong>투자일임업</strong></li></ol><ul><li>(+ 종합금융투자업·온라인소액투자중개업을 더하면 8종)</li></ul><h3 class=\"subheading\">핵심 구분: 자기 계산 vs 타인 계산</h3><ul><li><strong>투자매매업 = 자기 계산</strong> (지문: \"누구의 명의로 하든지 자기의 계산으로\")</li><li>증권사 <strong>자기 돈</strong>으로 매매 → 손익은 <strong>증권사 귀속</strong> (예: A증권사가 자기 돈 100억으로 삼성전자 주식 매매, 이익 10억도 A증권사 몫)</li><li><strong>투자중개업 = 타인 계산</strong> (지문: \"타인에게...\" 또는 \"위탁자\")</li><li>고객(위탁자) 돈으로 매매 → 손익은 <strong>고객 귀속</strong>, 증권사는 수수료만</li></ul><h3 class=\"subheading\">나머지 4종의 의의</h3><ul><li><strong>집합투자업</strong>: <strong>2인 이상의 투자자</strong>로부터 자금을 모아 투자하는 것을 영업으로 (펀드 운용)</li><li><strong>신탁업</strong>: 신탁을 영업으로 (시험 비중 낮음)</li><li><strong>투자자문업</strong>: 기업 가치 판단 등을 위한 <strong>자문</strong>을 영업으로</li><li><strong>투자일임업</strong>: 고객으로부터 투자자산을 <strong>일임받아 운용</strong>하는 것을 영업으로</li><li>→ 정답: 1번 (투자매매업)</li></ul><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">증권 6종</td><td data-label=\"핵심 내용\">채무(채권) · 지분(주식) · 수익(펀드) · <strong>파생결합</strong>(ELS·DLS·ELW) · 투자계약(조합) · 증권예탁(DR)</td></tr><tr><td data-label=\"구분\">ETF</td><td data-label=\"핵심 내용\"><strong>수익증권</strong> (파생결합증권 아님)</td></tr><tr><td data-label=\"구분\">DR</td><td data-label=\"핵심 내용\">외국회사가 국내 상장 시 실물은 본국에, 증서만 예탁결제원에 — 주식과 동일 가치</td></tr><tr><td data-label=\"구분\">파생 키워드</td><td data-label=\"핵심 내용\">인도=<strong>선물/선도</strong>(장내/장외) · 권리=<strong>옵션</strong> · 교환=<strong>스왑</strong></td></tr><tr><td data-label=\"구분\">투자매매업</td><td data-label=\"핵심 내용\"><strong>자기 계산</strong> (증권사 돈으로 매매, 손익 증권사 귀속)</td></tr><tr><td data-label=\"구분\">투자중개업</td><td data-label=\"핵심 내용\"><strong>타인 계산</strong> (고객 돈으로 매매, 손익 고객 귀속)</td></tr><tr><td data-label=\"구분\">집합투자업</td><td data-label=\"핵심 내용\">2인 이상 자금 모아 투자 (펀드)</td></tr><tr><td data-label=\"구분\">투자일임업</td><td data-label=\"핵심 내용\">고객 자산 일임받아 운용 / 투자자문업은 가치판단 자문</td></tr></tbody></table></div><hr>", "quiz": [{"q": "ETF는 증권 6종 중 무엇에 해당하는가?", "a": "<strong>수익증권</strong>", "e": "끝자리 F=펀드. ELS·DLS·ELW는 파생결합증권이지만 ETF는 수익증권이므로 파생결합증권이 아님."}, {"q": "선물과 선도의 차이는?", "a": "<strong>장내 vs 장외</strong>", "e": "개념은 동일(장래 특정 시점에 인도 약정). \"인도\" 키워드는 선물·선도, \"권리\"는 옵션, \"교환\"은 스왑."}, {"q": "\"기초자산에 의해 산출된 금전 등을 거래시킬 수 있는 권리를 부여하는 것을 약정하는 계약\"은?", "a": "<strong>옵션</strong>", "e": "파생결합증권이 아님에 주의."}, {"q": "\"누구의 명의로 하든지 자기의 계산으로\" 금융투자상품의 매매 등을 영업으로 하는 업은?", "a": "<strong>투자매매업</strong>", "e": "타인의 계산이면 투자중개업. 자기 돈으로 사서 손익이 증권사 귀속이면 매매업."}, {"q": "증권예탁증권(DR)이란?", "a": "외국회사 주식의 <strong>예탁 증서</strong>, 주식과 동일한 가치", "e": "외국회사가 국내 상장할 때 실물은 본국에 두고 증서만 예탁결제원에 맡긴 것."}]}, {"id": "3RzQ1tAp7M0", "group": "자본시장법", "groupIndex": 1, "index": 3, "label": "3탄", "title": "[증권투자권유자문인력 독학 시험] 기출문제 풀이🙌 '자본시장법 3탄'ㅣ해커스 송영욱", "teacher": "송영욱", "nature": "기출풀이", "depth": "full", "video": "https://www.youtube.com/watch?v=3RzQ1tAp7M0", "badge": "", "content": "<h2 class=\"section-heading\">1. 온라인소액투자중개업의 등록 요건 (증권형 크라우드펀딩)</h2><ul><li><strong>등록 요건 중 핵심 숫자: 자기자본 5억원 이상</strong> — 일반 투자중개업보다 요건이 훨씬 낮지만, 이것과 혼동하면 안 되는 함정 지문(3억원 등)이 자주 나옴.</li><li>다른 요건: ① 상법상 주식회사 또는 영업소 설치 외국 온라인투자중개업자 ② 사업계획의 타당성·건전성 ③ 투자자 보호 가능 + 업무 수행에 충분한 인력·전산·물적 장비.</li><li><strong>온라인소액투자중개업 = 등록 대상 / 일반 투자중개업 = 인가 대상</strong> — 인가 대상 일반 투자중개업의 자기자본 요건은 온라인소액투자중개업보다 훨씬 더 높게 강화되어 있음.</li></ul><h2 class=\"section-heading\">2. 온라인소액투자중개업자의 영업행위 규제 — 허용되는 청약권유 행위 4가지</h2><ul><li>청약권유는 원칙적으로 제한되며, 다음 <strong>4가지만 허용</strong>:</li></ul><ol><li>투자광고를 <strong>자신의 홈페이지에 게시</strong>하는 행위</li><li>발행인의 발언(게재 내용)을 자신의 홈페이지에 게시하는 행위</li><li>자신의 홈페이지를 통한 투자자 회원의 모집·관리 행위</li><li>발행인이 게재한 내용을 <strong>특정 투자자에게 전송</strong>하는 행위</li></ol><ul><li>이 4가지 이외의 청약권유는 불가.</li></ul><h2 class=\"section-heading\">3. 전문투자자 3분류 (투자자 구분 — 압도적 출제)</h2><ul><li>자본시장법은 투자자를 <strong>일반투자자 vs 전문투자자</strong>로 구분하고 <strong>차등 보호</strong> (일반투자자를 더 많이 보호). 차별이 아닌 차등 보호.</li><li><strong>절대적 전문투자자</strong>: 국가·정부·금융기관 등 — 어떤 경우에도 일반투자자로 전환 불가.</li><li><strong>상대적 전문투자자</strong>: 주권상장법인, 지방자치단체, 기금관리운영법인, 공익사업법인 — 본인이 신청하면 일반투자자로 전환 가능 (일반투자자 수준의 보호 — 적합성·적정성·설명의무 적용 — 를 받고 싶을 때).</li><li><strong>자발적 전문투자자</strong>: 원래 일반투자자인데 스스로 전문투자자 지위를 신청하는 경우 (전문투자형 사모펀드 가입 목적 등).</li><li>개인의 자발적 전문투자자 요건 (<strong>2019.12.5 개정 반영</strong>):</li><li><strong>공통: 금융투자상품 잔고 5,000만원 이상</strong> (종전 5억원에서 하향)</li><li>＋ 다음 중 하나: ① 연소득 <strong>1억원</strong> 이상 (부부합산 1.5억원, 부동산 임대소득 제외) ② 순자산 <strong>5억원</strong> 이상 (종전 10억원에서 하향) ③ 변호사·회계사 등 <strong>전문성 요건</strong>.</li><li>교재·문제집에 개정 전 수치(5억/10억)로 적힌 것은 개정 법 미반영이므로 틀림.</li><li>일반투자자에게만 적용되는 보호: <strong>적합성 원칙·적정성 원칙·설명의무</strong> — 전문투자자에게는 적용되지 않음.</li></ul><h2 class=\"section-heading\">4. 인가 대상 vs 등록 대상 금융투자업</h2><ul><li><strong>인가 대상 4가지</strong>: 투자매매업, 투자중개업, 집합투자업, 신탁업 — 금융위원회 인가 필요, 투자자 보호가 강해 요건이 까다로움.</li><li><strong>등록 대상 4가지</strong>: 투자자문업, 투자일임업, <strong>온라인소액투자중개업</strong>, <strong>전문사모집합투자업</strong> — \"전문\"이 붙으면 등록.</li><li>암기 포인트: 투자중개업은 인가 대상이지만 <strong>온라인소액투자중개업은 등록 대상</strong>, 신탁업은 인가 대상이지만 <strong>전문사모집합투자업은 등록 대상</strong> (집합투자업은 인가 대상).</li><li>인가 요건 중 핵심:</li><li><strong>자기자본 요건: 5억원과 대통령령으로 정하는 금액 중 큰 금액 이상</strong> (\"작은 금액\"이 아닌 \"큰 금액\" — 함정).</li><li><strong>최소 전문인력: 투자권유자문인력 5인 이상</strong> (인가 기준).</li></ul><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">온라인소액투자중개업</td><td data-label=\"핵심 내용\"><strong>등록 대상</strong>, 자기자본 <strong>5억원</strong> 이상</td></tr><tr><td data-label=\"구분\">청약권유 허용 행위</td><td data-label=\"핵심 내용\">자사 홈페이지 게시, 발행인 게재내용 홈페이지 게시, 홈페이지 통한 회원 모집·관리, 특정 투자자에게 전송 — 4가지만</td></tr><tr><td data-label=\"구분\">절대적 전문투자자</td><td data-label=\"핵심 내용\">국가·금융기관 등, <strong>일반투자자로 전환 불가</strong></td></tr><tr><td data-label=\"구분\">상대적 전문투자자</td><td data-label=\"핵심 내용\">주권상장법인·지자체·기금운영법인·공익사업법인, 신청 시 전환 가능</td></tr><tr><td data-label=\"구분\">자발적 전문투자자(개인)</td><td data-label=\"핵심 내용\">잔고 5천만원＋(연소득 1억 or 순자산 5억 or 전문성) — 2019.12.5 개정</td></tr><tr><td data-label=\"구분\">차등보호 내용</td><td data-label=\"핵심 내용\">적합성·적정성 원칙, 설명의무는 일반투자자에게만</td></tr><tr><td data-label=\"구분\">인가 대상 4종</td><td data-label=\"핵심 내용\">투자매매·투자중개·집합투자·신탁업</td></tr><tr><td data-label=\"구분\">등록 대상 4종</td><td data-label=\"핵심 내용\">투자자문·투자일임·온라인소액투자중개·전문사모집합투자업</td></tr><tr><td data-label=\"구분\">인가 자기자본 요건</td><td data-label=\"핵심 내용\">5억원과 대통령령 금액 중 <strong>큰</strong> 금액 이상</td></tr><tr><td data-label=\"구분\">인가 전문인력 요건</td><td data-label=\"핵심 내용\">투자권유자문인력 <strong>5인</strong> 이상</td></tr></tbody></table></div>", "quiz": [{"q": "온라인소액투자중개업의 등록 요건과 거리가 먼 것은?", "a": "\"자기자본 3억원 이상일 것\"", "e": "<strong>5억원 이상</strong>이 맞으며, 3억원은 함정 수치."}, {"q": "절대적 전문투자자에 해당하지 않는 자는?", "a": "주권상장법인(상대적)", "e": "절대적은 국가·정부·금융기관 등으로 전환 불가, 주권상장법인·지자체 등은 상대적."}, {"q": "인가 대상 금융투자업이 아닌 것은?", "a": "투자일임업", "e": "인가는 매매·중개·집합·신탁, 자문·일임·온라인소액·전문사모는 등록 대상."}, {"q": "개정 법 기준 개인 자발적 전문투자자의 잔고 요건은?", "a": "금융투자상품 잔고 <strong>5,000만원</strong> 이상", "e": "2019.12.5 개정으로 5억원→5,000만원, 순자산 10억→5억원으로 하향."}, {"q": "온라인소액투자중개업자의 영업행위 규제상 허용되는 청약권유 행위가 아닌 것은?", "a": "홈페이지 이외의 수단(광고성 이메일 등) 통한 청약권유", "e": "허용 4가지(자사 홈페이지 게시·회원 모집관리·특정 투자자 전송 등) 이외는 불가."}]}, {"id": "hLEe7Eh2zIM", "group": "자본시장법", "groupIndex": 1, "index": 4, "label": "4탄", "title": "[증권투자권유자문인력 핵심 후기] 기출문제 풀이🙌 '자본시장법 4탄'ㅣ해커스 송영욱", "teacher": "송영욱", "nature": "기출풀이", "depth": "full", "video": "https://www.youtube.com/watch?v=hLEe7Eh2zIM", "badge": "", "content": "<h2 class=\"section-heading\">1. 금융투자업의 등록 (투자자문업·투자일임업)</h2><ul><li>금융투자업자가 <strong>투자자문업·투자일임업</strong>을 하려면 금융위원회에 <strong>등록</strong>해야 함 (인가 아님 — \"인가\"라는 말 자체가 함정).</li><li><strong>임원의 요건</strong>은 인가 대상 금융투자업의 임원 요건과 동일.</li><li><strong>금융투자전문인력 요건</strong> — 인가(5인 이상)와 가장 큰 차이점:</li><li>투자자문업: <strong>1인</strong> 이상</li><li>투자일임업: <strong>2인</strong> 이상</li><li>두 가지 모두 하는 경우: <strong>3인</strong> 이상</li><li>\"3인 이상\"이 투자자문업 요건이라는 지문은 틀림.</li></ul><h2 class=\"section-heading\">2. 금융투자업자의 건전성 규제</h2><ul><li>건전성 규제의 취지: 금융기관의 <strong>재무구조 건전성</strong> 확보 — 고객이 맡긴 돈을 언제든 돌려줄 수 있어야 하므로.</li><li><strong>자산건전성 분류 5단계</strong>: 정상 → 요주의 → 고정 → 회수의문 → 추정손실.</li><li><strong>대손충당금 적립비율</strong>: 고정 분류 자산은 <strong>20%</strong> (요주의 2%, 회수의문 75%, 추정손실 100%).</li><li><strong>순자본비율</strong>은 <strong>최소 일별</strong>로 산정해야 함.</li><li><strong>적기시정조치</strong> — 순자본비율에 따라 조치 강도가 달라짐:</li><li>100% 미만: <strong>경영개선권고</strong></li><li>50% 미만: <strong>경영개선요구</strong></li><li>0% 미만: <strong>경영개선명령</strong></li><li>\"50% 이상 100% 미만이면 경영개선명령\"이라는 지문은 틀림 (이 구간은 권고).</li><li>순자본 산정 원칙: 자산·부채는 <strong>연결재무제표상 장부가액</strong> 기재 / 영업용순자본 감산 항목은 원칙적으로 <strong>위험액을 산정하지 않음</strong>.</li><li><strong>총위험액 = 시장위험 + 신용위험 + 운영위험</strong>의 합.</li></ul><h2 class=\"section-heading\">3. 대주주 거래 제한 (대주주·계열사 거래 규제 3가지)</h2><ul><li><strong>① 대주주가 발행한 증권 소유 금지</strong>: 금융투자업자는 대주주 또는 특수관계인이 발행한 증권을 <strong>소유할 수 없는 것이 원칙</strong> (대주주가 주가 부양 등으로 부당 이익을 취하는 것을 원천 차단).</li><li><strong>② 계열회사 발행 증권 소유 한도</strong>: 계열회사가 발행한 주식·채권은 취득 가능하지만 <strong>8%를 초과하여 소유 불가</strong>. 8%까지 소유하더라도 <strong>전원(전원의 찬성)</strong> 을 받아야 가능.</li><li>\"자기자본의 3%를 초과하여 소유할 수 없다\"는 지문은 틀림 — <strong>8%</strong>가 정답.</li><li><strong>③ 신용공여 금지</strong>: 금융투자업자 또는 대주주는 대주주·특수관계인에게 신용공여(대출)를 하는 것도, 받는 것도 <strong>금지</strong> (쌍방 금지).</li><li><strong>④ 부당한 영향력 행사</strong>: 대주주가 통상적 거래조건과 다른 조건으로 자신 또는 제3자와의 거래를 요구하는 행위 금지.</li><li>대주주의 부당한 영향력 행사 혐의가 인정되면 금융투자업자·대주주에게 <strong>자료 제출 요구</strong> 가능.</li></ul><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">등록 전문인력</td><td data-label=\"핵심 내용\">투자자문업 <strong>1인</strong> 이상, 투자일임업 <strong>2인</strong> 이상, 둘 다 하면 <strong>3인</strong> 이상</td></tr><tr><td data-label=\"구분\">자산건전성 분류</td><td data-label=\"핵심 내용\">정상·요주의·고정·회수의문·추정손실 5단계</td></tr><tr><td data-label=\"구분\">대손충당금</td><td data-label=\"핵심 내용\">요주의 2%, <strong>고정 20%</strong>, 회수의문 75%, 추정손실 100%</td></tr><tr><td data-label=\"구분\">순자본비율 산정 주기</td><td data-label=\"핵심 내용\">최소 <strong>일별</strong></td></tr><tr><td data-label=\"구분\">적기시정조치</td><td data-label=\"핵심 내용\">100% 미만 권고 / 50% 미만 요구 / 0% 미만 명령</td></tr><tr><td data-label=\"구분\">대주주 발행 증권</td><td data-label=\"핵심 내용\">소유 <strong>금지</strong> (원칙)</td></tr><tr><td data-label=\"구분\">계열회사 발행 증권</td><td data-label=\"핵심 내용\"><strong>8%</strong> 초과 소유 불가, 소유 시 전원 찬성 필요</td></tr><tr><td data-label=\"구분\">신용공여</td><td data-label=\"핵심 내용\">대주주·특수관계인에게 하는 것·받는 것 모두 금지</td></tr><tr><td data-label=\"구분\">순자본 산정</td><td data-l
