</strong>(외부자지만 미공개 중요정보 취득자, 예: 제휴 과정에서 정보를 알게 된 타사 사장) 모두 규제</li><li><strong>시장질서 교란행위 규제</strong>: 1차 정보수령자를 넘어 <strong>다차(2·3·4차) 정보수령자</strong>, 미공개 중요정보를 <strong>전달한 자</strong>까지 제재 대상으로 확대하는 별도 규정</li><li>불공정거래 규제는 <strong>목적성</strong>(목적)이 있어야 처벌 가능</li></ul><h2 class=\"section-heading\">5. 비밀정보 보호 (10번 문제)</h2><ul><li><strong>미공개 정보도 비밀정보에 해당</strong> (기록 형태·유무와 무관 — \"해당되지 않는다\"는 틀린 지문)</li><li>비밀정보 제공: <strong>필요성이 인정되는 경우 사전승인 절차</strong> 거침</li><li>제공자는 권한 없는 자에게 전달되지 않도록 <strong>성실한 주의의무</strong></li><li>제공받는 자: <strong>목적 외 사용 및 타인 사용 금지</strong></li></ul><h2 class=\"section-heading\">6. 정보교류 차단 의무(차이니스 월) (11번 문제)</h2><ul><li>자본시장법상 금융투자업자의 의무, 내용은 <strong>내부통제기준</strong>에 규정</li><li>겸영업무·부수업무 영위 시 미공개 중요정보 등에 대한 <strong>내부 정보교류 차단장치</strong> 구축</li><li>계열회사·제3자에게 정보 제공 시에도 차단 장치 구축</li><li><strong>상시 정보교류를 허용하는 임원을 지정해야 함</strong> (지정하면 안 된다는 것은 틀린 지문 — 통제하려면 한 사람은 전체를 알아야 하므로)</li><li>방법: <strong>물리적 분리 + 비밀정보 접근권한 통제</strong></li><li>차단 대상: <strong>미공개 중요정보</strong>, 투자자의 매매·소유 현황 정보, 이해상충 우려 정보</li></ul><h2 class=\"section-heading\">7. 이해상충 방지체계 (12번 문제 — 항상 출제)</h2><ul><li><strong>의무적</strong>으로 마련해야 함 (자율 아님), <strong>인가·등록 시부터</strong> 의무</li><li>이해상충 발생 가능성은 <strong>내부통제기준</strong>에 따라 파악·평가·관리 (표준투자권유준칙 아님!)</li><li><strong>고지 의무 + 저감 후 거래 의무</strong>: 투자자에게 알리고 문제없는 수준으로 낮춘 후 거래</li><li>낮추기 곤란하면 <strong>회피의무</strong> (거래 자체를 하지 않음 — 투자자 승낙 얻어 거래하는 게 아님)</li></ul><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">3과목 출제 비중</td><td data-label=\"핵심 내용\">30문제 중 <strong>직무윤리 12문제</strong> (최다)</td></tr><tr><td data-label=\"구분\">적용대상</td><td data-label=\"핵심 내용\"><strong>투자권유대행인 포함</strong>, 계약·보수 무관, <strong>잠재적 고객 포함</strong></td></tr><tr><td data-label=\"구분\">기본원칙 법제화</td><td data-label=\"핵심 내용\">고객우선·신의성실 → <strong>금융소비자보호법</strong>(금융소비자 보호) + <strong>자본시장법</strong>(이해상충 방지)</td></tr><tr><td data-label=\"구분\">보호대상 상품</td><td data-label=\"핵심 내용\"><strong>금융상품</strong>(금융투자상품 아님). 2021.3 확대 — <strong>보험·대출·예금</strong> 포함</td></tr><tr><td data-label=\"구분\">보호 4단계</td><td data-label=\"핵심 내용\"><strong>개발 / 판매 이전 / 판매 / 판매 이후</strong> (해피콜·미스터리쇼핑·소송중지·자료열람요구권 = 판매 이후)</td></tr><tr><td data-label=\"구분\">본인 윤리</td><td data-label=\"핵심 내용\"><strong>법규준수 · 자기혁신 · 품위유지</strong> · 공공성독립성 · 사적이익금지</td></tr><tr><td data-label=\"구분\">경영진 책임</td><td data-label=\"핵심 내용\"><strong>법적 책임(사용자 책임)</strong>도 있음</td></tr><tr><td data-label=\"구분\">준내부자(둔내부자)</td><td data-label=\"핵심 내용\">외부자이나 <strong>미공개 중요정보</strong>를 취득한 자</td></tr><tr><td data-label=\"구분\">시장질서 교란행위 규제</td><td data-label=\"핵심 내용\"><strong>다차(2·3·4차) 정보수령자</strong>, 정보 <strong>전달자</strong>까지 제재 대상 확대</td></tr><tr><td data-label=\"구분\">정보교류 차단</td><td data-label=\"핵심 내용\"><strong>내부통제기준</strong> 규정, <strong>상시 정보교류 허용 임원 지정</strong>, 물리적 분리+접근권한 통제</td></tr><tr><td data-label=\"구분\">이해상충 방지체계</td><td data-label=\"핵심 내용\"><strong>의무적</strong>, <strong>인가·등록 시부터</strong>, <strong>내부통제기준</strong> 관리, <strong>회피의무</strong></td></tr></tbody></table></div>", "quiz": [{"q": "금융소비자보호법에서 보호대상이 되는 상품의 정의는?", "a": "<strong>금융상품</strong>", "e": "2021년 3월 제정·시행으로 금융투자상품에서 금융상품(보험·대출·예금 등 비금융투자상품 포함)으로 확대"}, {"q": "해피콜 서비스는 금융소비자 보호의 어느 단계에 속하는가?", "a": "<strong>상품 판매 이후 단계</strong>", "e": "상품 판매 단계가 아니라 판매 이후 단계 — 6대 판매원칙·계약서류 제공 의무는 판매 단계"}, {"q": "직무윤리 적용대상에 대한 설명으로 틀린 것은?", "a": "<strong>\"계약관계가 없는 잠재적 고객까지 준수해야 하는 것은 아니다\"</strong>", "e": "잠재적 고객에 대해서도 준수해야 함. 투자권유대행인도 적용 대상"}, {"q": "시장질서 교란행위 규제의 제재 대상 범위에 대한 설명으로 옳은 것은?", "a": "<strong>내부자·준내부자·1차 정보수령자를 넘어 다차(2·3·4차) 정보수령자와 미공개 중요정보 전달자까지 제재 대상으로 확대</strong>", "e": "자본시장법 174~178조는 불공정거래(내부자거래) 규제"}, {"q": "정보교류 차단 의무(차이니스 월)에 대한 설명으로 적절하지 않은 것은?", "a": "<strong>\"상시 정보교류를 허용하는 임원을 지정해서는 안 된다\"</strong>", "e": "지정해야 하며, 내용은 내부통제기준에 규정, 계열사·제3자 제공 시에도 차단장치 구축"}, {"q": "이해상충 발생 가능성을 낮추기 곤란한 경우의 조치는?", "a": "<strong>회피의무 — 그 거래 자체를 하지 않는다</strong>", "e": "투자자 승낙을 얻어 거래하는 것이 아님"}]}, {"id": "KGiCMBTPveY", "group": "채권시장", "groupIndex": 6, "index": 1, "label": "기본서 이론정리", "title": "증권투자권유자문인력 기본서 이론정리ㅣ'채권시장''📝ㅣ해커스 민영기 증권투자자문인력 증권투자권유자문인력시험일정", "teacher": "민영기", "nature": "이론정리", "depth": "full", "video": "https://www.youtube.com/watch?v=KGiCMBTPveY", "badge": "", "content": "<h2 class=\"section-heading\">1. 채권의 정의와 기본적 특성</h2><ul><li><strong>발행자격의 법적 제한</strong>: 아무나 발행할 수 없음 (일정 요건 필요)</li><li><strong>이자 지급을 약속한 증권</strong></li><li><strong>기한부 증권</strong>: 만기가 정해져 있음 (예외: 영구채는 시험에 안 나옴, 참고만)</li><li><strong>장기증권</strong>: 채권은 1년을 초과하는 것이 일반적인 투자채권 (주식은 기한 없음, 채권은 장기 투자)</li></ul><h2 class=\"section-heading\">2. 채권가격의 기본 요소 (용어 전체 숙지, 3개는 핵심)</h2><ul><li><strong>액면가</strong>: 채권 권면에 인쇄된 만기 상환 금액. 언급 없으면 회사채 액면 = <strong>만원</strong>(주식 액면 5천원과 구분!)</li><li>발행일·만기·<strong>만기기간</strong>(발행일→만기 전체)·<strong>경과기간</strong>(발행 후 지난 기간)·<strong>잔존기간</strong>(남은 기간)</li><li><strong>이자지급기간</strong>: 이자 지급 주기 (3개월·6개월·1년 등)</li><li><strong>핵심 3요소</strong>: <strong>표면이율</strong>, <strong>만기수익률</strong>, <strong>단가</strong></li><li><strong>표면이율</strong>(액면이자율·쿠폰금리·쿠폰레이트): 권면에 기재된 이율, <strong>발행 시 결정되어 만기까지 변하지 않음</strong>(고정금리 채권이 기본, <strong>FRN</strong>(변동금리채)은 예외). 쿠폰의 어원 = 옛날 이자교환증(종이조각)을 떼어 이자를 받던 데서</li><li><strong>만기수익률(YTM)</strong>: 채권을 현재가치로 바꿀 때 쓰는 <strong>할인율</strong> = <strong>시장수익률 = 유통수익률 = 채권수익률 = 시장금리</strong>(상황에 따라 부르는 이름만 다르고 실체는 같음)</li><li>정의: 채권에서 미래에 발생하는 현금흐름(이자+액면)의 현재가치 합을 채권 가격과 일치시키는 할인율</li><li>채권의 <strong>현재가치를 결정할 때는 표면이율이 아니라 만기수익률</strong>을 사용</li><li>개념 구분: 이자율 = 현재돈→미래돈, 할인율 = 미래가치→현재가치</li><li>시장금리가 변하면 만기수익률이 변하고 채권가격도 따라서 변동</li><li><strong>단가</strong>: 채권 매매가격, 채권 액면 <strong>만원 기준</strong>으로 산정</li></ul><h2 class=\"section-heading\">3. 이자·원금 지급방식에 따른 3대 기본 채권 (압도적 빈출)</h2><div class=\"table-wrap\"><table><thead><tr><th>채권</th><th>이자 지급</th><th>만기 상환</th></tr></thead><tbody><tr><td data-label=\"채권\"><strong>이표채</strong>(쿠폰채)</td><td data-label=\"이자 지급\"><strong>중간에 이자 받음</strong> (이자표 붙어 있음)</td><td data-label=\"만기 상환\">액면가</td></tr><tr><td data-label=\"채권\"><strong>할인채</strong></td><td data-label=\"이자 지급\">중간 이자 없음 — <strong>이자를 미리 할인해 싸게 발행</strong></td><td data-label=\"만기 상환\">액면가 → <strong>초기 구입비용이 가장 쌈</strong></td></tr><tr><td data-label=\"채권\"><strong>복리채</strong></td><td data-label=\"이자 지급\">중간 이자 없이 <strong>누적</strong></td><td data-label=\"만기 상환\">액면 + 누적(복리)이자 한꺼번에 → <strong>만기 때 받는 돈이 가장 많음</strong></td></tr></tbody></table></div><ul><li>단리채는 참고용(중요도 낮음). \"중간에 이자를 받는 채권은 이표채 하나뿐\"임을 기억</li></ul><h2 class=\"section-heading\">4. 채권의 종류</h2><ul><li><strong>발행주체별</strong>: 국채·지방채·금융채·회사채 등 (사채 = <strong>회사채</strong>의 약자, 사채업자 아님!)</li><li><strong>보증여부</strong>: 보증채·<strong>무보증채</strong>(우리나라 회사채는 거의 100%)·담보부사채</li><li><strong>우리나라 회사채 = 무보증사채 → 위험하므로 2개 이상의 복수 신용평가 필수</strong></li><li><strong>ABS(자산유동화증권)</strong>: 자산이 담보라 1곳만 받으면 됨</li><li>신용평가를 받는 채권 = <strong>크레딧물</strong>(위험채권), 신용평가를 안 받는 채권(국채·통안채 등) = <strong>무위험채권</strong>(무위험자산)</li><li><strong>신용 스프레드 = 회사채 수익률 − 무위험채권 수익률</strong></li><li><strong>만기별</strong>: 단기·중기·장기 (한·미 기준 다름, 외울 필요 없음)</li><li><strong>금리변동채권(FRN)</strong>: 일정 기간마다 정해진 <strong>기준금리에 연동된 표면금리</strong>로 이자 지급 — 표면금리가 고정 아님. 변형: 역변동금리채권, 양기준금리 변동채권, 디지털 옵션 금리변동채권</li></ul><h2 class=\"section-heading\">5. 발행시장 (Primary Market)</h2><ul><li><strong>발행기관 3종</strong>: 주관회사·인수회사·청약회사 (구분)</li><li><strong>사모발행 vs 공모발행</strong>: 사모 = <strong>50인 미만</strong>의 특정 소수 투자자에게 사적 교섭으로 발행 / 공모 = <strong>불특정 다수(50인 이상)</strong>에게 발행 (50인 미만/이상 기준 암기)</li><li><strong>공모발행 = 직접발행 + 간접발행</strong>:</li><li>직접발행: <strong>매출발행</strong>(발행조건 미리 정해두고 일정 기간 개별적으로 매도) / <strong>공모입찰발행</strong>(입찰 결과를 기준으로 발행조건 결정)</li><li>간접발행: <strong>위탁발행 · 잔액인수 · 총액인수</strong> (위·잔·총)</li><li>공모입찰발행 3방식:</li><li><strong>복수가격 경매방식</strong>(컨벤셔널 방식): 응찰자가 제시한 수익률을 낮은 순으로 배열해 발행예정액까지 순차 낙찰 → 복수가격</li><li><strong>단일가격 경매방식</strong>(더치 방식): 낙찰된 수익률 중 가장 높은 수익률을 일정하게 적용해 단일 가격으로 발행</li><li><strong>차등가격 경매방식</strong>: <strong>우리나라 국채 발행에 사용</strong></li><li><strong>총액인수</strong>: 인수회사(증권회사)가 발행채권 총액을 모두 인수 후 자기 책임 하에 모집·매출</li><li>판매 실패 시 인수회사가 손해 → <strong>수수료가 가장 높음</strong>, 발행회사 입장에서는 가장 안전</li><li><strong>우리나라 회사채의 대부분은 총액인수 방식으로 발행</strong></li></ul><h2 class=\"section-heading\">6. 유통시장 (Secondary Market)</h2><ul><li><strong>장내시장 vs 장외시장</strong>:</li><li>장내: <strong>상장채권</strong>만 거래, 규격화, <strong>집단경쟁매매</strong></li><li>장외: <strong>상대매매</strong>(일대일), 상장채권·<strong>비상장채권 모두</strong> 거래</li><li><strong>국채전문유통시장(IDM, Inter-Dealer Market)</strong>: 국채딜러(국채 도매상 = <strong>금융회사</strong>, 개인 아님)가 거래소 시장에서 경쟁매매. 일반 투자자는 개인 자격 참여 불가, 위탁으로만 가능</li><li><strong>일반채권매매시장</strong>: 소매채권과 일반채권이 동시에 거래됨에 따른 유동성 분산·가격발견 기능 저하 해소를 위해 만듦 (정도만)</li><li>장외거래: <strong>대고객 상대매매</strong>(증권회사 통해) vs <strong>채권딜러 간 장외거래</strong>(<strong>IDB</strong>, Inter-Dealer Broker 통해). 결제방법은 <strong>익일결제(D+1)</strong> 가 보편적</li><li><strong>K-본드 시장</strong>: 개요 정도만</li></ul><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">채권 특성</td><td data-label=\"핵심 내용\">발행자격 <strong>법적 제한</strong>, 이자 지급 약속, <strong>기한부 증권</strong>, 장기증권</td></tr><tr><td data-label=\"구분\">액면가</td><td data-label=\"핵심 내용\">언급 없으면 회사채 액면 = <strong>만원</strong>(주식 액면 5천원)</td></tr><tr><td data-label=\"구분\">표면이율</td><td data-label=\"핵심 내용\"><strong>만기까지 변하지 않음</strong>(쿠폰금리)</td></tr><tr><td data-label=\"구분\">만기수익률</td><td data-label=\"핵심 내용\"><strong>시장수익률 = 유통수익률 = 채권수익률 = 시장금리</strong>, 채권 <strong>현재가치 결정 시 사용</strong></td></tr><tr><td data-label=\"구분\">3대 기본 채권</td><td data-label=\"핵심 내용\"><strong>이표채</strong>(중간 이자) / <strong>할인채</strong>(싸게 발행, 초기비용 최소) / <strong>복리채</strong>(누적, 만기수령 최대)</td></tr><tr><td data-label=\"구분\">복수 신용평가</td><td data-label=\"핵심 내용\"><strong>우리나라 회사채는 무보증 → 2곳 이상</strong>, ABS는 1곳</td></tr><tr><td data-label=\"구분\">신용 스프레드</td><td data-label=\"핵심 내용\"><strong>회사채 수익률 − 무위험채권 수익률</strong></td></tr><tr><td data-label=\"구분\">사모 vs 공모</td><td data-label=\"핵심 내용\"><strong>50인 미만</strong> vs <strong>50인 이상</strong>(불특정 다수)</td></tr><tr><td data-label=\"구분\">공모입찰 3방식</td><td data-label=\"핵심 내용\"><strong>복수가격</strong>(컨벤셔널) / <strong>단일가격</strong>(더치) / <strong>차등가격</strong>(<strong>우리나라 국채</strong>)</td></tr><tr><td data-label=\"구분\">총액인수</td><td data-label=\"핵심 내용\">인수사가 전부 인수 → <strong>수수료 최고</strong>, 발행사에 가장 안전, <strong>우리나라 회사채 대부분</strong></td></tr><tr><td data-label=\"구분\">IDM</td><td data-label=\"핵심 내용\"><strong>국채전문유통시장</strong>, 국채딜러 = <strong>금융회사</strong>(도매상)</td></tr><tr><td data-label=\"구분\">장외시장</td><td data-label=\"핵심 내용\"><strong>상대매매</strong>, 상장+비상장 모두 거래, <strong>D+1 결제</strong></td></tr></tbody></table></div>", "quiz": [{"q": "표면이율과 만기수익률의 차이로 옳은 것은?", "a": "<strong>표면이율은 발행 시 결정되어 만기까지 변하지 않고, 만기수익률은 시장금리에 따라 변하며 채권의 현재가치를 결정할 때 사용한다</strong>", "e": "만기수익률 = 시장수익률 = 유통수익률 = 채권수익률 = 시장금리"}, {"q": "이표채·할인채·복리채를 이자 지급 방식 기준으로 구분하면?", "a": "<strong>이표채는 중간에 이자를 받고, 할인채는 이자를 미리 할인해 싸게 발행하며, 복리채는 이자를 누적해 만기 때 한꺼번에 받는다</strong>", "e": "초기 구입비용이 가장 싼 것은 할인채, 만기 때 가장 많이 받는 것은 복리채"}, {"q": "우리나라 회사채 발행 시 신용평가를 어떻게 받아야 하는가?", "a": "<strong>2개 이상의 복수 신용평가</strong>", "e": "우리나라 회사채는 거의 100% 무보증사채이므로. ABS는 담보가 있어 1곳"}, {"q": "사모발행과 공모발행의 구분 기준은?", "a": "<strong>50인 미만</strong>(사모, 특정 소수) vs <strong>50인 이상</strong>(공모, 불특정 다수)", "e": "사모는 사적 교섭을 통해 발행"}, {"q": "우리나라 국채 발행에 사용되는 공모입찰 방식은?", "a": "<strong>차등가격 경매방식</strong>", "e": "복수가격(컨벤셔널), 단일가격(더치) 방식과 구분"}, {"q": "총액인수 방식의 특징으로 옳은 것은?", "a": "<strong>인수회사(증권회사)가 발행채권 총액을 모두 인수해 자기 책임 하에 모집·매출하므로 수수료가 가장 높고, 우리나라 회사채의 대부분이 이 방식으로 발행된다</strong>", "e": "판매 실패 시 손해는 인수회사가 부담"}]}, {"id": "rQiMO9zEhLo", "group": "채권시장", "groupIndex": 6, "index": 2, "label": "최종핵심 문제풀이 (2)", "title": "증권투자권유대행인 최종핵심 문제풀이 '채권시장 (2)' 금융권 취업을 원한다면 보세요!┃ 해커스금융 민영기 교수님", "teacher": "민영기", "nature": "문제풀이 (채권시장 ②, 기본문제 + 출제예상 ★3개)", "depth": "full", "video": "https://www.youtube.com/watch?v=rQiMO9zEhLo", "badge": "증권투자권유대행인 강의 · 채권시장 공통", "content": "<h2 class=\"section-heading\">1. 채권 투자전략 — 적극적 vs 소극적</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>적극적 투자전략</th><th>소극적 투자전략</th></tr></thead><tbody><tr><td data-label=\"구분\">시장관</td><td data-label=\"적극적 투자전략\">시장의 <strong>비효율성</strong> 전제</td><td data-label=\"소극적 투자전략\">시장의 <strong>효율성</strong> 전제</td></tr><tr><td data-label=\"구분\">목표</td><td data-label=\"적극적 투자전략\"><strong>초과수익</strong> 추구</td><td data-label=\"소극적 투자전략\">수익률 변동위험 <strong>극소화</strong>, 방어적(당초 목표 달성)</td></tr><tr><td data-label=\"구분\">종류</td><td data-label=\"적극적 투자전략\">수익률 예측 전략, 채권 교체 전략, <strong>수익률 곡선 타기 전략</strong>, <strong>나비형(바벨형)</strong> 투자전략</td><td data-label=\"소극적 투자전략\">만기보유 전략, <strong>인덱스 전략</strong>, 현금흐름 일치 전략, <strong>사다리형 만기운용</strong> 전략, 바벨형(나비형) 만기운용 전략, <strong>면역전략</strong></td></tr></tbody></table></div><ul><li><strong>나비형(바벨형)</strong>은 양쪽에 다 등장: <strong>미래 금리를 적극 예측해 대응하면 적극적</strong>, 기계적으로 하면 소극적 (전제가 갈림)</li><li><strong>면역전략</strong>: <strong>목표 투자기간과 포트폴리오 듀레이션을 일치</strong>시키는 전략 (\"잔존만기와 일치\"는 틀린 지문)</li><li><strong>인덱스 전략</strong>: 구성 종목 수가 적을수록 <strong>추적오차 증가</strong> (감소 아님)</li></ul><h2 class=\"section-heading\">2. 금리 전망별 투자전략 (금리 상승 예상 시)</h2><ul><li>전제: <strong>금리가 오르면 채권가격은 떨어진다</strong> (반대로 움직임)</li><li>① <strong>고정금리채 → 변동금리채로 교체</strong> (변동금리채는 금리에 연동돼 더 높은 이자 수령) — 거꾸로가 정답 함정</li><li>② <strong>듀레이션을 낮게</strong> (작은 채권으로 교체) — 금리 민감도를 줄여야 가격 하락폭이 작아짐</li><li><strong>듀레이션</strong>: 금리에 대한 채권가격 민감도. 듀레이션을 작게 = <strong>잔존만기 짧게</strong>(장기채 매도·단기채 매수) + <strong>표면이율 크게</strong>(중간 이자를 많이 받는)</li><li>③ <strong>장기채 매도 + 단기채 매수</strong></li><li>④ 사다리형은 금리와 무관하게 꾸준한 현금유입 추구 — 금리 대응 전략 아님</li><li>금리 <strong>하락</strong>(채권가격 상승) 예상 시는 정반대: <strong>듀레이션 크게</strong> → <strong>장기채 비중 높임</strong>, 표면이율 낮은 채권 비중 높임, 금리선물 <strong>매수</strong>(매도 아님)</li><li>금리 하락 시 할인채 비중 확대가 유리 (중간 이자 없이 듀레이션이 큼)</li></ul><h2 class=\"section-heading\">3. 수익률 곡선 타기 전략</h2><ul><li>조건: 수익률곡선이 <strong>우상향</strong>하고 <strong>투자기간 동안 모양이 변하지 않을</strong> 경우 사용</li><li><strong>롤링 효과</strong>(장기채 효과): 10년짜리 사서 1년 보유 후 9년짜리로 팔아 자본이득</li><li><strong>숄더 효과</strong>(단기채 효과): 5년짜리 사서 금리 떨어지면 1년 보유 후 팔아 수익 — <strong>만기가 짧을수록 수익률 하락폭이 큼</strong></li><li><strong>바벨형(나비형)</strong>: 장기채+단기채만 보유하고 중기채 매도 — 수익률 곡선 타기 전략이 아님!</li></ul><h2 class=\"section-heading\">4. 소극적 투자전략 각론</h2><ul><li><strong>만기보유 전략</strong>: 매입 후 만기까지 보유</li><li><strong>현금흐름 일치 전략</strong>: 채권 현금수입이 부채상환 흐름과 <strong>일치하거나 상회</strong>(들어오는 돈이 나가는 돈보다 많아야)하도록 포트폴리오 구성</li><li><strong>사다리형 만기운용 전략</strong>: <strong>각 잔존기간별 보유량을 동일하게 유지</strong>, 일정 기간마다 현금흐름(유동성) 확보, 만기 도래 자금을 장기 자산에 재투자 → <strong>수익률 평준화</strong></li></ul><h2 class=\"section-heading\">5. 말킬의 채권가격 정리 (Malkiel's Theorems) — 압도적 빈출</h2><ol><li><strong>채권가격과 채권수익률은 반대로</strong>(반비례 관계로) 움직임</li><li>만기 일정 시, <strong>수익률 하락으로 인한 가격상승폭 &gt; 같은 폭 수익률 상승으로 인한 가격하락폭</strong> (<strong>볼록성</strong> — \"상승폭이 작다\"는 틀린 지문)</li><li>만기에 따른 채권가격 변동폭은 만기가 증가할수록 커지나 그 증가는 <strong>체감</strong></li><li><strong>장기채가 단기채보다</strong> 일정한 수익률 변동에 대한 <strong>가격변동폭이 큼</strong> (듀레이션이 크다는 의미)</li></ol><h2 class=\"section-heading\">6. 채권투자 위험의 구분</h2><ul><li><strong>가격변동위험</strong>: 금리 상승 시 채권가격 하락</li><li><strong>신용위험(디폴트 리스크)</strong>: 발행사가 정해진 원리금을 지급하지 못하는 위험 — 가격변동위험이 아님!</li></ul><h2 class=\"section-heading\">7. 주식관련 사채 3종 — CB / EB / BW (구분 문제 빈출)</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>전환사채(CB)</th><th>교환사채(EB)</th><th>신주인수권부사채(BW)</th></tr></thead><tbody><tr><td data-label=\"구분\">교환 대상</td><td data-label=\"전환사채(CB)\"><strong>발행회사의 주식</strong>으로 전환</td><td data-label=\"교환사채(EB)\"><strong>발행회사가 보유한 타회사 주식</strong>으로 교환</td><td data-label=\"신주인수권부사채(BW)\">신주 인수</td></tr><tr><td data-label=\"구분\">권리 행사 시 현금</td><td data-label=\"전환사채(CB)\">추가 자금 <strong>불필요</strong>(주식과 교환)</td><td data-label=\"교환사채(EB)\">신규 자금 지출 <strong>없음</strong></td><td data-label=\"신주인수권부사채(BW)\"><strong>신주인수금 납입 → 회사로 현금 유입</strong></td></tr><tr><td data-label=\"구분\">권리 분리</td><td data-label=\"전환사채(CB)\">채권에서 떼어낼 수 없음 (권리 행사 시 채권 소멸)</td><td data-label=\"교환사채(EB)\">—</td><td data-label=\"신주인수권부사채(BW)\">권리는 <strong>워런트</strong>로 분리 가능, 행사 후에도 <strong>채권 존속</strong>(소멸 안 함)</td></tr></tbody></table></div><ul><li><strong>패리티</strong>는 전환사채의 지표 (교환사채 투자지표 아님!)</li><li><strong>패리티 가격</strong> = 전환사채의 <strong>주식 콜옵션 가치</strong>. 패리티 가격 = 전환가격의 주가를 만원 단위로 표시 × 100</li><li>전환사채 = <strong>채권 + 주식 콜옵션</strong> 결합</li><li><strong>비분리형 BW</strong>: <strong>발행·거래 시에는 떼서 거래 불가</strong>, 그러나 <strong>권리 행사 시에는 분리 행사</strong> (\"일반적으로 행사 불가\"는 틀린 지문)</li></ul><h2 class=\"section-heading\">8. ABS(자산유동화증권)</h2><ul><li>발행주체: 자산보유자가 아니라 <strong>SPC(유동화전문회사·특수목적회사, SBV/SPV)</strong></li><li>방식: 기초자산의 현금흐름을 투자자에게 그대로 이전 = <strong>패스스루</strong></li><li>기초자산: <strong>주택저당채권(모기지)</strong> — 덩치가 커서 <strong>MBS</strong>로 따로 다룸, 자동차할부금·신용카드 채권 등도 가능</li><li><strong>부외화(off-balance) 효과</strong> → 자기자본 관리 강화 수단 (부채·자본 조달 없이 현금 동원)</li></ul><h2 class=\"section-heading\">9. 조건부 자본증권(CoCo) vs 신종자본증권</h2><ul><li><strong>조건부 자본증권</strong>: 특정 상황에 처하면 채권이 <strong>자본으로 전환되거나 소각</strong>됨. <strong>바젤III상 자본으로 인정</strong>(BIS 비율 계산에 기여). 일반 채권보다 <strong>높은 금리 + 높은 위험</strong>. <strong>후순위채가 아님</strong>(틀린 지문 주의)</li><li><strong>신종자본증권</strong>: <strong>자본의 성격이 강한 채권</strong>(부채 아님) — 후순위성·만기연장성·이자지급 임의성이 클수록 자본성 높아짐. <strong>하이브리드 채권과 동일 개념</strong>, 코코본드와 유사</li></ul><h2 class=\"section-heading\">10. 채권 매매단가 계산형 (출제예상 ★3)</h2><ul><li>복리채: 만기 시 한 번만 현금흐름 → <strong>매매단가 = 만기상환금액 ÷ [(1+r)^정수년 × (1+r×잔여일/365)]</strong></li><li>예: 12,150 ÷ [(1.1)² × (1+0.1×73/365)] = 9,841</li><li>단리채(1년 만기, 표면금리 5%, 액면 만원): 만기 수령 = 10,500원 → <strong>10,500 ÷ [1+0.07×201/365]</strong> (채권수익률 7% 할인)</li></ul><hr><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">적극적 전략</td><td data-label=\"핵심 내용\">시장 <strong>비효율</strong> 전제, <strong>초과수익</strong> — 수익률예측·채권교체·수익률곡선타기·<strong>나비형(바벨형)</strong></td></tr><tr><td data-label=\"구분\">소극적 전략</td><td data-label=\"핵심 내용\">시장 <strong>효율</strong> 전제, 위험 극소화 — 만기보유·인덱스·현금흐름일치·<strong>사다리형</strong>·면역전략</td></tr><tr><td data-label=\"구분\">면역전략</td><td data-label=\"핵심 내용\"><strong>투자기간 = 포트폴리오 듀레이션</strong> 일치</td></tr><tr><td data-label=\"구분\">금리 상승 시</td><td data-label=\"핵심 내용\"><strong>변동금리채</strong>로 교체, <strong>듀레이션↓</strong>(장기채 매도·단기채 매수, 표면이율↑)</td></tr><tr><td data-label=\"구분\">듀레이션</td><td data-label=\"핵심 내용\">금리 대비 채권가격 <strong>민감도</strong>. <strong>만기 길수록·표면이율 낮을수록</strong> 커짐</td></tr><tr><td data-label=\"구분\">롤링 효과</td><td data-label=\"핵심 내용\">장기채 효과 (10년→1년 보유 후 9년으로 매도)</td></tr><tr><td data-label=\"구분\">숄더 효과</td><td data-label=\"핵심 내용\">단기채 효과 (<strong>만기 짧을수록</strong> 수익률 하락폭 큼)</td></tr><tr><td data-label=\"구분\">말킬 정리</td><td data-label=\"핵심 내용\">가격↔수익률 <strong>반대</strong>, 하락 시 <strong>상승폭 &gt; 상승 시 하락폭</strong>(볼록성), 장기채 변동폭 큼</td></tr><tr><td data-label=\"구분\">가격변동위험 vs 신용위험</td><td data-label=\"핵심 내용\">금리↑→가격↓ = 가격변동위험 / 원리금 미지급 = <strong>신용위험(디폴트)</strong></td></tr><tr><td data-label=\"구분\">패리티</td><td data-label=\"핵심 내용\"><strong>전환사채</strong> 지표 (교환사채 아님). 패리티 가격 = 전환가격 주가(만원 단위)×100</td></tr><tr><td data-label=\"구분\">현금 유입되는 권리</td><td data-label=\"핵심 내용\"><strong>신주인수권부사채(BW)</strong> — 신주인수금 납입</td></tr><tr><td data-label=\"구분\">ABS</td><td data-label=\"핵심 내용\">발행주체 = <strong>SPC</strong>, 현금흐름 이전 = <strong>패스스루</strong>, <strong>MBS</strong>는 모기지 유동화, 부외화 효과</td></tr><tr><td data-label=\"구분\">조건부 자본증권</td><td data-label=\"핵심 내용\">특정 상황 <strong>자본 전환·소각</strong>, <strong>바젤III 자본 인정</strong>, 고금리·고위험</td></tr></tbody></table></div>", "quiz": [{"q": "면역전략이란 무엇인가?", "a": "<strong>목표 투자기간과 채권 포트폴리오의 듀레이션을 일치시키는 전략</strong>", "e": "잔존만기와 일치시키는 것이 아님"}, {"q": "금리 상승이 예상될 때 취할 전략으로 옳은 것은?", "a": "<strong>장기채 매도·단기채 매수, 듀레이션을 낮게, 고정금리채를 변동금리채로 교체</strong>", "e": "금리가 오르면 채권가격이 떨어지므로 민감도(듀레이션)를 줄여야 함"}, {"q": "말킬의 채권가격 정리 중 옳지 않은 것은?", "a": "<strong>\"수익률 하락으로 인한 가격상승폭이 수익률 상승으로 인한 가격하락폭보다 작다\"</strong>", "e": "볼록성으로 인해 하락 시 상승폭이 더 크다"}, {"q": "패리티에 대한 설명으로 옳지 않은 것은?", "a": "<strong>\"패리티는 교환사채의 투자지표이다\"</strong>", "e": "패리티는 전환사채의 주식 콜옵션 가치를 나타내는 지표"}, {"q": "ABS(자산유동화증권)에 대한 설명으로 옳지 않은 것은?", "a": "<strong>\"자산유동화증권을 발행하는 주체는 자산보유자이다\"</strong>", "e": "SPC(유동화전문회사)가 발행하며, 패스스루 방식으로 부외화 효과를 거둠"}, {"q": "신종자본증권과 조건부 자본증권에 대한 설명으로 옳지 않은 것은?", "a": "<strong>\"신종자본증권은 부채의 성격이 강한 채권이다\"</strong>", "e": "자본의 성격이 강한 채권이며, 조건부 자본증권은 바젤III상 자본으로 인정되고 후순위채가 아님"}]}, {"id": "BG_iRheu0PQ", "group": "채권시장", "groupIndex": 6, "index": 3, "label": "채권만기수익률", "title": "[해커스 금융]민영기교수님의 증권투자권유자문인력 문제풀이_채권만기수익률", "teacher": "민영기", "nature": "문제풀이", "depth": "full", "video": "https://www.youtube.com/watch?v=BG_iRheu0PQ", "badge": "", "content": "<h2 class=\"section-heading\">1. 만기수익률(YTM)의 정의</h2><ul><li><strong>만기수익률</strong> = 채권에서 앞으로 얻을 <strong>미래 현금흐름의 현재가치 합계가 현재 채권 가격과 같아지게 만드는 할인율(이자율)</strong></li><li>단순히 표면금리(이자 지급률)가 아니라, 매매 가격을 반영한 <strong>실질 수익률</strong></li></ul><h2 class=\"section-heading\">2. 단기(만기 1년 이하) 채권 만기수익률 계산</h2><ul><li>강의의 문제: 만기 1년 남은 회사채가 <strong>105,000원</strong>에 매매되고 있음. 액면금액 100,000원, 표면금리 10%, 이자 연 1회 지급</li><li>1년 후 받는 돈 = 액면 100,000원 + 이자 10,000원 = <strong>110,000원</strong></li><li>만기수익률 = (110,000 ÷ 105,000) − 1 = <strong>4.76%</strong></li><li>계산 포인트: <strong>(만기 때 받는 총액 ÷ 현재 매수가격) − 1</strong></li></ul><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">만기수익률 정의</td><td data-label=\"핵심 내용\">미래 현금흐름의 현재가치를 채권 가격과 같게 만드는 할인율</td></tr><tr><td data-label=\"구분\">1년 만기 계산식</td><td data-label=\"핵심 내용\">(만기 수령 총액 ÷ 현재 매매가격) − 1</td></tr><tr><td data-label=\"구분\">문제의 수치</td><td data-label=\"핵심 내용\">110,000 ÷ 105,000 − 1 = 약 4.76%</td></tr><tr><td data-label=\"구분\">함정</td><td data-label=\"핵심 내용\">표면금리(10%) ≠ 만기수익률. 매매가격이 액면보다 높으면(할증) 만기수익률은 표면금리보다 낮아짐</td></tr></tbody></table></div>", "quiz": [{"q": "만기가 1년 남은 회사채가 105,000원에 거래되고 있다. 액면 100,000원, 표면금리 10%(연 1회 지급)일 때 만기수익률은?", "a": "약 4.76%", "e": "1년 후 수령액 110,000원을 현재가격 105,000원으로 나눈 뒤 1을 빼면 (110,000÷105,000)−1 = 4.76%이다."}, {"q": "만기수익률의 정확한 정의로 옳은 것은?", "a": "채권의 미래 현금흐름 현재가치 합계가 현재 채권 가격과 같아지게 만드는 이자율", "e": "단순 이자지급률이 아니라 가격을 반영한 실질 수익률이다."}, {"q": "액면 100,000원·표면금리 10% 채권을 105,000원에 매수했다. 만기수익률이 표면금리보다 낮은 이유는?", "a": "할증으로 매수했기 때문", "e": "현재가격(105,000원)이 액면보다 높으므로 이자 10,000원을 더한 110,000원을 받아도 수익률은 10%보다 낮다."}]}, {"id": "KZcXLysyuF0", "group": "채권시장", "groupIndex": 6, "index": 4, "label": "골든크로스 vs 데드크로스", "title": "[해커스 금융] 민영기 교수님의 증권투자권유자문인력 문제풀이_골든크로스vs데드크로스", "teacher": "민영기", "nature": "문제풀이", "depth": "full", "video": "https://www.youtube.com/watch?v=KZcXLysyuF0", "badge": "", "content": "<h2 class=\"section-heading\">1. 골든크로스 vs 데드크로스</h2><ul><li><strong>골든크로스</strong>: <strong>단기 이동평균선이 장기 이동평균선을 상향 돌파</strong>하여 올라가는 현상 → <strong>매수신호(매입 신호)</strong></li><li><strong>데드크로스</strong>: <strong>단기 이동평균선이 장기 이동평균선을 하향 돌파</strong>하여 내려가는 현상 → <strong>매도신호(매각 신호)</strong></li><li>강의의 함정 지적: \"주가가 이평선을 돌파해서 나오는 매매신호\"라는 표현에 흔들리지 말 것 — 지문상 크로스는 <strong>이평선 간의 돌파</strong>다. 골든크로스 = 매수, 데드크로스 = 매도라는 1:1 매칭을 정확히 암기</li></ul><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">골든크로스</td><td data-label=\"핵심 내용\">단기 이평선 ↑ 장기 이평선을 상향 돌파 → <strong>매수신호</strong></td></tr><tr><td data-label=\"구분\">데드크로스</td><td data-label=\"핵심 내용\">단기 이평선 ↓ 장기 이평선을 하향 돌파 → <strong>매도신호</strong></td></tr><tr><td data-label=\"구분\">크로스 주체</td><td data-label=\"핵심 내용\">주가-이평선이 아니라 <strong>단기 이평선 vs 장기 이평선</strong> 간의 돌파</td></tr></tbody></table></div>", "quiz": [{"q": "단기 이동평균선이 장기 이동평균선을 상향 돌파하는 현상과 그 매매신호는?", "a": "골든크로스, 매수신호", "e": "단기가 장기를 뚫고 올라가면 상승 추세 진입 신호로 매입한다."}, {"q": "단기 이동평균선이 장기 이동평균선을 하향 돌파하는 현상과 그 매매신호는?", "a": "데드크로스, 매도신호", "e": "단기가 장기를 뚫고 내려가면 하락 추세 신호로 매각한다."}, {"q": "골든크로스는 매수신호, 데드크로스는 매도신호가 되는 근거는?", "a": "단기 이평선이 장기 이평선을 돌파할 때 시장의 추세 전환이 확인되기 때문", "e": "기술적 분석에서 이평선 간 돌파는 추세 전환의 매매 타이밍 신호로 본다."}]}, {"id": "iWinnHya8Tw", "group": "기타", "groupIndex": 7, "index": 1, "label": "주식회사 관련법", "title": "증권투자권유자문인력 기본서 이론정리ㅣ'주식회사 관련법' 📝ㅣ해커스 송영욱 금융권취업", "teacher": "송영욱", "nature": "이론정리", "depth": "full", "video": "https://www.youtube.com/watch?v=iWinnHya8Tw", "badge": "", "content": "<h2 class=\"section-heading\">1. 주식회사의 개념과 3원칙</h2><ul><li>주식회사는 <strong>사원이 유한책임</strong>을 지는 회사. 시험에서 유한회사와의 차이: 주식회사는 <strong>감사 선임이 강제</strong>(유한회사는 임의), <strong>주식 발행이 필수</strong>(유한회사는 주식 발행 불요)</li><li><strong>자본 3원칙</strong> (암기):</li></ul><ol><li><strong>자본확정의 원칙</strong> — 설립 시 발행 주식 총수와 자본금을 확정(예: 1만 주 × 1만원 = 자본금 1억)</li><li><strong>자본유지의 원칙</strong> — 확정된 자본금이 깨지지 않고 계속 유지되어야 함</li><li><strong>자본불변의 원칙</strong> — 자본금은 임의로 변경·감소시켜서는 안 됨</li></ol><h2 class=\"section-heading\">2. 주식회사 설립절차 (4단계 순서 암기)</h2><ol><li><strong>발기인조합 결성</strong> — 발기인은 <strong>1주 이상</strong> 인수해야 자격. 조합의 업무 결정은 <strong>과반수</strong> 원칙, 단 <strong>정관 작성과 설립 시 발행주식 결정은 발기인 전원 동의</strong></li><li><strong>정관 작성</strong> — <strong>절대적 기재사항 8가지</strong>: ① 목적 ② 상호 ③ 회사가 발행할 주식의 총수 ④ 액면주식 발행 시 1주 금액 ⑤ 회사 설립 시 발행하는 주식의 총수 ⑥ 본점소재지 ⑦ 공고방법 ⑧ 발기인의 성명·주민등록번호 (하나라도 빠지면 정관 작성 부적법)</li><li><strong>실체 구성</strong> — 자본금 + 사원 + 기관(이사·감사 등)</li><li><strong>설립등기</strong> — 실체구성 종료 후 <strong>2주 이내</strong>. 등기함으로써 비로소 주식회사 성립</li></ol><ul><li>설립 방법: <strong>발기설립</strong>(발기인이 전 주식을 인수) vs <strong>모집설립</strong>(일부는 일반 모집)</li><li>발기인의 책임: <strong>자본충실 책임 + 손해배상 책임</strong>. 이사·감사는 제3자에게 손해를 입히면 <strong>연대 배상책임</strong>(주주 전원 동의로 면제 가능)</li></ul><h2 class=\"section-heading\">3. 주주의 권한: 자익권 vs 공익권</h2><ul><li><strong>자익권</strong> = 자기만 이득이 되는 개인적 권리 (이익배당청구권, 잔여재산분배청구권, 신주인수권, 주식양도권 등)</li><li><strong>공익권</strong> = 다른 주주에게도 이익이 되는 권리 → 다시 두 가지로 나눔</li><li><strong>단독주주권</strong> = 1인 단독으로 행사 가능 (의결권, 장부·서류 열람청구권, 주총소집에 대한 총회검사인선임청구권 등)</li><li><strong>소수주주권</strong> = 일정 지분(보통 <strong>1~3%</strong>, <strong>6개월 이상 보유</strong> 요건)을 모아야 행사 가능. 시험에 자주 나오는 목록: 주총 <strong>소집청구권</strong>, 업무·재산상태 <strong>검사청구권</strong>, 회계장부 <strong>열람청구권</strong>, <strong>위법행위 유지청구권</strong>, <strong>대표소송제기권</strong>, 총회 <strong>검사인선임청구권</strong>, 이사 <strong>해임청구권</strong>, <strong>집중투표청구권</strong>, <strong>해산판결청구권</strong></li><li>대표소송제기권은 <strong>1% 이상</strong> 지분으로 행사 (상장법인은 0.5% 등 더 낮은 특례)</li><li>함정: <strong>주주제안권은 소수주주권</strong> (1인 단독 안 됨)</li></ul><h2 class=\"section-heading\">4. 주식의 양도·담보</h2><ul><li><strong>주식양도 자유의 원칙</strong>: <strong>법률 또는 정관에 의하지 않고는</strong> 주식양도를 제한하지 못한다</li><li>법률에 의한 제한 2가지 — 둘 다 <strong>회사에 대항하지 못함</strong>(회사에 대한 효력 없음):</li></ul><ol><li><strong>신주인수권(권리주)의 양도</strong></li><li><strong>주권 발행 전의 주식 양도</strong></li></ol><ul><li>정관에 의한 제한: <strong>이사회의 승인</strong>을 얻도록 정관에 규정 가능</li><li>양도 방법: 당사자 합의 + <strong>주권 교부</strong>(효력발생요건). 주주명부에 <strong>명의개서</strong>(기재)해야 회사에 대항 가능</li><li>주식 담보 = <strong>질권</strong> 설정. <strong>등록질</strong>(주주명부에 질권자 등록) vs <strong>약식질</strong>(주권만 교부)</li></ul><h2 class=\"section-heading\">5. 주식의 소각·병합·분할 / 주식매수선택권 / 포괄적 교환·이전</h2><ul><li>주식 <strong>소각 3방법</strong>: ① 자본감소에 의한 소각 ② 자기주식 소각 ③ 상환주식 소각</li><li><strong>주식의 분할</strong>은 <strong>주주총회 특별결의</strong> 필요 (예: 5,000원 1주 → 500원 10주)</li><li><strong>주식매수선택권(스톡옵션)</strong> 요건: ① <strong>정관에 규정</strong> + ② <strong>주총 특별결의</strong>; 행사요건: 부여 주총 결의일로부터 <strong>2년 이상 재임</strong>; 행사가액은 <strong>액면가와 시세 중 높은 금액 이상</strong></li><li><strong>주식의 포괄적 교환</strong> = A사가 B사 주식을 100% 취득 → <strong>모자회사 관계</strong>(2개 회사 → 1개 그룹)</li><li><strong>주식의 포괄적 이전</strong> = 기존 회사가 자산 100% 출자로 신생 완전자회사 설립 (1개 회사 → 2개 회사)</li></ul><h2 class=\"section-heading\">6. 주주총회: 보통결의·특별결의·특수결의</h2><ul><li><strong>보통결의</strong> = 출석주주 <strong>과반수</strong> + 발행주식총수 <strong>1/4 이상</strong> (이사·감사 <strong>선임</strong>, 이사 보수 등)</li><li><strong>특별결의</strong> = 출석주주 의결권 <strong>2/3 이상</strong> + 발행주식총수 <strong>1/3 이상</strong> (이사·감사 <strong>해임</strong>, 주식병합·분할, 자본감소, 주식 포괄적 교환·이전 등)</li><li><strong>특수결의</strong> = <strong>의결권 없는 주주까지 포함한 전 주주 동의</strong> (이사의 책임면제, 조직변경 단 2가지)</li><li>함정 쌍둥이: 이사 선임은 보통결의지만 <strong>해임은 특별결의</strong></li><li>소집권자: 원칙적으로 <strong>이사회</strong>, 소수주주·감사·법원도 가능</li><li>의결권 행사 제한: <strong>특별 이해관계자</strong>, <strong>자기주식</strong>, <strong>자회사가 보유한 모회사 주식</strong>, 감사 선임 시 <strong>3% 초과 지분</strong></li><li>불통일행사(일부는 찬성·일부는 반대), 서면투표·전자투표 모두 가능</li><li>결의 하자 소송: <strong>취소의 소</strong>(결의일로부터 <strong>1개월</strong> 이내), 무효확인의 소·부존재확인의 소(제소기간 제한 없음), 부당결의취소·변경의 소. 판결은 <strong>대세적 효력 + 소급효</strong></li></ul><h2 class=\"section-heading\">7. 이사·감사·감사위원회</h2><ul><li>이사는 <strong>주총에서 보통결의로 선임</strong>(주총의 전속권한). 이사 수 <strong>3인 이상</strong>(자본금 10억 미만은 1~2인 가능), 임기 <strong>3년 초과 불가</strong>(연임 가능)</li><li><strong>사외이사 강제</strong>: 상장회사는 이사 총수의 <strong>1/4 이상</strong>, 자산총액 <strong>2조원 이상</strong> 상장회사는 <strong>3인 이상 + 과반수</strong></li><li><strong>집중투표제</strong>: 발행주식총수 <strong>3% 이상</strong> 지분 주주가 주총 7일 전까지 서면·전자문서로 청구. 정관으로 배제 가능</li><li>감사: 감사의 <strong>법정 대체기관은 감사위원회</strong> (감사 또는 감사위원회 둘 중 하나만). 자산총액 <strong>2조원 이상 대형 상장회사</strong>는 감사위원회 <strong>의무</strong>, 3인 이상 이사로 구성하고 <strong>사외이사 2/3 이상</strong></li></ul><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">자본 3원칙</td><td data-label=\"핵심 내용\">확정·유지·불변</td></tr><tr><td data-label=\"구분\">설립 4단계</td><td data-label=\"핵심 내용\">발기인조합 결성 → 정관 작성 → 실체 구성 → 설립등기(2주 이내)</td></tr><tr><td data-label=\"구분\">정관 절대적기재사항</td><td data-label=\"핵심 내용\">목적·상호·발행주식총수·1주금액·설립시발행주식수·본점소재지·공고방법·발기인 성명·주민번호 (8가지)</td></tr><tr><td data-label=\"구분\">소수주주권</td><td data-label=\"핵심 내용\">소집청구·검사청구·열람청구·위법행위유지·대표소송(1%)·검사인선임·이사해임청구·집중투표·해산판결</td></tr><tr><td data-label=\"구분\">보통결의</td><td data-label=\"핵심 내용\">출석 과반 + 발행주식총수 1/4 이상 (이사 선임)</td></tr><tr><td data-label=\"구분\">특별결의</td><td data-label=\"핵심 내용\">출석 의결권 2/3 + 발행주식총수 1/3 이상 (이사 해임)</td></tr><tr><td data-label=\"구분\">특수결의</td><td data-label=\"핵심 내용\">전 주주 동의 (이사의 책임면제·조직변경)</td></tr><tr><td data-label=\"구분\">주식매수선택권</td><td data-label=\"핵심 내용\">정관 규정 + 주총 특별결의, 2년 이상 재임 후 행사</td></tr></tbody></table></div>", "quiz": [{"q": "주식회사 설립절차의 4단계를 순서대로 쓰시오.", "a": "발기인조합 결성 → 정관 작성 → 실체 구성 → 설립등기", "e": "설립등기는 실체구성 종료 후 2주 이내에 하며, 등기로 비로소 주식회사가 성립한다."}, {"q": "정관의 절대적 기재사항이 아닌 것은? (목적/상호/본점소재지/이사의 성명)", "a": "이사의 성명", "e": "절대적 기재사항 8가지는 목적, 상호, 회사가 발행할 주식의 총수, 1주 금액, 설립 시 발행주식 총수, 본점소재지, 공고방법, 발기인의 성명·주민등록번호이다."}, {"q": "소수주주권에 해당하는 것은? (이익배당청구권/대표소송제기권/신주인수권/주식양도권)", "a": "대표소송제기권", "e": "일정 지분(상법상 1%)을 모아야 행사 가능하므로 소수주주권이며, 나머지는 자익권이다."}, {"q": "이사·감사 선임과 해임의 결의 요건을 구분하시오.", "a": "선임은 주총 보통결의, 해임은 주총 특별결의", "e": "자주 나오는 함정 쌍둥이로, 이사 선임은 출석주주 과반수+발행주식총수 1/4 이상, 해임은 출석주주 의결권 2/3 이상+발행주식총수 1/3 이상이다."}, {"q": "자산총액 2조원 이상 대형 상장회사의 감사는 어떤 형태인가?", "a": "감사위원회 의무 설치", "e": "감사위원회는 감사의 법정 대체기관으로 둘 중 하나만 둘 수 있으며, 대형 상장회사는 감사위원회를 의무적으로 설치해야 한다."}]}, {"id": "omV_cgY-P4Y", "group": "기타", "groupIndex": 7, "index": 2, "label": "투자전략 (2)", "title": "증권투자권유자문인력 최종핵심 문제풀이 '투자전략(2)' 지금 바로 단기합격을 원한다면 꼭 보세요!ㅣ해커스금융 민영기", "teacher": "민영기", "nature": "문제풀이", "depth": "full", "video": "https://www.youtube.com/watch?v=omV_cgY-P4Y", "badge": "", "content": "<h2 class=\"section-heading\">1. 마코위츠 분산투자효과 (체계적 위험 vs 비체계적 위험)</h2><ul><li><strong>분산투자효과(포트폴리오 효과)</strong>: 종목 수를 늘릴수록 총위험이 줄어든다. 그러나 0까지 줄지 않고 일정 수준에 수렴하는데, 그 수렴점이 <strong>체계적 위험(시장위험)</strong> 이다</li><li><strong>체계적 위험</strong> = 분산투자로 제거 불가(분산 불능 위험). 시장의 본래 특성에 의해 야기</li><li><strong>비체계적 위험</strong> = 기업 고유 특성에 의한 위험으로 분산투자하면 <strong>제거 가능</strong></li><li>종목 수 증가 → 총위험은 <strong>각 종목 간 공분산의 평균값</strong>(≈ 체계적 위험)에 근접. 개별 종목이 포트폴리오에 미치는 영향은 종목 수 증가에 따라 감소</li><li>함정 지문: \"구성 종목 수를 증가시켜도 줄어들지 않는 위험\"은 비체계적이 아니라 <strong>체계적 위험</strong></li></ul><h2 class=\"section-heading\">2. 블랙-리터만 자산배분 모델</h2><ul><li>핵심 아이디어: ① <strong>시장 포트폴리오에 내재된 균형 기대수익률</strong> + ② <strong>투자자의 시장 전망</strong>, 두 정보를 결합해 최적 포트폴리오를 구하는 자산배분 모델</li><li>균형 기대수익률은 시장 전체 자산들을 <strong>시가총액 비율대로 편입한 시장 포트폴리오</strong>에서 도출 (구하기 쉬워 객관적 기준 역할)</li><li>장점: 평균-분산 모델의 <strong>극단적 자산배분 비중 문제</strong>를 해결, 투자자의 장기 전망을 반영해 비중 조정 가능(유연성)</li><li>함정: \"투자자의 기대수익률\"을 별도 입력하는 모델이 <strong>아님</strong> — 필요한 입력은 위 두 가지뿐</li></ul><h2 class=\"section-heading\">3. 기대수익률 측정법 4가지</h2><ol><li><strong>추세분석법</strong> — 과거 추세가 앞으로도 계속된다고 가정</li><li><strong>시나리오분석법</strong> — 경제 시나리오(호황·보통·불황)에 확률과 기대수익률을 부여해 <strong>가중평균</strong> (가장 시험 빈출, 계산문제로 나옴)</li><li><strong>펀더멘털분석법</strong> — 펀더멘털 기반 분석</li><li><strong>시장공통예측치사용법</strong> — 시장의 공통 예측치 사용</li></ol><ul><li>시나리오분석 계산 예: 호황(30%)·보통(40%)·불황(30%), A주식 기대수익률 각 20%·10%·-7% → 0.3×20 + 0.4×10 + 0.3×(-7) = <strong>11.5%</strong></li></ul><h2 class=\"section-heading\">4. 지배원리: 효율적 포트폴리오 vs 최적 포트폴리오</h2><ul><li><strong>평균-분산 기준(지배원리)</strong>: 기대수익이 동일하면 <strong>위험이 작은 것</strong> 선택, 위험이 동일하면 <strong>기대수익이 큰 것</strong> 선택. 지배당하는 쪽은 투자 후보에서 제외</li><li>지배원리로 선별된 포트폴리오들을 연결한 선 = <strong>효율적 프론티어(효율적 전선)</strong>, 그 위의 점 = <strong>효율적 포트폴리오</strong></li><li><strong>최적 포트폴리오</strong> ≠ 효율적 포트폴리오. 효율적 프론티어와 <strong>무차별곡선(투자자 효용함수)</strong> 이 만나는 접점이 최적 포트폴리오</li><li><strong>위험회피형(보수적) 투자자</strong>는 가장 위험이 낮은 효율적 증권을 선택</li></ul><h2 class=\"section-heading\">5. 투자자 유형별 효용함수</h2><ul><li><strong>위험회피형</strong>: <strong>오목(concave)</strong> 한 효용함수, 한계효용 체감</li><li><strong>위험중립형</strong>: <strong>직선</strong> (시험에 정답으로 거의 안 나옴)</li><li><strong>위험선호형</strong>: <strong>볼록(convex)</strong> 한 효용함수, 한계효용 체증</li><li>모든 투자자는 기대수익은 높을수록, 위험은 낮을수록 선호 (공통 전제)</li></ul><h2 class=\"section-heading\">6. 전략적 자산배분(SAA) vs 전술적 자산배분(TAA)</h2><ul><li><strong>전략적(SAA)</strong>: 시장은 <strong>효율적</strong>이라 가정 → <strong>소극적·장기·투자정책</strong> → 목표수익률 = <strong>시장평균수익률</strong></li><li><strong>전술적(TAA)</strong>: 시장은 <strong>비효율적</strong>이라 가정 → <strong>적극적·동적·중단기</strong> → 목표수익률 = <strong>초과수익</strong>. 수단: <strong>가격착오 활용, 과잉반응 이용, 역투자전략</strong>(쌀 때 사서 저평가 매수·고평가 매도)</li><li>SAA 실행방법 4가지: ① <strong>시장가치 접근법</strong> ② <strong>위험-수익 최적화 방법</strong> ③ <strong>투자자별 특수상황 고려 방법</strong> ④ <strong>다른 기관투자자 모방 방법</strong></li><li>함정: <strong>포뮬러플랜은 TAA의 실행방법</strong>이지 SAA가 아님</li></ul><h2 class=\"section-heading\">7. 벤치마크</h2><ul><li>펀드 운용 성과 측정의 <strong>기준</strong>. 가장 중요한 시험 포인트: <strong>운용 이전에 사전에 설정</strong>되어야 한다 (사후에 설정 불가)</li><li>펀드매니저가 추적 가능해야 하고, 펀드 특성을 잘 표현하며, 여러 지수를 조합해 만들 수도 있음. 의사소통 수단·가이드라인 역할</li></ul><h2 class=\"section-heading\">8. ESG 투자</h2><ul><li><strong>ESG</strong> = Environment(환경) + Social(사회) + Governance(지배구조). 환경·사회·지배구조가 건전한 기업에 투자하는 <strong>책임투자 = 지속가능투자</strong>(우리나라 표현: 책임투자)</li><li>핵심 특징: 재무제표 등 <strong>기존 재무정보에 포함되지 않는 비재무정보</strong>가 주된 평가 대상</li><li><strong>2006년 유엔 PRI</strong>(책임투자원칙) — 유엔 후원으로 조직된 기관투자자 네트워크, 최초의 ESG 이니셔티브</li><li><strong>2014년 GSI</strong>(글로벌지속가능투자연합)가 ESG 투자방식을 <strong>7개 범주</strong>로 정의 → <strong>7개 중 하나 이상</strong>의 기준을 적용하는 펀드가 <strong>책임투자펀드</strong>(함정: \"2개 이상\"이 아님)</li><li><strong>ESG 워싱</strong>(세탁): ESG를 가장한 마케팅 활동에 대한 주의 필요</li></ul><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">제거 불가 위험</td><td data-label=\"핵심 내용\">체계적 위험(시장위험) = 분산 불능, 공분산 평균값에 수렴</td></tr><tr><td data-label=\"구분\">제거 가능 위험</td><td data-label=\"핵심 내용\">비체계적 위험(기업고유위험)</td></tr><tr><td data-label=\"구분\">블랙-리터만 입력 2</td><td data-label=\"핵심 내용\">시장 포트폴리오의 균형 기대수익률 + 투자자의 시장 전망</td></tr><tr><td data-label=\"구분\">기대수익률 측정 4법</td><td data-label=\"핵심 내용\">추세분석·시나리오분석·펀더멘털분석·시장공통예측치사용</td></tr><tr><td data-label=\"구분\">지배원리</td><td data-label=\"핵심 내용\">수익 동일→위험 작은 것, 위험 동일→수익 큰 것</td></tr><tr><td data-label=\"구분\">최적 포트폴리오</td><td data-label=\"핵심 내용\">효율적 프론티어 × 무차별곡선(효용함수)의 접점</td></tr><tr><td data-label=\"구분\">위험회피형</td><td data-label=\"핵심 내용\">오목 효용함수 / 위험중립 직선 / 위험선호 볼록</td></tr><tr><td data-label=\"구분\">SAA vs TAA</td><td data-label=\"핵심 내용\">효율·소극·장기·시장평균 vs 비효율·적극·단기·초과수익</td></tr><tr><td data-label=\"구분\">벤치마크</td><td data-label=\"핵심 내용\">운용 이전 사전 설정 (사후 설정 불가)</td></tr><tr><td data-label=\"구분\">ESG</td><td data-label=\"핵심 내용\">비재무정보, PRI(2006), GSI 7개 범주 중 1개 이상 → 책임투자펀드</td></tr></tbody></table></div>", "quiz": [{"q": "구성 종목 수를 늘려도 줄어들지 않는 위험과 줄어드는 위험은?", "a": "체계적 위험(시장위험)은 줄어들지 않고, 비체계적 위험(기업고유위험)이 줄어든다", "e": "분산투자해도 시장 본래의 특성에서 오는 체계적 위험은 제거할 수 없으며, 총위험은 공분산의 평균값 수준에 수렴한다."}, {"q": "블랙-리터만 자산배분 모델에 반영되는 두 정보는?", "a": "시장 포트폴리오에 내재된 균형 기대수익률과 투자자의 시장 전망", "e": "평균-분산 모델의 극단적 자산배분 비중 문제를 해결하며, 투자자의 기대수익률 자체를 별도 입력하는 모델이 아니다."}, {"q": "시나리오분석법으로 기대수익률을 구하는 방법은?", "a": "각 시나리오의 확률 × 기대수익률을 모두 합한 가중평균", "e": "예) 0.3×20% + 0.4×10% + 0.3×(-7%) = 11.5%."}, {"q": "최적 포트폴리오와 효율적 포트폴리오의 관계는?", "a": "지배원리로 선별한 효율적 포트폴리오들의 선(효율적 프론티어)과 투자자의 무차별곡선이 만나는 접점이 최적 포트폴리오이다", "e": "효율적 포트폴리오는 객관적 기준, 최적은 투자자 성향(위험회피도)을 반영한 최종 선택이다."}, {"q": "전략적 자산배분과 전술적 자산배분의 시장 가정·성격·목표수익률은?", "a": "전략적은 시장 효율 가정·소극적·장기·시장평균수익률 목표, 전술적은 시장 비효율 가정·적극적·중단기·초과수익 목표", "e": "포뮬러플랜은 전술적 자산배분의 실행방법이므로 전략적 지문으로 나오면 오답이다."}, {"q": "GSI가 정의한 책임투자펀드의 기준은?", "a": "7개 투자방식 범주 중 하나 이상을 적용하는 펀드", "e": "2개 이상이 아니며, 책임투자는 지속가능투자라고도 하고 기존 재무정보에 포함되지 않는 비재무정보를 평가한다."}]}, {"id": "90j3n6KP3uI", "group": "기타", "groupIndex": 7, "index": 3, "label": "기본서 핵심정리", "title": "[해커스금융] 증권투자권유자문인력 기본서 핵심정리", "teacher": "미표기 (영상 제목·자막에 강사명 없음)", "nature": "이론정리", "depth": "full", "video": "https://www.youtube.com/watch?v=90j3n6KP3uI", "badge": "", "content": "<h2 class=\"section-heading\">1. 기본적 분석 vs 기술적 분석</h2><ul><li><strong>기본적 분석</strong>: 기업의 <strong>내재가치(진정한 가치·본질가치)</strong> 를 찾아내는 것이 목적. <strong>재무제표 자료</strong> 사용. 주가 변화의 <strong>원인</strong>에 관심</li><li><strong>기술적 분석</strong>: 내재가치와 무관. <strong>과거 가격·거래량</strong>을 도표(차트)화해 분석. 주가 변화의 <strong>현상</strong>에만 관심, 원인은 관심 없음</li><li>배경 전제: 기술적 분석은 <strong>수요-공급</strong>이 가격을 결정하고, 수요-공급의 밑바탕에는 <strong>투자자 심리(욕망)</strong> 가 있다고 본다. 심리가 가격·거래량으로 나타나므로 이를 도표화하는 것</li><li>기술적 분석은 <strong>차티스트</strong>라고도 하며, 과거 주가 패턴이 반복된다고 가정(과거 중시)</li></ul><h2 class=\"section-heading\">2. 탑다운 vs 바텀업</h2><ul><li><strong>탑다운 방식</strong> = <strong>경제분석 → 산업분석 → 기업분석</strong>(종목 선정). 큰 쪽에서 작은 쪽으로 분석</li><li><strong>바텀업 방식</strong> = <strong>기업분석 → 산업분석 → 경제분석</strong>. 작은 쪽에서 큰 쪽으로 올라감</li><li>일반적으로 <strong>탑다운</strong>을 많이 사용. 교재도 탑다운 순서(경기분석 → 기업분석)로 구성</li></ul><h2 class=\"section-heading\">3. 경제환경과 주가 (7개 요소)</h2><h3 class=\"subheading\">① 경기전망과 주가 — 출제 비중 낮음, 읽고 넘어가기</h3><ul><li>경기가 좋아질 것 같으면 주가 상승, 나빠질 것 같으면 하락 (직관적)</li></ul><h3 class=\"subheading\">② 통화량과 주가 — 유동성효과·소득효과·피셔효과 (시험 빈출)</h3><ul><li><strong>유동성효과</strong>: 통화량 증가 → <strong>단기적으로 금리 하락</strong> → 주가 <strong>긍정</strong>(상승)</li><li><strong>소득효과</strong>: 금리 하락 → 투자↑ → 소득↑ → 화폐수요↑ → 금리 <strong>상승</strong> (금리 올리는 효과)</li><li><strong>피셔효과(기대인플레이션 효과)</strong>: 통화량 증가 → 인플레이션 → <strong>명목금리 상승</strong> (금리 올리는 효과)</li><li>결론: 통화량 증가는 <strong>단기적으로 주가에 긍정적</strong>이나, 장기적으로 소득효과·피셔효과가 금리를 올리므로 <strong>장기까지 긍정적이라 볼 수 없음</strong></li><li>부수 개념: <strong>피셔의 화폐교환방정식</strong> MV = PT (통화유통속도는 일정 가정)</li></ul><h3 class=\"subheading\">③ 금리와 주가 — 반대로 움직임</h3><ul><li>금리 상승 → 자금조달 축소 → 설비투자 축소 → 기업 실적 악화 → <strong>주가 하락</strong></li><li>금리 하락 → 자금조달 확대 → 투자 확대 → <strong>주가 상승</strong></li></ul><h3 class=\"subheading\">④ 물가와 주가 — 완만한 상승은 긍정, 급격한 상승은 부정</h3><ul><li><strong>완만한 물가상승</strong> = 기업 입장에서 판매가격 상승 → <strong>주가 긍정</strong></li><li><strong>급격한 물가상승(하이퍼인플레이션)</strong> = 경제 혼란 → 미래 전망 암울 → <strong>주가 부정</strong></li><li><strong>디스인플레이션</strong>(물가는 오르나 물가상승률이 둔화) = 경제 안정 신호 → <strong>주가 상승 요인</strong></li><li><strong>스태그플레이션</strong>(물가 상승 + 경기 불황) = 최악의 사태 → <strong>주가 하락</strong></li><li><strong>인플레이션 헤지</strong>: 물가가 오르면 기업 보유자산의 명목가치가 상승해 자산재평가·무상증자가 가능 → 주식 보유로 물가상승을 방어할 수 있다는 반론 이론</li></ul><h3 class=\"subheading\">⑤ 환율과 주가 — 우리나라(수출 의존형)는 환율 상승이 긍정</h3><ul><li>환율 상승 → 수출↑·수입↓ → 경상수지 개선 → 기업 실적 개선 → <strong>주가 상승</strong></li><li>환율 하락 → 수출↓·수입↑ → 경상수지 악화 → <strong>주가 하락</strong></li><li>수출기업에는 환율 상승이 유리, 수입기업에는 환율 하락이 유리하지만, 우리나라 전체 경제는 수출 의존도가 압도적이므로 환율 상승이 주가를 올린다고 정리</li></ul><h3 class=\"subheading\">⑥ 원자재가격과 주가 — 반대로 움직임</h3><ul><li>원자재가격 상승 → 비용 상승 → 경제에 부정 → <strong>주가 하락</strong>. 단순 역의 관계</li></ul><h3 class=\"subheading\">⑦ 외국인투자자와 주가 — 환율 변동률 vs 주가 변동률 비교 (암기)</h3><ul><li><strong>주가가 떨어져도 환율 하락률이 주가 하락률보다 크면 외국인투자자는 주식을 매입</strong>한다</li><li><strong>주가가 올라도 환율 상승률이 주가 상승률보다 크면 주식을 매입하지 않는다</strong>(오히려 판다)</li><li>교재 표현: \"환율 인하율이 주가 하락률을 <strong>상회</strong>하면 매입하고, 환율 인상률이 주가 상승률을 <strong>초과</strong>하면 매입하지 않는다\"</li><li>예시(1달러=1,000원에 투자): 주가가 1,000원→900원으로 떨어져도 환율이 800원으로 더 떨어지면, 달러 기준으로는 더 많은 돈으로 나가므로 매입. 반대로 주가가 1,000원→1,100원으로 올라도 환율이 1,200원이면 달러 환전 시 손실이라 미매입</li></ul><h2 class=\"section-heading\">시험 직전 암기표</h2><div class=\"table-wrap\"><table><thead><tr><th>구분</th><th>핵심 내용</th></tr></thead><tbody><tr><td data-label=\"구분\">기본적 vs 기술적</td><td data-label=\"핵심 내용\">내재가치·재무제표·원인 vs 가격/거래량·차트·현상</td></tr><tr><td data-label=\"구분\">탑다운</td><td data-label=\"핵심 내용\">경제 → 산업 → 기업 (큰→작은)</td></tr><tr><td data-label=\"구분\">통화량 3효과</td><td data-label=\"핵심 내용\">유동성(단기 금리↓·주가↑) / 소득효과(금리↑) / 피셔효과(금리↑)</td></tr><tr><td data-label=\"구분\">금리-주가</td><td data-label=\"핵심 내용\">반대로 움직임</td></tr><tr><td data-label=\"구분\">물가-주가</td><td data-label=\"핵심 내용\">완만↑ 긍정 / 급격↑ 부정 / 디스인플레이션 긍정 / 스태그플레이션 부정</td></tr><tr><td data-label=\"구분\">환율-주가</td><td data-label=\"핵심 내용\">(수출 의존형 한국) 환율↑ → 수출↑·수입↓ → 주가↑</td></tr><tr><td data-label=\"구분\">원자재가격-주가</td><td data-label=\"핵심 내용\">반대로 움직임</td></tr><tr><td data-label=\"구분\">외국인</td><td data-label=\"핵심 내용\">환율하락률이 주가하락률보다 크면 매입 / 환율상승률이 주가상승률보다 크면 미매입</td></tr></tbody></table></div>", "quiz": [{"q": "기본적 분석과 기술적 분석의 접근 방법을 구분하시오.", "a": "기본적 분석은 재무제표를 이용해 기업의 내재가치를 찾고 주가 변화의 원인에 관심, 기술적 분석은 과거 가격·거래량을 도표화해 주가 변화의 현상만 분석", "e": "기본적=진정한 가치(내재가치·본질가치)를 기준으로 고평가면 매도·저평가면 매수."}, {"q": "통화량 증가가 주가에 미치는 단기·장기 효과를 유동성효과·소득효과·피셔효과로 설명하시오.", "a": "단기적으로 유동성효과로 금리가 떨어져 주가에 긍정적이나, 장기적으로 소득효과와 피셔효과가 금리를 올리므로 장기까지 긍정적이라 할 수 없음", "e": "세 효과 모두 금리 경로를 통해 주가에 영향을 준다."}, {"q": "스태그플레이션과 디스인플레이션이 주가에 미치는 영향은?", "a": "스태그플레이션(물가 상승+경기 불황)은 주가 하락, 디스인플레이션(물가상승률 둔화)은 주가 상승 요인", "e": "완만한 물가상승도 주가에 긍정적이나 급격한 물가상승은 부정적."}, {"q": "우리나라에서 환율 상승이 주가에 미치는 영향과 그 근거는?", "a": "주가 상승. 우리나라는 수출 의존도가 압도적이므로 환율 상승 시 수출↑·수입↓로 경상수지가 개선되고 기업 실적이 좋아지기 때문", "e": "환율 하락이면 반대(주가 하락)."}, {"q": "외국인투자자는 주가가 올라도 주식을 매입하지 않을 수 있다. 그 조건은?", "a": "환율 상승률이 주가 상승률보다 클 때", "e": "자국 통화 기준으로 환산하면 손실이 되므로 미매입. 반대로 주가 하락 시 환율 하락률이 주가 하락률보다 크면 매입."}]}];
    const groupColors = ["#146c62", "#b2492f", "#2f68a0", "#6d5687", "#8a5b16", "#a53d58", "#4c6b3c", "#475569"];

      if (nature.includes('이론')) return '이론정리';
      if (nature.includes('기출')) return '기출풀이';
      if (nature.includes('문제')) return '문제풀이';

        </li>`
      ).join('');

      $('#sideList').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.id));

      const quizList = Array.isArray(x.quiz) ? x.quiz : [];
      const quizHtml = quizList.length > 0 ? `
        <section class="quiz">
          <div class="quiz-head">
            <h2>복습 문제 (${quizList.length})</h2>
            <div class="quiz-actions">
              <button type="button" class="quiz-toggle-btn" id="openAllQuiz">모두 열기</button>
              <button type="button" class="quiz-toggle-btn" id="closeAllQuiz">모두 닫기</button>
            </div>
          </div>
          <p class="quiz-intro">문제를 먼저 머릿속으로 풀어보고 펼쳐서 정답과 해설을 확인하세요.</p>
          ${quizList.map((q, i) => `
            <details class="quiz-item">
              <summary>
                <span class="q-num">Q${i + 1}</span>
                <span class="q-text">${esc(q.q)}</span>
                <span class="toggle-icon">+</span>
              </summary>
              <div class="answer">
                <div class="answer-row">
                  <span class="badge-ans">정답</span>
                  <div>${q.a}</div>
                </div>
                ${q.e ? `
                  <div class="answer-row">
                    <span class="badge-exp">해설</span>
                    <div>${q.e}</div>
                  </div>
                ` : ''}
              </div>
            </details>
          `).join('')}
        </section>
      ` : '';

      $('#article').innerHTML = `
        <div class="crumb">
          <a href="#" onclick="go();return false;">전체 강의</a>
          <span>/</span>
          <span>${esc(x.group)}</span>
          <span>/</span>
          <span style="color:var(--ink);font-weight:700;">${esc(x.label)}</span>
        </div>
        <div class="kicker">
          <span class="pill accent">${esc(x.group)}</span>
          <span class="pill">${esc(x.nature)}</span>
          ${x.depth === 'thin' ? '<span class="pill">요약 강의</span>' : ''}
          ${x.badge ? `<span class="pill warn">${esc(x.badge)}</span>` : ''}
        </div>
        <h1 class="article-title">${esc(x.label)}</h1>
        <div class="article-meta">
          <span>강사: <strong>${esc(x.teacher)}</strong></span>
          <span>출처: 해커스금융</span>
          <a class="video-link" href="${esc(x.video)}" target="_blank" rel="noopener noreferrer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            원본 영상 보기 ↗
          </a>
        </div>
        <div class="article-body">
          ${x.content}
        </div>
        ${quizHtml}
        <nav class="pager">
          ${prev ? `
            <button class="pager-btn prev" type="button" data-id="${esc(prev.id)}">
              <small>← 이전 강의</small>
              <span>${esc(prev.label)}</span>
            </button>
          ` : '<span></span>'}
          ${next ? `
            <button class="pager-btn next" type="button" data-id="${esc(next.id)}">
              <small>다음 강의 →</small>
              <span>${esc(next.label)}</span>
            </button>
          ` : '<span></span>'}
        </nav>
      `;

      $('#article').querySelectorAll('.pager button').forEach(b => b.onclick = () => go(b.dataset.id));

      const openBtn = $('#openAllQuiz');
      const closeBtn = $('#closeAllQuiz');
      if (openBtn && closeBtn) {
        openBtn.onclick = () => {
          document.querySelectorAll('.quiz-item').forEach(d => d.open = true);
        };
        closeBtn.onclick = () => {
          document.querySelectorAll('.quiz-item').forEach(d => d.open = false);
        };
      }

      document.title = `${x.label} · 핵심자료`;
      window.scrollTo(0, 0);
    }

    function route() {
      const m = location.hash.match(/^#lecture=(.+)$/);
      if (m) {
        const id = decodeURIComponent(m[1]);
        const x = lectures.find(v => v.id === id);
        if (x) return renderLecture(x);
      }
      renderIndex();
    }

    $('#homeBtn').onclick = () => go();
    $('#searchInput').addEventListener('input', e => renderCards(e.target.value));
    window.addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>
