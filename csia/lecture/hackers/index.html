<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>해커스금융 강의 핵심자료</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --paper: #ffffff;
      --paper-2: #f1f5f9;
      --paper-hover: #f8fafc;
      --ink: #0f172a;
      --ink-secondary: #334155;
      --muted: #64748b;
      --line: #e2e8f0;
      --line-strong: #cbd5e1;
      --nav: #0f172a;
      --nav-text: #f8fafc;
      --nav-border: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --accent-border: #bfdbfe;
      --highlight: #fef08a;
      --highlight-ink: #713f12;
      --badge-bg: #e2e8f0;
      --badge-ink: #334155;
      --th-bg: #1e293b;
      --th-ink: #f8fafc;
      --table-border: #e2e8f0;
      --table-zebra: #f8fafc;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 12px 28px -4px rgba(15, 23, 42, 0.12), 0 4px 10px -2px rgba(15, 23, 42, 0.05);
      --focus: #3b82f6;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f17;
        --paper: #131b28;
        --paper-2: #1b2536;
        --paper-hover: #1e2a3c;
        --ink: #f1f5f9;
        --ink-secondary: #cbd5e1;
        --muted: #94a3b8;
        --line: #263346;
        --line-strong: #33445c;
        --nav: #080d14;
        --nav-text: #f8fafc;
        --nav-border: #1b2536;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-soft: #172554;
        --accent-border: #1e3a8a;
        --highlight: rgba(250, 204, 21, 0.22);
        --highlight-ink: #fde047;
        --badge-bg: #1e293b;
        --badge-ink: #cbd5e1;
        --th-bg: #1e293b;
        --th-ink: #f8fafc;
        --table-border: #263346;
        --table-zebra: #162030;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.35);
        --shadow-lg: 0 14px 34px rgba(0, 0, 0, 0.45);
        --focus: #60a5fa;
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      line-height: 1.75;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    button, input, a { font: inherit; }
    a { color: inherit; text-decoration: none; }

    /* Topbar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--nav-text);
      border-bottom: 1px solid var(--nav-border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .topbar-inner {
      max-width: 1200px;
      margin: auto;
      min-height: 60px;
      padding: 8px 24px;
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .home-btn {
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      display: none;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      transition: all 0.15s ease;
      align-items: center;
      gap: 6px;
    }
    .home-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.35);
    }
    .home-btn.visible { display: inline-flex; }
    .search {
      margin-left: auto;
      position: relative;
      width: min(380px, 60vw);
    }
    .search input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-radius: var(--radius-md);
      padding: 9px 14px 9px 38px;
      outline: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .search input::placeholder { color: #94a3b8; }
    .search input:focus {
      border-color: #60a5fa;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.25);
    }
    .search svg {
      position: absolute;
      left: 12px;
      top: 10px;
      opacity: 0.65;
    }
    .status {
      font-size: 0.84rem;
      color: #94a3b8;
      white-space: nowrap;
      font-weight: 500;
    }

    /* Main layout */
    .wrap {
      max-width: 1200px;
      margin: auto;
      padding: 36px 24px 80px;
    }

    /* Hero */
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 36px;
      align-items: center;
      padding: 20px 0 36px;
      border-bottom: 1px solid var(--line);
    }
    .hero h1 {
      font-size: clamp(2rem, 4.5vw, 3.2rem);
      font-weight: 850;
      line-height: 1.18;
      letter-spacing: -0.04em;
      margin: 0 0 16px;
      color: var(--ink);
    }
    .hero p {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 640px;
      margin: 0;
      line-height: 1.7;
    }
    .stat-board {
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 22px 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .stat strong {
      font-size: 2.1rem;
      font-weight: 850;
      display: block;
      line-height: 1.1;
      color: var(--accent);
      letter-spacing: -0.03em;
    }
    .stat span {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
    }

    /* Group Nav */
    .group-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 28px 0 36px;
    }
    .group-nav button {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink-secondary);
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }
    .group-nav button:hover, .group-nav button:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
      outline: none;
    }

    /* Group Section & Cards */
    .group-section {
      margin: 0 0 54px;
    }
    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--line);
    }
    .group-head h2 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin: 0;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .group-head .count-badge {
      font-size: 0.82rem;
      color: var(--muted);
      background: var(--paper-2);
      border: 1px solid var(--line);
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 600;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 16px;
    }
    .lecture-card {
      position: relative;
      text-align: left;
      border: 1px solid var(--line);
      border-left: 4px solid var(--group-color);
      background: var(--paper);
      color: var(--ink);
      padding: 18px 20px;
      cursor: pointer;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 154px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .lecture-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--line-strong);
    }
    .lecture-card:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .card-index {
      font-weight: 750;
      font-size: 0.82rem;
      color: var(--muted);
      background: var(--paper-2);
      padding: 2px 7px;
      border-radius: 4px;
    }
    .card-nature {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .lecture-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.45;
      margin: 0 0 14px;
      color: var(--ink);
      letter-spacing: -0.015em;
    }
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .card-bottom .teacher {
      font-weight: 600;
      color: var(--ink-secondary);
    }
    .card-bottom .arrow {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.95rem;
      transition: transform 0.15s ease;
    }
    .lecture-card:hover .arrow {
      transform: translateX(3px);
    }
    .empty {
      grid-column: 1 / -1;
      padding: 48px 24px;
      background: var(--paper);
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-md);
      text-align: center;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .footer-note {
      margin-top: 54px;
      color: var(--muted);
      font-size: 0.84rem;
      text-align: center;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    /* Lecture View Layout */
    .lecture-layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 820px);
      gap: 40px;
      justify-content: center;
      align-items: start;
    }
    .side {
      position: sticky;
      top: 80px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      padding-right: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }
    .side::-webkit-scrollbar {
      width: 4px;
    }
    .side::-webkit-scrollbar-thumb {
      background: var(--line-strong);
      border-radius: 4px;
    }
    .side .group-label {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--accent);
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }
    .side ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .side li {
      margin-bottom: 4px;
    }
    .side button {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 9px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: var(--radius-sm);
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .side button:hover {
      background: var(--paper-2);
      color: var(--ink);
    }
    .side button.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 750;
      border-color: var(--accent-border);
    }

    /* Article Reader */
    .article {
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-md);
      padding: clamp(28px, 5vw, 64px);
      border-radius: var(--radius-lg);
    }
    .crumb {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .crumb span { color: var(--ink); }
    .kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--paper-2);
      border: 1px solid var(--line);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--ink-secondary);
    }
    .pill.accent {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent);
    }
    .pill.warn {
      background: #fef2f2;
      border-color: #fecaca;
      color: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      .pill.warn {
        background: #450a0a;
        border-color: #7f1d1d;
        color: #fca5a5;
      }
    }
    .article-title {
      font-size: clamp(1.85rem, 4vw, 2.45rem);
      font-weight: 850;
      line-height: 1.26;
      letter-spacing: -0.035em;
      margin: 0 0 16px;
      color: var(--ink);
    }
    .article-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 18px;
      color: var(--muted);
      font-size: 0.88rem;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }
    .video-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #ffffff !important;
      font-weight: 700;
      font-size: 0.82rem;
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      margin-left: auto;
      transition: background 0.15s ease;
    }
    .video-link:hover {
      background: var(--accent-hover);
    }

    /* Article Content Typography */
    .article-body {
      font-size: 1.02rem;
      color: var(--ink-secondary);
      line-height: 1.76;
    }
    .section-heading {
      font-size: 1.36rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin: 46px 0 18px;
      padding: 10px 16px;
      background: var(--paper-2);
      border-left: 4px solid var(--accent);
      border-radius: 0 8px 8px 0;
      color: var(--ink);
    }
    .subheading {
      font-size: 1.1rem;
      font-weight: 750;
      letter-spacing: -0.015em;
      margin: 28px 0 12px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subheading::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .article-body p {
      margin: 12px 0;
    }
    .article-body ul, .article-body ol {
      margin: 12px 0 20px;
      padding-left: 1.5rem;
    }
    .article-body li {
      margin: 8px 0;
      line-height: 1.74;
    }
    .article-body li::marker {
      color: var(--accent);
      font-weight: 700;
    }
    .article-body strong {
      background: var(--highlight);
      color: var(--highlight-ink);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .article-body hr {
      border: 0;
      border-top: 1px dashed var(--line-strong);
      margin: 36px 0;
    }
    .article-body blockquote {
      margin: 22px 0;
      padding: 16px 20px;
      background: var(--paper-2);
      border-left: 4px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--ink);
      font-size: 0.96rem;
    }

    /* Table (암기표) */
    .table-wrap {
      margin: 22px 0 32px;
      border: 1px solid var(--table-border);
      border-radius: var(--radius-md);
      overflow-x: auto;
      box-shadow: var(--shadow-sm);
      background: var(--paper);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.94rem;
      text-align: left;
    }
    th {
      background: var(--th-bg);
      color: var(--th-ink);
      font-weight: 750;
      padding: 13px 18px;
      letter-spacing: -0.01em;
      border-bottom: 1px solid var(--line);
    }
    td {
      padding: 13px 18px;
      border-bottom: 1px solid var(--table-border);
      line-height: 1.68;
      vertical-align: middle;
      color: var(--ink-secondary);
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    tbody tr:nth-child(even) {
      background: var(--table-zebra);
    }
    tbody tr:hover {
      background: var(--accent-soft);
    }
    td[data-label="구분"] {
      font-weight: 750;
      color: var(--ink);
      word-break: keep-all;
    }

    /* Quiz Section */
    .quiz {
      margin-top: 54px;
      padding: 28px;
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
    }
    .quiz-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 8px;
    }
    .quiz-head h2 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .quiz-actions {
      display: flex;
      gap: 8px;
    }
    .quiz-toggle-btn {
      border: 1px solid var(--line-strong);
      background: var(--paper);
      color: var(--ink-secondary);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 650;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .quiz-toggle-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }
    .quiz-intro {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 20px;
    }
    .quiz-item {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .quiz-item:hover {
      border-color: var(--line-strong);
    }
    .quiz-item[open] {
      border-color: var(--accent-border);
      box-shadow: var(--shadow-sm);
    }
    .quiz summary {
      cursor: pointer;
      font-weight: 650;
      font-size: 0.98rem;
      padding: 15px 18px;
      list-style: none;
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      line-height: 1.55;
      color: var(--ink);
    }
    .quiz summary::-webkit-details-marker {
      display: none;
    }
    .quiz summary .q-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      min-width: 32px;
      height: 24px;
      padding: 0 6px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 4px;
      font-weight: 800;
      font-size: 0.78rem;
    }
    .quiz summary .q-text {
      flex: 1;
    }
    .quiz summary .toggle-icon {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 1.15rem;
      font-weight: 300;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .quiz-item[open] summary .toggle-icon {
      transform: rotate(45deg);
      color: var(--accent);
    }
    .answer {
      background: var(--paper-2);
      padding: 16px 20px;
      border-top: 1px solid var(--line);
      font-size: 0.94rem;
    }
    .answer-row {
      margin: 6px 0;
      display: flex;
      align-items: baseline;
      gap: 10px;
      line-height: 1.68;
    }
    .badge-ans, .badge-exp {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .badge-ans {
      background: #059669;
      color: #ffffff;
    }
    .badge-exp {
      background: var(--line-strong);
      color: var(--ink);
    }

    /* Pager Navigation */
    .pager {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }
    .pager-btn {
      display: flex;
      flex-direction: column;
      padding: 16px 20px;
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pager-btn:hover {
      background: var(--paper);
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .pager-btn.next {
      text-align: right;
      align-items: flex-end;
    }
    .pager-btn small {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 650;
      margin-bottom: 4px;
    }
    .pager-btn span {
      font-weight: 750;
      font-size: 1rem;
      color: var(--ink);
      line-height: 1.4;
    }

    .hidden { display: none !important; }

    /* Responsive */
    @media (max-width: 860px) {
      .topbar-inner { padding: 8px 16px; }
      .status { display: none; }
      .wrap { padding: 24px 16px 64px; }
      .hero { grid-template-columns: 1fr; gap: 24px; }
      .stat-board { max-width: 360px; }
      .lecture-layout { display: block; }
      .side { display: none; }
      .article { padding: 24px 18px; border-radius: var(--radius-md); }
      .article-title { font-size: 1.85rem; }
      .pager { grid-template-columns: 1fr; }
      .pager-btn.next { text-align: left; align-items: flex-start; }
    }

    @media (max-width: 600px) {
      .search { width: auto; flex: 1; }
      .search input { font-size: 15px; }
      .hero h1 { font-size: 2.15rem; }
      .cards { grid-template-columns: 1fr; }
      .group-nav { margin-bottom: 24px; }
      .group-section { margin-bottom: 38px; }
      .table-wrap table, .table-wrap tbody, .table-wrap tr, .table-wrap td {
        display: block;
        width: 100%;
      }
      .table-wrap thead { display: none; }
      .table-wrap tr {
        border-bottom: 1px solid var(--line);
        margin: 0;
        padding: 10px 14px;
      }
      .table-wrap td {
        border: 0;
        padding: 6px 0;
      }
      .table-wrap td:before {
        content: attr(data-label);
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 800;
        margin-bottom: 2px;
      }
      .section-heading { font-size: 1.25rem; margin-top: 36px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .lecture-card, .pager-btn { transition: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="../index.html" style="color:#94a3b8; font-size:0.84rem; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:4px; padding:6px 10px; border-radius:6px; border:1px solid rgba(255,255,255,0.15); transition:all 0.15s ease;" onmouseover="this.style.color='#fff';this.style.borderColor='rgba(255,255,255,0.35)'" onmouseout="this.style.color='#94a3b8';this.style.borderColor='rgba(255,255,255,0.15)'">← 강의 포털</a>
      <button id="homeBtn" class="home-btn" type="button" aria-label="해커스 목록으로">목록으로</button>
      <div class="search" id="searchBox">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input id="searchInput" type="search" placeholder="제목·강사·주제 검색" aria-label="강의 검색">
      </div>
      <span class="status" id="status">37개 핵심자료</span>
    </div>
  </header>

  <main id="indexView" class="wrap">
    <section class="hero">
      <div>
        <h1>37강 핵심자료를 한 권처럼.<br>시험 직전까지.</h1>
        <p>해커스금융 증권투자권유자문인력 강의의 핵심 개념, 암기표, 복습 문제를 주제별로 묶었습니다. 검색하거나 아래 주제를 골라 바로 학습하세요.</p>
      </div>
      <div class="stat-board">
        <div class="stat"><strong>37</strong><span>핵심 강의 노트</span></div>
        <div class="stat"><strong>8</strong><span>주제 묶음</span></div>
      </div>
    </section>

    <nav class="group-nav" id="groupNav" aria-label="주제 바로가기"></nav>

    <div id="groups"></div>

    <p class="footer-note">정리 기준: 확보된 한국어 자막 기반 시험 핵심 요약 · 강의별 원본 영상은 각 노트 상단에서 확인할 수 있습니다.</p>
  </main>

  <main id="lectureView" class="wrap hidden">
    <div class="lecture-layout">
      <aside class="side">
        <div class="group-label" id="sideGroup"></div>
        <ol id="sideList"></ol>
      </aside>
      <article class="article" id="article"></article>
    </div>
  </main>

  <script src="lectures-data.js"></script>
  <script>
    const lectures = window.HACKERS_LECTURES || [];
    const groupColors = ["#146c62", "#b2492f", "#2f68a0", "#6d5687", "#8a5b16", "#a53d58", "#4c6b3c", "#475569"];
    const groups = [...new Set(lectures.map(x => x.group))];
    const $ = s => document.querySelector(s);
    const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    function go(id) {
      location.hash = id ? 'lecture=' + encodeURIComponent(id) : '';
    }

    function renderIndex() {
      $('#indexView').classList.remove('hidden');
      $('#lectureView').classList.add('hidden');
      $('#homeBtn').classList.remove('visible');
      $('#searchBox').classList.remove('hidden');

      const nav = $('#groupNav');
      nav.innerHTML = groups.map((g, i) =>
        `<button type="button" data-target="group-${i}">${esc(g)} · ${lectures.filter(x => x.group === g).length}</button>`
      ).join('');

      nav.querySelectorAll('button').forEach(b =>
        b.onclick = () => document.getElementById(b.dataset.target).scrollIntoView({ behavior: 'smooth' })
      );

      renderCards($('#searchInput').value);
      document.title = '해커스금융 강의 핵심자료';
      window.scrollTo(0, 0);
    }

    function getNatureShort(nature) {
      if (!nature) return '강의';
      if (nature.includes('이론')) return '이론정리';
      if (nature.includes('기출')) return '기출풀이';
      if (nature.includes('문제')) return '문제풀이';
      return nature.split(' ')[0];
    }

    function renderCards(query = '') {
      query = query.trim().toLowerCase();
      let shown = 0;

      $('#groups').innerHTML = groups.map((g, gi) => {
        const items = lectures.filter(x => x.group === g && (!query || [x.title, x.label, x.teacher, x.nature, x.group].join(' ').toLowerCase().includes(query)));
        shown += items.length;
        if (!items.length) return '';

        return `
          <section class="group-section" id="group-${gi}">
            <div class="group-head">
              <h2>${esc(g)}</h2>
              <span class="count-badge">${items.length}강</span>
            </div>
            <div class="cards">
              ${items.map(x => {
                const groupTotal = lectures.filter(y => y.group === g).length;
                const natShort = getNatureShort(x.nature);
                return `
                  <button class="lecture-card" type="button" data-id="${esc(x.id)}" style="--group-color:${groupColors[gi % groupColors.length]}">
                    <div class="card-top">
                      <span class="card-index">${String(x.index).padStart(2, '0')} / ${String(groupTotal).padStart(2, '0')}</span>
                      <span class="card-nature">${esc(natShort)}</span>
                    </div>
                    <h3>${esc(x.label)}</h3>
                    <div class="card-bottom">
                      <span class="teacher">${esc(x.teacher)}</span>
                      <span class="arrow" aria-hidden="true">학습하기 →</span>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </section>
        `;
      }).join('') || `<div class="empty">검색 결과가 없습니다. 다른 키워드로 찾아보세요.</div>`;

      document.querySelectorAll('.lecture-card').forEach(b => b.onclick = () => go(b.dataset.id));
      $('#status').textContent = query ? `${shown}개 검색됨` : `${lectures.length}개 핵심자료`;
    }

    function renderLecture(x) {
      $('#indexView').classList.add('hidden');
      $('#lectureView').classList.remove('hidden');
      $('#homeBtn').classList.add('visible');
      $('#searchBox').classList.add('hidden');

      const peers = lectures.filter(y => y.group === x.group);
      const p = peers.findIndex(y => y.id === x.id);
      const prev = peers[p - 1];
      const next = peers[p + 1];

      $('#status').textContent = `${x.index} / ${peers.length}`;
      $('#sideGroup').textContent = x.group;
      $('#sideList').innerHTML = peers.map(y =>
        `<li>
          <button type="button" data-id="${esc(y.id)}" class="${y.id === x.id ? 'active' : ''}">
            <span style="opacity:0.65;font-weight:700;">${String(y.index).padStart(2, '0')}</span>
            <span>${esc(y.label)}</span>
          </button>
        </li>`
      ).join('');

      $('#sideList').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.id));

      const quizList = Array.isArray(x.quiz) ? x.quiz : [];
      const quizHtml = quizList.length > 0 ? `
        <section class="quiz">
          <div class="quiz-head">
            <h2>복습 문제 (${quizList.length})</h2>
            <div class="quiz-actions">
              <button type="button" class="quiz-toggle-btn" id="openAllQuiz">모두 열기</button>
              <button type="button" class="quiz-toggle-btn" id="closeAllQuiz">모두 닫기</button>
            </div>
          </div>
          <p class="quiz-intro">문제를 먼저 머릿속으로 풀어보고 펼쳐서 정답과 해설을 확인하세요.</p>
          ${quizList.map((q, i) => `
            <details class="quiz-item">
              <summary>
                <span class="q-num">Q${i + 1}</span>
                <span class="q-text">${esc(q.q)}</span>
                <span class="toggle-icon">+</span>
              </summary>
              <div class="answer">
                <div class="answer-row">
                  <span class="badge-ans">정답</span>
                  <div>${q.a}</div>
                </div>
                ${q.e ? `
                  <div class="answer-row">
                    <span class="badge-exp">해설</span>
                    <div>${q.e}</div>
                  </div>
                ` : ''}
              </div>
            </details>
          `).join('')}
        </section>
      ` : '';

      $('#article').innerHTML = `
        <div class="crumb">
          <a href="#" onclick="go();return false;">전체 강의</a>
          <span>/</span>
          <span>${esc(x.group)}</span>
          <span>/</span>
          <span style="color:var(--ink);font-weight:700;">${esc(x.label)}</span>
        </div>
        <div class="kicker">
          <span class="pill accent">${esc(x.group)}</span>
          <span class="pill">${esc(x.nature)}</span>
          ${x.depth === 'thin' ? '<span class="pill">요약 강의</span>' : ''}
          ${x.badge ? `<span class="pill warn">${esc(x.badge)}</span>` : ''}
        </div>
        <h1 class="article-title">${esc(x.label)}</h1>
        <div class="article-meta">
          <span>강사: <strong>${esc(x.teacher)}</strong></span>
          <span>출처: 해커스금융</span>
          <a class="video-link" href="${esc(x.video)}" target="_blank" rel="noopener noreferrer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            원본 영상 보기 ↗
          </a>
        </div>
        <div class="article-body">
          ${x.content}
        </div>
        ${quizHtml}
        <nav class="pager">
          ${prev ? `
            <button class="pager-btn prev" type="button" data-id="${esc(prev.id)}">
              <small>← 이전 강의</small>
              <span>${esc(prev.label)}</span>
            </button>
          ` : '<span></span>'}
          ${next ? `
            <button class="pager-btn next" type="button" data-id="${esc(next.id)}">
              <small>다음 강의 →</small>
              <span>${esc(next.label)}</span>
            </button>
          ` : '<span></span>'}
        </nav>
      `;

      $('#article').querySelectorAll('.pager button').forEach(b => b.onclick = () => go(b.dataset.id));

      const openBtn = $('#openAllQuiz');
      const closeBtn = $('#closeAllQuiz');
      if (openBtn && closeBtn) {
        openBtn.onclick = () => {
          document.querySelectorAll('.quiz-item').forEach(d => d.open = true);
        };
        closeBtn.onclick = () => {
          document.querySelectorAll('.quiz-item').forEach(d => d.open = false);
        };
      }

      document.title = `${x.label} · 핵심자료`;
      window.scrollTo(0, 0);
    }

    function route() {
      const m = location.hash.match(/^#lecture=(.+)$/);
      if (m) {
        const id = decodeURIComponent(m[1]);
        const x = lectures.find(v => v.id === id);
        if (x) return renderLecture(x);
      }
      renderIndex();
    }

    $('#homeBtn').onclick = () => go();
    $('#searchInput').addEventListener('input', e => renderCards(e.target.value));
    window.addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>
