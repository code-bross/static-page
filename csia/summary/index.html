<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>증권투자권유자문인력 - 시니어 전문가 심화 요약집 & 구조도 캡처</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <!-- KaTeX Math Formula Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <style>
    body {
      background-color: var(--bg-body);
      color: var(--text-primary);
      min-height: 100vh;
      font-family: var(--font-sans);
    }

    .summary-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.5rem;
    }

    .summary-nav {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .nav-title {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-banner {
      max-width: 1200px;
      margin: 1.5rem auto 1rem auto;
      padding: 1.75rem 2rem;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.25), rgba(168, 85, 247, 0.2));
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .hero-content h1 {
      font-size: 1.55rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
      color: #ffffff;
    }

    .hero-content p {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .filter-bar {
      max-width: 1200px;
      margin: 0 auto 1.5rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 0.85rem 1.25rem 0.85rem 2.8rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      opacity: 0.8;
    }

    .category-pills {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
      scrollbar-width: thin;
    }

    .pill-btn {
      padding: 0.45rem 1rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .pill-btn.active {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .chapters-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem 3rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .chapter-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.85rem;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 1.35rem;
    }

    .chapter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
      flex-wrap: wrap;
    }

    .subj-tag {
      padding: 0.3rem 0.75rem;
      border-radius: var(--radius-full);
      font-size: 0.825rem;
      font-weight: 800;
      background-color: var(--bg-surface-hover);
      color: var(--primary);
      border: 1px solid var(--border-color);
    }

    .chapter-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    /* Expert Notice Box */
    .expert-notice-box {
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.12), rgba(167, 139, 250, 0.1));
      border: 1px solid rgba(96, 165, 250, 0.3);
      border-radius: var(--radius-md);
      padding: 1.1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .expert-notice-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .expert-notice-body {
      font-size: 0.925rem;
      color: var(--text-primary);
      line-height: 1.6;
    }

    /* Section Content */
    .section-block {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.35rem;
    }

    .section-subtitle {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-primary);
      border-left: 4px solid var(--primary);
      padding-left: 0.65rem;
    }

    .section-body {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text-primary);
    }

    .section-body p {
      margin-bottom: 0.5rem;
    }

    .section-body ul {
      margin-left: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .section-body li {
      margin-bottom: 0.35rem;
    }

    /* Styled Tables */
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75rem 0;
      font-size: 0.875rem;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .summary-table th {
      background-color: var(--bg-surface-hover);
      color: var(--primary);
      font-weight: 700;
      padding: 0.65rem 0.85rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .summary-table td {
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .expert-tip {
      background-color: var(--warning-bg);
      border: 1px solid var(--warning);
      color: var(--warning);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      line-height: 1.5;
    }

    /* Inline Diagram Cards */
    .diagram-inline-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-top: 0.75rem;
    }

    .diagram-inline-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .diagram-header-bar {
      padding: 0.85rem 1.25rem;
      background-color: var(--bg-surface-hover);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .diagram-img-box {
      width: 100%;
      padding: 1.25rem;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
    }

    .diagram-img-box img {
      width: 100%;
      max-width: 960px;
      height: auto;
      display: block;
      border-radius: var(--radius-sm);
    }

    .diagram-explanation-box {
      padding: 1.1rem 1.25rem;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .diagram-exp-tag {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .diagram-exp-text {
      font-size: 0.925rem;
      line-height: 1.65;
      color: var(--text-primary);
    }

    /* Image Modal Lightbox */
    .lightbox-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .lightbox-modal.show {
      display: flex;
    }

    .lightbox-img-wrap {
      max-width: 92vw;
      max-height: 92vh;
      overflow: auto;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
    }

    .lightbox-img-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }

    .lightbox-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.35rem;
      cursor: pointer;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="summary-header">
    <div class="summary-nav">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <a href="../index.html" class="btn btn-outline btn-sm">🏠 CBT 메인</a>
        <div class="nav-title">시니어 전문가 증투 자격증 심화 요약집</div>
      </div>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <a href="./exam/index.html" class="btn btn-primary btn-sm">🎯 요약 퀴즈 풀기</a>
        <button id="themeToggle" class="btn-icon">🌙</button>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <div class="hero-banner">
    <div class="hero-content">
      <h1>👨‍💼 증권사 시니어 전문가 핵심 출제 요약집</h1>
      <p>증권투자권유자문인력 자격시험 합격을 위한 1~4과목 전 범위 법령·공식·수치·파급경로 심화 요약 및 원본 구조도 캡처 가이드입니다.</p>
    </div>
    <a href="./exam/index.html" class="btn btn-primary" style="padding: 0.75rem 1.5rem; border-radius: var(--radius-full); text-decoration: none; font-weight: 800;">📝 전과목 퀴즈 도전하기 ➔</a>
  </div>

  <!-- Filter & Search Bar -->
  <div class="filter-bar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="심화 요약 키워드 검색 (예: DuPont, PER, 5% 룰, 서킷브레이커, 2,000만원, Gross-up)...">
    </div>

    <div class="category-pills" id="categoryPills">
      <button class="pill-btn active" data-cat="ALL">전체 과목 (14개 장)</button>
      <button class="pill-btn" data-cat="1과목">1과목 (증권분석 및 시장)</button>
      <button class="pill-btn" data-cat="2과목">2과목 (금융투자상품 & 직무윤리)</button>
      <button class="pill-btn" data-cat="3과목">3과목 (자본시장법 & 금소법)</button>
      <button class="pill-btn" data-cat="4과목">4과목 (세제 & 자산배분)</button>
    </div>
  </div>

  <!-- Chapters Container -->
  <div class="chapters-container" id="chaptersContainer">
    <!-- Rendered dynamically -->
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox-modal" id="lightboxModal">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <div class="lightbox-img-wrap">
      <img id="lightboxImg" src="" alt="구조도 확대 뷰어">
    </div>
  </div>

  <script src="./summary-data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const chaptersContainer = document.getElementById('chaptersContainer');
      const searchInput = document.getElementById('searchInput');
      const categoryPills = document.getElementById('categoryPills');
      const themeToggle = document.getElementById('themeToggle');
      const lightboxModal = document.getElementById('lightboxModal');
      const lightboxImg = document.getElementById('lightboxImg');
      const lightboxClose = document.getElementById('lightboxClose');

      let activeCategory = 'ALL';
      let searchQuery = '';

      // Theme toggle
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

      themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
      });

      // Render chapters
      function renderChapters() {
        const data = window.SUMMARY_DATA || [];
        const filtered = data.filter(ch => {
          const matchCat = activeCategory === 'ALL' || ch.subject.includes(activeCategory);
          const q = searchQuery.toLowerCase().trim();
          const matchSearch = !q ||
            ch.title.toLowerCase().includes(q) ||
            ch.subject.toLowerCase().includes(q) ||
            (ch.expertNotice && ch.expertNotice.toLowerCase().includes(q)) ||
            (ch.sections && ch.sections.some(s => s.subtitle.toLowerCase().includes(q) || s.body.toLowerCase().includes(q)));
          return matchCat && matchSearch;
        });

        if (filtered.length === 0) {
          chaptersContainer.innerHTML = `
            <div style="text-align: center; padding: 4rem 1rem; color: var(--text-secondary);">
              <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔍</div>
              <h3>검색 결과가 없습니다.</h3>
              <p>다른 검색어를 입력하거나 전체 과목 탭을 선택해 보세요.</p>
            </div>
          `;
          return;
        }

        chaptersContainer.innerHTML = filtered.map(ch => {
          const diagrams = ch.diagrams || [];

          return `
            <div class="chapter-card" id="ch-${ch.id}">
              <div class="chapter-header">
                <div>
                  <span class="subj-tag">${escapeHtml(ch.subject)}</span>
                  <h2 class="chapter-title" style="margin-top: 0.4rem;">${escapeHtml(ch.title)}</h2>
                </div>
                <a href="./exam/index.html?chapter=${ch.id}" class="btn btn-outline btn-sm">✍️ 이 장 퀴즈 풀기</a>
              </div>

              <!-- Expert Notice Box -->
              ${ch.expertNotice ? `
                <div class="expert-notice-box">
                  <div class="expert-notice-title">
                    <span>👨‍💼</span> <span>시니어 전문가의 출제 포인트 & 합격 팁</span>
                  </div>
                  <div class="expert-notice-body">${escapeHtml(ch.expertNotice)}</div>
                </div>
              ` : ''}

              <!-- Sections List -->
              ${(ch.sections || []).map(sec => `
                <div class="section-block">
                  <div class="section-subtitle">${escapeHtml(sec.subtitle)}</div>
                  <div class="section-body">${formatMarkdownBody(sec.body)}</div>
                  
                  ${sec.table ? `
                    <table class="summary-table">
                      <thead>
                        <tr>
                          ${(sec.table.headers || (Array.isArray(sec.table) ? sec.table[0] : [])).map(val => `<th>${escapeHtml(val)}</th>`).join('')}
                        </tr>
                      </thead>
                      <tbody>
                        ${(sec.table.rows || (Array.isArray(sec.table) ? sec.table.slice(1) : [])).map(row => `
                          <tr>
                            ${(Array.isArray(row) ? row : Object.values(row)).map(val => `<td>${escapeHtml(val)}</td>`).join('')}
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  ` : ''}

                  ${sec.expertTip ? `
                    <div class="expert-tip">${escapeHtml(sec.expertTip)}</div>
                  ` : ''}
                </div>
              `).join('')}

              <!-- Inline Diagram Cards with Explanations -->
              ${diagrams.length > 0 ? `
                <div class="diagram-inline-container">
                  ${diagrams.map((d, idx) => `
                    <div class="diagram-inline-card">
                      <div class="diagram-header-bar">
                        <span>📊</span> <span>${escapeHtml(d.title || `${ch.title} 시각 다이어그램 #${idx+1}`)}</span>
                      </div>
                      <div class="diagram-img-box" onclick="openLightbox('${d.path}')" style="cursor: pointer;" title="클릭 시 100% 해상도 창 팝업">
                        <img src="${d.path}" alt="${escapeHtml(d.title || ch.title)}" loading="lazy">
                      </div>
                      ${d.description ? `
                        <div class="diagram-explanation-box">
                          <div class="diagram-exp-tag">💡 [다이어그램 상세 해설 & 출제 핵심 포인트]</div>
                          <div class="diagram-exp-text">${formatMarkdownBody(d.description)}</div>
                        </div>
                      ` : ''}
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          `;
        }).join('');

        // Trigger KaTeX math rendering for LaTeX formulas
        if (window.renderMathInElement) {
          try {
            renderMathInElement(chaptersContainer, {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
              ],
              throwOnError: false
            });
          } catch(e) {
            console.warn('KaTeX render warning:', e);
          }
        } else {
          // Fallback if KaTeX loads async
          setTimeout(() => {
            if (window.renderMathInElement) {
              renderMathInElement(chaptersContainer, {
                delimiters: [
                  {left: '$$', right: '$$', display: true},
                  {left: '$', right: '$', display: false},
                  {left: '\\(', right: '\\)', display: false},
                  {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError: false
              });
            }
          }, 300);
        }
      }

      function formatMarkdownBody(text) {
        if (!text) return '';
        let formatted = escapeHtml(text);
        // Replace bold **text** with <strong>text</strong>
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        // Convert lines starting with * or - into lists
        const lines = formatted.split('\n');
        let html = '';
        let inList = false;

        lines.forEach(line => {
          const trimmed = line.trim();
          if (trimmed.startsWith('* ') || trimmed.startsWith('- ')) {
            if (!inList) { html += '<ul>'; inList = true; }
            html += `<li>${trimmed.substring(2)}</li>`;
          } else {
            if (inList) { html += '</ul>'; inList = false; }
            if (trimmed) html += `<p>${trimmed}</p>`;
          }
        });

        if (inList) html += '</ul>';
        return html;
      }

      function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>"']/g, function(m) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
      }

      // Lightbox functions
      window.openLightbox = function(imgUrl) {
        lightboxImg.src = imgUrl;
        lightboxModal.classList.add('show');
      };

      lightboxClose.addEventListener('click', () => {
        lightboxModal.classList.remove('show');
      });

      lightboxModal.addEventListener('click', (e) => {
        if (e.target === lightboxModal) {
          lightboxModal.classList.remove('show');
        }
      });

      // Filter events
      categoryPills.addEventListener('click', (e) => {
        const btn = e.target.closest('.pill-btn');
        if (!btn) return;
        categoryPills.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.cat;
        renderChapters();
      });

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderChapters();
      });

      renderChapters();
    });
  </script>
</body>
</html>
