<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전 과목 핵심 요약 퀴즈 - 증권투자권유자문인력</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    body {
      background-color: var(--bg-body);
      color: var(--text-primary);
      min-height: 100vh;
      font-family: var(--font-sans);
    }

    .quiz-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.65rem 1.25rem;
    }

    .quiz-nav {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .nav-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary);
    }

    .quiz-container {
      max-width: 760px;
      margin: 1.5rem auto 3rem auto;
      padding: 0 1rem;
    }

    .quiz-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .quiz-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .quiz-progress-text {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      font-family: var(--font-mono);
    }

    .quiz-score-badge {
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-full);
      background-color: var(--bg-surface-hover);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background-color: var(--bg-surface-hover);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-top: -0.5rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.3s ease;
    }

    .quiz-q-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.5;
    }

    .quiz-q-box {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.1rem 1.25rem;
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.65;
      color: var(--text-primary);
      border-left: 4px solid var(--primary);
    }

    /* Options */
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .opt-btn {
      padding: 0.95rem 1.25rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      font-size: 0.975rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .opt-btn:hover {
      border-color: var(--primary);
      background-color: var(--bg-surface-hover);
    }

    .opt-btn.correct {
      border-color: var(--success) !important;
      background-color: var(--success-bg) !important;
      color: var(--success) !important;
      font-weight: 800;
    }

    .opt-btn.wrong {
      border-color: var(--danger) !important;
      background-color: var(--danger-bg) !important;
      color: var(--danger) !important;
      font-weight: 700;
    }

    .opt-btn:disabled {
      cursor: default;
    }

    /* Feedback Box */
    .feedback-box {
      padding: 1.1rem 1.25rem;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.6;
      display: none;
    }

    .feedback-box.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .feedback-box.is-correct {
      background-color: var(--success-bg);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .feedback-box.is-wrong {
      background-color: var(--danger-bg);
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    .btn-next-q {
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      width: 100%;
      margin-top: 0.5rem;
    }

    /* Mode & Config Selector */
    .quiz-config-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .config-title {
      font-size: 1.3rem;
      font-weight: 800;
    }

    .config-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .config-group label {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .config-btn-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .cfg-btn {
      padding: 0.6rem 1.1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }

    .cfg-btn.active {
      background-color: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Result Screen */
    .result-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .result-score-big {
      font-size: 3.5rem;
      font-weight: 900;
      font-family: var(--font-mono);
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="quiz-header">
    <div class="quiz-nav">
      <a href="../index.html" class="btn btn-outline btn-sm">📚 전 과목 요약집</a>
      <div class="nav-title">🎯 전 과목 핵심 요약 퀴즈</div>
      <button id="themeToggle" class="btn-icon">🌙</button>
    </div>
  </header>

  <div class="quiz-container">

    <!-- Config / Start View -->
    <div id="configView" class="quiz-config-card">
      <div class="config-title">🎯 전 과목 핵심 요약 퀴즈 설정</div>
      
      <div class="config-group">
        <label>1. 과목 선택</label>
        <div class="config-btn-group" id="subjectGroup">
          <button class="cfg-btn active" data-subj="ALL">전 과목 (1~4과목)</button>
          <button class="cfg-btn" data-subj="1과목">1과목 (증권분석 & 시장)</button>
          <button class="cfg-btn" data-subj="2과목">2과목 (금융투자상품 & 직무윤리)</button>
          <button class="cfg-btn" data-subj="3과목">3과목 (자본시장법 & 금소법)</button>
          <button class="cfg-btn" data-subj="4과목">4과목 (세제 & 자산배분)</button>
        </div>
      </div>

      <div class="config-group">
        <label>2. 퀴즈 문항 수 선택</label>
        <div class="config-btn-group" id="countGroup">
          <button class="cfg-btn active" data-count="10">10문항 (Quick Test)</button>
          <button class="cfg-btn" data-count="20">20문항 (Standard)</button>
          <button class="cfg-btn" data-count="40">40문항 (Full Review)</button>
        </div>
      </div>

      <button id="btnStartQuiz" class="btn btn-primary btn-next-q" style="margin-top: 1rem;">🚀 퀴즈 시작하기</button>
    </div>

    <!-- Play View -->
    <div id="playView" class="quiz-card" style="display: none;">
      <div class="quiz-meta-bar">
        <div class="quiz-progress-text" id="quizProgressText">Q 1 / 10</div>
        <div class="quiz-score-badge" id="quizScoreBadge">점수: 0점</div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>

      <div class="quiz-q-title" id="quizQTitle">문제 파악 중...</div>
      <div class="quiz-q-box" id="quizQBox">...</div>

      <div class="quiz-options" id="quizOptions">
        <!-- Options rendered dynamically -->
      </div>

      <div class="feedback-box" id="feedbackBox">
        <div id="feedbackResult" style="font-size: 1.1rem; font-weight: 800; margin-bottom: 0.3rem;"></div>
        <div id="feedbackText"></div>
      </div>

      <button id="btnNext" class="btn btn-primary btn-next-q" style="display: none;">다음 문제 ➔</button>
    </div>

    <!-- Result View -->
    <div id="resultView" class="result-card" style="display: none;">
      <div style="font-size: 3rem;">🎉</div>
      <h2 style="font-size: 1.6rem; font-weight: 800;">요약 퀴즈 완료!</h2>
      <div class="result-score-big" id="finalScore">100점</div>
      <p id="resultComment" style="color: var(--text-secondary); font-size: 1rem;"></p>
      
      <div style="display: flex; gap: 0.75rem; width: 100%; margin-top: 1rem;">
        <button id="btnRetry" class="btn btn-outline" style="flex: 1; padding: 0.85rem;">🔄 다시 도전</button>
        <a href="../index.html" class="btn btn-primary" style="flex: 1; padding: 0.85rem; text-decoration: none; text-align: center;">📚 요약집 복습하기</a>
      </div>
    </div>

  </div>

  <script src="../summary-data.js"></script>
  <script src="./summary-quiz-data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const configView = document.getElementById('configView');
      const playView = document.getElementById('playView');
      const resultView = document.getElementById('resultView');

      const subjectGroup = document.getElementById('subjectGroup');
      const countGroup = document.getElementById('countGroup');
      const btnStartQuiz = document.getElementById('btnStartQuiz');

      const quizProgressText = document.getElementById('quizProgressText');
      const quizScoreBadge = document.getElementById('quizScoreBadge');
      const progressBarFill = document.getElementById('progressBarFill');

      const quizQTitle = document.getElementById('quizQTitle');
      const quizQBox = document.getElementById('quizQBox');
      const quizOptions = document.getElementById('quizOptions');
      const feedbackBox = document.getElementById('feedbackBox');
      const feedbackResult = document.getElementById('feedbackResult');
      const feedbackText = document.getElementById('feedbackText');
      const btnNext = document.getElementById('btnNext');

      const finalScore = document.getElementById('finalScore');
      const resultComment = document.getElementById('resultComment');
      const btnRetry = document.getElementById('btnRetry');

      const themeToggle = document.getElementById('themeToggle');

      let selectedSubj = 'ALL';
      let totalQCount = 10;
      let quizList = [];
      let currentIdx = 0;
      let userScore = 0;
      let isAnswered = false;

      // URL Chapter Filter check
      const urlParams = new URLSearchParams(window.location.search);
      const chapterParam = urlParams.get('chapter');
      let activeChapterParam = chapterParam;

      if (chapterParam) {
        const matchingChapter = (window.SUMMARY_DATA || []).find(c => c.id === chapterParam);
        if (matchingChapter) {
          const catPill = Array.from(subjectGroup.querySelectorAll('.cfg-btn')).find(b => matchingChapter.subject.includes(b.dataset.subj));
          if (catPill) {
            subjectGroup.querySelectorAll('.cfg-btn').forEach(b => b.classList.remove('active'));
            catPill.classList.add('active');
            selectedSubj = catPill.dataset.subj;
          }
        }
      }

      // Theme toggle
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

      themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
      });

      // Utility: Fisher-Yates Shuffle Algorithm
      function shuffleArray(arr) {
        const array = [...arr];
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      // Config handlers
      subjectGroup.addEventListener('click', (e) => {
        const btn = e.target.closest('.cfg-btn');
        if (!btn) return;
        subjectGroup.querySelectorAll('.cfg-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedSubj = btn.dataset.subj;
        activeChapterParam = null; // User manually selected subject, clear chapter lock
      });

      countGroup.addEventListener('click', (e) => {
        const btn = e.target.closest('.cfg-btn');
        if (!btn) return;
        countGroup.querySelectorAll('.cfg-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        totalQCount = parseInt(btn.dataset.count, 10);
      });

      // Generate Questions from SUMMARY_QUIZ_DATA & SUMMARY_DATA with Randomization
      function generateQuizList() {
        let pool = window.SUMMARY_QUIZ_DATA || [];

        if (activeChapterParam) {
          const chPool = pool.filter(q => q.chapterId === activeChapterParam);
          if (chPool.length > 0) pool = chPool;
        } else if (selectedSubj !== 'ALL') {
          pool = pool.filter(q => q.subject.includes(selectedSubj));
        }

        // 1. Randomly shuffle question order using Fisher-Yates
        let selectedQuestions = shuffleArray(pool).slice(0, Math.min(totalQCount, pool.length));

        // 2. Deep clone and shuffle option choices for 4-choice questions
        return selectedQuestions.map(q => {
          const clone = JSON.parse(JSON.stringify(q));
          if (clone.options && clone.correctAnswerIndex !== undefined) {
            const correctOptText = clone.options[clone.correctAnswerIndex];
            clone.options = shuffleArray(clone.options);
            clone.correctAnswerIndex = clone.options.indexOf(correctOptText);
          }
          return clone;
        });
      }

      btnStartQuiz.addEventListener('click', () => {
        quizList = generateQuizList();
        if (quizList.length === 0) {
          alert('해당 과목의 요약 퀴즈를 불러올 수 없습니다.');
          return;
        }
        currentIdx = 0;
        userScore = 0;
        configView.style.display = 'none';
        resultView.style.display = 'none';
        playView.style.display = 'flex';
        renderQuestion();
      });

      function renderQuestion() {
        isAnswered = false;
        btnNext.style.display = 'none';
        feedbackBox.className = 'feedback-box';

        const q = quizList[currentIdx];
        quizProgressText.textContent = `Q ${currentIdx + 1} / ${quizList.length}`;
        quizScoreBadge.textContent = `점수: ${userScore}점`;
        progressBarFill.style.width = `${((currentIdx + 1) / quizList.length) * 100}%`;

        quizQTitle.textContent = q.title;
        quizQBox.textContent = q.box;

        quizOptions.innerHTML = '';

        if (q.correctAnswer) {
          // OX
          q.options.forEach((optText, i) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            const val = i === 0 ? 'O' : 'X';
            btn.innerHTML = `<span>${optText}</span>`;
            btn.addEventListener('click', () => checkAnswer(val, q));
            quizOptions.appendChild(btn);
          });
        } else {
          // 4choice
          q.options.forEach((optText, i) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = `<span>${i + 1}. ${escapeHtml(optText)}</span>`;
            btn.addEventListener('click', () => checkAnswer(i, q));
            quizOptions.appendChild(btn);
          });
        }
      }

      function checkAnswer(userChoice, q) {
        if (isAnswered) return;
        isAnswered = true;

        let isCorrect = false;
        const buttons = quizOptions.querySelectorAll('.opt-btn');

        if (q.correctAnswer) {
          isCorrect = (userChoice === q.correctAnswer);
          buttons.forEach((btn, i) => {
            btn.disabled = true;
            const val = i === 0 ? 'O' : 'X';
            if (val === q.correctAnswer) btn.classList.add('correct');
            if (val === userChoice && !isCorrect) btn.classList.add('wrong');
          });
        } else {
          isCorrect = (userChoice === q.correctAnswerIndex);
          buttons.forEach((btn, i) => {
            btn.disabled = true;
            if (i === q.correctAnswerIndex) btn.classList.add('correct');
            if (i === userChoice && !isCorrect) btn.classList.add('wrong');
          });
        }

        if (isCorrect) {
          userScore += Math.round(100 / quizList.length);
          quizScoreBadge.textContent = `점수: ${userScore}점`;
          feedbackResult.textContent = '⭕ 정답입니다!';
          feedbackBox.className = 'feedback-box show is-correct';
        } else {
          feedbackResult.textContent = '❌ 오답입니다!';
          feedbackBox.className = 'feedback-box show is-wrong';
        }

        feedbackText.textContent = q.explanation;
        btnNext.style.display = 'block';
      }

      btnNext.addEventListener('click', () => {
        currentIdx++;
        if (currentIdx < quizList.length) {
          renderQuestion();
        } else {
          showResult();
        }
      });

      function showResult() {
        playView.style.display = 'none';
        resultView.style.display = 'flex';
        finalScore.textContent = `${userScore}점`;

        if (userScore >= 90) {
          resultComment.textContent = '🏆 대단합니다! 전 과목 핵심 요약을 완벽하게 숙지하셨습니다.';
        } else if (userScore >= 70) {
          resultComment.textContent = '👍 우수한 성적입니다! 틀린 파트의 요약 이미지와 텍스트를 재복습해 보세요.';
        } else {
          resultComment.textContent = '📚 요약집의 다이어그램과 요약문을 다시 읽고 도전해 보세요!';
        }
      }

      btnRetry.addEventListener('click', () => {
        resultView.style.display = 'none';
        configView.style.display = 'flex';
      });

      function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>"']/g, function(m) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
      }
    });
  </script>
</body>
</html>
