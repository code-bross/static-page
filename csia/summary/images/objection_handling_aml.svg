<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">고객 우려 대응과 자금세탁방지 제도</title>
  <desc id="desc">상담은 경청, 인정, 응답, 확인의 순서로 고객의 우려를 다룬다. CDD는 신원 확인, STR은 의심거래 보고, CTR은 법정 고액 현금거래 보고이다.</desc>
  <rect width="960" height="640" rx="24" fill="#0f172a"/>
  <g font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" fill="#f1f5f9">
    <text x="40" y="48" font-size="16" fill="#67e8f9">SALES PRACTICE / CUSTOMER &amp; COMPLIANCE</text>
    <text x="40" y="94" font-size="30" font-weight="700">고객 이해와 준법 절차를 함께</text>
    <rect x="40" y="126" width="422" height="406" rx="16" fill="#1e293b"/>
    <rect x="482" y="126" width="438" height="406" rx="16" fill="#1e293b"/>
    <text x="64" y="168" font-size="24" fill="#fcd34d">고객 우려 대응 4단계</text>
    <text x="64" y="219" font-size="23">1. 경청</text><text x="64" y="251" font-size="20">말을 끊지 않고 우려를 듣기</text>
    <text x="64" y="294" font-size="23">2. 인정</text><text x="64" y="326" font-size="20">고객의 감정·우려를 인정하기</text>
    <text x="64" y="369" font-size="23">3. 응답</text><text x="64" y="401" font-size="20">사실·위험·대안을 설명하기</text>
    <text x="64" y="444" font-size="23">4. 확인</text><text x="64" y="476" font-size="20">이해 여부와 남은 질문 확인</text>
    <text x="506" y="168" font-size="24" fill="#67e8f9">AML · 서로 다른 세 절차</text>
    <text x="506" y="224" font-size="23">CDD · 고객 확인</text>
    <text x="506" y="258" font-size="20">고객 신원·실제 소유자 등 확인</text>
    <text x="506" y="320" font-size="23">STR · 의심거래 보고</text>
    <text x="506" y="354" font-size="20">의심할 근거를 바탕으로 FIU 보고</text>
    <text x="506" y="416" font-size="23">CTR · 고액 현금거래 보고</text>
    <text x="506" y="450" font-size="20">법정 현금거래 기준에 따라 보고</text>
    <text x="506" y="498" font-size="19" fill="#67e8f9">세 제도는 동시에 적용될 수 있음</text>
    <text x="40" y="574" font-size="21" fill="#fcd34d">인정은 허위 주장에 동의한다는 뜻이 아닙니다. 수익 보장으로 설득하지 마세요.</text>
    <text x="40" y="610" font-size="18" fill="#cbd5e1">AML 금액 기준·합산 방식·예외는 적용 시점의 규정을 확인합니다.</text>
  </g>
</svg>
