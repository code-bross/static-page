<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
  <title id="title">주식회사 역할과 특별결의 요건</title>
  <desc id="desc">주주총회, 이사회, 대표이사의 역할을 구분한다. 특별결의는 출석 의결권 3분의 2 이상과 발행주식 총수 3분의 1 이상을 모두 만족해야 한다.</desc>
  <rect width="720" height="640" rx="24" fill="#f4f7fc"/>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="36" y="52" font-size="16" fill="#2563eb">05 / COMPANY LAW</text>
    <text x="36" y="94" font-size="30" font-weight="700">누가 결정하고, 누가 실행할까요?</text>
    <rect x="36" y="126" width="648" height="64" rx="14" fill="#dbeafe"/>
    <text x="58" y="166" font-size="23"><tspan font-weight="700">주주총회</tspan><tspan dx="24">법정 중요 사항 결정 · 이사 선임</tspan></text>
    <rect x="36" y="206" width="648" height="64" rx="14" fill="#e0e7ff"/>
    <text x="58" y="246" font-size="23"><tspan font-weight="700">이사회</tspan><tspan dx="46">중요 업무집행 결정 · 감독</tspan></text>
    <rect x="36" y="286" width="648" height="64" rx="14" fill="#ccfbf1"/>
    <text x="58" y="326" font-size="23"><tspan font-weight="700">대표이사</tspan><tspan dx="24">회사를 대표 · 업무집행</tspan></text>
    <text x="36" y="398" font-size="25" font-weight="700">특별결의 = 두 문턱 모두 통과</text>
    <rect x="36" y="422" width="304" height="106" rx="16" fill="#172b4d"/>
    <rect x="380" y="422" width="304" height="106" rx="16" fill="#172b4d"/>
    <text x="188" y="461" text-anchor="middle" font-size="21" fill="white">출석 의결권</text>
    <text x="188" y="505" text-anchor="middle" font-size="30" fill="#93c5fd" font-weight="700">2/3 이상</text>
    <text x="360" y="483" text-anchor="middle" font-size="17" font-weight="700">AND</text>
    <text x="532" y="461" text-anchor="middle" font-size="21" fill="white">발행주식 총수</text>
    <text x="532" y="505" text-anchor="middle" font-size="30" fill="#5eead4" font-weight="700">1/3 이상</text>
    <text x="36" y="576" font-size="22">예: 총 900주 · 출석 600주 → 찬성 최소 400주</text>
    <text x="36" y="612" font-size="17">의결권 제외 등 예외가 없는 예시 · 법정 산정 방식은 별도 확인</text>
  </g>
</svg>
