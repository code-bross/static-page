      <g font-size="17">
        <text x="62" y="163">십자형</text><text x="188" y="163">장족십자형</text><text x="314" y="163">비석십자형</text>
      </g>
    </g>
    <rect x="813" y="680" width="350" height="352" rx="16" fill="#e2e8f0"/>
    <text x="835" y="719" font-size="23" font-weight="700">그림 읽는 순서</text>
    <g font-size="19">
      <text x="835" y="763">1. 먼저 상승·하락 추세 확인</text>
      <text x="835" y="808">2. 몸통의 길이·포함 관계 확인</text>
      <text x="835" y="853">3. 꼬리·가격 갭·종가 위치 확인</text>
      <text x="835" y="898">4. 이후 봉·거래량으로 재확인</text>
      <text x="835" y="947" fill="#475569">십자형은 시가와 종가가 유사.</text>
      <text x="835" y="978" fill="#475569">그 자체로 전환 방향을</text>
      <text x="835" y="1006" fill="#475569">확정하지는 않습니다.</text>
    </g>
    <text x="32" y="1096" font-size="21" font-weight="700" fill="#9a3412">같은 봉 모양도 추세 위치에 따라 이름과 해석이 달라집니다.</text>
    <text x="32" y="1131" font-size="18" fill="#475569">전형적인 형태를 단순화한 학습용 그림입니다. 패턴만으로 향후 가격이나 수익을 보장하지 않습니다.</text>
  </g>
</svg>
