  <rect width="1200" height="1160" rx="24" fill="#f4f7fc"/>
  <g font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" fill="#172b4d">
    <text x="32" y="43" font-size="15" fill="#2563eb">TECHNICAL ANALYSIS / CANDLESTICK PATTERN ATLAS</text>
    <text x="32" y="86" font-size="30" font-weight="700">봉차트 패턴, 앞선 추세와 함께 비교하세요</text>
    <text x="32" y="120" font-size="18">원본의 한 개봉·두 개봉·세 개봉 구성 · 빨강: 양봉 / 파랑: 음봉 / 회색 선: 앞선 추세</text>
    <g fill="#e2e8f0">
      <rect x="24" y="145" width="376" height="51" rx="10"/>
      <rect x="412" y="145" width="376" height="51" rx="10"/>
      <rect x="800" y="145" width="376" height="51" rx="10"/>
    </g>
    <g font-size="25" font-weight="700" text-anchor="middle">
      <text x="212" y="180">한 개봉</text><text x="600" y="180">두 개봉</text><text x="988" y="180">세 개봉</text>
    </g>
    <g font-size="21" font-weight="700" text-anchor="middle">
      <text x="115" y="229" fill="#be123c">상승전환</text><text x="309" y="229" fill="#1d4ed8">하락전환</text>
      <text x="503" y="229" fill="#be123c">상승전환</text><text x="697" y="229" fill="#1d4ed8">하락전환</text>
      <text x="891" y="229" fill="#be123c">상승전환</text><text x="1085" y="229" fill="#1d4ed8">하락전환</text>
    </g>
    <path d="M406 145V1050 M794 145V1050 M24 447H1176 M24 651H1176 M24 855H788" stroke="#cbd5e1" stroke-width="2"/>
    <g font-size="20" text-anchor="middle">
      <g transform="translate(28 247)"><use href="#fall"/><use href="#hammer"/><text x="87" y="186">해머형</text></g>
      <g transform="translate(222 247)"><use href="#rise"/><use href="#hanging"/><text x="87" y="186">교수형</text></g>
      <g transform="translate(416 247)"><use href="#fall"/><use href="#bull-engulf"/><text x="87" y="186">상승장악형</text></g>
