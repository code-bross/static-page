  <title id="title">봉차트 패턴 전체 비교: 한 개봉·두 개봉·세 개봉</title>
  <desc id="desc">한 개봉·두 개봉·세 개봉의 패턴을 비교한다. 각 패턴 앞의 추세는 회색 실선, 뒤의 상승·하락 전환 예시는 점선으로 표시한다. 십자형은 앞선 흐름의 한 예와 이후 양방향 가능성을 보여준다. 점선은 확정 예측이 아니라 해석을 돕는 예시다.</desc>
