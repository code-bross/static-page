    <g id="shooting" stroke="#2563eb" stroke-width="3"><path d="M105 12V82"/><path d="M96 55H114V77H96Z" fill="#2563eb"/></g>
    <g id="bull-belt" stroke="#dc2626" stroke-width="3"><path d="M105 65V82"/><path d="M96 82H114V143H96Z" fill="#dc2626"/></g>
    <g id="bear-belt" stroke="#2563eb" stroke-width="3"><path d="M105 87V102"/><path d="M96 25H114V87H96Z" fill="#2563eb"/></g>
