<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc">
  <title id="title">봉차트 패턴 전체 비교: 한 개봉·두 개봉·세 개봉</title>
  <desc id="desc">원본의 패턴 분류를 벡터로 재구성했다. 한 개봉은 해머형·교수형·역전된 해머형·유성형·상승 및 하락 샅바형·십자형, 두 개봉은 장악형·잉태형·관통형·먹구름형·반격형, 세 개봉은 샛별형·석별형·까마귀형이다. 각 패턴 앞의 추세와 양봉·음봉의 위치를 함께 보여준다. 전환 가능성을 해석하는 도구이며 확정 신호는 아니다.</desc>
  <defs>
    <g id="fall" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 28L28 48L38 39L55 64L65 55L81 79"/>
    </g>
    <g id="rise" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 79L28 59L38 68L55 43L65 52L81 28"/>
    </g>
