    <text x="32" y="1096" font-size="21" font-weight="700" fill="#9a3412">같은 봉 모양도 추세 위치에 따라 이름과 해석이 달라집니다.</text>
    <text x="32" y="1131" font-size="18" fill="#475569">점선은 확정 예측이 아닙니다. 이후 봉·거래량으로 재확인하며 패턴만으로 수익을 보장하지 않습니다.</text>
