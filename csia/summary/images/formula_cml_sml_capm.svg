<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc">
  <title id="title">자본시장선 CML과 증권시장선 SML</title>
  <desc id="desc">CML은 효율적 포트폴리오의 표준편차 σ, SML은 개별 자산을 포함한 자산의 베타 β를 사용한다. SML: E(Ri) = Rf + βi × [E(Rm) - Rf].</desc>
  <rect width="960" height="630" rx="24" fill="#0f172a"/>
  <g font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" fill="#f1f5f9">
    <text x="40" y="48" font-size="16" fill="#5eead4">PORTFOLIO / CML &amp; SML</text>
    <text x="40" y="94" font-size="30" font-weight="700">가로축의 위험이 다릅니다</text>
    <rect x="40" y="126" width="880" height="170" rx="16" fill="#1e293b"/>
    <text x="64" y="166" font-size="24" fill="#5eead4">CML · 자본시장선</text>
    <text x="64" y="210" font-size="28">E(Rp) = Rf + [E(Rm) − Rf] × σp / σm</text>
    <text x="64" y="257" font-size="22">대상: 효율적 포트폴리오 / 위험 척도: 총위험 σ</text>
    <rect x="40" y="316" width="880" height="170" rx="16" fill="#1e293b"/>
    <text x="64" y="356" font-size="24" fill="#fcd34d">SML · 증권시장선 (CAPM)</text>
    <text x="64" y="400" font-size="28">E(Ri) = Rf + βi × [E(Rm) − Rf]</text>
    <text x="64" y="447" font-size="22">대상: 개별 자산도 포함 / 위험 척도: 시장 민감도 β</text>
    <text x="40" y="532" font-size="20">Rf 무위험수익률 · m 시장 · p 포트폴리오 · i 개별 자산</text>
    <text x="40" y="568" font-size="21">시장 위험프리미엄 = 시장 기대수익률 − 무위험수익률</text>
    <text x="40" y="603" font-size="21" fill="#5eead4">예: Rf 3%, E(Rm) 8%, β 1.2 → 요구수익률 9%</text>
  </g>
</svg>
